<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Solen — Greeting dedupe</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{--ink:#0A0A0A;--ink2:#6B6B6B;--ink3:#A3A3A3;--b:#E7E5E4;--sunken:#F5F5F4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E6E6E6;font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .bar{position:sticky;top:0;z-index:50;background:#17130F;color:#fff;padding:9px 12px;display:flex;gap:7px;justify-content:center;font-size:12px}
  .bar b{font-family:'Inter Tight';font-weight:700;opacity:.7;align-self:center;margin-right:4px}
  .bar button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-weight:600;cursor:pointer}
  .bar button.on{background:#fff;color:#17130F;border-color:#fff}

  .screen{max-width:402px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:36px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px}
  .topbar .logo{font-family:'Inter Tight';font-weight:800;font-size:20px}
  .topbar .r{display:flex;align-items:center;gap:14px;color:var(--ink2)} .topbar svg{width:19px;height:19px}
  .topbar .loc{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink)}
  .pad{padding:0 18px}

  .greet{font-size:15px;font-weight:500;color:var(--ink2);margin:10px 0 12px;letter-spacing:-.005em}
  .h1{font-family:'Inter Tight';font-weight:800;font-size:30px;line-height:1.06;letter-spacing:-.02em}
  .sub{font-size:15px;color:var(--ink2);margin-top:7px}

  .searchcard{background:#fff;border:1px solid #F0EFEE;border-radius:22px;padding:16px;margin-top:16px;box-shadow:0 18px 44px -12px rgba(0,0,0,.13),0 4px 12px -6px rgba(0,0,0,.07)}
  .field{display:flex;align-items:center;gap:11px;border:1px solid var(--b);border-radius:13px;height:46px;padding:0 14px;margin-bottom:10px}
  .field svg{width:18px;height:18px;color:var(--ink3)} .field .lb{font-size:14.5px;color:var(--ink3)}
  .findbtn{width:100%;height:48px;border:none;background:var(--ink);color:#fff;border-radius:13px;font-family:'Inter Tight';font-weight:700;font-size:15px;margin-top:2px;box-shadow:0 10px 22px -8px rgba(10,10,10,.45)}

  /* the second greeting block (ForYouGreeting) */
  .welcome{margin-top:26px}
  .welcome h2{font-family:'Inter Tight';font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.015em}
  .welcome p{font-size:14px;color:var(--ink2);margin-top:4px}
  .dupflag{display:inline-flex;align-items:center;gap:5px;background:#FEE2E2;color:#B91C1C;border-radius:6px;padding:2px 8px;font-size:10.5px;font-weight:700;margin-bottom:7px}

  .sech{font-family:'Inter Tight';font-weight:700;font-size:18px;margin:26px 0 13px}
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .cat{aspect-ratio:1.15/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--sunken);border-radius:18px}
  .cat img{width:42px;height:42px;object-fit:contain} .cat .l{font-size:13px;font-weight:600}

  /* flag the hero greeting as a dup only in "now" mode */
  .screen[data-state="proposed"] .welcome{display:none}
  .screen[data-state="proposed"] .dup-hero{display:none}
  .dup-hero{display:inline-flex;align-items:center;gap:5px;background:#FEE2E2;color:#B91C1C;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:700;margin-left:8px;vertical-align:middle}
</style>
</head>
<body>
  <div class="bar"><b>Greeting</b>
    <button data-s="now" class="on">Now · 2 greetings</button>
    <button data-s="proposed">Proposed · 1</button>
  </div>

  <div class="screen" data-state="now" id="screen">
    <div class="topbar"><span class="logo">Solen</span><div class="r"><span class="loc"><i data-l="map-pin"></i>Basel</span><i data-l="menu"></i></div></div>
    <div class="pad">
      <div class="greet">Hallo, hiroseseiju<span class="dup-hero">greeting #1</span></div>
      <h1 class="h1">Termin in 30 Sekunden.</h1>
      <div class="sub">Beauty &amp; wellness across Switzerland.</div>
      <div class="searchcard">
        <div class="field"><i data-l="search"></i><span class="lb">Service</span></div>
        <div class="field"><i data-l="map-pin"></i><span class="lb">City</span></div>
        <div class="field"><i data-l="calendar"></i><span class="lb">Any date</span></div>
        <button class="findbtn">Find appointments</button>
      </div>

      <!-- the redundant second greeting -->
      <div class="welcome">
        <span class="dupflag"><i data-l="copy" style="width:12px;height:12px"></i>greeting #2 — same name, redundant</span>
        <h2>Willkommen zurück, hiroseseiju</h2>
        <p>Schön, dass du wieder da bist.</p>
      </div>

      <div class="sech">For you</div>
      <div class="cats">
        <div class="cat"><img src="/icons/categories/scissors.png"><span class="l">Coiffeur</span></div>
        <div class="cat"><img src="/icons/categories/clippers.png"><span class="l">Barber</span></div>
        <div class="cat"><img src="/icons/categories/nails.png"><span class="l">Nails</span></div>
        <div class="cat"><img src="/icons/categories/map.png"><span class="l">Map</span></div>
        <div class="cat"><img src="/icons/categories/walkin.png"><span class="l">Walk-in</span></div>
        <div class="cat"><img src="/icons/categories/spa.png"><span class="l">Spa</span></div>
      </div>
    </div>
  </div>

<script>
  lucide.createIcons({ attrs:{ class:'ic' }, nameAttr:'data-l' });
  const scr=document.getElementById('screen');
  document.querySelectorAll('.bar button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.bar button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); scr.dataset.state=b.dataset.s;
  }));
</script>
</body>
</html>
