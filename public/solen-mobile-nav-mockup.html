<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Solen · mobile nav mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --s-bg:        #F4F4F6;
    --s-ink:       #1A1209;
    --s-ink-2:     #56463E;
    --s-ink-3:     #8B7C72;
    --s-brand:     #1A8F5C;
    --s-brand-mid: #0F6F44;
    --s-accent:    #E0703D;
    --s-cream:     #F5EFE0;
    --s-charcoal:  #1A1C19;
    --ease-glide:  cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  html, body {
    background: var(--s-bg);
    color: var(--s-ink);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body { position: relative; }

  /* ─── Fixed header (sharp, stays put) ─────────────────────── */
  header {
    position: fixed;
    inset: 0 0 auto 0;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 50;
    background: transparent;
    pointer-events: none; /* let stage receive scroll/clicks; buttons re-enable */
  }
  header > * { pointer-events: auto; }
  .logo {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--s-ink);
    display: inline-flex;
    align-items: baseline;
  }
  .logo-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--s-accent);
    margin-left: 3px;
    transform: translateY(-2px);
  }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .lang {
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--s-ink-2);
    letter-spacing: 0.04em;
  }

  /* Hamburger / close toggle */
  .menu-toggle {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: #FFFFFF;
    border: none;
    box-shadow: 0 6px 18px rgba(26, 18, 9, 0.10), 0 1px 0 rgba(255,255,255,0.6) inset;
    display: grid;
    place-items: center;
    cursor: pointer;
    position: relative;
    transition: transform 200ms var(--ease-glide);
  }
  .menu-toggle:active { transform: scale(0.94); }
  .menu-toggle .bars,
  .menu-toggle .close {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    transition: opacity 220ms var(--ease-glide), transform 320ms var(--ease-glide);
  }
  .menu-toggle .bars { opacity: 1; transform: rotate(0deg) scale(1); }
  .menu-toggle .close { opacity: 0; transform: rotate(-45deg) scale(0.7); }
  body.menu-open .menu-toggle .bars { opacity: 0; transform: rotate(45deg) scale(0.7); }
  body.menu-open .menu-toggle .close { opacity: 1; transform: rotate(0deg) scale(1); }

  /* ─── Stage (the page content that blurs) ─────────────────── */
  .stage {
    min-height: 100vh;
    transition:
      filter 420ms var(--ease-glide),
      transform 420ms var(--ease-glide),
      opacity 420ms var(--ease-glide);
    transform-origin: center 35%;
    will-change: filter, transform;
  }
  body.menu-open .stage {
    filter: blur(14px);
    transform: scale(0.94);
    opacity: 0.55;
    pointer-events: none;
  }

  /* Atmosphere wash for hero */
  .hero-wash {
    position: absolute;
    inset: 0 0 auto 0;
    height: 560px;
    background:
      radial-gradient(120% 80% at 80% 0%, #FFE0CC 0%, transparent 60%),
      radial-gradient(100% 70% at 0% 20%, #FFE8D8 0%, transparent 55%),
      var(--s-bg);
    z-index: -1;
  }

  /* Hero block */
  main { padding: 96px 22px 200px; max-width: 480px; margin: 0 auto; }
  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 11vw, 56px);
    line-height: 1.02;
    letter-spacing: -0.035em;
    color: var(--s-ink);
    margin-top: 16px;
  }
  h1 .accent { color: var(--s-accent); }

  /* Mock SearchBar pill */
  .searchbar {
    margin-top: 26px;
    background: #FFFFFF;
    border-radius: 24px;
    padding: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    gap: 0;
    border: 1px solid rgba(26, 18, 9, 0.04);
  }
  .searchbar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px;
    border-bottom: 1px solid rgba(26, 18, 9, 0.06);
  }
  .searchbar-row:last-of-type { border-bottom: none; }
  .searchbar-row svg { width: 18px; height: 18px; color: var(--s-ink-2); flex-shrink: 0; }
  .searchbar-row span { color: var(--s-ink-2); font-size: 15px; font-weight: 500; }
  .searchbar-cta {
    margin-top: 8px;
    background: var(--s-brand);
    color: #fff;
    border: none;
    border-radius: 18px;
    padding: 16px;
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(26, 143, 92, 0.28);
    transition: transform 160ms var(--ease-glide), box-shadow 160ms var(--ease-glide);
  }
  .searchbar-cta:active { transform: scale(0.97); }

  .feed-section {
    margin-top: 56px;
    padding: 28px 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.9));
    border-radius: 32px 32px 0 0;
    box-shadow: 0 -8px 24px rgba(26, 18, 9, 0.05);
  }
  .feed-section h2 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.025em;
    color: var(--s-ink);
  }
  .feed-section p {
    margin-top: 8px;
    font-size: 14px;
    color: var(--s-ink-2);
    line-height: 1.5;
  }

  /* ─── Backdrop scrim (sits between blurred stage + bottom nav) ─ */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(26, 18, 9, 0.25);
    opacity: 0;
    pointer-events: none;
    z-index: 60;
    transition: opacity 360ms var(--ease-glide);
  }
  body.menu-open .backdrop {
    opacity: 1;
    pointer-events: auto;
  }

  /* ─── Bottom nav pill ─────────────────────────────────────── */
  .bottom-nav {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translate(-50%, calc(100% + 60px));
    z-index: 70;
    width: calc(100% - 32px);
    max-width: 420px;
    background: var(--s-charcoal);
    border-radius: 28px;
    padding: 14px 12px 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.30), 0 1px 0 rgba(255,255,255,0.06) inset;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    opacity: 0;
    transition:
      transform 460ms var(--ease-spring),
      opacity 320ms var(--ease-glide);
  }
  body.menu-open .bottom-nav {
    transform: translate(-50%, 0);
    opacity: 1;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 8px;
    border-radius: 18px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: rgba(245, 239, 224, 0.55);
    transition: color 220ms var(--ease-glide), background 220ms var(--ease-glide);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
  }
  .nav-item svg { width: 22px; height: 22px; stroke-width: 1.8; }
  .nav-item-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .nav-item-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--s-accent);
    margin-top: 2px;
    opacity: 0;
    transition: opacity 220ms var(--ease-glide);
  }
  .nav-item.active {
    color: var(--s-ink);
  }
  .nav-item.active .icon-wrap {
    background: #FFFFFF;
  }
  .nav-item.active .nav-item-dot { opacity: 1; }
  .icon-wrap {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: transparent;
    display: grid;
    place-items: center;
    transition: background 240ms var(--ease-glide);
  }

</style>
</head>
<body>
  <!-- ─── Header (fixed, stays sharp) ─── -->
  <header>
    <a class="logo" href="#">Solen<span class="logo-dot"></span></a>
    <div class="header-right">
      <span class="lang">DE</span>
      <button class="menu-toggle" aria-label="Menü öffnen" aria-expanded="false">
        <span class="bars">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="22" height="22"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/></svg>
        </span>
        <span class="close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="22" height="22"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </span>
      </button>
    </div>
  </header>

  <!-- ─── Stage (blurs when menu opens) ─── -->
  <div class="stage">
    <div class="hero-wash" aria-hidden></div>
    <main>
      <h1>Schöner aussehen,<br/>schneller <span class="accent">buchen</span>.</h1>
      <div class="searchbar">
        <div class="searchbar-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Service</span>
        </div>
        <div class="searchbar-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 7-8 13-8 13s-8-6-8-13a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>Stadt</span>
        </div>
        <div class="searchbar-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Zeit</span>
        </div>
        <button class="searchbar-cta">Solen durchsuchen</button>
      </div>

      <section class="feed-section">
        <h2>Artist des Monats</h2>
        <p>Tippe oben rechts auf das Menü — du siehst, wie das Bottom-Nav reinglidet und der Hintergrund unscharf wird.</p>
      </section>
    </main>
  </div>

  <!-- ─── Backdrop scrim ─── -->
  <div class="backdrop" aria-hidden></div>

  <!-- ─── Bottom nav pill ─── -->
  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <button class="nav-item active" data-key="home">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2h-3v-7h-8v7H5a2 2 0 0 1-2-2z"/></svg>
      </div>
      <span class="nav-item-label">Home</span>
      <span class="nav-item-dot"></span>
    </button>
    <button class="nav-item" data-key="discover">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      </div>
      <span class="nav-item-label">Entdecken</span>
      <span class="nav-item-dot"></span>
    </button>
    <button class="nav-item" data-key="favs">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>
      <span class="nav-item-label">Favoriten</span>
      <span class="nav-item-dot"></span>
    </button>
    <button class="nav-item" data-key="account">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <span class="nav-item-label">Konto</span>
      <span class="nav-item-dot"></span>
    </button>
  </nav>

<script>
  const toggle = document.querySelector('.menu-toggle');
  const backdrop = document.querySelector('.backdrop');
  const body = document.body;
  const navItems = document.querySelectorAll('.nav-item');

  function setOpen(open) {
    body.classList.toggle('menu-open', open);
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? 'Menü schließen' : 'Menü öffnen');
  }
  toggle.addEventListener('click', () => setOpen(!body.classList.contains('menu-open')));
  backdrop.addEventListener('click', () => setOpen(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });

  navItems.forEach((btn) => {
    btn.addEventListener('click', () => {
      navItems.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // Demo: auto-close on tap so user sees the smooth blur reverse.
      setTimeout(() => setOpen(false), 200);
    });
  });
</script>
</body>
</html>
