<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Solen · mobile menu (Fresha-style)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --s-bg:        #F4F4F6;
    --s-ink:       #1A1209;
    --s-ink-2:     #56463E;
    --s-ink-3:     #8B7C72;
    --s-brand:     #1A8F5C;
    --s-brand-mid: #0F6F44;
    --s-accent:    #E0703D;
    --s-cream:     #F5EFE0;
    --s-border:    rgba(26, 18, 9, 0.06);
    --ease-glide:  cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  html, body {
    background: var(--s-bg);
    color: var(--s-ink);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body { position: relative; }

  /* ─── Fixed header ─────────────────────────────────────────── */
  header {
    position: fixed;
    inset: 0 0 auto 0;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 50;
    transition: background 240ms var(--ease-glide), backdrop-filter 240ms var(--ease-glide);
  }
  body.menu-open header {
    background: rgba(244, 244, 246, 0.85);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
  }
  .logo {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--s-ink);
    display: inline-flex;
    align-items: baseline;
    text-decoration: none;
  }
  .logo-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--s-accent);
    margin-left: 3px;
    transform: translateY(-2px);
  }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .lang {
    font-size: 13px;
    font-weight: 600;
    color: var(--s-ink-2);
    letter-spacing: 0.04em;
  }
  .menu-toggle {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: #FFFFFF;
    border: none;
    box-shadow: 0 6px 18px rgba(26, 18, 9, 0.10);
    display: grid;
    place-items: center;
    cursor: pointer;
    position: relative;
    transition: transform 200ms var(--ease-glide);
  }
  .menu-toggle:active { transform: scale(0.94); }
  .menu-toggle .bars,
  .menu-toggle .close {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    transition: opacity 220ms var(--ease-glide), transform 320ms var(--ease-glide);
  }
  .menu-toggle .bars { opacity: 1; transform: rotate(0deg) scale(1); }
  .menu-toggle .close { opacity: 0; transform: rotate(-45deg) scale(0.7); }
  body.menu-open .menu-toggle .bars { opacity: 0; transform: rotate(45deg) scale(0.7); }
  body.menu-open .menu-toggle .close { opacity: 1; transform: rotate(0deg) scale(1); }

  /* ─── Page content (hidden when menu open) ─────────────────── */
  .stage {
    min-height: 100vh;
    transition: opacity 240ms var(--ease-glide);
  }
  body.menu-open .stage {
    opacity: 0;
    pointer-events: none;
  }

  .hero-wash {
    position: absolute;
    inset: 0 0 auto 0;
    height: 560px;
    background:
      radial-gradient(120% 80% at 80% 0%, #FFE0CC 0%, transparent 60%),
      radial-gradient(100% 70% at 0% 20%, #FFE8D8 0%, transparent 55%),
      var(--s-bg);
    z-index: -1;
  }
  main { padding: 96px 22px 60px; max-width: 480px; margin: 0 auto; }
  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 11vw, 56px);
    line-height: 1.02;
    letter-spacing: -0.035em;
  }
  h1 .accent { color: var(--s-accent); }
  .searchbar {
    margin-top: 26px;
    background: #fff;
    border-radius: 24px;
    padding: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.06);
    border: 1px solid rgba(26, 18, 9, 0.04);
  }
  .searchbar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px;
    border-bottom: 1px solid rgba(26, 18, 9, 0.06);
  }
  .searchbar-row:last-of-type { border-bottom: none; }
  .searchbar-row svg { width: 18px; height: 18px; color: var(--s-ink-2); flex-shrink: 0; }
  .searchbar-row span { color: var(--s-ink-2); font-size: 15px; font-weight: 500; }
  .searchbar-cta {
    margin-top: 8px;
    background: var(--s-brand);
    color: #fff;
    border: none;
    border-radius: 18px;
    padding: 16px;
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(26, 143, 92, 0.28);
    width: 100%;
  }

  /* ─── Menu overlay (full-screen) ──────────────────────────── */
  .menu-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: var(--s-bg);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition:
      opacity 280ms var(--ease-glide),
      transform 320ms var(--ease-glide);
    padding: 88px 20px 60px;
  }
  body.menu-open .menu-overlay {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .menu-inner { max-width: 480px; margin: 0 auto; }

  .menu-section-label {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 7.5vw, 36px);
    letter-spacing: -0.025em;
    color: var(--s-ink);
    margin-bottom: 14px;
    margin-top: 8px;
  }
  .menu-section-label:not(:first-child) { margin-top: 28px; }

  .menu-card {
    background: #FFFFFF;
    border-radius: 18px;
    box-shadow: 0 1px 3px rgba(26, 18, 9, 0.04);
    overflow: hidden;
  }
  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--s-border);
    width: 100%;
    cursor: pointer;
    color: var(--s-ink);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    font-weight: 600;
    font-size: 16px;
    text-align: left;
    transition: background 160ms var(--ease-glide);
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:active { background: rgba(26, 18, 9, 0.03); }
  .menu-item-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .menu-item-left svg { width: 22px; height: 22px; color: var(--s-ink-2); flex-shrink: 0; }
  .menu-item-arrow { color: var(--s-ink-3); flex-shrink: 0; }
  .menu-item-arrow svg { width: 18px; height: 18px; }

  /* Primary auth row — emerald text + bold */
  .menu-item--primary {
    color: var(--s-brand);
    font-weight: 700;
  }
  .menu-item--primary .menu-item-arrow { color: var(--s-brand); }

  /* B2B card has darker emphasis */
  .menu-card-b2b {
    background: #FFFFFF;
    border-radius: 18px;
    box-shadow: 0 1px 3px rgba(26, 18, 9, 0.04);
    margin-top: 12px;
  }
  .menu-item-b2b {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 20px;
    width: 100%;
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    color: var(--s-ink);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: 17px;
  }
  .menu-item-b2b-sub {
    display: block;
    margin-top: 4px;
    font-size: 13px;
    font-weight: 500;
    color: var(--s-ink-3);
  }
  .menu-item-b2b-arrow {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--s-brand);
    color: #fff;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .menu-item-b2b-arrow svg { width: 18px; height: 18px; }

  /* Secondary group (categories — small chips) */
  .category-chips {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .category-chips::-webkit-scrollbar { display: none; }
  .category-chip {
    flex-shrink: 0;
    padding: 10px 16px;
    background: #fff;
    border: 1px solid var(--s-border);
    border-radius: 999px;
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--s-ink);
    cursor: pointer;
    white-space: nowrap;
    transition: background 160ms var(--ease-glide);
  }
  .category-chip:active { background: rgba(26, 18, 9, 0.04); }
</style>
</head>
<body>
  <!-- ─── Header ─── -->
  <header>
    <a class="logo" href="#">Solen<span class="logo-dot"></span></a>
    <div class="header-right">
      <span class="lang">DE</span>
      <button class="menu-toggle" aria-label="Menü öffnen" aria-expanded="false">
        <span class="bars">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="22" height="22"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/></svg>
        </span>
        <span class="close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="22" height="22"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </span>
      </button>
    </div>
  </header>

  <!-- ─── Stage (the page — hides on menu open) ─── -->
  <div class="stage">
    <div class="hero-wash" aria-hidden></div>
    <main>
      <h1>Schöner aussehen,<br/>schneller <span class="accent">buchen</span>.</h1>
      <div class="searchbar">
        <div class="searchbar-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Service</span>
        </div>
        <div class="searchbar-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 7-8 13-8 13s-8-6-8-13a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>Stadt</span>
        </div>
        <div class="searchbar-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Zeit</span>
        </div>
        <button class="searchbar-cta">Solen durchsuchen</button>
      </div>
    </main>
  </div>

  <!-- ─── Menu overlay ─── -->
  <div class="menu-overlay" role="dialog" aria-modal="true" aria-label="Menü">
    <div class="menu-inner">
      <!-- For customers section -->
      <div class="menu-section-label">Für Kund:innen</div>
      <div class="menu-card">
        <button class="menu-item menu-item--primary">
          <span class="menu-item-left">Anmelden oder Registrieren</span>
          <span class="menu-item-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
          </span>
        </button>
        <button class="menu-item">
          <span class="menu-item-left">Hilfe &amp; Support</span>
          <span class="menu-item-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
          </span>
        </button>
        <button class="menu-item">
          <span class="menu-item-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            Deutsch
          </span>
          <span class="menu-item-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
          </span>
        </button>
      </div>

      <!-- Quick category browse — horizontal scroll -->
      <div class="menu-section-label">Stöbern</div>
      <div class="category-chips">
        <button class="category-chip">Coiffeur</button>
        <button class="category-chip">Barbershop</button>
        <button class="category-chip">Nails</button>
        <button class="category-chip">Spa &amp; Wellness</button>
        <button class="category-chip">Entdecken</button>
      </div>

      <!-- For businesses card -->
      <div class="menu-section-label">Für Salons</div>
      <div class="menu-card-b2b">
        <button class="menu-item-b2b">
          <span>
            Werde Solen-Partner
            <span class="menu-item-b2b-sub">In 60 Sekunden eintragen — kostenlos starten</span>
          </span>
          <span class="menu-item-b2b-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </span>
        </button>
      </div>
    </div>
  </div>

<script>
  const toggle = document.querySelector('.menu-toggle');
  const body = document.body;
  function setOpen(open) {
    body.classList.toggle('menu-open', open);
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? 'Menü schließen' : 'Menü öffnen');
    body.style.overflow = open ? 'hidden' : '';
  }
  toggle.addEventListener('click', () => setOpen(!body.classList.contains('menu-open')));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
</script>
</body>
</html>
