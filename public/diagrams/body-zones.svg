<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <title>Body zones diagram</title>
  <!-- Simplified gender-neutral body outline with selectable zones -->
  <!-- Zone: neck -->
  <path id="zone-neck"
    d="M90,25 Q100,20 110,25 L112,40 Q100,42 88,40Z"
    fill="rgba(26,18,9,0.04)" stroke="rgba(26,18,9,0.15)" stroke-width="1"/>
  <!-- Zone: shoulders -->
  <path id="zone-shoulders"
    d="M55,50 Q72,40 88,40 L112,40 Q128,40 145,50 L140,65 Q100,58 60,65Z"
    fill="rgba(26,18,9,0.04)" stroke="rgba(26,18,9,0.15)" stroke-width="1"/>
  <!-- Zone: chest -->
  <path id="zone-chest"
    d="M60,65 Q100,58 140,65 L138,100 Q100,95 62,100Z"
    fill="rgba(26,18,9,0.04)" stroke="rgba(26,18,9,0.15)" stroke-width="1"/>
  <!-- Zone: upper back -->
  <path id="zone-upper-back"
    d="M62,100 Q100,95 138,100 L136,130 Q100,125 64,130Z"
    fill="rgba(26,18,9,0.04)" stroke="rgba(26,18,9,0.15)" stroke-width="1"/>
  <!-- Zone: stomach -->
  <path id="zone-stomach"
    d="M64,130 Q100,125 136,130 L134,160 Q100,155 66,160Z"
    fill="rgba(26,18,9,0.04)" stroke="rgba(26,18,9,0.15)" stroke-width="1"/>
  <!-- Zone: lower back / hips -->
  <path id="zone-lower-back"
    d="M66,160 Q100,155 134,160 L132,185 Q100,180 68,185Z"
    fill="rgba(26,18,9,0.04)" stroke="rgba(26,18,9,0.15)" stroke-width="1"/>
  <!-- Zone: full arms (left + right) -->
  <path id="zone-full-arms"
    d="M55,50 L42,55 Q30,80 28,120 L38,122 Q42,85 50,65 Z M145,50 L158,55 Q170,80 172,120 L162,122 Q158,85 150,65Z"
    fill="rgba(26,18,9,0.04)" stroke="rgba(26,18,9,0.15)" stroke-width="1"/>
  <!-- Zone: full legs (left + right) -->
  <path id="zone-full-legs"
    d="M68,185 Q80,182 90,185 L88,250 Q82,270 80,290 L72,290 Q74,270 76,250 Q72,220 68,185Z M132,185 Q120,182 110,185 L112,250 Q118,270 120,290 L128,290 Q126,270 124,250 Q128,220 132,185Z"
    fill="rgba(26,18,9,0.04)" stroke="rgba(26,18,9,0.15)" stroke-width="1"/>
  <!-- Zone: feet -->
  <path id="zone-feet"
    d="M72,290 L80,290 Q84,295 80,298 L70,298 Q66,295 72,290Z M120,290 L128,290 Q132,295 128,298 L118,298 Q114,295 120,290Z"
    fill="rgba(26,18,9,0.04)" stroke="rgba(26,18,9,0.15)" stroke-width="1"/>
</svg>
