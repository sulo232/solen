<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solen · Mapbox Standard test</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #FAFAF9; padding: 20px; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #6B6B6B; margin-bottom: 14px; }
    #map { width: 100%; max-width: 900px; height: 540px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(10,10,10,0.10); }
    .pin {
      font-family: 'Geist', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 3px 9px; border-radius: 9999px; font-size: 12px; font-weight: 600;
      white-space: nowrap; box-shadow: 0 2px 8px rgba(10,10,10,0.14); cursor: pointer;
      background: #fff; color: #0A0A0A; border: 1px solid rgba(10,10,10,0.14);
    }
    .pin.sel { background: #0A0A0A; color: #fff; border-color: #0A0A0A; }
  </style>
</head>
<body>
  <h1>Mapbox Standard (day) — single live map</h1>
  <p class="sub">Verifying the style the app will ship: mapbox/standard, lightPreset day, mercator, B&amp;W pill markers.</p>
  <div id="map"></div>
  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoic29sZW4zMiIsImEiOiJjbW40eTAybmEwNDBoMm9zOW1iM2RoNjNrIn0.CyYYldXXZScFAl7Gdk4WNA';
    const CENTER = [7.5886, 47.5596];
    const SALONS = [
      { lng: 7.5886, lat: 47.5596, price: 45, sel: true },
      { lng: 7.5820, lat: 47.5572, price: 60 },
      { lng: 7.5958, lat: 47.5618, price: 35 },
      { lng: 7.5905, lat: 47.5540, price: 80 },
      { lng: 7.5808, lat: 47.5631, price: 50 },
    ];
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/standard',
      center: CENTER, zoom: 13.3, projection: 'mercator',
      cooperativeGestures: false, attributionControl: false,
    });
    map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
    map.on('load', () => {
      map.resize();
      try {
        map.setConfigProperty('basemap', 'lightPreset', 'day');
        map.setConfigProperty('basemap', 'showPointOfInterestLabels', false);
      } catch (e) { console.warn('config', e); }
      SALONS.forEach((s) => {
        const el = document.createElement('div');
        el.className = 'pin' + (s.sel ? ' sel' : '');
        el.textContent = 'ab ' + s.price + ' CHF';
        new mapboxgl.Marker(el).setLngLat([s.lng, s.lat]).addTo(map);
      });
    });
  </script>
</body>
</html>
