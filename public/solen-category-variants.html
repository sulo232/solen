<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solen — Barbershop page (final: B hero + restructured header)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A; --ink2:#6B6B6B; --border:#E7E5E4; --sunken:#F5F5F4;
    --accent:#276EF1; --star:#FFC32B; --heart:#FF3366;
    --disp:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#e9e8e6;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 80px}
  h1{font-family:var(--disp);font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 2px 4px}
  .lead{font-size:13.5px;color:#444;line-height:1.55;margin:0 2px 18px}
  .lead b{color:var(--ink)}
  .phone{background:#fff;border-radius:34px;border:1px solid #d9d7d4;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.13)}
  .screen{height:780px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .screen::-webkit-scrollbar{display:none}
  .pad{padding:0 16px}

  /* topbar */
  .topbar{padding:16px 16px 0;position:sticky;top:0;background:#fff;z-index:5}
  .titlerow{display:flex;align-items:center;gap:10px}
  .chev{width:30px;height:30px;display:grid;place-items:center;margin-left:-6px;color:var(--ink)}
  .btitle{font-family:var(--disp);font-weight:800;font-size:25px;letter-spacing:-.025em;line-height:1;color:var(--ink)}
  .bcat-ico{width:24px;height:24px;object-fit:contain;margin-left:auto;opacity:.9}
  .searchbar{display:flex;align-items:center;gap:9px;margin-top:12px;border:1px solid var(--border);background:#fff;border-radius:14px;padding:12px 13px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .searchbar .ph{flex:1;font-size:14px;color:var(--ink2)}
  .searchbar .div{width:1px;height:18px;background:var(--border)}
  .ico{display:inline-grid;place-items:center;color:var(--ink)}
  .ico.muted{color:var(--ink2)}

  .block{margin-top:24px}
  .block.first{margin-top:18px}
  .secttl{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.01em;color:var(--ink);margin:0 0 10px}
  .eyebrow{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.02em;margin:0 0 8px}

  /* B hero carousel */
  .carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 2px;margin:0 -16px;scroll-padding-left:16px}
  .carousel::-webkit-scrollbar{display:none}
  .slide{flex:0 0 87%;scroll-snap-align:start}
  .cardB{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:3/2;background:var(--ink)}
  .cardB > img{width:100%;height:100%;object-fit:cover;display:block}
  .cardB .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.12) 56%,rgba(0,0,0,.18))}
  .cardB .badge{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;border-radius:10px;padding:6px 11px;font-size:11px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .cardB .heart{position:absolute;top:11px;right:11px;width:33px;height:33px;border-radius:999px;background:rgba(255,255,255,.22);display:grid;place-items:center;color:#fff;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25)}
  .cardB .ct{position:absolute;left:16px;right:16px;bottom:15px;color:#fff}
  .cardB .nm{font-family:var(--disp);font-weight:700;font-size:23px;letter-spacing:-.02em;line-height:1.05}
  .cardB .rt{display:flex;align-items:center;gap:5px;font-size:13.5px;margin-top:6px;color:#fff;font-variant-numeric:tabular-nums}
  .cardB .sub{font-size:13px;color:rgba(255,255,255,.78);margin-top:2px}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
  .dot{width:7px;height:7px;border-radius:999px;background:#d4d4d4;transition:width .25s,background .25s}
  .dot.on{width:22px;border-radius:4px;background:var(--ink)}

  /* fuer dich */
  .fd{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .fd::-webkit-scrollbar{display:none}
  .tile{flex:0 0 auto;width:74px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:7px}
  .tile img{width:30px;height:30px;object-fit:contain}
  .tile span{font-size:11px;font-weight:500;color:var(--ink)}

  /* chips */
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--ink);white-space:nowrap}

  /* count + grid */
  .countrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
  .count{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--ink)}
  .maplink{display:flex;align-items:center;gap:5px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
  .grid{display:flex;flex-direction:column;gap:22px;padding-bottom:30px}
  .gcard{position:relative}
  .gphoto{position:relative;width:100%;aspect-ratio:3/2;border-radius:18px;overflow:hidden;background:var(--sunken);box-shadow:0 20px 40px rgba(0,0,0,.04)}
  .gphoto img{width:100%;height:100%;object-fit:cover;display:block}
  .gheart{position:absolute;top:10px;right:10px;width:33px;height:33px;border-radius:999px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--heart);box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .gbody{margin-top:12px}
  .grow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .gname{font-family:var(--disp);font-weight:500;font-size:18px;letter-spacing:-.015em;line-height:1.15;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .grate{display:flex;align-items:center;gap:3px;flex-shrink:0;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .grow2{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
  .gaddr{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .gprice{font-size:13px;color:var(--ink2);flex-shrink:0}
  .gprice b{font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Barbershop page — final</h1>
  <p class="lead">Your real components + real data. <b>Header restructured</b> (Barbershop title where the logo sits + long search). <b>Top bewertet = B</b>, the black photo-hero carousel (swipe it, peek + dots). Then the existing für-dich tiles, filter chips, and white results grid.</p>
  <div class="phone"><div class="screen" id="screen"></div></div>
</div>

<script>
const SALONS = [
  { name:"Blade & Stone",    rating:4.4, reviews:11, price:15, addr:"Feldbergstrasse 82, Basel", photo:"https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=900&q=80" },
  { name:"The Fade Factory", rating:4.3, reviews:11, price:28, addr:"Hammerstrasse 65, Basel",   photo:"https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=900&q=80" },
  { name:"Old Town Barbers", rating:4.3, reviews:12, price:28, addr:"Münsterplatz 11, Basel",     photo:"https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=900&q=80" },
];
const FUER_DICH = [
  { label:"Stempel", icon:"/icons/fuer-dich/treueprogramm.png" },
  { label:"Inspo",   icon:"/icons/fuer-dich/entdecken.png" },
  { label:"Gruppe",  icon:"/icons/fuer-dich/gruppe.png" },
  { label:"Walk-in", icon:"/icons/fuer-dich/walkin.png" },
];
const CHIPS = ["Sortieren","Jetzt geöffnet","Preis","Für wen","Bewertung","Ausstattung","Angebote"];

function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}
function svg(d,size){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("width",size);s.setAttribute("height",size);s.setAttribute("fill","none");s.setAttribute("stroke","currentColor");s.setAttribute("stroke-width","2");s.setAttribute("stroke-linecap","round");s.setAttribute("stroke-linejoin","round");const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",d);s.appendChild(p);return s;}
function star(sz){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("width",sz);s.setAttribute("height",sz);s.setAttribute("fill","#FFC32B");const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d","M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");s.appendChild(p);return s;}
function img(src,alt){const i=el("img");i.src=src;i.alt=alt||"";i.loading="lazy";return i;}
function heartW(cls){const h=el("div",cls);const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("width","16");s.setAttribute("height","16");s.setAttribute("fill","none");s.setAttribute("stroke","currentColor");s.setAttribute("stroke-width","2");const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d","M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z");s.appendChild(p);h.appendChild(s);return h;}

function slideB(s){
  const wrap=el("div","slide"); const c=el("div","cardB");
  c.appendChild(img(s.photo,s.name));
  c.appendChild(el("div","ov"));
  c.appendChild(el("span","badge","Top bewertet"));
  c.appendChild(heartW("heart"));
  const ct=el("div","ct");
  ct.appendChild(el("div","nm",s.name));
  const rt=el("div","rt"); rt.appendChild(star(14)); rt.appendChild(el("span",null,s.rating.toFixed(1)+" ("+s.reviews+")")); ct.appendChild(rt);
  ct.appendChild(el("div","sub","ab CHF "+s.price+" · "+s.addr));
  c.appendChild(ct); wrap.appendChild(c); return wrap;
}
function gridCard(s){
  const c=el("div","gcard");
  const ph=el("div","gphoto"); ph.appendChild(img(s.photo,s.name)); ph.appendChild(heartW("gheart")); c.appendChild(ph);
  const b=el("div","gbody");
  const r1=el("div","grow"); r1.appendChild(el("h3","gname",s.name));
  const rt=el("div","grate"); rt.appendChild(star(12)); rt.appendChild(el("span",null,s.rating.toFixed(1)+" ("+s.reviews+")")); r1.appendChild(rt); b.appendChild(r1);
  const r2=el("div","grow2"); r2.appendChild(el("div","gaddr",s.addr));
  const pr=el("div","gprice"); pr.appendChild(document.createTextNode("ab ")); pr.appendChild(el("b",null,String(s.price))); pr.appendChild(document.createTextNode(" CHF")); r2.appendChild(pr); b.appendChild(r2);
  c.appendChild(b); return c;
}

function build(){
  const root=document.getElementById("screen");

  // topbar
  const tb=el("div","topbar"); const tr=el("div","titlerow");
  const chev=el("div","chev"); chev.appendChild(svg("M15 18l-6-6 6-6","22")); tr.appendChild(chev);
  tr.appendChild(el("div","btitle","Barbershop"));
  const cico=el("img","bcat-ico"); cico.src="/icons/categories/clippers.png"; cico.alt=""; tr.appendChild(cico);
  tb.appendChild(tr);
  const sb=el("div","searchbar");
  const sI=el("span","ico muted"); const sg=svg("M21 21l-4.3-4.3","18"); const circ=document.createElementNS("http://www.w3.org/2000/svg","circle"); circ.setAttribute("cx","11"); circ.setAttribute("cy","11"); circ.setAttribute("r","7"); sg.insertBefore(circ,sg.firstChild); sI.appendChild(sg); sb.appendChild(sI);
  sb.appendChild(el("span","ph","Barbershop in Basel suchen"));
  sb.appendChild(el("span","div"));
  const fI=el("span","ico"); fI.appendChild(svg("M4 6h16M7 12h10M10 18h4","18")); sb.appendChild(fI);
  tb.appendChild(sb); root.appendChild(tb);

  // Top bewertet (B hero carousel)
  const w=el("div","block first pad");
  w.appendChild(el("h2","secttl","Top bewertet"));
  const car=el("div","carousel"); SALONS.forEach(s=>car.appendChild(slideB(s))); w.appendChild(car);
  const dots=el("div","dots"); for(let i=0;i<SALONS.length;i++) dots.appendChild(el("div","dot"+(i===0?" on":""))); w.appendChild(dots);
  root.appendChild(w);
  car.addEventListener("scroll",()=>{const max=car.scrollWidth-car.clientWidth;const idx=max>0?Math.round(car.scrollLeft/max*(SALONS.length-1)):0;[...dots.children].forEach((d,i)=>d.classList.toggle("on",i===idx));},{passive:true});

  // für dich
  const fdB=el("div","block pad"); fdB.appendChild(el("div","eyebrow","Für dich"));
  const fd=el("div","fd"); FUER_DICH.forEach(t=>{const tl=el("div","tile");const im=el("img");im.src=t.icon;im.alt="";tl.appendChild(im);tl.appendChild(el("span",null,t.label));fd.appendChild(tl);}); fdB.appendChild(fd); root.appendChild(fdB);

  // chips
  const chB=el("div","block pad"); const chips=el("div","chips");
  CHIPS.forEach((label,i)=>{const ch=el("div","chip"); if(i===0){const g=el("span","ico");g.appendChild(svg("M4 6h16M7 12h10M10 18h4","15"));ch.appendChild(g);} ch.appendChild(el("span",null,label)); chips.appendChild(ch);});
  chB.appendChild(chips); root.appendChild(chB);

  // grid
  const gB=el("div","block pad"); const cr=el("div","countrow");
  cr.appendChild(el("div","count","Alle Barbershops · 3"));
  const ml=el("div","maplink"); const mi=el("span","ico"); mi.appendChild(svg("M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3zM9 7v13M15 4v13","15")); ml.appendChild(mi); ml.appendChild(el("span",null,"Karte")); cr.appendChild(ml);
  gB.appendChild(cr);
  const grid=el("div","grid"); SALONS.forEach(s=>grid.appendChild(gridCard(s))); gB.appendChild(grid); root.appendChild(gB);
}
build();
</script>
</body>
</html>
