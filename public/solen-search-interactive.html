<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solen — interactive search (homepage + category)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0A0A0A;--ink2:#6B6B6B;--ink3:#9a9a9a;--border:#E7E5E4;--sunken:#F5F5F4;--accent:#276EF1;--green:#16A34A;--disp:'Inter Tight',sans-serif;--body:'Inter',sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e8e6;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 80px}
  h1{font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 2px 4px}
  .lead{font-size:13.5px;color:#444;line-height:1.55;margin:0 2px 22px;max-width:760px}
  .lead b{color:var(--ink)}
  .frames{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
  .col{width:374px;max-width:100%}
  .tag{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
  .tag .pill{font-size:11px;font-weight:800;color:#fff;background:var(--ink);padding:3px 8px;border-radius:6px;font-family:var(--disp)}
  .tag .ds{font-size:11.5px;color:#777}
  .phone{background:#fff;border-radius:28px;border:1px solid #d9d7d4;overflow:hidden;padding:16px 14px 20px;box-shadow:0 18px 48px rgba(0,0,0,.12);min-height:520px}
  .h{font-family:var(--disp);font-size:20px;font-weight:800;letter-spacing:-.02em;margin:6px 2px 2px}
  .subh{font-size:13px;color:var(--ink2);margin:0 2px 14px}
  /* header for category */
  .chead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--ink)}
  .citychip{flex:1;display:flex;justify-content:center;align-items:center;gap:5px;font-size:14.5px;font-weight:600}
  .chev{opacity:.5}
  /* search field */
  .field{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:14px;padding:0 13px;height:48px;background:#fff;cursor:text}
  .field.focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(10,10,10,.06)}
  .field input{flex:1;border:none;outline:none;font-family:var(--body);font-size:15px;color:var(--ink);background:transparent;min-width:0}
  .field input::placeholder{color:var(--ink2)}
  .field .clr{width:20px;height:20px;border-radius:999px;background:var(--sunken);display:none;place-items:center;color:var(--ink2);cursor:pointer;flex:0 0 auto}
  .field.has .clr{display:grid}
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .rowfield{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:14px;padding:0 13px;height:48px;background:#fff;cursor:pointer;position:relative}
  .rowfield .v{flex:1;font-size:15px;color:var(--ink);font-weight:500}
  .rowfield.empty .v{color:var(--ink2);font-weight:400}
  /* suggestions */
  .sugbox{border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 10px 30px rgba(26,18,9,.10);margin-top:8px;overflow:hidden;max-height:340px;overflow-y:auto}
  .sgl{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.03em;text-transform:uppercase;padding:11px 14px 5px}
  .sug{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer}
  .sug:hover,.sug.kbd{background:var(--sunken)}
  .sug .si{width:34px;height:34px;border-radius:10px;background:var(--sunken);display:grid;place-items:center;flex:0 0 auto;color:var(--ink)}
  .sug .st{font-size:15px;font-weight:500;color:var(--ink)}
  .sug .ss{font-size:12px;color:var(--ink2);margin-top:1px}
  .sug mark{background:transparent;color:var(--ink);font-weight:700}
  .empty-state{padding:16px 14px;font-size:13px;color:var(--ink2)}
  .dropmini{position:absolute;left:0;right:0;top:54px;z-index:5;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 10px 30px rgba(26,18,9,.10);overflow:hidden}
  .dropmini button{display:block;width:100%;text-align:left;border:none;background:#fff;padding:12px 14px;font-family:var(--body);font-size:14.5px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--sunken)}
  .dropmini button:last-child{border-bottom:none}
  .dropmini button:hover{background:var(--sunken)}
  .cta{display:flex;align-items:center;justify-content:center;height:50px;border-radius:14px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;margin-top:12px;cursor:pointer}
  .chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:500}
  .hint{font-size:12px;color:var(--accent);font-weight:600;margin:10px 2px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Interactive search , try it</h1>
  <p class="lead"><b>Tap the Service field and type</b> (e.g. "bar", "näg", "färb") , the suggestions filter live, click one to fill it. Tap <b>Stadt</b> / <b>Zeit</b> for their pickers. Both search bars work: the <b>homepage</b> form (left) and the <b>category-page</b> search (right).</p>
  <div class="frames" id="frames"></div>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}
function svg(p,o){o=o||{};const s=document.createElementNS(NS,"svg");s.setAttribute("width",o.size||18);s.setAttribute("height",o.size||18);s.setAttribute("viewBox","0 0 24 24");s.setAttribute("fill","none");s.setAttribute("stroke","currentColor");s.setAttribute("stroke-width",o.sw||2);s.setAttribute("stroke-linecap","round");s.setAttribute("stroke-linejoin","round");(Array.isArray(p)?p:[p]).forEach(d=>{const q=document.createElementNS(NS,"path");q.setAttribute("d",d);s.appendChild(q);});return s;}
function searchI(o){o=o||{};const s=svg(["M21 21l-4.3-4.3"],{size:o.size||18});const c=document.createElementNS(NS,"circle");c.setAttribute("cx","11");c.setAttribute("cy","11");c.setAttribute("r","7");c.setAttribute("fill","none");c.setAttribute("stroke","currentColor");c.setAttribute("stroke-width","2");s.insertBefore(c,s.firstChild);return s;}
function pinI(){return svg(["M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z","M12 10.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"],{size:17});}
function calI(){return svg(["M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z","M3 9h18","M8 2v4","M16 2v4"],{size:17});}
function homeI(){return svg(["M3 10.5 12 3l9 7.5","M5 9.5V21h14V9.5"],{size:18});}
function menuI(){return svg(["M3 6h18","M3 12h18","M3 18h18"],{size:19,sw:2.2});}
function scI(){return svg(["M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z","M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z","M20 4 8.5 15.5","M14.5 14.5 20 20","M8.5 8.5 12 12"],{size:16});}
function tagI(){return svg(["M20.6 13.4 12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8z","M7.5 7.5h.01"],{size:16});}
function clkI(){const s=svg(["M12 7v5l3 2"],{size:16});const c=document.createElementNS(NS,"circle");c.setAttribute("cx","12");c.setAttribute("cy","12");c.setAttribute("r","9");c.setAttribute("fill","none");c.setAttribute("stroke","currentColor");c.setAttribute("stroke-width","2");s.insertBefore(c,s.firstChild);return s;}
function xI(){return svg(["M18 6 6 18","M6 6l12 12"],{size:13});}

const SERVICES=[
  {n:"Herrenschnitt",c:"Coiffeur",p:45},{n:"Damenschnitt",c:"Coiffeur",p:65},
  {n:"Bart trimmen",c:"Barber",p:28},{n:"Haare & Bart",c:"Barber",p:60},
  {n:"Färben",c:"Coiffeur",p:90},{n:"Balayage",c:"Coiffeur",p:160},
  {n:"Maniküre",c:"Nails",p:55},{n:"Gel-Nägel",c:"Nails",p:80},
  {n:"Massage",c:"Spa",p:120},{n:"Gesichtsbehandlung",c:"Spa",p:140},{n:"Waxing",c:"Spa",p:50},
];
const CATS=[{n:"Coiffeur"},{n:"Barber"},{n:"Nails"},{n:"Spa"}];
const RECENT=["Herrenschnitt"];

function sugRow(icon,title,sub,q){
  const r=el("div","sug"); const si=el("div","si"); si.appendChild(icon); r.appendChild(si);
  const tx=el("div");
  const tt=el("div","st");
  if(q){ const i=title.toLowerCase().indexOf(q.toLowerCase()); if(i>=0){ tt.appendChild(document.createTextNode(title.slice(0,i))); const m=el("mark",null,title.slice(i,i+q.length)); tt.appendChild(m); tt.appendChild(document.createTextNode(title.slice(i+q.length))); } else tt.textContent=title; }
  else tt.textContent=title;
  tx.appendChild(tt); if(sub)tx.appendChild(el("div","ss",sub)); r.appendChild(tx);
  return r;
}

function buildServiceSearch(){
  const f=el("div","field"); f.appendChild(searchI({size:18}));
  const inp=document.createElement("input"); inp.type="text"; inp.placeholder="Service oder Salon suchen"; f.appendChild(inp);
  const clr=el("div","clr"); clr.appendChild(xI()); f.appendChild(clr);
  const box=el("div","sugbox"); box.style.display="none";
  function render(q){
    box.textContent="";
    const ql=(q||"").trim().toLowerCase();
    if(!ql){
      const g1=el("div","sgl","Beliebt"); box.appendChild(g1);
      SERVICES.slice(0,5).forEach(s=>{const r=sugRow(scI(),s.n,"Service · ab CHF "+s.p);r.onclick=()=>pick(s.n);box.appendChild(r);});
      if(RECENT.length){const g2=el("div","sgl","Zuletzt");box.appendChild(g2);RECENT.forEach(n=>{const r=sugRow(clkI(),n,"Zuletzt gesucht");r.onclick=()=>pick(n);box.appendChild(r);});}
      return;
    }
    const svc=SERVICES.filter(s=>s.n.toLowerCase().includes(ql));
    const cat=CATS.filter(c=>c.n.toLowerCase().includes(ql));
    if(!svc.length && !cat.length){ box.appendChild(el("div","empty-state","Keine Treffer , wir suchen trotzdem nach „"+q+"“.")); return; }
    if(svc.length){const g=el("div","sgl","Services");box.appendChild(g);svc.forEach(s=>{const r=sugRow(scI(),s.n,"Service · ab CHF "+s.p,q);r.onclick=()=>pick(s.n);box.appendChild(r);});}
    if(cat.length){const g=el("div","sgl","Kategorien");box.appendChild(g);cat.forEach(c=>{const r=sugRow(tagI(),c.n,"Kategorie",q);r.onclick=()=>pick(c.n);box.appendChild(r);});}
  }
  function pick(name){inp.value=name;f.classList.add("has");box.style.display="none";f.classList.remove("focus");}
  inp.addEventListener("focus",()=>{f.classList.add("focus");render(inp.value);box.style.display="block";});
  inp.addEventListener("input",()=>{f.classList.toggle("has",!!inp.value);render(inp.value);box.style.display="block";});
  clr.onclick=()=>{inp.value="";f.classList.remove("has");inp.focus();render("");};
  document.addEventListener("click",(e)=>{ if(!f.contains(e.target) && !box.contains(e.target)){ box.style.display="none"; f.classList.remove("focus"); }});
  return {field:f,box:box};
}

function miniPicker(field,vEl,options,onPick){
  let open=false,drop=null;
  field.onclick=(e)=>{
    e.stopPropagation();
    if(open){ if(drop)drop.remove(); open=false; return; }
    drop=el("div","dropmini");
    options.forEach(o=>{const btn=document.createElement("button");btn.type="button";btn.textContent=o;btn.onclick=(ev)=>{ev.stopPropagation();vEl.textContent=o;field.classList.remove("empty");if(drop)drop.remove();open=false;onPick&&onPick(o);};drop.appendChild(btn);});
    field.appendChild(drop); open=true;
  };
  document.addEventListener("click",(e)=>{ if(open && !field.contains(e.target)){ if(drop)drop.remove(); open=false; } });
}

function homepageFrame(){
  const box=el("div","phone");
  box.appendChild(el("div","h","Termin in 30 Sekunden."));
  box.appendChild(el("div","subh","Beauty & Wellness in der ganzen Schweiz."));
  const s=buildServiceSearch(); box.appendChild(s.field); box.appendChild(s.box);
  const stack=el("div","stack");
  const cf=el("div","rowfield empty"); cf.appendChild(pinI()); const cv=el("span","v","Stadt"); cf.appendChild(cv); stack.appendChild(cf); miniPicker(cf,cv,["Basel","Zürich","Bern","In meiner Nähe"]);
  const tf=el("div","rowfield empty"); tf.appendChild(calI()); const tv=el("span","v","Zeit"); tf.appendChild(tv); stack.appendChild(tf); miniPicker(tf,tv,["Heute","Morgen","Dieses Wochenende","Datum wählen"]);
  box.appendChild(stack);
  const cta=el("div","cta"); cta.appendChild(el("span",null,"Termine finden")); box.appendChild(cta);
  box.appendChild(el("div","hint","↑ tap the field + type, e.g. „bar“"));
  return box;
}

function categoryFrame(){
  const box=el("div","phone");
  const ch=el("div","chead"); const h=el("div","ic"); h.appendChild(homeI()); ch.appendChild(h);
  const cc=el("div","citychip"); cc.appendChild(pinI()); cc.appendChild(el("span",null,"Basel")); cc.appendChild((function(){const s=svg(["M6 9l6 6 6-6"],{size:13});s.classList.add("chev");return s;})()); ch.appendChild(cc);
  const m=el("div","ic"); m.appendChild(menuI()); ch.appendChild(m); box.appendChild(ch);
  // category pills row
  const chips=el("div","chips"); [["Barber",1],["Coiffeur",0],["Nails",0]].forEach(([l,on])=>{const c=el("div","chip");if(on){c.style.background="var(--sunken)";c.style.borderColor="var(--sunken)";c.style.fontWeight="600";}c.appendChild(el("span",null,l));chips.appendChild(c);}); box.appendChild(chips);
  // the search (same interactive component)
  const s=buildServiceSearch(); s.field.style.marginTop="12px"; box.appendChild(s.field); box.appendChild(s.box);
  // filter chips
  const fr=el("div","chips"); const w=el("div","chip");w.style.borderColor="rgba(39,110,241,.4)";w.style.background="rgba(39,110,241,.08)";w.style.fontWeight="600";w.appendChild(el("span",null,"Walk-in"));fr.appendChild(w);["Jetzt geöffnet","Preis"].forEach(l=>{const c=el("div","chip");c.appendChild(el("span",null,l));fr.appendChild(c);}); box.appendChild(fr);
  box.appendChild(el("div","hint","↑ same search, tap + type"));
  return box;
}

function colize(pillTxt,nm,node){const col=el("div","col");const tag=el("div","tag");tag.appendChild(el("span","pill",pillTxt));tag.appendChild(el("span","ds",nm));col.appendChild(tag);col.appendChild(node);document.getElementById("frames").appendChild(col);}
colize("HOMEPAGE","full form + live suggestions", homepageFrame());
colize("CATEGORY","same search, in the page header", categoryFrame());
</script>
</body>
</html>
