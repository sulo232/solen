<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solen — walk-in C2, color-coded (clean)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0A0A0A;--ink2:#6B6B6B;--ink3:#9a9a9a;--border:#E7E5E4;--sunken:#F5F5F4;
    --blue:#276EF1;--orange:#EA580C;--red:#DC2626;--star:#FFC32B;--heart:#FF3366;
    --disp:'Inter Tight',sans-serif;--body:'Inter',sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e8e6;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 80px}
  h1{font-family:var(--disp);font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 2px 4px}
  .lead{font-size:13.5px;color:#444;line-height:1.55;margin:0 2px 14px;max-width:520px}
  .legend{display:flex;gap:16px;margin:0 2px 18px;font-size:12px;color:#555;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:20px;height:6px;border-radius:3px;display:inline-block}
  .phone{width:392px;max-width:100%;margin:0 auto;background:#fff;border-radius:30px;border:1px solid #d9d7d4;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.12);padding:20px 16px 24px;display:flex;flex-direction:column;gap:20px}
  .card .ph{position:relative;width:100%;aspect-ratio:3/2;border-radius:18px;overflow:hidden;background:var(--sunken);box-shadow:0 16px 36px rgba(0,0,0,.05)}
  .card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .heart{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--heart)}
  /* time pill — NO dot, NO tilde, a range */
  .freepill{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .body{margin-top:11px}
  .r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .nm{font-family:var(--disp);font-weight:500;font-size:18px;letter-spacing:-.015em;color:var(--ink)}
  .rt{display:flex;align-items:center;gap:3px;flex-shrink:0;font-size:13px;color:var(--ink2)}
  .meta{font-size:13px;color:var(--ink2);margin-top:3px}
  .wf{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .ql{min-width:0;flex:1}
  .qbar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-bottom:7px}
  .qbar i{display:block;height:100%;border-radius:3px;background:var(--c)}
  .qn{font-size:13.5px;font-weight:600;color:var(--c)}
  .join{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;white-space:nowrap}
  .join.notify{background:var(--sunken);color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Walk-in C2 — color-coded (clean)</h1>
  <p class="lead">No dot, no "~", a real time range, and trimmed text. The bar + the count shift color with how busy the line is.</p>
  <div class="legend">
    <span><i style="background:var(--blue)"></i> chill</span>
    <span><i style="background:var(--orange)"></i> viel los</span>
    <span><i style="background:var(--red)"></i> rappelvoll</span>
  </div>
  <div class="phone" id="ph"></div>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}
function svg(paths,o){o=o||{};const s=document.createElementNS(NS,"svg");s.setAttribute("width",o.size||15);s.setAttribute("height",o.size||15);s.setAttribute("viewBox","0 0 24 24");s.setAttribute("fill","none");s.setAttribute("stroke","currentColor");s.setAttribute("stroke-width",o.sw||2);s.setAttribute("stroke-linecap","round");s.setAttribute("stroke-linejoin","round");(Array.isArray(paths)?paths:[paths]).forEach(d=>{const p=document.createElementNS(NS,"path");p.setAttribute("d",d);s.appendChild(p);});return s;}
function star(){const s=document.createElementNS(NS,"svg");s.setAttribute("width",12);s.setAttribute("height",12);s.setAttribute("viewBox","0 0 24 24");s.setAttribute("fill","#FFC32B");const p=document.createElementNS(NS,"path");p.setAttribute("d","M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");s.appendChild(p);return s;}
function heart(){const h=el("div","heart");const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("width","16");s.setAttribute("height","16");s.setAttribute("fill","none");s.setAttribute("stroke","currentColor");s.setAttribute("stroke-width","2");const p=document.createElementNS(NS,"path");p.setAttribute("d","M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z");s.appendChild(p);h.appendChild(s);return h;}

const CAP = 8;
function tierC(ahead){ if(ahead<=2) return "var(--blue)"; if(ahead<=5) return "var(--orange)"; return "var(--red)"; }

const SALONS = [
  { name:"Blade & Stone",    rating:4.4, reviews:11, addr:"Feldbergstrasse 82", price:43, free:"Frei in 5-8 Min",   ahead:2, photo:"https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=800&q=80" },
  { name:"The Fade Factory", rating:4.3, reviews:11, addr:"Hammerstrasse 65",   price:47, free:"Frei in 20-25 Min", ahead:5, photo:"https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=800&q=80" },
  { name:"Old Town Barbers", rating:4.3, reviews:12, addr:"Münsterplatz 11",     price:47, free:"Frei in 40-50 Min", ahead:8, photo:"https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=800&q=80" },
];

function card(s){
  const c=el("div","card"); c.style.setProperty("--c", tierC(s.ahead));
  const ph=el("div","ph"); const im=el("img"); im.src=s.photo; im.alt=s.name; ph.appendChild(im);
  ph.appendChild(el("div","freepill", s.free));
  ph.appendChild(heart()); c.appendChild(ph);
  const body=el("div","body");
  const r1=el("div","r1"); r1.appendChild(el("div","nm",s.name)); const rt=el("div","rt"); rt.appendChild(star()); rt.appendChild(el("span",null,s.rating.toFixed(1)+" ("+s.reviews+")")); r1.appendChild(rt); body.appendChild(r1);
  body.appendChild(el("div","meta",s.addr+", Basel · ab CHF "+s.price));
  const wf=el("div","wf"); const ql=el("div","ql");
  const bar=el("div","qbar"); const fillEl=el("i"); fillEl.style.width=Math.round(Math.min(Math.max(s.ahead/CAP,0.12),1)*100)+"%"; bar.appendChild(fillEl); ql.appendChild(bar);
  ql.appendChild(el("div","qn", s.ahead+" vor dir")); wf.appendChild(ql);
  const jb=el("div","join"+(s.full?" notify":"")); jb.appendChild(el("span",null,s.full?"Benachrichtigen":"Anstehen")); if(!s.full)jb.appendChild(svg(["M5 12h14","M12 5l7 7-7 7"],{size:15})); wf.appendChild(jb);
  body.appendChild(wf); c.appendChild(body);
  return c;
}
const ph=document.getElementById("ph"); SALONS.forEach(s=>ph.appendChild(card(s)));
</script>
</body>
</html>
