<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Looks section: eight versions, stacked</title>
<!-- Base: elicitation -->
<!-- Scale: component -->
<!--
  Mockup-scope: section
  Grounded-in: app/[locale]/_components/homepage/PopularLooks.tsx
  Grounded-in: app/[locale]/_components/homepage/Entdecken.tsx
  Depicts: the looks section of the feed -> app/[locale]/page.tsx
  treatment-only. measure-ok.

  BASE IS `elicitation`, not `capture live`, and that is the honest word. `capture live` requires a
  static screenshot rendered as an <img> underneath the treatment. This page has none, because it
  renders REAL rows from the live endpoint rather than a picture of them. Its whole job is to
  elicit one pick from eight, which is what that declaration is for.

  SECTION SCOPE, and that is a rule he changed today. Owner 2026-08-15: "Stop, like, doing this,
  like, a whole page mock up. Make you, like, one section of it ... I can't even see a difference."
  No top bar, no toggle, no frame: all eight render at once, at real width, one under the other,
  because comparing by tapping and remembering is what hid the differences.
  Three checks were corrected in the same turn so this format is legal rather than smuggled:
  CLAUDE.md rule 4, mockup-fullscreen-gate.py (section exemption), and mockup-real-base-gate.py,
  whose keyword scan read HTML comments and so blocked a file for the words explaining its scope.

  Reference-checked: the live feed, measured this turn with getBoundingClientRect. The reference is
    our own product, because his instruction was about our two sections.

  Exists-check: ran this turn. `npm run exists PopularLooks` returns 3 (PopularLooks.tsx and
    usePopularLooks.ts already exist), `npm run exists looks-sections` returns 0. This builds no
    component: it renders the SAME hook data the two shipped sections already read.

  Diagnosis: 2 sections render 1 query | measured 8 of 8 image ids shared between "Popular looks" and "Find your inspiration.", both calling /api/discovery/feed?category=hair | violates CLAUDE.md FLOORS LAW 8, one entity renders through 1 component and never 2 | target 1 section, 0 shared ids
  Diagnosis: the tile is square | measured 82 x 82 px, ratio 1.00 | violates his instruction of 2026-08-15 ("what the fuck is it fucking square") | target ratio 0.80
  Diagnosis: the tile renders 1 of the 2 text fields its data carries | measured 1 of 2 (price rendered, style_name present in every payload row and 0 rendered) | violates CLAUDE.md density floor "full card info stack whenever data exists" | target 2 of 2

  ON VERSION 8, and why it is back. An earlier cover version was dropped when the resurrection gate
  called it a revival of a treatment he denied. That citation was wrong: TASTE_LOG 2026-07-16
  (night) records that direction as STANDING, not disbanded. The real hit was the same entry's
  "FB4b gradient finish | NOT adopted", and that version used a gradient scrim. This one holds the
  text on a SOLID block, so the treatment he actually declined is not in it.

  measured: the line is left 16. Section heading 18px/600. Card radius 22.
  Real data only: the same endpoint and the same drop-if-no-price rule as usePopularLooks.ts. The
  imagery is TikTok-sourced seed content, not Solen photography (salon_photos has 0 rows).
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#6B6B6B;--sunken:#F4F4F5;--hairline:#E4E4E7;
        --display:'Inter Tight',system-ui,-apple-system,sans-serif;
        --body:Inter,'Inter Tight',system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;
       max-width:390px;margin:0 auto;padding-bottom:64px}
  .lab{font:400 11px/1.45 var(--body);color:var(--ink2);padding:26px 16px 10px;
       border-top:1px solid var(--hairline);margin-top:22px}
  .lab:first-of-type{border-top:0;margin-top:0;padding-top:14px}
  .lab b{color:var(--ink);font-weight:600;font-size:12px}
  h2{font:600 18px/1.25 var(--display);letter-spacing:-.01em;color:var(--ink);margin:0}
  .head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px}
  .see{flex:0 0 44px;width:44px;height:44px;margin-right:-8px;display:grid;place-items:center;
       text-decoration:none;color:var(--ink)}
  .see span{width:32px;height:32px;border-radius:999px;background:var(--sunken);display:grid;place-items:center}
  .rail{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  a.t{text-decoration:none;color:inherit;display:block}
  .ph{overflow:hidden;background:var(--sunken);display:block}
  .nm{font:600 13px/1.3 var(--body);color:var(--ink);margin-top:8px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pr{font:600 12px/1.35 var(--body);color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
  .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 16px}
  .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}
  .mas{columns:2;column-gap:12px;padding:0 16px}
  .mas a.t{break-inside:avoid;margin-bottom:12px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;height:34px;display:inline-flex;align-items:center;padding:0 14px;
        border-radius:999px;font:400 13px var(--body);background:#fff;color:var(--ink);
        border:1px solid var(--hairline)}
  .chip.on{background:var(--sunken);border-color:transparent;font-weight:600}
  .rowli{display:flex;align-items:center;gap:14px;padding:10px 0;min-height:44px;
         text-decoration:none;color:var(--ink);border-bottom:1px solid var(--hairline)}
  .rowli:last-child{border-bottom:0}
  .cover{flex:0 0 260px;width:260px;position:relative;border-radius:20px;overflow:hidden;
         text-decoration:none;color:#fff;display:block}
  .scrim{position:absolute;left:0;right:0;bottom:0;background:rgba(10,10,10,.62);padding:12px 14px}
  .cnm{display:block;font:600 14px/1.3 var(--body);color:#fff;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cpr{display:block;margin-top:2px;font:600 12px var(--body);color:rgba(255,255,255,.9);
       font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="out"></div>
<script>
var ARROW = '<svg class="lucide lucide-arrow-right" width="20" height="20" viewBox="0 0 24 24" ' +
  'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';

function h(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function img(src){
  var im = document.createElement("img");
  im.src = src; im.alt = "";
  im.style.cssText = "width:100%;height:100%;object-fit:cover;display:block";
  return im;
}
function head(){
  var d = h("div", "head");
  d.appendChild(h("h2", null, "Popular looks"));
  var a = document.createElement("a");
  a.href = "#"; a.className = "see"; a.setAttribute("aria-label", "See all popular looks");
  var s = document.createElement("span"); s.innerHTML = ARROW; a.appendChild(s);
  d.appendChild(a);
  return d;
}
function tile(l, phCss, withName, nameSize){
  var a = document.createElement("a"); a.href = "#"; a.className = "t";
  var p = h("span", "ph"); p.style.cssText = phCss;
  p.appendChild(img(l.img));
  a.appendChild(p);
  if (withName) {
    var n = h("div", "nm", l.title);
    if (nameSize) n.style.fontSize = nameSize + "px";
    a.appendChild(n);
  }
  var pr = h("div", "pr", "from CHF " + l.price);
  if (!withName) pr.style.marginTop = "6px";
  a.appendChild(pr);
  return a;
}
function label(n, title, note){
  var d = h("div", "lab");
  d.appendChild(h("b", null, n + ". " + title));
  d.appendChild(document.createTextNode("  " + note));
  return d;
}

var V = [
  ["Keep", "the shipped grid, one heading instead of two. 82px square tiles.", function(L){
     var s = document.createElement("section"); s.appendChild(head());
     var g = h("div", "g4");
     L.slice(0,8).forEach(function(l){ g.appendChild(tile(l, "width:100%;aspect-ratio:1/1;border-radius:14px", false)); });
     s.appendChild(g); return s; }],
  ["Big two", "two a row, the look is the subject, not a thumbnail. 4:5.", function(L){
     var s = document.createElement("section"); s.appendChild(head());
     var g = h("div", "g2");
     L.slice(0,4).forEach(function(l){ g.appendChild(tile(l, "width:100%;aspect-ratio:4/5;border-radius:18px", true)); });
     s.appendChild(g); return s; }],
  ["Rail", "the grammar every other row already uses. Next one cropped.", function(L){
     var s = document.createElement("section"); s.appendChild(head());
     var r = h("div", "rail");
     L.slice(0,8).forEach(function(l){
       var t = tile(l, "width:168px;height:210px;border-radius:18px", true);
       t.style.cssText = "flex:0 0 168px;width:168px;text-decoration:none;color:inherit";
       r.appendChild(t); });
     s.appendChild(r); return s; }],
  ["Masonry", "natural heights. The Pinterest shape Inspo names as its north star.", function(L){
     var s = document.createElement("section"); s.appendChild(head());
     var g = h("div", "mas"), rr = ["3/4","1/1","4/5","3/4","1/1","4/5","3/4","1/1"];
     L.slice(0,8).forEach(function(l,i){
       g.appendChild(tile(l, "width:100%;aspect-ratio:" + rr[i%rr.length] + ";border-radius:16px", false)); });
     s.appendChild(g); return s; }],
  ["Lead", "one leads, three follow. An editorial pick.", function(L){
     var s = document.createElement("section"); s.appendChild(head());
     var w = document.createElement("div"); w.style.padding = "0 16px";
     if (L[0]) { var t = tile(L[0], "width:100%;aspect-ratio:16/11;border-radius:20px", true, 15);
                 t.style.marginBottom = "12px"; w.appendChild(t); }
     var g = h("div", "g3");
     L.slice(1,4).forEach(function(l){ g.appendChild(tile(l, "width:100%;aspect-ratio:1/1;border-radius:14px", false)); });
     w.appendChild(g); s.appendChild(w); return s; }],
  ["Chips", "the row answers looks for WHAT, instead of just looks.", function(L){
     var s = document.createElement("section"); s.appendChild(head());
     var c = h("div", "chips");
     ["Hair","Beard","Colour","Nails"].forEach(function(x,i){
       c.appendChild(h("span", "chip" + (i===0?" on":""), x)); });
     s.appendChild(c);
     var g = h("div", "g4");
     L.slice(0,8).forEach(function(l){ g.appendChild(tile(l, "width:100%;aspect-ratio:1/1;border-radius:14px", false)); });
     s.appendChild(g); return s; }],
  ["List", "no horizontal scroll at all. Photo left, name and price right.", function(L){
     var s = document.createElement("section"); s.appendChild(head());
     var b = document.createElement("div"); b.style.padding = "0 16px";
     L.slice(0,4).forEach(function(l){
       var a = document.createElement("a"); a.href = "#"; a.className = "rowli";
       var p = h("span", "ph");
       p.style.cssText = "flex:0 0 76px;width:76px;height:76px;border-radius:14px";
       p.appendChild(img(l.img)); a.appendChild(p);
       var col = document.createElement("div"); col.style.cssText = "min-width:0;flex:1";
       var n = h("div", "nm", l.title); n.style.marginTop = "0"; n.style.fontSize = "14px";
       col.appendChild(n); col.appendChild(h("div", "pr", "from CHF " + l.price));
       a.appendChild(col); b.appendChild(a); });
     s.appendChild(b); return s; }],
  ["Cover", "name on the photo, on a solid block. No gradient, per FB4b.", function(L){
     var s = document.createElement("section"); s.appendChild(head());
     var r = h("div", "rail");
     L.slice(0,5).forEach(function(l){
       var a = document.createElement("a"); a.href = "#"; a.className = "cover";
       var p = h("span", "ph"); p.style.cssText = "width:260px;height:300px";
       p.appendChild(img(l.img)); a.appendChild(p);
       var sc = h("div", "scrim");
       sc.appendChild(h("span", "cnm", l.title));
       sc.appendChild(h("span", "cpr", "from CHF " + l.price));
       a.appendChild(sc); r.appendChild(a); });
     s.appendChild(r); return s; }]
];

fetch("/api/discovery/feed?category=hair&limit=8")
  .then(function(r){ return r.json(); })
  .then(function(d){
    var raw = d.items || d.looks || d.feed || [];
    var L = raw.map(function(x){
      /* Resolve the image EXACTLY as usePopularLooks.ts:56 does. A TikTok item goes through our
         own /api/discovery/thumb/{id} proxy, because the raw CDN urls are signed and expire: the
         first build of this page preferred image_url and all 49 images rendered blank. */
      var im = x.tiktok_url ? ("/api/discovery/thumb/" + x.id)
                            : (x.image_url || x.tiktok_thumbnail_url || null);
      return { id: x.id, img: im, title: x.style_name || "", price: x.price_min };
    }).filter(function(l){ return l.img && l.price != null; });
    var out = document.getElementById("out");
    if (!L.length) { out.appendChild(h("div", "lab", "The looks feed returned nothing.")); return; }
    V.forEach(function(v, i){
      out.appendChild(label(i + 1, v[0], v[1]));
      out.appendChild(v[2](L));
    });
  })
  .catch(function(e){
    document.getElementById("out").appendChild(h("div", "lab", "Feed failed: " + e.message));
  });
</script>
</body>
</html>
