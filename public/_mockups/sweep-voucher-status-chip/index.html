<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Voucher status chip , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/profile/vouchers/page.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real voucher wallet via
  /api/dev/login?to=/de/profile/vouchers (the status chip paints icon AND label in the semantic hue, so "Active"
  is faint amber text on an amber tint). AFTER = pale bg + INK label + saturated icon (rule 6). Only the chip changes.
  Depicts: voucher status chip -> app/[locale]/profile/vouchers/page.tsx
  Exists-check: `npm run exists "voucher status chip"` ran earlier , the wallet already renders.
  Backend-check: vouchers are live data; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--warning:#F1AE27;--green:#16A34A;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:22px 16px 40px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-0.02em}
  .vc{margin-top:14px;background:#fff;border:1px solid var(--hairline);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(10,10,10,.04)}
  .vt{display:flex;justify-content:space-between;align-items:flex-start}
  .va{font-size:20px;font-weight:700;letter-spacing:-0.02em}.vm{font-size:12px;color:var(--ink3);margin-top:2px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;color:var(--ink)}
  .chip svg{width:13px;height:13px}
  .chip.act{background:rgba(241,174,39,.15)} .chip.act svg{color:var(--warning)}
  .chip.used{background:rgba(22,163,74,.15)} .chip.used svg{color:var(--green)}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:22px;line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/api/dev/login?to=/de/profile/vouchers" title="live vouchers"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="h1">Vouchers</div>
        <div class="vc"><div class="vt"><div><div class="va">CHF 50</div><div class="vm">Valid to 12.2026</div></div><span class="chip act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Active</span></div></div>
        <div class="vc" style="margin-top:12px"><div class="vt"><div><div class="va">CHF 30</div><div class="vm">Used 03.2026</div></div><span class="chip used"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="M20 6 9 17l-5-5"/></svg>Used</span></div></div>
        <div class="cap">Change applied: the status chip is pale bg + ink label + one saturated icon (rule 6), so "Active" reads in full-contrast ink instead of faint amber text on an amber tint.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
