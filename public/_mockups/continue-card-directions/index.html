<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Continue card: three directions, round 2</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Mockup-scope: whole-page
  Grounded-in: app/[locale]/_components/homepage/ContinueCard.tsx
  Depicts: the homepage feed -> app/[locale]/page.tsx
  treatment-only for the surrounding page. measure-ok.

  TWO live iframes of the SAME real route /en. applyChange(doc) injects onto the real page and marks
  what it touched with data-sweep-done. A / B / C switch which direction is injected.

  ROUND 2, every change is one of his corrections, quoted:
   "too tall now, get rid of how it was before"        -> card back to 104px (was 98, I overshot to 124)
   "you made a fucking square"                         -> the photo is no longer square, it uses our
                                                          own 5/4 card shape
   "the dates, which week it is, no one cares"         -> every date and weekday removed
   "why is here how many person it is"                 -> the head count is removed
   "I don't like how the photos are stacked"           -> the fanned stack is gone from A
   "maybe put back city or if they search for a
    specific haircut, they see what they search"       -> A now shows the ACTUAL search text
   "b is chill except the aspect ratio, it's too big"  -> B keeps its shape, its photo comes down
   "on the booking, too much texting unorganized"      -> C cut to two short lines
   "why is this see all button just text? we use an
    arrow everywhere else. inconsistent sloppiness"    -> real Lucide arrow-right in a circular
                                                          button, the same one the page already uses

  Diagnosis: the card grew past its content | measured 124px tall carrying two short lines | violates his instruction of 2026-08-15 ("too tall now, get rid of how it was before") | target 104px
  Diagnosis: my section header had no arrow button where every other row on our page has one | measured 0px of button in my header against a 28pt circular arrow in his reference | violates FLOORS LAW 8, the same thing must look the same everywhere | target 28px
  Diagnosis: the photo was square where our cards are not | measured 88px square | violates taste rule 9, pull the shape from a locked component, ours is 5/4 | target 92px wide
  Diagnosis: our category pill icons are oversized | measured 28px inside a 40px pill against 18.4pt inside a 38pt pill in his reference | violates his instruction of 2026-08-15 ("the category icons are too big") | target 19px

  measured: his screenshot, PIL this turn, 402pt phone. Recently-viewed thumb 96pt wide. The header
    affordance on the right is a CIRCULAR button 28pt across, which is what our own page already uses
    on every other row and what my "See all" text was breaking.
  measured: our live page, getBoundingClientRect this turn: category pill 113 by 40px, its icon 28px.
  measured: the card was 98px, I made it 124px and he called it too tall. It is 104px here.

  ON THE CITY, checked rather than assumed: a reviewer argued "Coiffeur" would just be the next dead
  word if nearly every salon were coiffeur. Live count says otherwise: coiffeur 8, nails 4, spa 4,
  barbershop 4 of 20. A goes further anyway and shows what he actually typed.

  Backend-check: every salon name, photo, category and rating is a live row read 2026-08-14.
  Exists-check: ran this turn. ContinueCard.tsx and RecentlyViewed.tsx already exist.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#6B6B6B;--sunken:#F4F4F5;--hairline:#E4E4E7;--star:#FFC32B;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);padding:8px 10px}
  .row{display:flex;justify-content:center}
  .row + .row{margin-top:6px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(340px,90vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink2);padding:7px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .cap{position:fixed;top:96px;left:0;right:0;z-index:19;background:var(--sunken);color:var(--ink2);font-size:12px;font-weight:600;text-align:center;padding:6px 12px;line-height:1.35}
  .stage{position:fixed;top:128px;left:0;right:0;bottom:0;transition:top .18s ease}
  body.bare .top,body.bare .cap{display:none}
  body.bare .stage{top:0}
  /* The toggle has to live somewhere, and every somewhere covers part of the real page. Bottom-right
     covered the tab bar, which is load-bearing nav. Top-right sits over the page's white top padding,
     the emptiest strip on the screen, and it drops to 40% once the controls are hidden. */
  .peek{position:fixed;right:6px;top:6px;z-index:30;width:30px;height:30px;border:0;border-radius:999px;
    background:rgba(10,10,10,.82);color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);
    display:flex;align-items:center;justify-content:center;opacity:.55;transition:opacity .15s ease}
  .peek:hover,.peek:active{opacity:1}
  body.bare .peek{opacity:.4}
  .pane{position:absolute;inset:0}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div class="top">
    <div class="row"><div class="seg">
      <button id="bBefore" class="on" onclick="show('before')">Before (live)</button>
      <button id="bAfter" onclick="show('after')">After</button>
    </div></div>
    <div class="row"><div class="seg">
      <button id="bA" class="on" onclick="pick('a')">A search</button>
      <button id="bB" onclick="pick('b')">B salon</button>
      <button id="bC" onclick="pick('c')">C booking</button>
    </div></div>
  </div>
  <div class="cap" id="cap">A. What they actually typed. No date, no place, no head count.</div>
  <button class="peek" id="peek" onclick="bare()" title="Hide controls" aria-label="Hide controls"></button>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe id="beforeFrame" src="/en" title="the real homepage, before"></iframe></div>
    <div id="paneAfter" class="pane hidden"><iframe id="afterFrame" src="/en" title="the real homepage, after"></iframe></div>
  </div>
<script>
var SALONS = [
  {n:"Cuts & Culture",   p:"https://images.unsplash.com/photo-1622288432450-277d0fef5ed6?w=800&q=80", cat:"Barbershop", r:"4.8", c:16},
  {n:"Haarsalon Margot", p:"https://images.unsplash.com/photo-1487412947147-5cebf100ffc2?w=800&q=80", cat:"Coiffeur",   r:"4.8", c:16},
  {n:"Atelier Haarwerk", p:"https://images.unsplash.com/photo-1560066984-138dadb4c035?w=800&q=80", cat:"Coiffeur",   r:"4.6", c:25},
  {n:"Velvet Face",      p:"https://images.unsplash.com/photo-1512290923902-8a9f81dc236c?w=800&q=80", cat:"Make-up",    r:"4.6", c:7}
];

// Real Lucide arrow-right, copied from the markup already used elsewhere in this folder.
var ARROW = '<svg class="lucide lucide-arrow-right" width="14" height="14" viewBox="0 0 24 24" ' +
  'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
  'stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';

var CAPS = {
  a: "A. What they actually typed. No date, no place, no head count.",
  b: "B. The salon itself. Photo down to our card shape.",
  c: "C. The booking, cut to two lines."
};

var VARIANTS = {
  a: [
    { title: "Skin fade",  sub: "Barbershop",           photo: SALONS[0].p },
    { title: "Balayage",   sub: "Coiffeur",             photo: SALONS[2].p }
  ],
  b: [
    { title: "Cuts & Culture",   sub: "Barbershop",       photo: SALONS[0].p },
    { title: "Haarsalon Margot", sub: "Coiffeur",         photo: SALONS[1].p }
  ],
  c: [
    { title: "Herrenschnitt",    sub: "Cuts & Culture",   photo: SALONS[0].p },
    { title: "Balayage",         sub: "Atelier Haarwerk", photo: SALONS[2].p }
  ]
};

function arrowButton(doc){
  var b = doc.createElement("a");
  b.href = "#";
  b.setAttribute("aria-label", "See all");
  b.style.cssText = "flex:0 0 28px;width:28px;height:28px;border-radius:999px;background:#F4F4F5;" +
    "display:grid;place-items:center;text-decoration:none;color:#0A0A0A";
  b.innerHTML = ARROW;
  return b;
}

function continueRail(doc, key){
  var wrap = doc.createElement("div");
  wrap.style.cssText = "padding:4px 0 6px";
  var rail = doc.createElement("div");
  rail.style.cssText = "display:flex;gap:12px;overflow-x:auto;padding:0 24px 2px;scrollbar-width:none";
  VARIANTS[key].forEach(function(v){
    var card = doc.createElement("a");
    card.href = "#";
    card.style.cssText = "flex:0 0 321px;height:104px;display:flex;align-items:center;gap:14px;" +
      "border-radius:18px;background:#fff;padding:15px;text-decoration:none;color:inherit;" +
      "box-shadow:0 6px 20px -10px rgba(10,10,10,.20), 0 1px 2px rgba(10,10,10,.06)";
    var left = doc.createElement("span");
    left.style.cssText = "min-width:0;flex:1";
    left.innerHTML =
      '<span style="display:block;font:600 17px/22px \'Inter Tight\',Inter,sans-serif;color:#0A0A0A;' +
        'white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + v.title + '</span>' +
      '<span style="display:block;margin-top:4px;font:400 13px Inter,sans-serif;color:#6B6B6B">' + v.sub + '</span>';
    var shot = doc.createElement("span");
    shot.style.cssText = "flex:0 0 92px;width:92px;height:74px;border-radius:14px;overflow:hidden;background:#F4F4F5";
    shot.innerHTML = '<img src="' + v.photo + '" style="width:100%;height:100%;object-fit:cover;display:block">';
    card.appendChild(left); card.appendChild(shot);
    rail.appendChild(card);
  });
  wrap.appendChild(rail);
  return wrap;
}

function viewedRow(doc){
  var sec = doc.createElement("section");
  sec.style.cssText = "padding:18px 0 4px";
  var head = doc.createElement("div");
  head.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:0 24px 12px";
  var h = doc.createElement("h2");
  h.textContent = "Recently viewed";
  h.style.cssText = "font:600 22px/1.2 'Inter Tight',Inter,sans-serif;letter-spacing:-.01em;margin:0;color:#0A0A0A";
  head.appendChild(h); head.appendChild(arrowButton(doc));
  var rail = doc.createElement("div");
  rail.style.cssText = "display:flex;gap:12px;overflow-x:auto;padding:0 24px 4px;scrollbar-width:none";
  SALONS.forEach(function(x){
    var a = doc.createElement("a");
    a.href = "#";
    a.style.cssText = "flex:0 0 150px;text-decoration:none;color:inherit";
    a.innerHTML =
      '<div style="width:150px;aspect-ratio:5/4;border-radius:16px;overflow:hidden;background:#F4F4F5;box-shadow:0 1px 3px rgba(0,0,0,.06)">' +
        '<img src="' + x.p + '" style="width:100%;height:100%;object-fit:cover;display:block"></div>' +
      '<p style="font:600 14px/1.25 Inter,sans-serif;margin:8px 0 0;color:#0A0A0A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + x.n + '</p>' +
      '<p style="font:400 12px/1.3 Inter,sans-serif;color:#6B6B6B;margin:2px 0 0">' + x.cat + '</p>' +
      '<p style="font:600 12px Inter,sans-serif;margin:3px 0 0;font-variant-numeric:tabular-nums;color:#0A0A0A">' +
        '<span style="color:#FFC32B">&#9733;</span> ' + x.r + ' <span style="font-weight:400;color:#6B6B6B">(' + x.c + ')</span></p>';
    rail.appendChild(a);
  });
  sec.appendChild(head); sec.appendChild(rail);
  return sec;
}

function shrinkPillIcons(doc){
  doc.querySelectorAll('a img, button img, a svg, button svg').forEach(function(im){
    var r = im.getBoundingClientRect ? im.getBoundingClientRect() : null;
    if (r && Math.round(r.width) === 28 && Math.round(r.height) === 28) {
      im.style.width = "19px"; im.style.height = "19px";
      im.setAttribute("data-sweep-done", "1");
    }
  });
}

function applyChange(doc){
  var key = window.__ccKey || "a";
  var old = doc.querySelector("[data-cc-variant]");
  if (old) old.remove();
  var oldRow = doc.querySelector("[data-cc-viewed]");
  if (oldRow) oldRow.remove();

  var ours = doc.querySelectorAll('span[class*="h-[88px]"], div[class*="h-[88px]"]');
  if (ours.length) {
    var c = ours[0];
    for (var u = 0; u < 5 && c.parentElement; u++) c = c.parentElement;
    if (!c.hasAttribute("data-cc-variant")) c.style.display = "none";
  }

  var anchor = null, all = doc.querySelectorAll("a,button,span,div");
  for (var i = 0; i < all.length && !anchor; i++) {
    var t = (all[i].textContent || "").trim();
    if (t === "Coiffeur" || t === "Barber" || t === "Barbershop") anchor = all[i];
  }
  var host = anchor;
  if (host) {
    for (var u2 = 0; u2 < 6 && host.parentElement; u2++) {
      host = host.parentElement;
      var tx = host.textContent || "";
      if (tx.indexOf("Coiffeur") > -1 && tx.indexOf("Barber") > -1) break;
    }
  }
  var target = host || doc.querySelector("main section, main > div, main");
  if (!target || !target.parentElement) return 0;

  var holder = doc.createElement("div");
  holder.setAttribute("data-cc-variant", key);
  holder.setAttribute("data-sweep-done", "1");
  holder.style.position = "relative";
  holder.appendChild(continueRail(doc, key));
  var lab = doc.createElement("div");
  lab.textContent = "After: " + key.toUpperCase();
  lab.style.cssText = "position:absolute;top:-2px;right:10px;background:rgba(10,10,10,.82);color:#fff;" +
    "font:600 10px/1.3 -apple-system,sans-serif;padding:3px 8px;border-radius:999px;z-index:99999";
  holder.appendChild(lab);
  target.parentElement.insertBefore(holder, target.nextSibling);

  var row = viewedRow(doc);
  row.setAttribute("data-cc-viewed", "1");
  holder.parentElement.insertBefore(row, holder.nextSibling);

  shrinkPillIcons(doc);
  try { holder.scrollIntoView({ block: "center" }); } catch (e) {}
  return 1;
}

function pump(){
  var f = document.getElementById("afterFrame");
  setInterval(function(){
    try {
      var doc = f.contentDocument;
      if (!doc || !doc.querySelector("h1,h2,h3")) return;
      var have = doc.querySelector("[data-cc-variant]");
      var shown = have ? have.getAttribute("data-cc-variant") : null;
      if (shown !== (window.__ccKey || "a")) applyChange(doc);
    } catch (e) {}
  }, 400);
}
function pick(k){
  window.__ccKey = k;
  ["A","B","C"].forEach(function(id, i){
    document.getElementById("b" + id).classList.toggle("on", ["a","b","c"][i] === k);
  });
  document.getElementById("cap").textContent = CAPS[k];
  show("after");
  try { applyChange(document.getElementById("afterFrame").contentDocument); } catch (e) {}
}
function show(w){
  document.getElementById("paneBefore").classList.toggle("hidden", w !== "before");
  document.getElementById("paneAfter").classList.toggle("hidden", w !== "after");
  document.getElementById("bBefore").classList.toggle("on", w === "before");
  document.getElementById("bAfter").classList.toggle("on", w === "after");
}
var EYE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
var EYE_OFF = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
function bare(){
  var on = document.body.classList.toggle('bare');
  var b = document.getElementById('peek');
  b.innerHTML = on ? EYE : EYE_OFF;
  b.title = b.ariaLabel = on ? 'Show controls' : 'Hide controls';
}
document.getElementById('peek').innerHTML = EYE_OFF;
window.__ccKey = "a";
pump();
</script>
</body>
</html>
