<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Booking services , salon-page tier-card display (mockup)</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Owner-scope: confirmed: approved this turn ("alr approved ... the mockup u made is good"), refined 2026-07-18:
  chevron inline by the name, price below the description on expand, + centered vertically. This edit adds the
  owner-required MOTION: the + -> check swap animates (opacity + scale + blur crossfade, glide ease, matching
  ToggleCircle ENTER_RECIPE) plus a small circle pop; the price total ROLLS up (value-roll) when it changes;
  the minutes bump (count-bump) when the duration changes. Interaction unchanged: tap the row body to expand,
  tap the + to select. No before/after toggle.
  Grounded-in: components-legacy/booking/ServicesStaffStep.tsx (its ToggleCircle add-control, its
  animate-value-roll price + animate-count-bump count, the fixed total plus Continue bar, the per-service
  description) restyled to match app/[locale]/_components/salon/SalonServices.tsx (subcategory filter pills ->
  DURATION-TIER groups Express / Classic / Signature, each a rounded-[24px] border border-s-border bg-white
  shadow-whisper list, name 15/600 md16 / duration "20 min" text-only no clock / price "from CHF N" bold). The
  motion values mirror app/globals.css value-roll + count-bump keyframes and ToggleCircle.tsx (opacity+scale+
  blur, glide). CHECKED all three live this turn. No review count on any row (C11), no blue accent used.
  Exists-check: `npm run exists booking` ran this turn. The salon-page tier display (SalonServices.tsx), the
  booking step (ServicesStaffStep.tsx), and the value-roll / count-bump keyframes (app/globals.css) all exist
  and render today; REMOVED.md none. NEW = the booking step adopting the salon page's tier-card display; the
  motion classes already exist in the real component.
  Backend-check: the + = add/remove in the client booking-context cart (real, updates total/duration); the row
  body tap = expand info (client only, no write); Continue = goToStep(next) (real); every name/duration/price/
  description is display of a live service row (real). No fabricated value. Taste-current: no review count on
  rows; no full-bleed; no ALL-CAPS. English chrome.
  Reference-checked: the salon page is Solen's own surface (SalonServices.tsx plus live PDP
  /de/salon/blade-and-stone), read plus rendered this turn.
-->
<style>
  :root{
    --ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--surface:#fff;--sunken:#F4F4F5;
    --hairline:#E4E4E7;
    --whisper:0 1px 2px rgba(10,10,10,.04),0 6px 20px -10px rgba(10,10,10,.08);
    --glide:cubic-bezier(0.16,1,0.3,1);--pop:cubic-bezier(0.34,1.56,0.64,1);
    --font:'Inter Tight',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .app{position:fixed;inset:0;width:100%;display:flex;flex-direction:column;background:#fff}

  /* Header (booking wizard chrome) */
  .hd{flex:none;display:flex;align-items:center;gap:10px;height:56px;padding:0 12px;border-bottom:1px solid var(--hairline);background:rgba(255,255,255,.96);backdrop-filter:blur(8px)}
  .ic{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none}
  .ic.br{border:1px solid var(--hairline)}
  .hd .ttl{font-size:16px;font-weight:700;letter-spacing:-0.01em}
  .hd .step{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:600}

  /* Scroll body */
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 130px}

  /* Section header */
  .h2{font-size:clamp(18px,2vw,20px);font-weight:600;letter-spacing:-0.02em;line-height:1.2;padding:18px 0 0}

  /* Filter pills (subcategory) , sticky under the header */
  .pills{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 10px;margin:0 -16px}
  .pills::-webkit-scrollbar{display:none}
  .pl{flex:none;font-size:13px;font-weight:600;padding:9px 15px;border-radius:999px;border:1px solid var(--hairline);color:var(--ink2);background:#fff;white-space:nowrap}
  .pl.on{background:var(--sunken);color:var(--ink);border-color:transparent;font-weight:600}

  /* Duration-tier group */
  .tier{margin-top:22px}
  .tier:first-of-type{margin-top:6px}
  .tlab{display:flex;align-items:baseline;gap:8px}
  .tlab h3{font-size:16px;font-weight:600;letter-spacing:-0.01em;color:var(--ink)}
  .tlab .rng{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}

  /* The card (salon-page: rounded-24 plus hairline plus whisper) */
  .card{margin-top:12px;border:1px solid var(--hairline);border-radius:24px;background:#fff;box-shadow:var(--whisper);overflow:hidden}

  /* Row = expandable body + a separate select control */
  .row{border-top:1px solid var(--hairline)}
  .card .row:first-child{border-top:0}
  .row.sel{background:rgba(244,244,245,.7)}
  .top{display:flex;align-items:center;gap:10px;padding:16px 20px}
  .body{min-width:0;flex:1;text-align:left;background:none;border:0;font-family:inherit;cursor:pointer;padding:0}
  /* Name line: name + the down chevron INLINE beside it */
  .nmline{display:flex;align-items:center;gap:6px}
  .body .nm{font-size:16px;font-weight:600;color:var(--ink);line-height:1.25}
  .chv{flex:none;display:grid;place-items:center;color:var(--ink3);transition:transform .26s var(--glide)}
  .row.open .chv{transform:rotate(180deg)}
  .body .du{font-size:14px;color:var(--ink3);margin-top:4px;font-variant-numeric:tabular-nums}
  /* Info panel sits BETWEEN duration and price, so on expand the price ends up UNDER the description */
  .desc{max-height:0;overflow:hidden;transition:max-height .28s var(--glide),margin-top .28s var(--glide);margin-top:0;color:var(--ink2)}
  .row.open .desc{max-height:160px;margin-top:10px}
  .desc p{font-size:14px;line-height:1.5;padding-right:8px}
  .body .pr{font-size:15px;font-weight:700;color:var(--ink);margin-top:12px;font-variant-numeric:tabular-nums}

  /* ToggleCircle (36px) with the + -> check crossfade (opacity+scale+blur, glide) + a select pop */
  .tog{position:relative;width:36px;height:36px;border-radius:999px;flex:none;border:1px solid var(--hairline);color:var(--ink2);background:#fff;cursor:pointer;padding:0;transition:background-color .3s var(--glide),border-color .3s var(--glide)}
  .tog.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tog.pop{animation:tog-pop .42s var(--pop)}
  .tog .pl-i,.tog .ck-i{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .42s var(--glide),transform .42s var(--glide),filter .42s var(--glide)}
  .tog .pl-i{opacity:1;transform:scale(1);filter:blur(0)}
  .tog .ck-i{opacity:0;transform:scale(.6);filter:blur(6px)}
  .tog.on .pl-i{opacity:0;transform:scale(.6);filter:blur(6px)}
  .tog.on .ck-i{opacity:1;transform:scale(1);filter:blur(0)}
  @keyframes tog-pop{0%{transform:scale(1)}38%{transform:scale(1.18)}100%{transform:scale(1)}}

  /* Fixed bottom bar (total plus Continue) */
  .bar{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--hairline);background:#fff;z-index:8}
  .bar .in{max-width:520px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:14px}
  .bar .tot{font-size:22px;font-weight:800;letter-spacing:-0.01em;line-height:1;font-variant-numeric:tabular-nums;overflow:hidden}
  .bar .meta{font-size:12px;color:var(--ink3);margin-top:6px;display:flex;align-items:center;gap:6px}
  .cont{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;border:0;border-radius:14px;padding:14px 22px;font-family:inherit;cursor:pointer;transition:opacity .2s}
  .cont.off{opacity:.45;cursor:not-allowed}

  /* Motion vocab (mirrors app/globals.css): price rolls, minutes/count bump */
  .roll{display:inline-block}
  .roll.go{animation:value-roll .38s var(--glide)}
  @keyframes value-roll{0%{transform:translateY(60%);opacity:0}100%{transform:translateY(0);opacity:1}}
  .bump{display:inline-block}
  .bump.go{animation:count-bump .4s var(--pop)}
  @keyframes count-bump{0%{transform:scale(1)}35%{transform:scale(1.4)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  svg{display:block}
</style>
</head>
<body>
  <div class="app">
    <div class="hd">
      <span class="ic br" data-i="back"></span>
      <span class="ttl">Select services</span>
      <span class="step">Step 1 of 4</span>
      <span class="ic br" data-i="close"></span>
    </div>

    <div class="scroll">
      <div class="wrap">
        <h2 class="h2">Services</h2>

        <div class="pills">
          <span class="pl on">All</span>
          <span class="pl">Haircut</span>
          <span class="pl">Beard</span>
          <span class="pl">Combo</span>
          <span class="pl">Extras</span>
        </div>

        <!-- Express -->
        <div class="tier">
          <div class="tlab"><h3>Express</h3><span class="rng">15&ndash;30 min</span></div>
          <div class="card">
            <div class="row" data-price="28" data-dur="20">
              <div class="top">
                <button class="body" data-expand>
                  <div class="nmline"><span class="nm">Beard trim</span><span class="chv" data-i="chev"></span></div>
                  <div class="du">20 min</div>
                  <div class="desc"><p>Shape and tidy the beard line with a scissor and clipper finish.</p></div>
                  <div class="pr">from CHF 28</div>
                </button>
                <button class="tog" data-tog><span class="pl-i" data-i="plus"></span><span class="ck-i" data-i="check"></span></button>
              </div>
            </div>
            <div class="row" data-price="25" data-dur="25">
              <div class="top">
                <button class="body" data-expand>
                  <div class="nmline"><span class="nm">Line-up &amp; edges</span><span class="chv" data-i="chev"></span></div>
                  <div class="du">25 min</div>
                  <div class="desc"><p>Crisp hairline and edge detailing to sharpen your current cut.</p></div>
                  <div class="pr">from CHF 25</div>
                </button>
                <button class="tog" data-tog><span class="pl-i" data-i="plus"></span><span class="ck-i" data-i="check"></span></button>
              </div>
            </div>
            <div class="row open" data-price="42" data-dur="30">
              <div class="top">
                <button class="body" data-expand>
                  <div class="nmline"><span class="nm">Hot-towel shave</span><span class="chv" data-i="chev"></span></div>
                  <div class="du">30 min</div>
                  <div class="desc"><p>Traditional straight razor shave with hot towels and a post shave balm.</p></div>
                  <div class="pr">from CHF 42</div>
                </button>
                <button class="tog" data-tog><span class="pl-i" data-i="plus"></span><span class="ck-i" data-i="check"></span></button>
              </div>
            </div>
          </div>
        </div>

        <!-- Classic -->
        <div class="tier">
          <div class="tlab"><h3>Classic</h3><span class="rng">45&ndash;60 min</span></div>
          <div class="card">
            <div class="row sel" data-price="65" data-dur="45">
              <div class="top">
                <button class="body" data-expand>
                  <div class="nmline"><span class="nm">Signature cut</span><span class="chv" data-i="chev"></span></div>
                  <div class="du">45 min</div>
                  <div class="desc"><p>Consultation, wash, precision cut and finish tailored to your hair.</p></div>
                  <div class="pr">from CHF 65</div>
                </button>
                <button class="tog on" data-tog><span class="pl-i" data-i="plus"></span><span class="ck-i" data-i="check"></span></button>
              </div>
            </div>
            <div class="row" data-price="88" data-dur="60">
              <div class="top">
                <button class="body" data-expand>
                  <div class="nmline"><span class="nm">Cut &amp; beard combo</span><span class="chv" data-i="chev"></span></div>
                  <div class="du">60 min</div>
                  <div class="desc"><p>A full haircut paired with a beard shape and line up in one visit.</p></div>
                  <div class="pr">from CHF 88</div>
                </button>
                <button class="tog" data-tog><span class="pl-i" data-i="plus"></span><span class="ck-i" data-i="check"></span></button>
              </div>
            </div>
          </div>
        </div>

        <!-- Signature -->
        <div class="tier">
          <div class="tlab"><h3>Signature</h3><span class="rng">90+ min</span></div>
          <div class="card">
            <div class="row" data-price="120" data-dur="90">
              <div class="top">
                <button class="body" data-expand>
                  <div class="nmline"><span class="nm">Full grooming ritual</span><span class="chv" data-i="chev"></span></div>
                  <div class="du">90 min</div>
                  <div class="desc"><p>Haircut, hot towel shave, beard care and styling, the complete session.</p></div>
                  <div class="pr">from CHF 120</div>
                </button>
                <button class="tog" data-tog><span class="pl-i" data-i="plus"></span><span class="ck-i" data-i="check"></span></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bar">
      <div class="in">
        <div>
          <div class="tot"><span class="roll" id="rollv">CHF 65</span></div>
          <div class="meta"><span data-i="cart"></span><span class="mt" id="metav">1 service, <span class="bump">45</span> min</span></div>
        </div>
        <button class="cont">Continue<span data-i="arrow"></span></button>
      </div>
    </div>
  </div>

<script>
var I={
  back:'<path d="M15 18l-6-6 6-6"/>',
  close:'<path d="M18 6 6 18M6 6l12 12"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
function svg(p,st,w,sw){return '<svg class="lucide" width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="'+st+'" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var ink='#0A0A0A',ink2='#52525B',ink3='#A1A1AA';
document.querySelector('[data-i=back]').innerHTML=svg(I.back,ink,20);
document.querySelector('[data-i=close]').innerHTML=svg(I.close,ink,19);
document.querySelector('[data-i=cart]').innerHTML=svg(I.cart,ink3,13,1.8);
document.querySelector('[data-i=arrow]').innerHTML=svg(I.arrow,'#fff',16);
document.querySelectorAll('[data-i=chev]').forEach(function(e){e.innerHTML=svg(I.chev,ink3,17);});
document.querySelectorAll('.pl-i[data-i=plus]').forEach(function(e){e.innerHTML=svg(I.plus,ink2,17);});
document.querySelectorAll('.ck-i[data-i=check]').forEach(function(e){e.innerHTML=svg(I.check,'#fff',17,2.5);});

// restart a keyframe animation by removing + reflowing + re-adding the .go class
function replay(el){if(!el)return;el.classList.remove('go');void el.offsetWidth;el.classList.add('go');}

// Tap the row body -> expand the info panel. Select is NOT here.
document.querySelectorAll('[data-expand]').forEach(function(btn){
  btn.addEventListener('click',function(){btn.closest('.row').classList.toggle('open');});
});

// Tap the + -> select / deselect, pop the circle, recompute + animate the bar.
var cont=document.querySelector('.cont'), rollv=document.getElementById('rollv'), metav=document.getElementById('metav');
var prevTotal=65, prevDur=45;
function recompute(){
  var sel=document.querySelectorAll('.row.sel'), total=0, dur=0;
  sel.forEach(function(r){total+=+r.dataset.price;dur+=+r.dataset.dur;});
  var n=sel.length;
  rollv.textContent='CHF '+total;
  if(total!==prevTotal) replay(rollv);              // price rolls up on change
  if(n){
    metav.innerHTML = n+(n===1?' service, ':' services, ')+'<span class="bump">'+dur+'</span> min';
    if(dur!==prevDur) replay(metav.querySelector('.bump'));   // minutes bump on change
  } else { metav.textContent='No services yet'; }
  cont.classList.toggle('off', n===0);
  prevTotal=total; prevDur=dur;
}
document.querySelectorAll('[data-tog]').forEach(function(t){
  t.addEventListener('click',function(){
    t.classList.toggle('on');
    t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');   // select pop
    t.closest('.row').classList.toggle('sel',t.classList.contains('on'));
    recompute();
  });
});
</script>
</body>
</html>
