<style>
  :root{
    --ink:#0A0A0A; --grey:#767676; --line:#E0E0E0; --chip:#E9E9E9; --lav:#CDCBEF;
    --sf:-apple-system,BlinkMacSystemFont,'Inter Tight','SF Pro Display',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{font-family:var(--sf);-webkit-font-smoothing:antialiased;color:var(--ink);padding-bottom:110px}
  /* header */
  .hdr{display:flex;align-items:center;gap:10px;padding:10px 8px 0}
  .av{width:36px;height:36px;border-radius:50%;background:var(--lav);display:grid;place-items:center;font-size:16px;font-weight:600;color:#52525B;flex:none}
  .tabs{flex:1;display:flex;align-items:center;justify-content:center;gap:26px}
  .tab{font-size:18px;font-weight:600;color:var(--grey);letter-spacing:-0.02em}
  .tab.on{color:var(--ink);position:relative}
  .tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:3px;background:var(--ink);border-radius:2px}
  .gear{width:30px;height:30px;flex:none;color:var(--ink)}
  /* search row */
  .srow{display:flex;align-items:center;gap:14px;padding:17px 8px 0}
  .search{flex:1;height:37px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--grey);font-size:16px}
  .plus{width:22px;height:22px;flex:none;color:var(--ink)}
  /* chips */
  .chips{display:flex;gap:8px;align-items:center;padding:22px 8px 0}
  .chip{height:31px;border-radius:999px;background:var(--chip);display:flex;align-items:center;gap:6px;padding:0 16px;font-size:14px;font-weight:600;color:var(--ink)}
  .chip.icon{padding:0 12px}
  /* tile grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:16px 4px 0}
  .tile{width:100%;aspect-ratio:195/131;border-radius:16px;overflow:hidden;display:flex;gap:2px}
  .tile .main{flex:0 0 66%}
  .tile .thc{flex:1;display:flex;flex-direction:column;gap:2px}
  .tile .thc > div{flex:1}
  .bname{font-size:14px;font-weight:600;margin-top:7px;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
  .bmeta{font-size:11px;margin-top:4px;color:var(--ink);padding:0 8px}
  .bmeta .g{color:var(--grey)}
  /* section header */
  .shead{font-size:21px;font-weight:700;letter-spacing:-0.02em;padding:19px 12px 0}
  /* suggestions */
  .sugg{display:flex;gap:10px;overflow-x:auto;padding:12px 9px 0;scrollbar-width:none}
  .sugg::-webkit-scrollbar{display:none}
  .scard{flex:none;width:148px}
  .simg{width:148px;aspect-ratio:148/101;border-radius:16px;overflow:hidden;position:relative;display:flex;gap:2px}
  .simg .main{flex:0 0 66%}
  .simg .thc{flex:1;display:flex;flex-direction:column;gap:2px}
  .simg .thc > div{flex:1}
  .create{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:999px;padding:13px 13px;font-size:15px;font-weight:600;line-height:1.2;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .sname{font-size:14px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .smeta{font-size:11px;margin-top:2px;color:var(--ink)}
  /* bottom nav (part of the reference screen itself) */
  .nav{position:fixed;left:0;right:0;bottom:0;height:96px;background:linear-gradient(rgba(255,255,255,0),#fff 40%,#E7E7EA);display:flex;align-items:center;justify-content:center;gap:14px;padding-bottom:14px}
  .navi{width:50px;height:50px;background:#fff;border-radius:14px;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .navi svg{width:24px;height:24px;color:var(--ink)}
  /* neutral grey stand-ins for the reference photos (geometry copy) */
  .g1{background:#BFC2C7} .g2{background:#D2D0CE} .g3{background:#ADB0B5} .g4{background:#C7CBD0}
  .g5{background:#9EA2A8} .g6{background:#D8D6D3} .g7{background:#8C9096} .g8{background:#B6B4B1}
  .g9{background:#A7A5AE} .g10{background:#C2BEB8}
</style>
