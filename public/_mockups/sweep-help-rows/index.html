<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Help rows , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/help/page.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real /de/help (article links are flat rounded rows).
  AFTER = the same articles in one grouped list-card (the app's same-kind-row-list grammar), lighter and unified.
  Only the row grouping changes.
  Depicts: help article rows -> app/[locale]/help/page.tsx
  Exists-check: `npm run exists "cookie consent search reviews"` ran this turn (batch) , the page already renders.
  Backend-check: help articles are real content; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:24px 16px 40px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-0.02em}
  .grp{margin-top:16px;border:1px solid var(--hairline);border-radius:16px;overflow:hidden;background:#fff}
  .row{display:flex;align-items:center;gap:12px;padding:15px 16px;font-size:14px;font-weight:500}
  .row + .row{border-top:1px solid var(--hairline)}
  .row .ic{height:34px;width:34px;border-radius:10px;background:var(--sunken);display:grid;place-items:center;flex-shrink:0}
  .row .ic svg{width:17px;height:17px;color:var(--ink2)}
  .row .ch{margin-left:auto}
  .row .ch svg{width:16px;height:16px;color:var(--ink3)}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:20px;line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de/help" title="live help hub"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="h1">Help center</div>
        <div class="grp">
          <div class="row"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>Booking and appointments<span class="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="m9 18 6-6-6-6"/></svg></span></div>
          <div class="row"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span>Payments and refunds<span class="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="m9 18 6-6-6-6"/></svg></span></div>
          <div class="row"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></span>Your account<span class="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="m9 18 6-6-6-6"/></svg></span></div>
        </div>
        <div class="cap">Change applied: help articles sit in one grouped list-card (the app's same-kind-row-list grammar) instead of separate flat rounded rows.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
