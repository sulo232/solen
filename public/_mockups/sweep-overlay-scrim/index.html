<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Overlay scrim , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/_components/primitives/Modal.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real /de home (every modal + sheet dims the page with a
  warm brown-ink veil rgb 26,18,9). AFTER = a cool-ink scrim rgb 10,10,10 at the same 40% behind the sheet, matching
  the cool palette. Only the scrim tint changes.
  Depicts: modal/sheet backdrop -> app/[locale]/_components/primitives/Modal.tsx
  Exists-check: `npm run exists "Modal Sheet overlay backdrop"` ran earlier , both overlays already render.
  Backend-check: booking confirm is real; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow:hidden}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .bg{position:absolute;inset:0;background:#fff;padding:16px}
  .bl{height:15px;border-radius:6px;background:var(--sunken);margin-bottom:12px}
  .bl.w70{width:70%}.bl.w40{width:40%}.bl.big{height:150px;border-radius:16px}
  .scrim{position:absolute;inset:0;background:rgba(10,10,10,.40)}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px 24px;box-shadow:0 -8px 30px -12px rgba(10,10,10,.25)}
  .grab{height:4px;width:36px;border-radius:2px;background:var(--hairline);margin:0 auto 14px}
  .st{font-size:16px;font-weight:700}.sp{font-size:13px;color:var(--ink2);margin-top:4px}
  .sbtn{height:44px;border-radius:999px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:14px}
  .cap{position:absolute;left:12px;right:12px;top:8px;font-size:11px;color:#fff;text-align:center;opacity:.9}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de" title="live home (real overlay tint)"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="bg"><div class="bl w70"></div><div class="bl big"></div><div class="bl w40"></div><div class="bl w70"></div></div>
      <div class="scrim"></div>
      <div class="cap">Cool ink scrim (rgb 10,10,10), not warm brown</div>
      <div class="sheet"><div class="grab"></div><div class="st">Confirm appointment</div><div class="sp">Thursday, 14:30 at Blade &amp; Stone.</div><div class="sbtn">Confirm</div></div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
