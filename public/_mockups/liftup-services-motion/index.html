<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Booking services , total motion morph (mockup)</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Owner-scope: confirmed: owner 2026-07-18 "it looks soo ass i want more of the morphing is it not the blur
  and the othr stuff or idk". The plain blur fade landed flat, so this is a COMPARISON LAB: four value-change
  motions on the real booking total, each replayable, so the owner can feel them and pick one, instead of me
  guessing a third time. Recommendation carried in the UI (Count + pop).
  Grounded-in: components-legacy/booking/ServicesStaffStep.tsx (the fixed bottom bar total + minutes this
  motion applies to) + _design-system/MOTION.md (the enter recipe: opacity+scale+blur, glide). The number
  values (CHF 65 -> 93, 45 -> 65 min) are the same as the booking-services tiered mockup's Signature cut +
  Beard trim. CHECKED ServicesStaffStep.tsx live this turn.
  Exists-check: `npm run exists motion` ran this turn. The booking services total bar (ServicesStaffStep.tsx)
  and the MOTION.md recipe exist; REMOVED.md none. NEW = a motion-comparison lab (throwaway once the owner
  picks); no product surface is rebuilt.
  Backend-check: none , this is a static motion demo, the Add button only toggles a local 1<->2 service count
  to replay the animation. No fabricated product data (illustrative barber numbers, same as the tiered mockup).
  Reference-checked: the enter recipe is Solen's own (MOTION.md + ToggleCircle.tsx), read this turn. Taste:
  no review count, no full-bleed, no ALL-CAPS, no blue. English chrome.
-->
<style>
  :root{
    --ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;
    --glide:cubic-bezier(0.16,1,0.3,1);--pop:cubic-bezier(0.34,1.56,0.64,1);
    --font:'Inter Tight',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .app{position:fixed;inset:0;width:100%;display:flex;flex-direction:column;background:#fff}
  .hd{flex:none;display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-bottom:1px solid var(--hairline)}
  .hd .ttl{font-size:16px;font-weight:700;letter-spacing:-0.01em}
  .body{flex:1;overflow-y:auto;padding:18px 16px 40px;max-width:520px;margin:0 auto;width:100%}
  .lead{font-size:14px;color:var(--ink2);line-height:1.5;margin-bottom:16px}

  .seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .sg{flex:none;font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--hairline);color:var(--ink2);background:#fff;cursor:pointer;position:relative}
  .sg.on{background:var(--sunken);color:var(--ink);border-color:transparent}
  .sg .rec{margin-left:6px;font-size:10px;font-weight:700;color:var(--ink3)}

  .stage{border:1px solid var(--hairline);border-radius:24px;padding:34px 22px 26px;text-align:center;box-shadow:0 1px 2px rgba(10,10,10,.04),0 6px 20px -10px rgba(10,10,10,.08)}
  .eyebrow{font-size:12px;color:var(--ink3);font-weight:600}
  .total{font-size:34px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
  .meta{font-size:13px;color:var(--ink2);margin-top:10px;font-variant-numeric:tabular-nums}
  .desc{font-size:13px;color:var(--ink3);line-height:1.5;margin-top:16px;min-height:38px}
  .add{margin-top:20px;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-family:inherit;font-size:15px;font-weight:600;border:0;border-radius:14px;padding:14px 24px;cursor:pointer}

  /* the animated number wrappers */
  .num{position:relative;display:inline-block}
  .num .val{display:inline-block;transition:opacity .44s var(--glide),transform .44s var(--glide),filter .44s var(--glide)}
  .num .val.fx{animation:enterfx .44s var(--glide)}
  @keyframes enterfx{0%{opacity:0;transform:scale(.96);filter:blur(8px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
  .num .val.pop{animation:landpop .42s var(--pop)}
  @keyframes landpop{0%{transform:scale(1.16);filter:blur(4px)}100%{transform:scale(1);filter:blur(0)}}
  .num .val.leave{position:absolute;left:0;right:0;top:0;opacity:0;transform:scale(1.3);filter:blur(9px)}
  .num .val.enter-in{opacity:0;transform:scale(.55);filter:blur(9px)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  svg{display:block}
</style>
</head>
<body>
  <div class="app">
    <div class="hd"><span id="back"></span><span class="ttl">Total motion</span></div>
    <div class="body">
      <p class="lead">Four ways the total can move when a service is added. Pick a style, then tap Add to replay it. The + to check toggle stays as it is , this is only about the number.</p>

      <div class="seg" id="seg">
        <button class="sg" data-v="fade">Blur fade</button>
        <button class="sg" data-v="count">Count up</button>
        <button class="sg" data-v="morph">Zoom morph</button>
        <button class="sg on" data-v="countpop">Count + pop<span class="rec">rec</span></button>
      </div>

      <div class="stage">
        <div class="eyebrow">Total</div>
        <div class="total"><span class="num" id="totNum"><span class="val">CHF 65</span></span></div>
        <div class="meta"><span id="svcCount">1 service</span>, <span class="num" id="minNum"><span class="val">45</span></span> min</div>
        <div class="desc" id="desc"></div>
        <button class="add" id="add"><span id="addIcon"></span>Add a service</button>
      </div>
    </div>
  </div>

<script>
function svg(p,st,w,sw){return '<svg class="lucide" width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="'+st+'" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
document.getElementById('back').innerHTML=svg('<path d="M15 18l-6-6 6-6"/>','#0A0A0A',20);
document.getElementById('addIcon').innerHTML=svg('<path d="M12 5v14M5 12h14"/>','#fff',17);

var DESC={
  fade:'Blur fade , the new number fades in with a touch of scale and blur. Calm. (This is the one that felt flat.)',
  count:'Count up , the number ticks from 65 up to the new total, so you watch the price climb.',
  morph:'Zoom morph , the old number blurs and grows out while the new one resolves in from small. A real morph, no sliding.',
  countpop:'Count up, then a pop , the number climbs, then the final value snaps in with a scale and blur. Most alive.'
};
var variant='countpop';
var curTotal=65, curMin=45, sel=1;

function fade(numEl,text){var v=numEl.querySelector('.val');v.textContent=text;v.classList.remove('fx');void v.offsetWidth;v.classList.add('fx');}
function pop(v){v.classList.remove('pop');void v.offsetWidth;v.classList.add('pop');}
function countUp(numEl,from,to,prefix,then){
  var v=numEl.querySelector('.val'),start=null,ms=620;
  function step(ts){if(!start)start=ts;var p=Math.min((ts-start)/ms,1);var e=1-Math.pow(1-p,3);
    v.textContent=prefix+Math.round(from+(to-from)*e);
    if(p<1)requestAnimationFrame(step);else{v.textContent=prefix+to;if(then)then(v);}}
  requestAnimationFrame(step);
}
function morphSwap(numEl,text){
  var old=numEl.querySelector('.val');
  var nu=document.createElement('span');nu.className='val enter-in';nu.textContent=text;
  numEl.appendChild(nu);void nu.offsetWidth;
  old.classList.add('leave');nu.classList.remove('enter-in');
  setTimeout(function(){if(old.parentNode)old.remove();},520);
}
function applyTo(numEl,from,to,prefix){
  if(variant==='fade') fade(numEl,prefix+to);
  else if(variant==='count') countUp(numEl,from,to,prefix);
  else if(variant==='morph') morphSwap(numEl,prefix+to);
  else countUp(numEl,from,to,prefix,function(v){pop(v);});
}

document.getElementById('desc').textContent=DESC[variant];
document.querySelectorAll('#seg .sg').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('#seg .sg').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');variant=b.dataset.v;
    document.getElementById('desc').textContent=DESC[variant];
  });
});

var totNum=document.getElementById('totNum'), minNum=document.getElementById('minNum'), svcCount=document.getElementById('svcCount');
var addLabel=document.getElementById('add').lastChild;
document.getElementById('add').addEventListener('click',function(){
  sel = sel===1?2:1;
  var nt = sel===2?93:65, nm = sel===2?65:45;
  applyTo(totNum, curTotal, nt, 'CHF ');
  applyTo(minNum, curMin, nm, '');
  svcCount.textContent = sel===1?'1 service':'2 services';
  curTotal=nt; curMin=nm;
  addLabel.textContent = sel===2?'Remove a service':'Add a service';
});
</script>
</body>
</html>
