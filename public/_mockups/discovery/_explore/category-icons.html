<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kategorie-Icons</title><style>
:root{--ink:#0A0A0A;--ink-2:#6B6B6B;--hair:#E4E4E7;--sunken:#F4F4F5;--white:#fff;--disp:'Inter Tight',-apple-system,system-ui,sans-serif;--body:'Inter',-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:#EFEFF1;color:var(--ink);padding:26px 16px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:430px;margin:0 auto}
.head{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em;margin-bottom:4px}
.sub{font-size:13px;color:var(--ink-2);margin-bottom:20px}
.grp{background:var(--white);border:1px solid var(--hair);border-radius:18px;padding:16px 0 16px 16px;margin-bottom:14px}
.gl{font-family:var(--disp);font-weight:700;font-size:14px;margin-bottom:12px}
.types{display:flex;gap:8px;overflow-x:auto;padding-right:16px}
.types::-webkit-scrollbar{display:none}
.type{position:relative;flex:0 0 auto;width:72px;height:74px;border-radius:14px;border:1px solid var(--hair);background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.type img{width:38px;height:38px;object-fit:contain;display:block}
.type .word{font-size:12px;font-weight:500;color:var(--ink-2)}
.type.is-on{background:var(--sunken);border-color:#D7D7DB}
.type.is-on .word{color:var(--ink);font-weight:600}
.type .chk{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--ink);display:none;align-items:center;justify-content:center}
.type.is-on .chk{display:flex}
.type .chk svg{width:11px;height:11px;color:#fff}
</style></head><body><div class="wrap">
<div class="head">Kategorie-Icons</div>
<div class="sub">Gleicher Tile-Stil wie Naegel: Line-Art, Auswahl = heller Sunken-Fill + Tinten-Haken (nie schwarz).</div>
<div class="grp"><div class="gl">Naegel</div><div class="types"><button class="type"><img src="/nail-shapes/round.png?v=1" alt=""><span class="word">Rund</span></button><button class="type"><img src="/nail-shapes/square.png?v=1" alt=""><span class="word">Eckig</span></button><button class="type"><img src="/nail-shapes/oval.png?v=1" alt=""><span class="word">Oval</span></button><button class="type is-on"><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><img src="/nail-shapes/almond.png?v=1" alt=""><span class="word">Mandel</span></button><button class="type"><img src="/nail-shapes/coffin.png?v=1" alt=""><span class="word">Sarg</span></button><button class="type"><img src="/nail-shapes/stiletto.png?v=1" alt=""><span class="word">Stiletto</span></button><button class="type"><img src="/nail-shapes/squoval.png?v=1" alt=""><span class="word">Squoval</span></button><button class="type"><img src="/nail-shapes/ballerina.png?v=1" alt=""><span class="word">Ballerina</span></button></div></div><div class="grp"><div class="gl">Wimpern</div><div class="types"><button class="type"><img src="/lash-types/classic.png?v=1" alt=""><span class="word">Klassisch</span></button><button class="type"><img src="/lash-types/hybrid.png?v=1" alt=""><span class="word">Hybrid</span></button><button class="type is-on"><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><img src="/lash-types/volume.png?v=1" alt=""><span class="word">Volumen</span></button><button class="type"><img src="/lash-types/mega.png?v=1" alt=""><span class="word">Mega</span></button></div></div><div class="grp"><div class="gl">Brauen</div><div class="types"><button class="type is-on"><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><img src="/brow-shapes/natural.png?v=1" alt=""><span class="word">Natuerlich</span></button><button class="type"><img src="/brow-shapes/laminated.png?v=1" alt=""><span class="word">Laminiert</span></button><button class="type"><img src="/brow-shapes/bold.png?v=1" alt=""><span class="word">Definiert</span></button><button class="type"><img src="/brow-shapes/arched.png?v=1" alt=""><span class="word">Geschwungen</span></button></div></div>
</div></body></html>
