<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Bookings loading , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/profile/bookings/page.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real bookings list via /api/dev/login?to=/de/profile/bookings
  (loads with a bare spinner then hard-swaps). AFTER = a Skeleton shaped like the booking list (each row = thumb +
  salon + date + status), so the list settles. Only the loading state changes.
  Depicts: bookings list loading -> app/[locale]/profile/bookings/page.tsx
  Exists-check: `npm run exists "bookings list"` ran earlier , the list already renders.
  Backend-check: display of live bookings; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:24px 16px 40px}
  .h1{height:22px;width:130px;border-radius:8px}
  .shim{background:linear-gradient(90deg,var(--sunken),#ececee,var(--sunken));background-size:200% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
  @keyframes sh{to{background-position:-200% 0}}
  .card{margin-top:14px;border:1px solid var(--hairline);border-radius:16px;padding:12px;display:flex;gap:12px}
  .thumb{height:56px;width:56px;border-radius:12px;flex-shrink:0}
  .l1{height:14px;width:60%}.l2{height:12px;width:40%;margin-top:8px}.l3{height:12px;width:30%;margin-top:8px}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:22px;line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/api/dev/login?to=/de/profile/bookings" title="live bookings"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="shim h1"></div>
        <div class="card"><div class="shim thumb"></div><div style="flex:1"><div class="shim l1"></div><div class="shim l2"></div><div class="shim l3"></div></div></div>
        <div class="card"><div class="shim thumb"></div><div style="flex:1"><div class="shim l1"></div><div class="shim l2"></div><div class="shim l3"></div></div></div>
        <div class="card"><div class="shim thumb"></div><div style="flex:1"><div class="shim l1"></div><div class="shim l2"></div><div class="shim l3"></div></div></div>
        <div class="cap">Change applied: the list loads behind a Skeleton shaped like the booking rows (thumb + salon + date + status), so the screen settles, instead of a bare centered spinner that hard-swaps.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
