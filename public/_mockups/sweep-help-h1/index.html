<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Help H1 scale , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/help/page.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real /de/help (its H1 runs one of 3 undocumented sizes,
  24 to 48px, across help / About / blog, none the locked Page-title scale). AFTER = the help hub on ONE locked
  page-title size. Only the H1 scale changes.
  Depicts: help hub title -> app/[locale]/help/page.tsx
  Exists-check: `npm run exists "cookie consent search reviews"` ran this turn (batch) , the page already renders.
  Backend-check: help articles are real content; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--accent:#276EF1;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:28px 20px 40px}
  .h1{font-size:28px;font-weight:700;letter-spacing:-0.03em;line-height:1.1}
  .sub{font-size:15px;color:var(--ink2);margin-top:8px}
  .sbar{height:48px;border:1px solid var(--hairline);border-radius:999px;display:flex;align-items:center;padding:0 16px;font-size:14px;color:var(--ink3);gap:8px;margin-top:18px}
  .sbar svg{width:16px;height:16px}
  .row{display:flex;align-items:center;padding:15px 0;border-top:1px solid var(--hairline);font-size:14px;font-weight:500}
  .row:first-of-type{margin-top:20px}
  .row svg{width:16px;height:16px;color:var(--ink3);margin-left:auto}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:24px;line-height:1.5;border-top:1px solid var(--hairline);padding-top:14px}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de/help" title="live help hub"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="h1">Help center</div>
        <div class="sub">Answers to common questions.</div>
        <div class="sbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Search help</div>
        <div class="row">Booking and appointments<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="m9 18 6-6-6-6"/></svg></div>
        <div class="row">Payments and refunds<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="m9 18 6-6-6-6"/></svg></div>
        <div class="row">Your account<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="m9 18 6-6-6-6"/></svg></div>
        <div class="cap">Change applied: the page title uses the ONE locked page-title size, instead of one of three undocumented H1 sizes (24 to 48px) scattered across help, About and blog.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
