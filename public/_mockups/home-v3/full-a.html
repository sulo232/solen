  }
  function svgMenu() {
    return '<svg class="lucide lucide-menu" data-lucide="menu" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>';
  }
  function svgStar() {
    return '<svg class="lucide lucide-star" data-lucide="star" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>';
  }
  function svgHeart() {
    return '<svg class="lucide lucide-heart" data-lucide="heart" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="rgba(0,0,0,0.28)" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 0L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>';
  }

  document.getElementById("fa-searchicon").innerHTML = svgSearch();
  document.getElementById("fa-menu").innerHTML = svgMenu();

  var scroll = document.getElementById("fa-catscroll");
  CATS.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "fa-cat";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", c.slug === ACTIVE ? "true" : "false");
    var img = document.createElement("img");
    img.className = "fa-caticon";
    img.src = c.iconSrc;
    img.alt = "";
    img.setAttribute("aria-hidden", "true");
    b.appendChild(img);
    b.appendChild(document.createTextNode(c.label));
    b.addEventListener("click", function () {
      scroll.querySelectorAll(".fa-cat").forEach(function (x) { x.setAttribute("aria-selected", "false"); });
      b.setAttribute("aria-selected", "true");
    });
    scroll.appendChild(b);
  });

  (function () {
    var card = document.createElement("button");
    card.type = "button";
    card.className = "fa-card";
    var ct = document.createElement("span");
    ct.className = "fa-cardtext";
    var t = document.createElement("span");
    t.className = "fa-cardtitle";
    t.textContent = CONT.title;
    var m = document.createElement("span");
    m.className = "fa-cardmeta";
    m.textContent = CONT.meta;
    ct.appendChild(t); ct.appendChild(m);
    var im = document.createElement("img");
    im.className = "fa-cardimg";
    im.src = CONT.photo;
    im.alt = "";
    im.setAttribute("aria-hidden", "true");
    card.appendChild(ct); card.appendChild(im);
    document.getElementById("fa-cardwrap").appendChild(card);
  })();

  // SALON CARD, the registry component's anatomy.
  function salonCard(s) {
    var a = document.createElement("div");
    a.className = "fa-card-store";
    a.setAttribute("role", "link");
    a.setAttribute("tabindex", "0");

    var pw = document.createElement("div");
    pw.className = "fa-photowrap";
    if (s.photo) {
      var im = document.createElement("img");
      im.className = "fa-photo";
      im.src = s.photo;
      im.alt = s.name + ", " + CATLABEL[s.cat];
      im.loading = "lazy";
      pw.appendChild(im);
    } else {
      var mono = document.createElement("span");
      mono.className = "fa-monogram";
      mono.setAttribute("aria-hidden", "true");
      mono.textContent = (s.name || "").trim().slice(0, 1).toUpperCase() || "?";
      pw.appendChild(mono);
    }
    var heart = document.createElement("button");
    heart.type = "button";
    heart.className = "fa-heart";
    heart.setAttribute("aria-label", "Save " + s.name);
    heart.innerHTML = svgHeart();
    pw.appendChild(heart);

    var info = document.createElement("div");
    info.className = "fa-info";

    var r1 = document.createElement("div");
    r1.className = "fa-row1";
    var nm = document.createElement("h3");
    nm.className = "fa-name";
    nm.textContent = s.name;
    var rate = document.createElement("span");
    rate.className = "fa-rate";
    var st = document.createElement("span");
    st.className = "fa-star";
    st.setAttribute("aria-hidden", "true");
    st.innerHTML = svgStar();
    rate.appendChild(st);
    rate.appendChild(document.createTextNode(s.rating));
    r1.appendChild(nm); r1.appendChild(rate);

    var r2 = document.createElement("div");
    r2.className = "fa-catline";
    r2.textContent = CATLABEL[s.cat];

    var r3 = document.createElement("div");
    r3.className = "fa-row3";
    var ad = document.createElement("span");
    ad.className = "fa-addr";
    ad.textContent = s.addr;
    var pr = document.createElement("span");
    pr.className = "fa-price";
    pr.textContent = s.price + " CHF";
    r3.appendChild(ad); r3.appendChild(pr);

    info.appendChild(r1); info.appendChild(r2); info.appendChild(r3);
    a.appendChild(pw); a.appendChild(info);
    return a;
  }

  // SECTIONS, all horizontal rails. No grid anywhere.
  var sections = document.getElementById("fa-sections");

  function section(title, seeAll, note, items) {
    var sec = document.createElement("section");
    sec.className = "fa-sec";
    var head = document.createElement("div");
    head.className = "fa-sechead";
    var h = document.createElement("h2");
    h.className = "fa-h2";
    h.textContent = title;
    head.appendChild(h);
    if (seeAll) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "fa-seeall";
      b.textContent = "See all";
      head.appendChild(b);
    }
    sec.appendChild(head);
    if (note) {
      var p = document.createElement("p");
      p.className = "fa-thin";
      p.textContent = note;
      sec.appendChild(p);
    }
    var rail = document.createElement("div");
    rail.className = "fa-rail";
    items.forEach(function (n) { rail.appendChild(n); });
    sec.appendChild(rail);
    sections.appendChild(sec);
    return sec;
  }

  section("Popular in Basel", true, null, STORES.map(salonCard));

  var walkins = STORES.filter(function (s) { return s.walkin; });
  section("Walk in today", false,
    walkins.length + " of 20 stores take walk-ins right now.",
    walkins.map(salonCard));

  section("For your hair type", true,
    "Hair DNA is not switched on yet, so this row is category-matched for now.",
    STORES.filter(function (s) { return s.cat === "coiffeur"; }).map(salonCard));

  var cityTile = (function () {
    var c = document.createElement("div");
    c.className = "fa-city";
    c.setAttribute("role", "link");
    c.setAttribute("tabindex", "0");
    var pw = document.createElement("div");
    pw.className = "fa-photowrap";
    var im = document.createElement("img");
    im.className = "fa-photo";
    im.src = "/_mockups/_assets/store-photos/atelier-haarwerk.jpg";
    im.alt = "Basel";
    im.loading = "lazy";
    pw.appendChild(im);
    var info = document.createElement("div");
    info.className = "fa-info";
    var nm = document.createElement("div");
    nm.className = "fa-name";
    nm.textContent = "Basel";
    var mt = document.createElement("div");
    mt.className = "fa-catline";
    mt.textContent = "20 stores";
    info.appendChild(nm); info.appendChild(mt);
    c.appendChild(pw); c.appendChild(info);
    return c;
  })();
  section("Cities", false, "Basel is the only city with stores so far.", [cityTile]);

  document.getElementById("fa-devnote").innerHTML =
    "<b>What is real and what is not.</b> Store names, ratings, prices and walk-in flags came from "
    + "your running dev server, and the photos are the seeded cover photos saved locally. Two look "
    + "identical because the seed points two stores at the same image. All 20 seeded stores are in "
    + "one city, which is why Cities has one tile. Hair DNA is dormant in the code, so that row is "
    + "category-matched and says so. Cards use the real SalonCard anatomy: 5:4 photo, 22px radius, "
    + "name and star on one row, category, then address and from-price. English until you decide "
    + "the German word for \"Salon\".";

  var band = document.getElementById("fa-band");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollTop() {
    return window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
  }
  function onScroll() {
    var y = scrollTop();
    var p = reduce ? (y > 30 ? 1 : 0) : Math.min(1, Math.max(0, y / 60));
    band.style.setProperty("--p", String(p));
  }
  onScroll();
  window.addEventListener("scroll", onScroll, { passive: true });
  document.addEventListener("scroll", onScroll, { passive: true });

  window.faMeasure = function () {
    var round1 = function (n) { return Math.round(n * 10) / 10; };
    var r = function (sel) {
      var e = document.querySelector(sel);
      if (!e) return null;
      var b = e.getBoundingClientRect();
      return { x: round1(b.x), y: round1(b.y), w: round1(b.width), h: round1(b.height) };
    };
    var vh = window.innerHeight;
    var selCat = document.querySelector('.fa-cat[aria-selected="true"]');
    var unsel = document.querySelector('.fa-cat[aria-selected="false"]');
    var cs = getComputedStyle(selCat), cu = getComputedStyle(unsel);
    var sizes = {}, weights = {}, bold = 0, total = 0;
    [].slice.call(document.querySelectorAll(".fa-root *")).forEach(function (e) {
      var direct = [].slice.call(e.childNodes).some(function (n) {
        return n.nodeType === 3 && n.textContent.trim().length;
      });
      if (!direct) return;
      var b = e.getBoundingClientRect();
      if (b.top >= vh || b.bottom <= 0 || b.width === 0) return;
      var st = getComputedStyle(e);
      sizes[st.fontSize] = (sizes[st.fontSize] || 0) + 1;
      weights[st.fontWeight] = (weights[st.fontWeight] || 0) + 1;
      total++;
      if (+st.fontWeight >= 600) bold++;
    });
    return {
      viewport: { w: window.innerWidth, h: vh },
      overflowX: document.documentElement.scrollWidth > window.innerWidth,
      pill: r(".fa-pill"),
      menu: r(".fa-menu"),
      catPill: { rect: r('.fa-cat[aria-selected="true"]'), size: cs.fontSize, pad: cs.paddingLeft, gap: cs.gap, radius: cs.borderRadius, bg: cs.backgroundColor },
      selectedWeight: cs.fontWeight,
      unselectedWeight: cu.fontWeight,
      weightChangesOnSelect: cs.fontWeight !== cu.fontWeight,
      rowGap: getComputedStyle(document.getElementById("fa-catscroll")).gap,
      catIcon: r(".fa-caticon"),
      contCard: r(".fa-card"),
      contPhoto: r(".fa-cardimg"),
      storeCard: r(".fa-card-store"),
      storePhoto: r(".fa-photowrap"),
      storePhotoRadius: getComputedStyle(document.querySelector(".fa-photowrap")).borderRadius,
      gridCount: document.querySelectorAll(".fa-grid").length,
      railCount: document.querySelectorAll(".fa-rail").length,
      fontSizes: sizes,
      fontWeights: weights,
      boldPct: round1(total ? bold / total * 100 : 0)
    };
  };
})();
</script>
