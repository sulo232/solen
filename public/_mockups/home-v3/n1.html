<style>
  .dn1-root {
    -webkit-text-size-adjust: 100%;
    width: 390px;
    margin: 0 auto;
    background: #FFFFFF;
    color: #0A0A0A;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .dn1-root *, .dn1-root *::before, .dn1-root *::after { box-sizing: border-box; }

  /* ===== STICKY BAND =======================================================
     Direct child of the scroll root so it stays pinned for the whole page, the
     same containing-block trick as SearchTemplate.tsx's max-md:sticky band. */
  .dn1-band {
    position: sticky;
    top: 0;
    z-index: 55;
    background: #FFFFFF;
    /* padding morphs 4 to 12 top, 0 to 8 bottom, driven by --dn1-p (0..1) */
    padding-top: calc(4px + (8px * var(--dn1-p, 0)));
    padding-bottom: calc(0px + (8px * var(--dn1-p, 0)));
  }

  .dn1-bandinner { width: 100%; padding: 0 16px; }

  /* ===== THE PILL ==========================================================
     Our real collapsed pill. ONE depth cue at a time (design contract, shadow
     row: "a card carrying elevation DROPS its border, never both"), so the
     border is gone and the shadow carries the edge. Resting shadow is the
     elevation-2 token, which FLOORS LAW 4(c) names as the legal border-free
     boundary on white; it grows into the shipped pinned float on scroll. */
  .dn1-pill {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 14px;
    border-radius: 9999px;
    border: 0;
    background: #FFFFFF;
    text-align: left;
    cursor: pointer;
    box-shadow:
      0 2px 8px rgba(50,47,44,0.09),
      0 10px 30px rgba(0,0,0,calc(0.13 * var(--dn1-p, 0)));
  }

  .dn1-pillicon { flex: 0 0 auto; color: #6B6B6B; display: flex; }

  .dn1-pilltext { min-width: 0; flex: 1 1 auto; }
  .dn1-l1 {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    letter-spacing: -0.005em;
    color: #0A0A0A;
  }
  .dn1-l2 {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12.5px;
    font-weight: 400;
    line-height: 18px;
    color: #6B6B6B;
  }

  /* The right 44x44 slot. On /search this circle is the map toggle; here it is
     the hamburger. Same geometry, same hairline, same hover sink. */
  .dn1-burger {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    height: 44px;
    width: 44px;
    border-radius: 9999px;
    border: 1px solid #E4E4E7;
    background: #FFFFFF;
    color: #0A0A0A;
    cursor: pointer;
    transition: background-color 300ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .dn1-burger:hover { background: #F4F4F5; }

  /* ===== CATEGORY ROW ======================================================
     Collapses on scroll. Height and opacity ramp on the same --dn1-p as the
     pill, so pill float-in and row fold-out are one continuous gesture in BOTH
     directions (the B6 fix in SearchTemplate.tsx, reused not reinvented). */
  .dn1-cats {
    overflow: hidden;
    height: calc(60px * (1 - var(--dn1-p, 0)));
    opacity: calc(1 - var(--dn1-p, 0));
  }
  .dn1-catscroll {
    display: flex;
    gap: 8px;
    padding: 8px 16px 12px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .dn1-catscroll::-webkit-scrollbar { display: none; }

  .dn1-cat {
    display: inline-flex;
    flex: 0 0 auto;
    height: 40px;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    border-radius: 9999px;
    border: 1px solid #E4E4E7;
    background: #FFFFFF;
    font-size: 15px;
    font-weight: 500;
    line-height: 1;
    color: #0A0A0A;
    cursor: pointer;
    transition: background-color 150ms cubic-bezier(0.22, 1, 0.36, 1),
                border-color 150ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .dn1-cat[aria-selected="true"] {
    background: #F4F4F5;
    border-color: #F4F4F5;
    font-weight: 600;
  }
  .dn1-caticon { height: 22px; width: 22px; flex: 0 0 auto; object-fit: contain; }

  /* ===== SPACER ============================================================
     Scroll runway only. Deliberately empty gray blocks: this file is the header
     template, so putting salon cards here would fork SalonCard for no reason. */
  .dn1-spacer { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .dn1-slot {
    height: 180px;
    border-radius: 16px;
    background: #F4F4F5;
    display: grid;
    place-items: center;
    font-size: 12.5px;
    color: #6B6B6B;
  }

  @media (prefers-reduced-motion: reduce) {
    .dn1-burger, .dn1-cat { transition: none; }
  }
</style>

<div class="dn1-root" id="dn1-root">

  <div class="dn1-band" id="dn1-band">
    <div class="dn1-bandinner">
      <div class="dn1-pill" id="dn1-pill" role="button" tabindex="0" aria-haspopup="dialog" aria-label="Edit search">
        <span class="dn1-pillicon" aria-hidden="true">
          <svg class="lucide lucide-search" data-lucide="search" xmlns="http://www.w3.org/2000/svg"
               width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21 21-4.34-4.34"/>
            <circle cx="11" cy="11" r="8"/>
          </svg>
        </span>
        <span class="dn1-pilltext">
          <span class="dn1-l1" id="dn1-l1">Search salons</span>
          <span class="dn1-l2" id="dn1-l2">Basel</span>
        </span>
        <button class="dn1-burger" id="dn1-burger" type="button" aria-label="Open menu" aria-expanded="false">
          <svg class="lucide lucide-menu" data-lucide="menu" xmlns="http://www.w3.org/2000/svg"
               width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 5h16"/>
            <path d="M4 12h16"/>
            <path d="M4 19h16"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="dn1-cats" id="dn1-cats">
      <div class="dn1-catscroll" id="dn1-catscroll" role="tablist" aria-label="Categories"></div>
    </div>
  </div>

  <div class="dn1-spacer" id="dn1-spacer"></div>
</div>

<script>
(function () {
  var root = document.getElementById("dn1-root");
  if (!root || root.dataset.dn1Init === "1") return;
  root.dataset.dn1Init = "1";

  // Same shape as Header.tsx HEADER_CATEGORIES, plus the walk-in filter that
  // /api/salons already supports (route.ts:52,195). Rendered from data, never a
  // hardcoded src attribute in the markup.
  var CATS = [
    { slug: "coiffeur",   label: "Coiffeur", iconSrc: "/icons/categories/scissors.png" },
    { slug: "barbershop", label: "Barber",   iconSrc: "/icons/categories/clippers.png" },
    { slug: "nails",      label: "Nails",    iconSrc: "/icons/categories/nails.png" },
    { slug: "spa",        label: "Spa",      iconSrc: "/icons/categories/spa.png" },
    { slug: "walkin",     label: "Walk-in",  iconSrc: "/icons/categories/walkin.png" }
  ];
  var ACTIVE = "barbershop";

  var scroll = document.getElementById("dn1-catscroll");
  CATS.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "dn1-cat";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", c.slug === ACTIVE ? "true" : "false");
    b.dataset.slug = c.slug;
    var img = document.createElement("img");
    img.className = "dn1-caticon";
    img.src = c.iconSrc;
    img.alt = "";
    img.setAttribute("aria-hidden", "true");
    b.appendChild(img);
    b.appendChild(document.createTextNode(c.label));
    b.addEventListener("click", function () {
      scroll.querySelectorAll(".dn1-cat").forEach(function (x) { x.setAttribute("aria-selected", "false"); });
      b.setAttribute("aria-selected", "true");
    });
    scroll.appendChild(b);
  });

  // Scroll runway.
  var spacer = document.getElementById("dn1-spacer");
  for (var i = 0; i < 8; i++) {
    var s = document.createElement("div");
    s.className = "dn1-slot";
    s.textContent = "feed slot " + (i + 1);
    spacer.appendChild(s);
  }

  // ===== THE COLLAPSE =====================================================
  // Continuous 0..60px ramp, identical to SearchTemplate.tsx:811-835. Not a
  // boolean threshold: a boolean snaps, and the owner already rejected that
  // once ("make the morphing smooth BOTH directions", B6 2026-07-03).
  var band = document.getElementById("dn1-band");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function scrollTop() {
    return window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
  }
  function onScroll() {
    var y = scrollTop();
    var p = reduce ? (y > 30 ? 1 : 0) : Math.min(1, Math.max(0, y / 60));
    band.style.setProperty("--dn1-p", String(p));
  }
  onScroll();
  window.addEventListener("scroll", onScroll, { passive: true });
  document.addEventListener("scroll", onScroll, { passive: true });

  // Measurement hook for the verification pass.
  window.dn1Measure = function () {
    var r = function (id) {
      var e = document.getElementById(id);
      if (!e) return null;
      var b = e.getBoundingClientRect();
      return { top: +b.top.toFixed(1), height: +b.height.toFixed(1), width: +b.width.toFixed(1) };
    };
    var pillEl = document.getElementById("dn1-pill");
    return {
      scrollY: scrollTop(),
      p: +(band.style.getPropertyValue("--dn1-p") || 0),
      band: r("dn1-band"),
      pill: r("dn1-pill"),
      cats: r("dn1-cats"),
      burger: r("dn1-burger"),
      pillShadow: getComputedStyle(pillEl).boxShadow,
      pillBorderWidth: getComputedStyle(pillEl).borderTopWidth
    };
  };
})();
</script>
