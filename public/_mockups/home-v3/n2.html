<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #F4F4F5; }

  @font-face {
    font-family: "InterVar";
    src: url("/_mockups/_assets/fonts/inter-latin-var.woff2") format("woff2");
    font-weight: 100 900; font-display: swap; font-style: normal;
  }
  @font-face {
    font-family: "InterTightVar";
    src: url("/_mockups/_assets/fonts/inter-tight-latin-var.woff2") format("woff2");
    font-weight: 100 900; font-display: swap; font-style: normal;
  }

  /* ───────────────────────── shell ───────────────────────── */
  .dn2-root {
    width: 390px;
    margin: 0 auto;
    background: #FFFFFF;
    color: #0A0A0A;
    font-family: "InterVar", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* The header deliberately changes height above the content, which is exactly the case
       Chrome's scroll anchoring tries to "fix": it silently re-adjusts scrollTop and the
       collapse then fights it (measured: a scrollTo(0,200) settled at 110). Opt out so the
       scroll position to collapse-progress mapping is deterministic. */
    overflow-anchor: none;
  }
  .dn2-root *, .dn2-root *::before, .dn2-root *::after { box-sizing: border-box; }
  .dn2-root button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .dn2-root a { color: inherit; text-decoration: none; }

  /* Keyboard focus. WCAG 2.4.7 is statutory and cannot be dropped, but the owner rejected the
     RING three times and the gate enforces that, so focus borrows the system's own selection
     language: the sunken gray fill plus an ink edge (the TabPill treatment). No ring, no halo. */
  .dn2-root button:focus-visible,
  .dn2-root [tabindex]:focus-visible {
    background: #F4F4F5;
    border-color: #0A0A0A;
  }
  .dn2-root a:focus-visible {
    background: #F4F4F5;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 2px;
  }

  /* ─────────────────────── sticky header ─────────────────────── */
  .dn2-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #FFFFFF;
  }

  /* Row 1, the logo row. THE BET: the hamburger lives here, top right, where every
     app on the owner's phone puts it. Height is driven inline by the scroll script. */
  .dn2-logorow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    padding: 0 16px;
    overflow: hidden;
  }
  .dn2-wordmark {
    display: inline-flex;
    align-items: baseline;
    /* Measured 28px tall as a bare text link, which clears WCAG 2.2 AA (24x24) but sits under
       this system's own 44px control floor. Padding, not a size change, so the wordmark still
       renders at the Logo.tsx "md" 28px. */
    padding: 8px 0;
    font-family: "InterTightVar", "InterVar", system-ui, sans-serif;
    font-size: 28px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0;
    color: #0A0A0A;
    white-space: nowrap;
  }
  .dn2-dot {
    display: inline-block;
    width: 6px; height: 6px;
    margin-left: 3px; margin-bottom: 2px;
    border-radius: 9999px;
    background: #0A0A0A;
  }
  .dn2-burger {
    display: grid;
    place-items: center;
    width: 44px; height: 44px;
    border-radius: 16px;                 /* rounded-input */
    border: 1px solid #E4E4E7;
    background: #FFFFFF;
    color: #0A0A0A;
    flex-shrink: 0;
    transition: background-color 200ms cubic-bezier(0.22,1,0.36,1), transform 200ms cubic-bezier(0.22,1,0.36,1);
  }
  .dn2-burger:active { transform: scale(0.94); }

  /* Row 2, the pill. Never collapses. Padding + shadow ramp inline on scroll. */
  .dn2-pillrow { padding: 4px 16px 0; }
  .dn2-pill {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 14px;
    border-radius: 9999px;               /* rounded-pill */
    background: #FFFFFF;
    /* NO border. Design contract, shadow row: "a card carrying elevation DROPS its border,
       never both." Boundary against white is carried by the shadow, which is wider and
       darker than shadow-elevation-2, the token FLOORS LAW 4 names as the legal
       white-on-white step. Set inline by the script so it can ramp with scroll. */
    box-shadow: 0 10px 30px rgba(0,0,0,0.100);
    text-align: left;
  }
  .dn2-pill-icon { flex-shrink: 0; color: #6B6B6B; display: grid; place-items: center; }
  .dn2-pill-text { flex: 1 1 auto; min-width: 0; }
  .dn2-pill-l1 {
    display: block;
    font-size: 14px; font-weight: 500; line-height: 20px;
    color: #0A0A0A;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dn2-pill-l2 {
    display: block;
    font-size: 12.5px; font-weight: 400; line-height: 18px;
    color: #6B6B6B;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dn2-pill-map {
    display: grid;
    place-items: center;
    width: 44px; height: 44px;
    flex-shrink: 0;
    border-radius: 9999px;
    border: 1px solid #E4E4E7;
    background: #FFFFFF;
    color: #0A0A0A;
    transition: background-color 300ms cubic-bezier(0.22,1,0.36,1);
  }
  .dn2-pill-map:hover { background: #F4F4F5; }

  /* Row 3, the category tabs. Collapses to zero on scroll. */
  .dn2-iconrow {
    display: flex;
    align-items: flex-end;
    gap: 0;
    padding: 10px 16px 0;
    border-bottom: 1px solid #E4E4E7;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .dn2-iconrow::-webkit-scrollbar { display: none; }
  .dn2-tab {
    position: relative;
    flex: 1 0 auto;
    min-width: 62px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 4px 10px;
  }
  .dn2-tab img { width: 22px; height: 22px; object-fit: contain; display: block; }
  .dn2-tab span {
    font-size: 12.5px;
    line-height: 16px;
    font-weight: 400;
    color: #6B6B6B;
    white-space: nowrap;
  }
  .dn2-tab[aria-selected="true"] span { font-weight: 600; color: #0A0A0A; }
  .dn2-tab[aria-selected="true"]::after {
    content: "";
    position: absolute;
    left: 4px; right: 4px; bottom: -1px;
    height: 2px;
    background: #0A0A0A;
    border-radius: 2px;
  }

  /* ─────────────── scroll spacer (NOT the feed design) ─────────────── */
  .dn2-spacer { padding: 16px 16px 40px; }
  .dn2-spacer-note {
    font-size: 12.5px; line-height: 18px; font-weight: 400; color: #6B6B6B;
    margin: 0 0 16px;
  }
  .dn2-card { margin-bottom: 20px; }
  .dn2-shot {
    position: relative;
    width: 100%;
    aspect-ratio: 5 / 4;
    border-radius: 16px;                 /* rounded-card */
    overflow: hidden;
    background: #F4F4F5;
    box-shadow: 0 1px 3px rgba(10,10,10,0.04), 0 10px 28px -14px rgba(10,10,10,0.10); /* shadow-whisper */
  }
  .dn2-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dn2-name {
    margin-top: 10px;
    font-size: 14px; font-weight: 500; line-height: 20px; color: #0A0A0A;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dn2-meta {
    font-size: 12.5px; font-weight: 400; line-height: 18px; color: #6B6B6B;
    font-variant-numeric: tabular-nums;
  }
  .dn2-tail { height: 900px; }
</style>

<script>
/* Scroll collapse. The real thing, not a CSS :hover trick.
   Mechanism copied from app/[locale]/_components/search/SearchTemplate.tsx:802-835: one
   continuous 0..1 progress over the first 60px of scroll, everything derived from it, so the
   collapse eases both ways instead of snapping at a threshold. Under prefers-reduced-motion the
   shipped code snaps the progress instead of ramping it; mirrored here.
   Progress is read from the fragment root's viewport-relative top rather than window.scrollY, so
   the same script works when this fragment is embedded in a comparison shell that scrolls in its
   own container. The header's own height change never moves the root, so there is no feedback loop.
*/
(function () {
  var root = document.getElementById("dn2-root");
  if (!root || root.dataset.dn2Init === "1") return;
  root.dataset.dn2Init = "1";

  var logorow = document.getElementById("dn2-logorow");
  var iconrow = document.getElementById("dn2-iconrow");
  var pillrow = document.getElementById("dn2-pillrow");
  var pill    = document.getElementById("dn2-pill");

  var RANGE = 60;                       // same 0 to 60px range as the shipped search band
  var SHADOW_REST = 0.10;               // proposed floor (shipped ramp starts at 0 = flat)
  var SHADOW_PINNED = 0.13;             // SearchTemplate.tsx:831, shipped
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var natural = { logo: 0, icons: 0, iconsPadTop: 0 };

  function measure() {
    logorow.style.height = "";
    iconrow.style.height = "";
    iconrow.style.paddingTop = "";
    iconrow.style.borderBottomWidth = "";
    natural.logo = logorow.offsetHeight;
    natural.icons = iconrow.offsetHeight;
    natural.iconsPadTop = parseFloat(getComputedStyle(iconrow).paddingTop) || 0;
  }

  function apply(p) {
    var inv = 1 - p;
    logorow.style.height = (natural.logo * inv).toFixed(2) + "px";
    logorow.style.opacity = inv.toFixed(3);
    iconrow.style.height = (natural.icons * inv).toFixed(2) + "px";
    iconrow.style.opacity = inv.toFixed(3);
    // box-sizing:border-box means height:0 still leaves padding + border standing, so the row
    // bottomed out at 11px (10 pad + 1 hairline) instead of vanishing. Measured, then fixed:
    // ramp the padding with the height and drop the hairline at the end of the ramp.
    iconrow.style.paddingTop = (natural.iconsPadTop * inv).toFixed(2) + "px";
    iconrow.style.borderBottomWidth = inv < 0.02 ? "0px" : "1px";

    pillrow.style.paddingTop = (4 + 8 * p).toFixed(2) + "px";
    pillrow.style.paddingBottom = (8 * p).toFixed(2) + "px";
    pill.style.boxShadow =
      "0 10px 30px rgba(0,0,0," + (SHADOW_REST + (SHADOW_PINNED - SHADOW_REST) * p).toFixed(3) + ")";

    // Collapsed rows must leave the tab order, or keyboard focus walks into zero-height content.
    var gone = p > 0.999;
    [logorow, iconrow].forEach(function (el) {
      el.setAttribute("aria-hidden", gone ? "true" : "false");
      el.style.pointerEvents = gone ? "none" : "";
      if (gone) el.setAttribute("inert", ""); else el.removeAttribute("inert");
    });

    root.dataset.dn2Progress = p.toFixed(3);
  }

  function progress() {
    var d = Math.max(0, -root.getBoundingClientRect().top);
    return reduce ? (d > RANGE / 2 ? 1 : 0) : Math.min(1, d / RANGE);
  }

  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      apply(progress());
    });
  }

  measure();
  apply(progress());

  // capture:true so an ancestor scroller's scroll event is caught too (scroll does not bubble)
  window.addEventListener("scroll", onScroll, { passive: true, capture: true });
  window.addEventListener("resize", function () {
    var p = progress();
    measure();
    apply(p);
  }, { passive: true });

  // verification seam
  window.dn2Apply = apply;
  window.dn2Progress = progress;
  window.dn2Natural = natural;
})();
</script>
