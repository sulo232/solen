    im.setAttribute("aria-hidden", "true");

    var txt = document.createElement("span");
    txt.className = "sa-conttext";
    var t = document.createElement("span");
    t.className = "sa-conttitle";
    t.textContent = "Continue searching for Barber";
    var m = document.createElement("span");
    m.className = "sa-contmeta";
    m.textContent = "Basel, Sa 2. Aug";
    txt.appendChild(t);
    txt.appendChild(m);

    if (CONT_VARIANT === "B") { card.appendChild(im); card.appendChild(txt); }
    else if (CONT_VARIANT === "A") { card.appendChild(txt); card.appendChild(im); }
    else {
      card.appendChild(txt);
      var ch = document.createElement("span");
      ch.className = "sa-contchev";
      ch.setAttribute("aria-hidden", "true");
      ch.innerHTML = '<svg class="lucide lucide-chevron-right" data-lucide="chevron-right" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
      card.appendChild(ch);
    }
    wrap.appendChild(card);

    var seg = document.createElement("div");
    seg.className = "sa-contseg";
    ["A", "B", "C"].forEach(function (v) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "sa-conttab";
      b.textContent = v;
      b.setAttribute("aria-selected", v === CONT_VARIANT ? "true" : "false");
      b.addEventListener("click", function () { CONT_VARIANT = v; renderHome(); });
      seg.appendChild(b);
    });
    wrap.appendChild(seg);
    return wrap;
  }

  function renderHome() {
    list.innerHTML = "";
    list.appendChild(continuationCard());
    // No personalised row here: the persona endpoint that would have powered one is on the
    // removed list, so a row claiming to know his hair would be a promise nothing can keep.
    var SECTIONS = [
      { title: "Popular in Basel", rows: STORES.slice(0, 6), note: null },
      { title: "Walk in today", rows: STORES.filter(function (s) { return s.walkin; }),
        note: "3 of 20 stores take walk-ins right now." },
      { title: "Coiffeurs in Basel", rows: STORES.filter(function (s) { return s.cat === "coiffeur"; }),
        note: null },
      { title: "Cities", rows: [], note: "Basel is the only city with stores so far." }
    ];
    SECTIONS.forEach(function (sec) {
      var wrap = document.createElement("section");
      wrap.className = "sa-sec";
      var h = document.createElement("h2");
      h.className = "sa-h2";
      h.textContent = sec.title;
      wrap.appendChild(h);
      if (sec.note) {
        var p = document.createElement("p");
        p.className = "sa-thin";
        p.textContent = sec.note;
        wrap.appendChild(p);
      }
      var rail = document.createElement("div");
      rail.className = "sa-rail";
      if (sec.rows.length) {
        sec.rows.forEach(function (s) { rail.appendChild(railCard(s)); });
      } else {
        var one = railCard(STORES[2]);
        one.querySelector(".sa-name").textContent = "Basel";
        var r = one.querySelector(".sa-rate"); if (r) r.remove();
        one.querySelector(".sa-meta2").textContent = "20 stores";
        var pr = one.querySelector(".sa-price"); if (pr) pr.remove();
        rail.appendChild(one);
      }
      wrap.appendChild(rail);
      list.appendChild(wrap);
    });
  }

  // ===== INSPO ============================================================
  // Its job is undirected image browsing, so it is a two-column masonry of photographs, not a list
  // of bookable rows. That is FLOORS LAW 10 applied honestly: an element belongs to the screen's
  // job, and a price and an address serve the booking job, not the looking job. The chrome stays
  // identical, which is the consistency that actually matters.
  function renderInspo() {
    list.innerHTML = "";
    var grid = document.createElement("div");
    grid.className = "sa-inspo";
    // Deliberately uneven heights: a masonry that renders a perfect grid is just a grid.
    var TALL = [0, 3, 4, 7];
    STORES.concat(STORES).forEach(function (s, i) {
      var cell = document.createElement("div");
      cell.className = "sa-inspocell" + (TALL.indexOf(i % 8) !== -1 ? " is-tall" : "");
      cell.setAttribute("role", "link");
      cell.setAttribute("tabindex", "0");
      var im = document.createElement("img");
      im.className = "sa-inspophoto";
      im.src = s.photo;
      im.alt = s.name + ", " + CATLABEL[s.cat];
      im.loading = "lazy";
      cell.appendChild(im);
      grid.appendChild(cell);
    });
    list.appendChild(grid);
  }

  function renderCategory(slug, label) {
    if (slug === "home") {
      renderHome();
      if (pillLine) pillLine.textContent = "Search stores";
      return;
    }
    if (slug === "inspo") {
      renderInspo();
      if (pillLine) pillLine.textContent = "Inspo";
      return;
    }
    var rows = STORES;
    if (slug === "walkin") rows = STORES.filter(function (s) { return s.walkin; });
    else if (slug !== "inspo") rows = STORES.filter(function (s) { return s.cat === slug; });

    list.innerHTML = "";
    if (!rows.length) {
      var empty = document.createElement("p");
      empty.className = "sa-meta2";
      empty.style.textAlign = "center";
      empty.style.padding = "24px 0";
      // No fabricated filler: a category with no seeded store says so.
      empty.textContent = "No seeded stores in this category yet.";
      list.appendChild(empty);
    } else {
      rows.forEach(function (s) { list.appendChild(resultRow(s)); });
    }
    if (pillLine) pillLine.textContent = slug === "home" ? "Search stores" : label;
  }

  renderCategory(ACTIVE, "Barber");

  document.getElementById("sa-note").innerHTML =
    "<b>Composed, not drawn.</b> The row is SalonResultCard's default shape, copied by line: full "
    + "width, photo left at 104 square, hairline kept, the lift on the photo rather than the card. "
    + "That is the opposite of the home card and it is deliberate in the real component, so it is "
    + "preserved rather than smoothed over. Pills use the measured Airbnb recipe and the selected "
    + "one does not change weight. Names, ratings and prices are the live seeded values.";

  // Version toggle. The real page loads only when its pane is opened.
  var paneNow = document.getElementById("sa-pane-now");
  var paneNew = document.getElementById("sa-pane-new");
  var tabNow = document.getElementById("sa-tab-now");
  var tabNew = document.getElementById("sa-tab-new");
  var frame = document.getElementById("sa-live-frame");

  function show(which) {
    var isNow = which === "now";
    paneNow.dataset.on = isNow ? "1" : "0";
    paneNew.dataset.on = isNow ? "0" : "1";
    tabNow.setAttribute("aria-selected", isNow ? "true" : "false");
    tabNew.setAttribute("aria-selected", isNow ? "false" : "true");
    if (isNow && !frame.getAttribute("src")) frame.setAttribute("src", REAL_ROUTE);
  }
  tabNow.addEventListener("click", function () { show("now"); });
  tabNew.addEventListener("click", function () { show("new"); });

  // ===== WHERE THE CATEGORY ROW SITS =====================================
  // Owner 2026-07-31: "what if we put the category icon above the search bar? What do you think?"
  // Three arrangements on the SAME page so only one variable moves.
  //
  // MY PICK IS BELOW, and the cost of ABOVE is one a still image hides: the category row COLLAPSES
  // on scroll. With it above the pill, folding it drags the search bar UP the screen, so the one
  // control the user is reaching for moves under their thumb mid-gesture. With it below, the pill
  // is pinned at the very top and never moves while the row folds away beneath it. ABOVE also
  // starts the search bar about 64px lower on arrival, and the search bar is the thing he set out
  // to make more prominent. Drawn fully anyway so he judges it, not a strawman of it.
  var band = document.querySelector(".sa-band");
  var bandinner = document.querySelector(".sa-bandinner");
  var catrow = document.getElementById("sa-catscroll");
  var arrange = document.getElementById("sa-arrange");

  function applyArrangement(mode) {
    catrow.style.display = mode === "none" ? "none" : "flex";
    if (mode === "above") band.insertBefore(catrow, bandinner);
    else band.appendChild(catrow);
    arrange.querySelectorAll(".sa-tab").forEach(function (t) {
      t.setAttribute("aria-selected", t.dataset.arr === mode ? "true" : "false");
    });
  }
  arrange.querySelectorAll(".sa-tab").forEach(function (t) {
    t.addEventListener("click", function () { applyArrangement(t.dataset.arr); });
  });

  // ===== FILTER PILLS, under the chrome, the arrangement he pointed at ====
  // Same controls the live route already has, collapsed into one scrolling row.
  function toolIcon(name) {
    var paths = {
      sliders: '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/>'
        + '<line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/>'
        + '<line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/>'
        + '<line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/>'
        + '<line x1="16" x2="16" y1="18" y2="22"/>',
      chevron: '<path d="m6 9 6 6 6-6"/>'
    };
    return '<svg class="lucide lucide-' + name + '" data-lucide="' + name + '" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths[name] + '</svg>';
  }
  var tools = document.createElement("div");
  tools.className = "sa-tools";
  [["Filters", "sliders"], ["Best match", "chevron"], ["Price", "chevron"], ["Open now", null]]
    .forEach(function (pair) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "sa-tool";
      b.innerHTML = pair[1] === "sliders"
        ? toolIcon("sliders") + "<span>" + pair[0] + "</span>"
        : pair[1] === "chevron"
          ? "<span>" + pair[0] + "</span>" + toolIcon("chevron")
          : "<span>" + pair[0] + "</span>";
      tools.appendChild(b);
    });
  band.appendChild(tools);

  // Three filter treatments, switchable, because he asked for ideas rather than one answer.
  var root = document.querySelector(".sa-root");
  var toolSeg = document.createElement("div");
  toolSeg.className = "sa-seg";
  toolSeg.setAttribute("role", "tablist");
  toolSeg.setAttribute("aria-label", "Filter pill depth");
  [["sunken", "Sunken"], ["matched", "Matched"], ["minimal", "Minimal"]].forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "sa-tab";
    b.setAttribute("role", "tab");
    b.dataset.tools = p[0];
    b.textContent = p[1];
    b.setAttribute("aria-selected", p[0] === "sunken" ? "true" : "false");
    b.addEventListener("click", function () {
      root.dataset.tools = p[0];
      toolSeg.querySelectorAll(".sa-tab").forEach(function (t) {
        t.setAttribute("aria-selected", t.dataset.tools === p[0] ? "true" : "false");
      });
    });
    toolSeg.appendChild(b);
  });
  document.querySelector(".sa-bar").appendChild(toolSeg);
  // Owner: "I told you I do not want to be sunken exclusively, and you made this again." He asked
  // for ideas and I picked one and made it the only default. The default is now the treatment he
  // actually described, the search bar's own outline plus shadow, and all three ideas stay on the
  // toggle for him to compare. No preselection.
  root.removeAttribute("data-tools");
  toolSeg.querySelectorAll(".sa-tab").forEach(function (t) { t.setAttribute("aria-selected", "false"); });

  // The owner picked categories ABOVE the search bar, so that is the default here.
  applyArrangement("above");

  // ===== ONLY THE SEARCH BAR SURVIVES THE SCROLL =========================
  // Owner: "when you scroll down it's all gonna be fucked up. Make it so the only search bar when
  // you scroll, the only search bar is there."
  // There was NO scroll handler in this file at all. It was lost in an earlier edit, which is why
  // --p sat at 0 forever and all three rows followed the page down. Not a CSS bug: the code that
  // drives the CSS had gone missing. Continuous 0..60 ramp, the same one SearchTemplate uses.
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function onScroll() {
    var y = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
    var p = reduce ? (y > 30 ? 1 : 0) : Math.min(1, Math.max(0, y / 60));
    band.style.setProperty("--p", String(p));
  }
  onScroll();
  window.addEventListener("scroll", onScroll, { passive: true });
  document.addEventListener("scroll", onScroll, { passive: true });

  window.saMeasure = function () {
    var r1 = function (n) { return Math.round(n * 10) / 10; };
    var q = function (sel) { var e = document.querySelector(sel); if (!e) return null;
      var b = e.getBoundingClientRect(); return { x: r1(b.x), y: r1(b.y), w: r1(b.width), h: r1(b.height) }; };
    var sel = document.querySelector('.sa-cat[aria-selected="true"]');
    var un = document.querySelector('.sa-cat[aria-selected="false"]');
    return {
      viewport: { w: window.innerWidth, h: window.innerHeight },
      overflowX: document.documentElement.scrollWidth > window.innerWidth,
      pane: paneNew.dataset.on === "1" ? "proposed" : "now",
      liveFrameSrc: frame.getAttribute("src"),
      row: q(".sa-row"), photo: q(".sa-photo"),
      rowBorder: getComputedStyle(document.querySelector(".sa-row")).borderTopWidth,
      selectedWeight: getComputedStyle(sel).fontWeight,
      unselectedWeight: getComputedStyle(un).fontWeight,
      weightChangesOnSelect: getComputedStyle(sel).fontWeight !== getComputedStyle(un).fontWeight,
      rows: document.querySelectorAll(".sa-row").length,
      grids: document.querySelectorAll(".sa-grid").length
    };
  };
})();
</script>
