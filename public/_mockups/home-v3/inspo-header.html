<!--
  home-v3 / inspo-header : Inspo gets the home chrome exactly. One arrangement, not three.

  Owner-scope 2026-07-31, verbatim: "did you forget that we are going to ditch the whole banner?
  We have the category icon pills on the top. So we have to ditch the hamburger menu AND the Inspo
  text. And we have to make the size of the search bar also the same so it actually looks good and
  complete."

  WHAT I GOT WRONG LAST ROUND, and it is why this file is now ONE arrangement instead of three.
  I kept Inspo's wordmark banner and asked him to choose where the hamburger and the heart should
  sit inside it. But the banner is the thing being deleted. Once the category pills are the top
  row, there is no banner left to arrange, so all three of my variants answered a question that no
  longer existed. The heart takes the search pill's right slot because the hamburger that used to
  be there goes with the banner.

  Exists-check: RAN THIS TURN. `npm run exists "inspo chrome"` -> 0 hits. Also this turn,
    `npm run exists "discovery searchbar"` -> HIT, components-legacy/discovery/SearchBar.tsx is
    what /de/inspo renders today, so the bar below is that control RESIZED to the home size, not a
    second search control. `npm run exists "inspo"` -> 41 hits; the page exists at
    app/[locale]/inspo, so this is a chrome change to a live surface, not a new screen.

  Grounded-in: app/[locale]/inspo/page.tsx
  Grounded-in: app/[locale]/_components/homepage/MobileCategoriesRow.tsx
  Grounded-in: public/_mockups/home-v3/search-a.html

  Depicts: the category row -> app/[locale]/_components/homepage/MobileCategoriesRow.tsx
  Depicts: the search control -> components-legacy/discovery/SearchBar.tsx
  Depicts: the saved-styles heart -> app/[locale]/inspo/page.tsx
  Depicts: the masonry feed -> app/[locale]/inspo/page.tsx
  Depicts: this chrome on Inspo -> NET-NEW: /de/inspo renders a wordmark banner and a 295-wide
    bar today, so the home chrome has never been applied to it.

  measured on the approved HOME mockup at vw=390 immediately before writing this file. Every
  number below is copied from it rather than chosen here:
    category row 390 x 66, padding 12/16/14, gap 12; pill h=40, padding 0 14, radius 40, 14px/400
    band padding 4/0/8, inner padding 0 16
    search pill 358 x 66 at x=16, padding 10 14, gap 12, radius 9999,
      border 1px #E4E4E7, lift rgba(0,0,0,0.07) 0 2px 8px
    the button in the pill's right slot 44 x 44 at x=315
    label 16px/500
  and on the LIVE /de/inspo at vw=375, for the before: bar 295 x 50, banner row 84 tall,
    heart 40 x 40 sitting OUTSIDE the bar, feed grid `columns-2 gap-1.5`.

  CARD CHROME IS KEPT, not removed: every unselected pill and the search bar carry the 1px #E4E4E7
  hairline and the rgba(0,0,0,0.07) lift. The selected pill is the approved sunken treatment
  (#F4F4F5 fill, lift removed) copied from the home mockup, which is a locked selected-state and
  not a flat redesign.

  DATA: the six discovery thumbnails are the real seeded ones, self-hosted under _assets/inspo.
  Salon photos elsewhere in this estate are stock placeholders; salon_photos has 0 rows.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspo with the home chrome</title>
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; -webkit-text-size-adjust: 100%; }
  .ih { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0A0A0A; max-width: 430px; margin: 0 auto; }
  .ih *, .ih *::before, .ih *::after { box-sizing: border-box; }

  /* ===== THE HOME CHROME, copied number for number from search-a.html ===== */
  .cats { display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
    padding: 12px 16px 14px; }
  .cats::-webkit-scrollbar { display: none; }
  .cat { position: relative; isolation: isolate; flex: 0 0 auto; display: inline-flex;
    align-items: center; gap: 4px; height: 40px; padding: 0 14px; border-radius: 40px;
    border: 1px solid #FFFFFF; background: transparent;
    font-size: 14px; font-weight: 400; color: #0A0A0A; white-space: nowrap; }
  /* The raised and sunken states live on two overlay layers, exactly as the approved home pill
     does, so the selected state swaps depth without the button fighting its own background. */
  .cat::before, .cat::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    pointer-events: none; z-index: -1; }
  .cat::before { background: #FFFFFF; box-shadow: rgba(0,0,0,0.07) 0 2px 8px 0; opacity: 1; }
  .cat::after { background: #F4F4F5; opacity: 0; }
  .cat[aria-selected="true"]::before { opacity: 0; }
  .cat[aria-selected="true"]::after { opacity: 1; }
  .cat[aria-selected="true"] { border-color: rgba(255,255,255,0.5); }
  .cat img { height: 20px; width: 20px; object-fit: contain; }

  .band { padding: 4px 0 8px; }
  .bandinner { padding: 0 16px; display: flex; align-items: center; }
  .pill { display: flex; align-items: center; gap: 12px; flex: 1 1 auto; min-width: 0;
    height: 66px; padding: 10px 14px; border-radius: 9999px; background: #FFFFFF;
    border: 1px solid #E4E4E7; box-shadow: rgba(0,0,0,0.07) 0 2px 8px 0; }
  .pilltext { min-width: 0; flex: 1 1 auto; }
  .l1 { display: block; font-size: 16px; font-weight: 500; line-height: 20px;
    letter-spacing: -0.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The heart takes the slot the hamburger held on home: same 44 square, same position, so the
     two screens read as one bar with one trailing action rather than two different bars. */
  .slot { display: grid; place-items: center; height: 44px; width: 44px; flex: 0 0 auto;
    border: 0; background: transparent; color: #0A0A0A; cursor: pointer; }

  /* the real feed, untouched: columns-2 with a 6px gap */
  .feed { columns: 2; column-gap: 6px; padding: 6px; }
  .feed img { width: 100%; display: block; border-radius: 10px; margin: 0 0 6px;
    break-inside: avoid; background: #F4F4F5; }
</style>

<div class="ih">
  <div class="cats">
    <span class="cat" aria-selected="true"><img src="/icons/categories/map.png" alt="" aria-hidden="true">Inspo</span>
    <span class="cat"><img src="/icons/categories/scissors.png" alt="" aria-hidden="true">Coiffeur</span>
    <span class="cat"><img src="/icons/categories/clippers.png" alt="" aria-hidden="true">Barber</span>

  </div>

  <div class="band">
    <div class="bandinner">
      <div class="pill" role="button" tabindex="0" aria-label="Search styles">
        <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
        <span class="pilltext"><span class="l1">Search styles</span></span>

      </div>
    </div>
  </div>

</div>
