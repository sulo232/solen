<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspo with the home chrome</title>
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; -webkit-text-size-adjust: 100%; }
  .ih { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0A0A0A; max-width: 430px; margin: 0 auto; }
  .ih *, .ih *::before, .ih *::after { box-sizing: border-box; }

  /* ============ CHROME COPIED VERBATIM FROM search-a.html ============ */
  .ih {
    --lift-raised:
      rgba(0,0,0,0.10) 0 3px 2.5px 0, rgba(0,0,0,0.15) 0 1px 1px 0, rgba(0,0,0,0.15) 0 0.8px 0.4px 0,
      rgb(255,255,255) 0 1px 1.5px 0 inset, rgba(58,58,58,0.02) 0 10px 15px 0 inset,
      rgba(255,255,255,0.6) 0 -1.5px 0.8px 0 inset, rgba(0,0,0,0.30) 0 -1.5px 0.75px 0 inset;
    --lift-sunken:
      rgb(255,255,255) 0 1px 0.5px 0, rgba(0,0,0,0.15) 0 -0.5px 1px 0, rgba(0,0,0,0.05) 0 -1.2px 0.5px 1px,
      rgba(0,0,0,0.05) 0 8px 16px 0, rgb(255,255,255) -0.2px -1px 1px 0 inset,
      rgba(0,0,0,0.20) 0.5px 0.7px 2.5px 0 inset, rgba(0,0,0,0.05) -1px -3px 8px 0 inset,
      rgba(0,0,0,0.10) 0.5px 2px 4px 0 inset, rgba(0,0,0,0.10) 1px 6px 6px 2px inset;
    --lift: rgba(0,0,0,0.07) 0 2px 8px 0;
  }

  .sa-catscroll { display: flex; gap: 12px; padding: 12px 16px 14px; overflow-x: auto;
    overflow-y: hidden; scrollbar-width: none; }
  .sa-catscroll::-webkit-scrollbar { display: none; }

  .sa-cat {
    display: inline-flex; flex: 0 0 auto; height: 40px; align-items: center; gap: 4px;
    padding: 0 14px; border-radius: 40px;
    font-size: 14px; font-weight: 400; line-height: 1; color: #0A0A0A; cursor: pointer;
    position: relative;
    border: 1px solid #FFFFFF;
    background: transparent;
    box-shadow: 0 0 0 0 rgba(0,0,0,0);
    isolation: isolate;
    transition: box-shadow 220ms cubic-bezier(0.1, 0.9, 0.2, 1),
                background-color 220ms cubic-bezier(0.1, 0.9, 0.2, 1),
                transform 220ms cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  .sa-cat.is-pressed { transform: scale(0.96); }
  .sa-cat::before,
  .sa-cat::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: -1;
    transition: opacity 220ms cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  .sa-cat::before { background: #FFFFFF; box-shadow: var(--lift-raised); opacity: 1; }
  .sa-cat::after  { background: #F4F4F5; box-shadow: var(--lift-sunken); opacity: 0; }
  .sa-cat[aria-selected="true"]::before { opacity: 0; }
  .sa-cat[aria-selected="true"]::after  { opacity: 1; }
  .sa-cat[aria-selected="true"] { border-color: rgba(255,255,255,0.5); }
  .sa-caticon { height: 31px; width: 31px; flex: 0 0 auto; object-fit: contain; }

  .sa-band { padding: 4px 0 8px; }
  .sa-bandinner { padding: 0 16px; display: flex; align-items: center; }
  .sa-pill { display: flex; align-items: center; gap: 12px; flex: 1 1 auto; min-width: 0;
    height: 66px; padding: 10px 14px; border-radius: 9999px; background: #FFFFFF;
    border: 1px solid #E4E4E7; box-shadow: var(--lift); }
  .sa-pillicon { flex: 0 0 auto; color: #6B6B6B; display: flex; }
  .sa-pilltext { min-width: 0; flex: 1 1 auto; }
  .sa-l1 { display: block; font-size: 16px; font-weight: 500; line-height: 20px;
    letter-spacing: -0.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The heart takes the slot the hamburger holds on home: same 44 square, same position. */
  .sa-menu { display: grid; place-items: center; height: 44px; width: 44px; flex: 0 0 auto;
    border: 0; background: transparent; color: #0A0A0A; cursor: pointer; }

  /* the real feed, untouched: columns-2 with a 6px gap */
  .feed { columns: 2; column-gap: 6px; padding: 6px; }
  .feed img { width: 100%; display: block; border-radius: 10px; margin: 0 0 6px;
    break-inside: avoid; background: #F4F4F5; }
</style>

<div class="ih">

      </div>
    </div>
  </div>

  <div class="feed">

    <img src="/_mockups/_assets/inspo/364edd9f-3483-4894-910c-cec7aa25face.jpg" alt="">
    <img src="/_mockups/_assets/inspo/1a11b89d-5583-41f4-a233-e1579275144f.jpg" alt="">
    <img src="/_mockups/_assets/inspo/b99a7617-fa43-4830-9cf1-d5302bca5139.jpg" alt="">
    <img src="/_mockups/_assets/inspo/30726a27-1a2b-4df6-86c1-9b3ab249dedc.jpg" alt="">
    <img src="/_mockups/_assets/inspo/f5bcaae3-9d70-46a9-ab3c-c2d0c383721c.jpg" alt="">

</div>

<script>
  // The press motion is JS-held for the same reason it is in search-a.html: iOS never fires
  // :active on a tap unless the element carries a touch listener, so a CSS-only press window is
  // zero-length and the motion never renders.
  document.querySelectorAll(".sa-cat").forEach(function (b) {
    ["pointerdown", "mousedown", "touchstart"].forEach(function (ev) {
      b.addEventListener(ev, function () {
        b.classList.add("is-pressed");
        setTimeout(function () { b.classList.remove("is-pressed"); }, 220);
      }, { passive: true });
    });
    b.addEventListener("click", function () {
      document.querySelectorAll(".sa-cat").forEach(function (x) { x.setAttribute("aria-selected", "false"); });
      b.setAttribute("aria-selected", "true");
    });
  });
</script>
