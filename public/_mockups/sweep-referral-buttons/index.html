<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Referral share buttons , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/profile/referral/page.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real referral page via /api/dev/login?to=/de/profile/referral
  (WhatsApp is a brand-green fill and Copy is a gray fill, so there's no single ink commit). AFTER = one ink primary
  (Share) + a neutral outline (Copy), one clear commit. Only the button hierarchy changes.
  Depicts: referral share buttons -> app/[locale]/profile/referral/page.tsx
  Exists-check: `npm run exists "referral"` ran earlier , the page already renders.
  Backend-check: share/copy are real; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--accent:#276EF1;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:24px 16px 40px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-0.02em}
  .code{margin-top:16px;background:#fff;border:1px solid var(--hairline);border-radius:16px;padding:16px;text-align:center}
  .cv{font-size:20px;font-weight:700;letter-spacing:.04em}
  .btns{margin-top:16px;display:flex;flex-direction:column;gap:10px}
  .bt{height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600}
  .bt svg{width:18px;height:18px}
  .bt.pri{background:var(--ink);color:#fff}
  .bt.sec{border:1px solid var(--hairline);color:var(--ink)}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:22px;line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/api/dev/login?to=/de/profile/referral" title="live referral"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="h1">Share your code</div>
        <div class="code"><div class="cv">SOLEN-4K2X</div></div>
        <div class="btns">
          <div class="bt pri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4M12 2v13"/></svg>Share</div>
          <div class="bt sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy code</div>
        </div>
        <div class="cap">Change applied: one ink primary (Share) plus a neutral outline (Copy), one clear commit, instead of a brand-green WhatsApp fill next to a gray Copy fill with no single primary.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
