.hdr-root {
  position: sticky;
  top: 0;
  z-index: 50;
  width: 100%;
  background: #fff;
  border-bottom: 1px solid #E4E4E7;
  padding-top: env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust: 100%;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  color: #0A0A0A;
  box-sizing: border-box;
}
.hdr-root *,
.hdr-root *::before,
.hdr-root *::after { box-sizing: border-box; }

.hdr-inner {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ── the real Logo primitive: font-display, 28px, 600, tracking-normal, no dot ── */
.hdr-logo {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  font-family: "Inter Tight", Inter, ui-sans-serif, system-ui, sans-serif;
  font-weight: 600;
  font-size: 28px;
  line-height: 1;
  letter-spacing: 0;
  color: #0A0A0A;
  text-decoration: none;
  -webkit-user-select: none;
  user-select: none;
}
.hdr-logo-sm { font-size: 18px; }         /* Logo size="sm" , the locked small variant */
.hdr-logo-tap { min-height: 44px; }

/* ── the real header tile: h-11 w-11, rounded-input 16, hairline, white, ink glyph ── */
.hdr-tile {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 16px;
  border: 1px solid #E4E4E7;
  background: #fff;
  color: #0A0A0A;
  padding: 0;
  cursor: pointer;
  transition: border-color 200ms cubic-bezier(0.22, 1, 0.36, 1),
              background-color 200ms cubic-bezier(0.22, 1, 0.36, 1),
              transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
}
.hdr-tile:hover { border-color: #0A0A0A; }
.hdr-tile:active { transform: scale(0.94); }
/* naked variant , used INSIDE the search bar where the bar already carries the edge */
.hdr-tile-bare { border-color: transparent; background: transparent; }
.hdr-tile-bare:hover { border-color: transparent; background: #F4F4F5; }

/* ── shared search-field grammar, carried from SearchBar.tsx ──
   resting state = placeholder, so weight 400 / ink-2, exactly as the real
   CollapsedRow renders it (isPlaceholder ? font-normal : font-semibold).
   That also keeps every variant at 1 of 4 text nodes >= weight 600 (the wordmark),
   i.e. 25%, under the 30% emphasis ceiling. */
.hdr-field {
  display: flex;
  align-items: center;
  min-width: 0;
  height: 48px;
  background: #fff;
  border: 1px solid #E4E4E7;
  border-radius: 999px;
  padding: 0 6px 0 14px;
  gap: 10px;
  cursor: pointer;
  text-align: left;
  transition: border-color 150ms cubic-bezier(0.22, 1, 0.36, 1),
              background-color 150ms cubic-bezier(0.22, 1, 0.36, 1),
              transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
}
.hdr-field:hover { background: #F4F4F5; }
.hdr-field:active { transform: scale(0.99); }
.hdr-field-ico { display: flex; flex-shrink: 0; color: #6B6B6B; }
.hdr-field-labels {
  display: flex;
  align-items: center;
  min-width: 0;
  flex: 1 1 auto;
  gap: 8px;
  overflow: hidden;
}
.hdr-lab {
  font-size: 14px;
  font-weight: 400;
  color: #6B6B6B;
  letter-spacing: -0.005em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hdr-lab-2 { font-size: 13px; }
.hdr-sep {
  flex-shrink: 0;
  width: 1px;
  height: 16px;
  background: #E4E4E7;
}
/* the one commit control, ink */
.hdr-go {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 999px;
  background: #0A0A0A;
  color: #fff;
  padding: 0;
  cursor: pointer;
  transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1),
              background-color 200ms cubic-bezier(0.22, 1, 0.36, 1);
}
.hdr-go:hover { background: #000; }
.hdr-go:active { transform: scale(0.97); }

.hdr-row {
  display: flex;
  align-items: center;
  min-height: 44px;
}
.hdr-spacer { flex: 1 1 auto; min-width: 0; }

/* ═══ A. hdr-stacked , logo row over a full-width search row (Airbnb's answer) ═══ */
.hdr-stacked .hdr-inner { padding-top: 10px; padding-bottom: 10px; }
.hdr-stacked-searchrow { margin-top: 8px; }
.hdr-stacked-searchrow .hdr-field { width: 100%; }

/* ═══ B. hdr-pill , one row, compact summary pill sandwiched in the 243px gap ═══ */

.hdr-pill-mid {

  min-width: 0;

}
.hdr-pill-mid .hdr-field {

  padding: 0 14px;

}

/* ═══ C. hdr-searchbar , the search bar IS the header ═══ */
.hdr-searchbar .hdr-inner { padding-top: 8px; padding-bottom: 8px; }
.hdr-sb-bar {
  display: flex;

  padding: 0 6px 0 14px;
  background: #fff;
  border: 1px solid #E4E4E7;

}
.hdr-sb-field {

  align-items: center;
  flex: 1 1 auto;
  min-width: 0;
  gap: 10px;
  height: 44px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  text-align: left;
}
.hdr-sb-field:active { transform: scale(0.99); }

/* ═══ D. hdr-minimal , logo, search icon, hamburger. No persistent field ═══ */
.hdr-minimal .hdr-inner { padding-top: 10px; padding-bottom: 10px; }
.hdr-minimal-actions {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  gap: 8px;
}
</style>
