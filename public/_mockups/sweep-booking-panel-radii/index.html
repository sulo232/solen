<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Booking panel radii , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: components-legacy/booking/PayConfirmStep.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real booking flow at /de/salon/blade-and-stone/booking
  (on the checkout screen the summary card is rounded-16 but the contact/voucher/card panels are rounded-12, the
  input radius, so the corners step down the page). AFTER = every panel at rounded-16, one radius. Only panel radius changes.
  Depicts: booking checkout panels -> components-legacy/booking/PayConfirmStep.tsx
  Exists-check: `npm run exists "PayConfirmStep"` ran earlier , the panels already render.
  Backend-check: checkout is real; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:22px 16px 40px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-0.02em}
  .blk{background:#fff;border:1px solid var(--hairline);border-radius:16px;padding:14px;margin-top:12px}
  .sum{box-shadow:0 1px 2px rgba(10,10,10,.04),0 8px 24px -16px rgba(10,10,10,.12)}
  .bh{font-size:13px;font-weight:600}
  .brow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-top:8px}.brow b{color:var(--ink)}
  .field{height:40px;border:1px solid var(--hairline);border-radius:10px;margin-top:8px;background:var(--sunken)}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:22px;line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de/salon/blade-and-stone/booking" title="live booking flow"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="h1">Confirm</div>
        <div class="blk sum"><div class="bh">Summary</div><div class="brow"><span>Haircut</span><b>CHF 55</b></div><div class="brow"><span>Total</span><b>CHF 55</b></div></div>
        <div class="blk"><div class="bh">Contact</div><div class="field"></div></div>
        <div class="blk"><div class="bh">Voucher</div><div class="field"></div></div>
        <div class="cap">Change applied: every checkout panel uses the card radius (16), matching the summary card, so the corners read as one family, instead of the summary at 16 and the panels below at 12 (the input radius).</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
