<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Header nav hover , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/_components/layout/Header.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real /de home (its header). AFTER = the desktop header
  bar with EVERY nav item hovering to the same gray sunken pill (the About-us item currently blooms a
  frosted-glass pill instead). Desktop-nav surface; the AFTER shows the desktop header strip with the unified hover.
  Depicts: desktop header nav -> app/[locale]/_components/layout/Header.tsx
  Exists-check: `npm run exists "cookie consent search reviews"` ran this turn (batch) , the header already renders.
  Backend-check: nav is client routing; no fabricated values. English chrome; live iframe shows real German labels.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{min-height:100%;background:#fff;padding:20px 16px}
  .hdr{border:1px solid var(--hairline);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(10,10,10,.04)}
  .logo{font-size:16px;font-weight:700;letter-spacing:-0.02em;margin-right:10px}
  .nav{font-size:13.5px;font-weight:500;color:var(--ink);padding:8px 12px;border-radius:999px}
  .hov{background:var(--sunken)}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de" title="live home header"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="hdr">
          <span class="logo">solen</span>
          <span class="nav hov">Services</span>
          <span class="nav">For business</span>
          <span class="nav hov">About us</span>
          <span class="nav">Inspo</span>
        </div>
        <div class="cap">Change applied: every desktop nav item hovers to the same gray sunken pill, including "About us", which currently blooms a frosted-glass pill instead. One hover material across the row. (Desktop surface; the live iframe shows the page's real header.)</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
