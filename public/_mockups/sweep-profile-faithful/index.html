<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Profile , faithful to the Pinterest reference</title>
<!-- Base: capture live (live-iframe of the real /de/profile, not a static img) -->
<!-- Scale: full-page -->
<!-- Grounded-in: app/[locale]/_components/profile/ProfileTabs.tsx -->
<!--
  Grounded-in: app/[locale]/_components/profile/ProfileTabs.tsx (the real /de/profile this fixes to match
  the owner's Pinterest reference IMG_6647). Reference PIL-measured this turn (1206x2622): near-square tiles
  ~576px wide = ~48% of viewport (2 columns, ~9px gutter); a chip row at y~560-650 (~22% down); a plus at the
  search's right edge (x~1030-1160); a suggestions section at y~1354 (~52% down) filling the bottom.
  What shipped diverged: tiles were 166px 4/3 (small + plain), no chip row, no plus, no suggestions row
  (so the bottom read empty, 178px dead space measured).
  english-ok lang-ok german-ok: genuinely-localised v2 mockup , injected labels are the app's REAL German
  product strings so the layout blends into the real German page it injects into; english chrome.
  FORMAT v2: BEFORE = the real /de/profile live; AFTER = the same live page re-laid to the reference anatomy:
  tab bar (avatar + saved/appointments/looks tabs + gear) + search + a chip row (a REAL sort toggle) +
  the owner's live next-booking block + BIGGER near-square tiles (real bookings/saved salons) + a
  suggestions section (real nearby salons) that matches the reference AND fills the dead space.
  Diagnosis: profile vs reference | tiles 166px 4/3 + no chip row + no suggestions (178px dead bottom) |
  diverges from IMG_6647 (near-square ~48% tiles + chip row + suggestions filling the page) | target the
  measured reference anatomy with our real data.
  psych-ok: every tile/photo is read live; empty tabs show the true empty state; suggestion cards use the
  CONVERGED SalonCard treatment (star + rating value only, matching the live SalonCard); the create-plus is
  DROPPED on purpose (Pinterest's plus = create-board, no customer-profile equivalent, not shown dead).
  Backend-check: sort = client-side sort of the already-fetched list (no endpoint needed); suggestions
  -> GET /api/salons (EXISTS) real nearby salons; bookings -> GET /api/bookings/user?tab=past (EXISTS);
  saved -> /de/profile/favorites (EXISTS). No fabricated action.
  Exists-check: `npm run exists "profile"` ran this turn; /profile, favorites, bookings API, /api/salons all
  exist. REMOVED: Inspo boards/collections (2026-06-23) stay dead , the saved grid here is FLAT tiles, no
  board/collection concept re-proposed. NEW: only the re-layout.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--line:#E4E4E7;--sunken:#F4F4F5;--star:#FFC32B;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(340px,86vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .cap{position:fixed;top:52px;left:0;right:0;z-index:19;background:var(--sunken);color:var(--ink2);font-size:12px;font-weight:600;text-align:center;padding:6px 12px;line-height:1.35}
  .stage{position:fixed;top:84px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After , like the reference</button></div></div>
  <div class="cap">After: the reference anatomy on the real page , chip row, bigger near-square tiles, and a suggestions row filling the bottom. Tap the gallery mint card first if you see login.</div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe id="beforeFrame" src="/de/profile" title="real profile, before"></iframe></div>
    <div id="paneAfter" class="pane hidden"><iframe id="afterFrame" src="/de/profile" title="real profile, faithful reference layout"></iframe></div>
  </div>
<script>
  var DATA={state:'idle',past:[],favs:[],sugg:[]};
  function load(){ if(DATA.state!=='idle') return; DATA.state='loading';
    Promise.all([
      fetch('/api/bookings/user?tab=past',{credentials:'include'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/de/profile/favorites',{credentials:'include'}).then(function(r){return r.ok?r.text():'';}).catch(function(){return '';}),
      fetch('/api/salons?limit=6',{credentials:'include'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    ]).then(function(res){
      var pj=res[0]; DATA.past=(pj&&pj.bookings)?pj.bookings.slice(0,8):[];
      DATA.favs=parseFavs(res[1]);
      var sj=res[2]; var arr=sj&&(sj.items||sj.salons||sj.data||sj.results); DATA.sugg=arr?arr.slice(0,6):[];
      DATA.state='ready';
    }).catch(function(){ DATA.state='ready'; });
  }
  function parseFavs(html){ try{ var d=new DOMParser().parseFromString(html,'text/html'); var out=[],seen={};
    [].forEach.call(d.querySelectorAll('a[href*="/salon/"]'),function(a){ if(out.length>=8) return;
      var img=a.querySelector('img'); var h=a.querySelector('h3,h2'); var name=h?(h.textContent||'').trim():'';
      if(!name){ name=((a.textContent||'').trim().split('\n')[0]||'').trim().slice(0,40); }
      if(name && !seen[name]){ seen[name]=1; out.push({name:name,img:img?img.getAttribute('src'):null}); } });
    return out; }catch(e){ return []; } }
  function fmtDate(iso){ try{ var d=new Date(iso); return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'; }catch(e){ return ''; } }
  function micon(d){ return '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="lucide" aria-hidden="true">'+d+'</svg>'; }
  var GEAR='<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>';
  var SEARCH='<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
  var SORT='<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-down"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>';
  var SCIS=micon('<circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/>');
  var STAR='<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="#FFC32B" stroke="#FFC32B" class="lucide lucide-star"><path d="M11.5 2.3a.5.5 0 0 1 1 0l2.3 4.7 5.2.8a.5.5 0 0 1 .3.9l-3.7 3.6.9 5.1a.5.5 0 0 1-.8.6L12 16.3l-4.6 2.4a.5.5 0 0 1-.8-.6l.9-5.1L3.8 9.4a.5.5 0 0 1 .3-.9l5.2-.8z"/></svg>';
  function readIdentity(doc){ var el=doc.querySelector('p[class*="text-[21px]"]'); var name=el?(el.textContent||'').trim():''; return {name:name||'Dein Profil'}; } // english-ok german-ok
  function readHero(doc){
    var links=doc.querySelectorAll('a[href$="/profile/bookings"]');
    for(var i=0;i<links.length;i++){ var a=links[i]; var h3=a.querySelector('h3'); if(!h3) continue;
      var tile=a.querySelector('div[class*="w-[52px]"],div[class*="w-[64px]"]'); var dow='',day='',mon='';
      if(tile&&tile.children.length>=3){ dow=(tile.children[0].textContent||'').trim(); day=(tile.children[1].textContent||'').trim(); mon=(tile.children[2].textContent||'').trim(); }
      var time='';
      [].forEach.call(a.querySelectorAll('p,div'),function(p){ var t=(p.textContent||'').trim(); if(/^\d{2}:\d{2}$/.test(t)&&!time) time=t; });
      return {salon:(h3.textContent||'').trim(),dow:dow,day:day,mon:mon,time:time}; }
    return null;
  }
  var TAB='appts', SORTDESC=true;
  function bigTile(name,img,meta){
    var cover=img?'<img src="'+img+'" alt="" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:16px;display:block;background:#F4F4F5">'
      :'<div style="width:100%;aspect-ratio:1/1;border-radius:16px;background:#F4F4F5;display:grid;place-items:center">'+SCIS+'</div>';
    return '<div>'+cover+'<div style="font-size:16px;font-weight:700;margin-top:9px;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+name+'</div>'
      + (meta?'<div style="font-size:13px;color:#52525B;margin-top:2px">'+meta+'</div>':'')+'</div>';
  }
  function suggCard(s){
    var img=s.cover_photo_url||s.image||null;
    var name=s.name||''; var rv=(s.average_rating!=null?s.average_rating:s.rating);
    var cover=img?'<img src="'+img+'" alt="" style="width:160px;height:160px;object-fit:cover;border-radius:16px;display:block;background:#F4F4F5">'
      :'<div style="width:160px;height:160px;border-radius:16px;background:#F4F4F5;display:grid;place-items:center">'+SCIS+'</div>';
    var rate=(rv!=null)?'<div style="display:flex;align-items:center;gap:4px;font-size:12.5px;margin-top:3px">'+STAR+'<span style="color:#0A0A0A;font-weight:600">'+rv+'</span></div>':''; // psych-ok: mirrors the live SalonCard rating (star + value)
    return '<a href="/de/salon/'+(s.slug||'')+'" style="flex:none;width:160px;text-decoration:none;color:#0A0A0A">'+cover
      + '<div style="font-size:14px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+name+'</div>'+rate+'</a>';
  }
  function grid(){
    var items=[];
    if(TAB==='appts'){ items=DATA.past.map(function(b){ var s=b.salon||{},svc=b.service||{}; return {name:s.name||'',img:s.cover_photo_url||null,meta:(svc.name_de||'')+'  '+fmtDate(b.starts_at),date:b.starts_at}; }); }
    else if(TAB==='saved'){ items=DATA.favs.map(function(f){ return {name:f.name,img:f.img,meta:'',date:null}; }); }
    if(TAB!=='third'){
      items.sort(function(a,c){ if(!a.date||!c.date) return 0; return SORTDESC?(new Date(c.date)-new Date(a.date)):(new Date(a.date)-new Date(c.date)); });
      if(!items.length) return '<div style="grid-column:1/-1;text-align:center;padding:36px 20px"><div style="display:inline-grid;place-items:center;height:52px;width:52px;border-radius:999px;background:#F4F4F5">'+SCIS+'</div><div style="font-size:15px;font-weight:600;margin-top:12px">Noch nichts hier</div></div>'; // english-ok german-ok
      return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px 9px;margin-top:12px">'+items.map(function(it){return bigTile(it.name,it.img,it.meta);}).join('')+'</div>';
    }
    return '';
  }
  function suggestions(){
    if(!DATA.sugg.length) return '';
    return '<div style="margin-top:28px"><div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-bottom:12px">Für dich</div>' // english-ok german-ok: matches the reference suggestions header
      + '<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none">'+DATA.sugg.map(suggCard).join('')+'</div></div>';
  }
  function chipRow(){
    return '<div style="display:flex;gap:9px;margin-top:12px;align-items:center">'
      + '<button data-sort style="display:grid;place-items:center;height:40px;width:44px;border:0;background:#F4F4F5;border-radius:12px;cursor:pointer">'+SORT+'</button>'
      + '<span style="background:#F4F4F5;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;color:#0A0A0A">Sortieren</span>' // english-ok german-ok: real sort control
      + '</div>';
  }
  function tab(id,label){ var on=TAB===id; return '<button data-ptab="'+id+'" style="border:0;background:none;font-family:inherit;cursor:pointer;padding:0 2px 9px;font-size:15px;'+(on?'font-weight:600;color:#0A0A0A;border-bottom:3px solid #0A0A0A;':'font-weight:400;color:#52525B;border-bottom:3px solid transparent;')+'">'+label+'</button>'; }
  function liveBlock(hero){ if(!hero||!hero.salon) return '';
    return '<div style="margin:16px 0 2px"><div style="font-size:13px;font-weight:500;color:#52525B;margin-bottom:9px">Nächster Termin</div>' // english-ok german-ok
      + '<a href="/de/profile/bookings" style="display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #E4E4E7;border-radius:20px;padding:14px;text-decoration:none;color:#0A0A0A">'
      + '<div style="flex:none;width:56px;border-radius:14px;background:#F4F4F5;padding:8px 0;text-align:center"><div style="font-size:11px;font-weight:700;color:#52525B">'+hero.dow+'</div><div style="font-size:22px;font-weight:700;line-height:1.05">'+hero.day+'</div><div style="font-size:11px;color:#52525B">'+hero.mon+'</div></div>'
      + '<div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+hero.salon+'</div>'+(hero.time?'<div style="font-size:13px;color:#52525B;margin-top:2px">'+hero.time+'</div>':'')+'</div></a></div>';
  }
  function render(doc,root,idn,hero){
    root.innerHTML =
      '<div style="display:flex;align-items:center;gap:8px;padding:10px 0 0">'
      + '<div style="height:40px;width:40px;border-radius:999px;background:#F4F4F5;display:grid;place-items:center;font-size:16px;font-weight:600;color:#52525B;flex:none">'+(idn.name.charAt(0)||'S')+'</div>'
      + '<div style="flex:1;display:flex;justify-content:center;gap:22px">'
      +   tab('saved','Gespeichert')+tab('appts','Termine')+tab('third','Looks') // english-ok german-ok
      + '</div>'
      + '<a href="/de/profile/settings" aria-label="settings" style="height:40px;width:40px;display:grid;place-items:center;flex:none">'+GEAR+'</a>'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:10px;height:46px;border:1px solid #E4E4E7;border-radius:16px;padding:0 16px;margin:12px 0 0">'+SEARCH+'<span style="font-size:15px;color:#A1A1AA">Suchen</span></div>' // english-ok german-ok
      + chipRow()
      + liveBlock(hero)
      + grid()
      + suggestions();
    root.querySelectorAll('[data-ptab]').forEach(function(b){ b.onclick=function(){ TAB=b.getAttribute('data-ptab'); render(doc,root,idn,hero); }; });
    var sb=root.querySelector('[data-sort]'); if(sb) sb.onclick=function(){ SORTDESC=!SORTDESC; render(doc,root,idn,hero); };
  }
  function applyTo(doc){
    var root=doc.getElementById('sweep-faith'); if(root) return 1;
    var main=doc.querySelector('main.min-h-screen'); if(!main) return 0;
    var col=main.querySelector(':scope > div'); if(!col||col.getBoundingClientRect().width<200) return 0;
    main.style.background='#fff';
    var st=doc.createElement('style'); st.textContent='#sweep-faith *{transition:none !important}'; doc.head.appendChild(st);
    [].forEach.call(col.children,function(ch){ ch.style.display='none'; });
    root=doc.createElement('div'); root.id='sweep-faith'; root.setAttribute('data-sweep-done','1');
    root.style.cssText='background:#fff;max-width:560px;margin:0 auto;padding:0 12px 32px;font-family:var(--font)';
    col.appendChild(root);
    render(doc,root,readIdentity(doc),readHero(doc));
    return 1;
  }
  var started=false;
  function startAfter(){ if(started) return; started=true; load();
    var f=document.getElementById('afterFrame'),n=0,MAX=600; // psych-ok: poll cap
    var iv=setInterval(function(){ n++; try{var d=f.contentDocument; if(d){ if(applyTo(d) && DATA.state==='ready'){ var r=d.getElementById('sweep-faith'); if(r && !r.getAttribute('data-hyd')){ r.setAttribute('data-hyd','1'); render(d,r,readIdentity(d),readHero(d)); } } } }catch(e){} if(n>MAX) clearInterval(iv); },300);
  }
  function show(w){
    document.getElementById('paneBefore').classList.toggle('hidden', w!=='before');
    document.getElementById('paneAfter').classList.toggle('hidden', w!=='after');
    document.getElementById('bB').classList.toggle('on', w==='before');
    document.getElementById('bA').classList.toggle('on', w==='after');
    if(w==='after') startAfter();
  }
</script>
</body>
</html>
