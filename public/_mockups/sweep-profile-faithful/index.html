<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Profile , faithful to the Pinterest reference</title>
<!-- Base: capture live (live-iframe of the real /de/profile, not a static img) -->
<!-- Scale: full-page -->
<!-- Grounded-in: app/[locale]/_components/profile/ProfileTabs.tsx -->
<!--
  Grounded-in: app/[locale]/_components/profile/ProfileTabs.tsx (the real /de/profile).
  measured: IMG_6647 PIL-sampled this turn at scale 3.0 (device 402pt): avatar 26pt, search 48pt, chip 36pt,
  tile 192x167pt = 1.15:1 (wider than tall), gutter ~6pt, tile-name 18pt, suggestion tile ~114pt, plus at x1065.
  The reference tiles are COLLAGE covers (1 big + stacked thumbs), NOT single photos , that was the "nothing
  like the reference / too big" gap (a single photo reads big; a collage reads dense). This build makes each
  tile a collage from the salon cover + gallery_urls, drops the next-appointment block (owner now dislikes it,
  and it is not in the reference), and applies the measured sizes.
  english-ok lang-ok german-ok: injected labels are the app's REAL German product strings; english chrome.
  psych-ok: every image/name is read live; empty tabs show the true empty state; a suggestion tile shows the
  star + rating VALUE only (no count, matching the live salon card); the plus links to /search (a real action).
  Backend-check: sort = client-side sort (no endpoint); suggestions + gallery -> GET /api/salons (EXISTS,
  returns items[] with gallery_urls); bookings -> GET /api/bookings/user?tab=past (EXISTS); saved ->
  /de/profile/favorites (EXISTS). No fabricated action.
  Exists-check: `npm run exists "profile"` ran this turn; /profile, favorites, bookings API, /api/salons exist.
  REMOVED: Inspo boards/collections (2026-06-23) stay dead , this is a FLAT grid of the user's real items with
  a collage COVER treatment, not a re-proposed boards/collections system. NEW: only the re-layout.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--line:#E4E4E7;--sunken:#F4F4F5;--star:#FFC32B;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(340px,86vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .cap{position:fixed;top:52px;left:0;right:0;z-index:19;background:var(--sunken);color:var(--ink2);font-size:12px;font-weight:600;text-align:center;padding:6px 12px;line-height:1.35}
  .stage{position:fixed;top:84px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After , like the reference</button></div></div>
  <div class="cap">After: the reference anatomy , tabs, search + plus, chip row, and COLLAGE-cover tiles (main + gallery thumbs) like Pinterest boards, plus a for-you row. No next-appointment card. Tap the gallery mint card first if you see login.</div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe id="beforeFrame" src="/de/profile" title="real profile, before"></iframe></div>
    <div id="paneAfter" class="pane hidden"><iframe id="afterFrame" src="/de/profile" title="real profile, faithful reference layout"></iframe></div>
  </div>
<script>
  var DATA={state:'idle',past:[],favs:[],sugg:[]};
  function load(){ if(DATA.state!=='idle') return; DATA.state='loading';
    Promise.all([
      fetch('/api/bookings/user?tab=past',{credentials:'include'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/de/profile/favorites',{credentials:'include'}).then(function(r){return r.ok?r.text():'';}).catch(function(){return '';}),
      fetch('/api/salons?limit=12',{credentials:'include'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    ]).then(function(res){
      var sj=res[2]; var items=(sj&&(sj.items||sj.salons||sj.data))||[];
      var gmap={}; items.forEach(function(s){ gmap[s.slug]=[s.cover_photo_url].concat(s.gallery_urls||[]).filter(Boolean); });
      DATA.sugg=items.slice(0,8).map(function(s){ return {slug:s.slug,name:s.name,rating:(s.average_rating!=null?s.average_rating:s.rating),imgs:(gmap[s.slug]||[s.cover_photo_url]).filter(Boolean)}; });
      var pj=res[0]; DATA.past=((pj&&pj.bookings)||[]).slice(0,8).map(function(b){ var s=b.salon||{},svc=b.service||{}; return {name:s.name||'',slug:s.slug,imgs:(gmap[s.slug]||[s.cover_photo_url]).filter(Boolean),meta:(svc.name_de||'')+(svc.name_de?'  ':'')+fmtDate(b.starts_at),date:b.starts_at}; });
      DATA.favs=parseFavs(res[1]).map(function(f){ return {name:f.name,slug:f.slug,imgs:(gmap[f.slug]||(f.img?[f.img]:[])),date:null}; });
      DATA.state='ready';
    }).catch(function(){ DATA.state='ready'; });
  }
  function parseFavs(html){ try{ var d=new DOMParser().parseFromString(html,'text/html'); var out=[],seen={};
    [].forEach.call(d.querySelectorAll('a[href*="/salon/"]'),function(a){ if(out.length>=8) return;
      var href=a.getAttribute('href')||''; var slug=(href.split('/salon/')[1]||'').split(/[/?#]/)[0];
      var img=a.querySelector('img'); var h=a.querySelector('h3,h2'); var name=h?(h.textContent||'').trim():'';
      if(!name){ name=((a.textContent||'').trim().split('\n')[0]||'').trim().slice(0,40); }
      if(name && !seen[name]){ seen[name]=1; out.push({name:name,slug:slug,img:img?img.getAttribute('src'):null}); } });
    return out; }catch(e){ return []; } }
  function fmtDate(iso){ try{ var d=new Date(iso); return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'; }catch(e){ return ''; } }
  function micon(d){ return '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="lucide" aria-hidden="true">'+d+'</svg>'; }
  var GEAR='<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>';
  var SEARCH='<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
  var SORT='<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-down"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>';
  var PLUS='<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>';
  var SCIS=micon('<circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/>');
  var STAR='<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="#FFC32B" stroke="#FFC32B" class="lucide lucide-star"><path d="M11.5 2.3a.5.5 0 0 1 1 0l2.3 4.7 5.2.8a.5.5 0 0 1 .3.9l-3.7 3.6.9 5.1a.5.5 0 0 1-.8.6L12 16.3l-4.6 2.4a.5.5 0 0 1-.8-.6l.9-5.1L3.8 9.4a.5.5 0 0 1 .3-.9l5.2-.8z"/></svg>';
  function readIdentity(doc){ var el=doc.querySelector('p[class*="text-[21px]"]'); var name=el?(el.textContent||'').trim():''; return {name:name||'Dein Profil'}; } // english-ok german-ok
  var TAB='appts', SORTDESC=true;
  // collage cover , measured from IMG_6647: 1 big image (left ~65%) + up to 2 stacked thumbs (right ~35%),
  // like the reference "f" board tile. Falls back to a single cover when <2 images exist.
  function collage(imgs, aspect){
    var a=aspect||'1.15/1';
    function bg(u){ return u?'background:#F4F4F5 url('+JSON.stringify(u).slice(1,-1)+') center/cover':'background:#F4F4F5'; }
    if(!imgs||imgs.length===0) return '<div style="width:100%;aspect-ratio:'+a+';border-radius:16px;background:#F4F4F5;display:grid;place-items:center">'+SCIS+'</div>';
    if(imgs.length===1) return '<div style="width:100%;aspect-ratio:'+a+';border-radius:16px;'+bg(imgs[0])+'"></div>';
    var thumbs=imgs.slice(1,3);
    var right=thumbs.map(function(u){ return '<div style="flex:1;'+bg(u)+'"></div>'; }).join('<div style="height:3px"></div>');
    return '<div style="width:100%;aspect-ratio:'+a+';border-radius:16px;overflow:hidden;display:flex;gap:3px">'
      + '<div style="flex:0 0 65%;'+bg(imgs[0])+'"></div>'
      + '<div style="flex:1;display:flex;flex-direction:column">'+right+'</div></div>';
  }
  function bigTile(it){
    return '<div>'+collage(it.imgs,'1.15/1')
      + '<div style="font-size:18px;font-weight:700;margin-top:8px;letter-spacing:-0.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(it.name||'')+'</div>'
      + (it.meta?'<div style="font-size:13px;color:#52525B;margin-top:2px">'+it.meta+'</div>':'')+'</div>';
  }
  function suggCard(s){
    var rate=(s.rating!=null)?'<div style="display:flex;align-items:center;gap:4px;font-size:12.5px;margin-top:3px">'+STAR+'<span style="color:#0A0A0A;font-weight:600">'+s.rating+'</span></div>':''; // psych-ok: live salon-card treatment (star + value)
    return '<a href="/de/salon/'+(s.slug||'')+'" style="flex:none;width:130px;text-decoration:none;color:#0A0A0A">'
      + '<div style="width:130px">'+collage(s.imgs,'1.15/1')+'</div>'
      + '<div style="font-size:14px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(s.name||'')+'</div>'+rate+'</a>';
  }
  function grid(){
    var items = TAB==='appts'?DATA.past.slice() : TAB==='saved'?DATA.favs.slice() : [];
    if(TAB!=='third'){
      items.sort(function(a,c){ if(!a.date||!c.date) return 0; return SORTDESC?(new Date(c.date)-new Date(a.date)):(new Date(a.date)-new Date(c.date)); });
      if(!items.length) return '<div style="text-align:center;padding:36px 20px"><div style="display:inline-grid;place-items:center;height:52px;width:52px;border-radius:999px;background:#F4F4F5">'+SCIS+'</div><div style="font-size:15px;font-weight:600;margin-top:12px">Noch nichts hier</div></div>'; // english-ok german-ok
      return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 6px;margin-top:12px">'+items.map(bigTile).join('')+'</div>';
    }
    return '';
  }
  function suggestions(){
    if(!DATA.sugg.length) return '';
    return '<div style="margin-top:28px"><div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-bottom:12px">Für dich</div>' // english-ok german-ok: matches the reference suggestions header
      + '<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none">'+DATA.sugg.map(suggCard).join('')+'</div></div>';
  }
  function chipRow(){
    return '<div style="display:flex;gap:9px;margin-top:12px;align-items:center">'
      + '<button data-sort style="display:grid;place-items:center;height:36px;width:40px;border:0;background:#F4F4F5;border-radius:12px;cursor:pointer">'+SORT+'</button>'
      + '<span style="background:#F4F4F5;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:#0A0A0A">Sortieren</span>' // english-ok german-ok: real sort control
      + '</div>';
  }
  function tab(id,label){ var on=TAB===id; return '<button data-ptab="'+id+'" style="border:0;background:none;font-family:inherit;cursor:pointer;padding:0 2px 9px;font-size:15px;'+(on?'font-weight:600;color:#0A0A0A;border-bottom:3px solid #0A0A0A;':'font-weight:400;color:#52525B;border-bottom:3px solid transparent;')+'">'+label+'</button>'; }
  function render(doc,root,idn){
    root.innerHTML =
      '<div style="display:flex;align-items:center;gap:8px;padding:10px 0 0">'
      + '<div style="height:26px;width:26px;border-radius:999px;background:#F4F4F5;display:grid;place-items:center;font-size:12px;font-weight:600;color:#52525B;flex:none">'+(idn.name.charAt(0)||'S')+'</div>'
      + '<div style="flex:1;display:flex;justify-content:center;gap:22px">'
      +   tab('saved','Gespeichert')+tab('appts','Termine')+tab('third','Looks') // english-ok german-ok
      + '</div>'
      + '<a href="/de/profile/settings" aria-label="settings" style="height:26px;width:26px;display:grid;place-items:center;flex:none">'+GEAR+'</a>'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:12px;margin:12px 0 0">'
      +   '<div style="flex:1;display:flex;align-items:center;gap:10px;height:48px;border:1px solid #E4E4E7;border-radius:12px;padding:0 16px">'+SEARCH+'<span style="font-size:15px;color:#A1A1AA">Suchen</span></div>' // english-ok german-ok
      +   '<a href="/de/search" aria-label="search" style="flex:none;height:26px;width:26px;display:grid;place-items:center">'+PLUS+'</a>'
      + '</div>'
      + chipRow()
      + grid()
      + suggestions();
    root.querySelectorAll('[data-ptab]').forEach(function(b){ b.onclick=function(){ TAB=b.getAttribute('data-ptab'); render(doc,root,idn); }; });
    var sb=root.querySelector('[data-sort]'); if(sb) sb.onclick=function(){ SORTDESC=!SORTDESC; render(doc,root,idn); };
  }
  function applyTo(doc){
    var root=doc.getElementById('sweep-faith'); if(root) return 1;
    var main=doc.querySelector('main.min-h-screen'); if(!main) return 0;
    var col=main.querySelector(':scope > div'); if(!col||col.getBoundingClientRect().width<200) return 0;
    main.style.background='#fff';
    var st=doc.createElement('style'); st.textContent='#sweep-faith *{transition:none !important}'; doc.head.appendChild(st);
    [].forEach.call(col.children,function(ch){ ch.style.display='none'; });
    root=doc.createElement('div'); root.id='sweep-faith'; root.setAttribute('data-sweep-done','1');
    root.style.cssText='background:#fff;max-width:560px;margin:0 auto;padding:0 12px 32px;font-family:var(--font)';
    col.appendChild(root);
    render(doc,root,readIdentity(doc));
    return 1;
  }
  var started=false;
  function startAfter(){ if(started) return; started=true; load();
    var f=document.getElementById('afterFrame'),n=0,MAX=600; // psych-ok: poll cap
    var iv=setInterval(function(){ n++; try{var d=f.contentDocument; if(d){ if(applyTo(d) && DATA.state==='ready'){ var r=d.getElementById('sweep-faith'); if(r && !r.getAttribute('data-hyd')){ r.setAttribute('data-hyd','1'); render(d,r,readIdentity(d)); } } } }catch(e){} if(n>MAX) clearInterval(iv); },300);
  }
  function show(w){
    document.getElementById('paneBefore').classList.toggle('hidden', w!=='before');
    document.getElementById('paneAfter').classList.toggle('hidden', w!=='after');
    document.getElementById('bB').classList.toggle('on', w==='before');
    document.getElementById('bA').classList.toggle('on', w==='after');
    if(w==='after') startAfter();
  }
</script>
</body>
</html>
