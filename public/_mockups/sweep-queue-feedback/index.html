<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Walk-in feedback CTA , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/queue/[token]/page.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real walk-in entry (/de/walk-in-join, closest live analog;
  in the queue tracker the low-rating "Send feedback" CTA is blue-FILLED, but blue is only for small clickable bits,
  never a big filled CTA). AFTER = the feedback CTA as the ink primary. Only the CTA treatment changes.
  Depicts: walk-in feedback CTA -> app/[locale]/queue/[token]/page.tsx
  Exists-check: `npm run exists "walk-in queue"` ran earlier , the tracker already renders.
  Backend-check: feedback submit is real; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--star:#FFC32B;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:32px 16px 40px;text-align:center}
  .h1{font-size:20px;font-weight:700;letter-spacing:-0.02em}
  .p{font-size:14px;color:var(--ink2);margin-top:8px}
  .stars{margin-top:20px;display:flex;justify-content:center;gap:8px}
  .stars svg{width:34px;height:34px;color:var(--star);fill:var(--star)}
  .stars svg.off{color:var(--hairline);fill:var(--hairline)}
  .ta{margin-top:20px;height:88px;border:1px solid var(--hairline);border-radius:16px;background:#fff}
  .cta{height:48px;border-radius:999px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;margin-top:16px}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:22px;line-height:1.5;text-align:left}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de/walk-in-join" title="live walk-in analog"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="h1">How was your visit?</div>
        <div class="p">Your feedback helps the shop improve.</div>
        <div class="stars">
          <svg viewBox="0 0 24 24" class="lucide"><path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7L12 18l-6.6 3.2L6.7 14l-5-4.8 7-.9z"/></svg>
          <svg viewBox="0 0 24 24" class="lucide"><path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7L12 18l-6.6 3.2L6.7 14l-5-4.8 7-.9z"/></svg>
          <svg viewBox="0 0 24 24" class="lucide off"><path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7L12 18l-6.6 3.2L6.7 14l-5-4.8 7-.9z"/></svg>
          <svg viewBox="0 0 24 24" class="lucide off"><path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7L12 18l-6.6 3.2L6.7 14l-5-4.8 7-.9z"/></svg>
          <svg viewBox="0 0 24 24" class="lucide off"><path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7L12 18l-6.6 3.2L6.7 14l-5-4.8 7-.9z"/></svg>
        </div>
        <div class="ta"></div>
        <div class="cta">Send feedback</div>
        <div class="cap">Change applied: the "Send feedback" button is the ink primary, not a big blue fill, blue stays a small-clickable-bits accent, never a full filled CTA.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
