<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every-state captures: real app, real components</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#E9E9EB;color:#0A0A0A;padding:32px 14px 90px}
  header{max-width:900px;margin:0 auto 26px}
  h1{font-family:'Inter Tight',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em}
  .sub{font-size:13.5px;color:#555;margin-top:8px;line-height:1.55;max-width:640px}
  h2{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.015em;max-width:900px;margin:34px auto 4px}
  .grid{display:flex;gap:18px;overflow-x:auto;padding:14px 2px 8px;max-width:900px;margin:0 auto}
  figure{flex:none;width:280px}
  figcaption{font-family:'Inter Tight',sans-serif;font-weight:600;font-size:12.5px;color:#444;margin-bottom:8px;text-align:center}
  figcaption small{display:block;font-weight:400;color:#888;font-size:11px;margin-top:1px}
  .ph{border-radius:22px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.16);background:#fff;max-height:560px;overflow-y:auto}
  .ph::-webkit-scrollbar{width:0}
  .ph img{width:100%;display:block}
</style>
</head>
<body>
<header>
  <h1>Every-state captures</h1>
  <p class="sub">Real app, real components, real session + seed data: screenshots of the running pages. "After" frames are the SAME live DOM with only the approved DS treatments patched in. Scroll inside each phone. One section per page; more pages get appended as they're captured.</p>
</header>

<h2>01 · Home</h2>
<div class="grid">
  <figure>
    <figcaption>BEFORE · as shipped<small>logged in, real data</small></figcaption>
    <div class="ph"><img src="shots/home/1-before-default.png" loading="lazy"></div>
  </figure>
  <figure>
    <figcaption>AFTER · DS treatments<small>icon details row (DS-7) · eyebrow gone · 32px rhythm (DS-5)</small></figcaption>
    <div class="ph"><img src="shots/home/2-after-ds.png" loading="lazy"></div>
  </figure>
  <figure>
    <figcaption>LOADING<small>real skeletons mid-hydration</small></figcaption>
    <div class="ph"><img src="shots/home/3-loading.png" loading="lazy"></div>
  </figure>
  <figure>
    <figcaption>LOGGED OUT<small>fresh session, no greeting</small></figcaption>
    <div class="ph"><img src="shots/home/4-logged-out.png" loading="lazy"></div>
  </figure>
</div>
</body>
</html>
