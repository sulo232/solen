<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Profile , Pinterest profile model , 3 directions</title>
<!-- Base: live iframes of the real route (stronger than a static capture; no capture img by design) -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/profile/page.tsx
  FORMAT v2, the owner's Pinterest-PROFILE correction (ref IMG_6647, PIL-measured this turn: avatar top-left,
  centered content tabs with a ~3px ink underline on the selected tab, a ~46pt rounded-full search field,
  a 2-column tile grid with ~12px gutters, management behind the top-right gear). BEFORE = the real
  /de/profile hub rendered LIVE in an iframe. Directions = the same live page with the Pinterest profile
  anatomy INJECTED into its DOM:
  content tabs (saved / appointments / third), the page's own next-appointment hero promoted to a BIGGER
  live-activity-style block on top (only when a real upcoming booking exists), and the tile grid fed by REAL
  data fetched same-origin. The three directions differ ONLY in the third tab (the Collages slot):
  D1 = Looks (the closest 1:1 concept: saved inspiration photos; the route exists as a stub today).
  D2 = Reviews (your written reviews; NO user-reviews list exists today, labeled net-new).
  D3 = Vouchers (the vouchers route exists; shows its real state).
  lang-ok german-ok english-ok: genuinely-localised mockup. The injected UI labels are the app's REAL German
  product strings (and copy lifted live from the real pages) so the injection blends seamlessly into the real
  German /de/profile page it sits inside; the mockup's own chrome (toggle, captions) is English.
  psych-ok: every name, photo, count and date is read live (DOM or same-origin API); empty tabs show true
  empty states; the search field and the reviews list are labeled net-new; nothing is invented. The star svg
  below is an empty-state ICON on the reviews tab, not a rating display, no bare average is rendered anywhere.
  Depicts: live hero -> the page's own next-appointment hero (real booking, restyled bigger)
  Depicts: appointments grid -> GET /api/bookings/user?tab=past (real bookings + salon cover photos)
  Depicts: saved grid -> /de/profile/favorites (real saved salons parsed from the live page; the flat
           inspo saved grid is the sibling surface, boards/collections stay dead per the graveyard)
  Depicts: Looks tab -> /de/profile/looks (real stub state, backend TBD)
  Depicts: reviews tab -> NET-NEW (no user-reviews surface exists today; labeled in the pane)
  Depicts: vouchers tab -> /de/profile/vouchers (real page state)
  Depicts: search field -> NET-NEW (search over saved/appointments is not built; non-functional here)
  Depicts: hub management rows -> they MOVE to settings (see sweep-settings-pinterest B2), profile = content only
  Diagnosis: profile model | measured the current hub is a row list (21px identity + hero + two grouped lists,
  sunken gray page bg) | violates the owner's 2026-07-20 Pinterest-profile correction (ref measured: content
  tabs + tile grid + gear, white bg) | target content tabs + the big live next-booking block
  on top + a 2-col grid of real content, white-first
  Exists-check: `npm run exists` ran this turn for the profile keyword and for the saved-grid keyword.
  Hub, favorites, looks, vouchers, bookings API all exist and are reused. REMOVED hits: Inspo
  boards/collections (owner 2026-06-23) stay dead, the saved tab here is a FLAT grid, no boards re-proposed.
  Backend-check: data fetched same-origin with the dev session cookie; no invented rows, no fabricated counts.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(430px,94vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .cap{position:fixed;top:52px;left:0;right:0;z-index:19;background:var(--sunken);color:var(--ink2);font-size:12px;font-weight:600;text-align:center;padding:6px 12px;line-height:1.35}
  .stage{position:fixed;top:84px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div class="top"><div class="seg">
    <button id="bv0" class="on" onclick="show('v0')">Before</button>
    <button id="bv1" onclick="show('v1')">D1 Looks</button>
    <button id="bv2" onclick="show('v2')">D2 Reviews</button>
    <button id="bv3" onclick="show('v3')">D3 Vouchers</button>
  </div></div>
  <div class="cap">The Pinterest profile model on the real page: tabs + big live next-booking block + a grid of your real bookings and saved salons. The three directions differ only in the THIRD tab. Tabs inside are tappable. Mint via the gallery if you see login.</div>
  <div class="stage">
    <div id="pv0" class="pane"><iframe id="fv0" src="/de/profile" title="real profile, before"></iframe></div>
    <div id="pv1" class="pane hidden"><iframe id="fv1" src="/de/profile" title="direction 1 injected"></iframe></div>
    <div id="pv2" class="pane hidden"><iframe id="fv2" src="/de/profile" title="direction 2 injected"></iframe></div>
    <div id="pv3" class="pane hidden"><iframe id="fv3" src="/de/profile" title="direction 3 injected"></iframe></div>
  </div>
<script>
  // ---- shared data, fetched ONCE from the parent (same origin), real seed data only ----
  var DATA={state:'idle', past:[], favs:[], looks:null, vouchers:null};
  function loadData(){
    if(DATA.state!=='idle') return; DATA.state='loading';
    Promise.all([
      fetch('/api/bookings/user?tab=past',{credentials:'include'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/de/profile/favorites',{credentials:'include'}).then(function(r){return r.ok?r.text():'';}).catch(function(){return '';}),
      fetch('/de/profile/looks',{credentials:'include'}).then(function(r){return r.ok?r.text():'';}).catch(function(){return '';}),
      fetch('/de/profile/vouchers',{credentials:'include'}).then(function(r){return r.ok?r.text():'';}).catch(function(){return '';})
    ]).then(function(res){
      var pj=res[0];
      DATA.past=(pj&&pj.bookings)?pj.bookings.slice(0,8):[];
      DATA.favs=parseFavs(res[1]);
      DATA.looks=parseEmptyCopy(res[2]);
      DATA.vouchers=parseEmptyCopy(res[3]);
      DATA.state='ready';
    }).catch(function(){ DATA.state='ready'; });
  }
  function parseFavs(html){
    try{
      var d=new DOMParser().parseFromString(html,'text/html');
      var out=[], seen={};
      [].forEach.call(d.querySelectorAll('a[href*="/salon/"]'),function(a){
        if(out.length>=8) return;
        var img=a.querySelector('img'); var h=a.querySelector('h3,h2');
        var name=h?(h.textContent||'').trim():'';
        if(!name){ name=((a.textContent||'').trim().split('\n')[0]||'').trim().slice(0,40); }
        if(name && !seen[name]){ seen[name]=1; out.push({name:name, img: img?img.getAttribute('src'):null}); }
      });
      return out;
    }catch(e){ return []; }
  }
  function parseEmptyCopy(html){
    try{
      var d=new DOMParser().parseFromString(html,'text/html');
      var h=d.querySelector('main h2, main h3'); var p=d.querySelector('main p');
      return {h:h?(h.textContent||'').trim():'', p:p?(p.textContent||'').trim():''};
    }catch(e){ return {h:'',p:''}; }
  }
  function fmtDate(iso){
    try{ var d=new Date(iso); var dd=('0'+d.getDate()).slice(-2); var mm=('0'+(d.getMonth()+1)).slice(-2); return dd+'.'+mm+'.'; }catch(e){ return ''; }
  }
  // ---- icons (real Lucide markup) ----
  function micon(d,attrs){ return '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="lucide" aria-hidden="true"'+(attrs||'')+'>'+d+'</svg>'; }
  var GEAR='<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>';
  var SEARCH='<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
  var SCISSORS=micon('<circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/>');
  var SPARK=micon('<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>');
  // psych-ok: this star svg is the EMPTY-STATE icon of the reviews tab (yellow per the semantic-color law), not a rating display; no average or bare star-rating is rendered anywhere in this mockup
  var STAR='<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#FFC32B" stroke="#FFC32B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>';
  var TICKET=micon('<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>');
  var HEARTI=micon('<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>');
  var CHEVI='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
  // ---- reads off the live page (real values only) ----
  function readIdentity(doc){
    var name=''; var el=doc.querySelector('p[class*="text-[21px]"]');
    if(el) name=(el.textContent||'').trim();
    return {name:name||'Dein Profil'}; // lang-ok german-ok english-ok: real app fallback label
  }
  function readHero(doc){
    var links=doc.querySelectorAll('a[href$="/profile/bookings"]');
    for(var i=0;i<links.length;i++){
      var a=links[i]; var h3=a.querySelector('h3'); if(!h3) continue;
      var tile=a.querySelector('div[class*="w-[52px]"]');
      var dow='',day='',mon='';
      if(tile&&tile.children.length>=3){ dow=(tile.children[0].textContent||'').trim(); day=(tile.children[1].textContent||'').trim(); mon=(tile.children[2].textContent||'').trim(); }
      var service='',time='',addr='';
      [].forEach.call(a.querySelectorAll('p'),function(p){
        var t=(p.textContent||'').trim();
        if(/\d{2}:\d{2}/.test(t)&&!time) time=t;
        else if(!service) service=t; else if(!addr) addr=t;
      });
      var price='';
      [].forEach.call(a.querySelectorAll('div,span'),function(el){
        var t=(el.textContent||'').trim();
        var m=t.length<40 && t.match(/CHF\s?[\d'.,]+/);
        if(m) price=m[0];
      });
      var pill=a.querySelector('div[class*="rounded-pill"]');
      return {salon:(h3.textContent||'').trim(), dow:dow, day:day, mon:mon, service:service, time:time, addr:addr, price:price, status:pill?(pill.textContent||'').trim():''};
    }
    return null;
  }
  // ---- builders (Pinterest anatomy, Solen tokens) ----
  var THIRD={v1:'Looks', v2:'Bewertungen', v3:'Gutscheine'}; // lang-ok german-ok english-ok: real app labels
  var TABLABEL={saved:'Gespeichert', appts:'Termine'}; // lang-ok german-ok english-ok: real app labels
  var tabPick={v1:'appts', v2:'appts', v3:'appts'};
  function tabBar(key, active, idn){
    function tab(id,label){
      var on=active===id;
      return '<button data-ptab="'+id+'" style="border:0;background:none;font-family:inherit;cursor:pointer;padding:0 2px 9px;font-size:15px;'+(on?'font-weight:600;color:#0A0A0A;border-bottom:3px solid #0A0A0A;':'font-weight:400;color:#52525B;border-bottom:3px solid transparent;')+'">'+label+'</button>';
    }
    return '<div style="display:flex;align-items:center;gap:8px;padding:10px 0 0">'
      + '<div style="height:40px;width:40px;border-radius:999px;background:#F4F4F5;display:grid;place-items:center;font-size:16px;font-weight:600;color:#52525B;flex:none">'+(idn.name.charAt(0)||'S')+'</div>'
      + '<div style="flex:1;display:flex;justify-content:center;gap:22px">'
      + tab('saved',TABLABEL.saved) + tab('appts',TABLABEL.appts) + tab('third', THIRD[key])
      + '</div>'
      + '<a href="/de/profile/settings" aria-label="settings" style="height:40px;width:40px;display:grid;place-items:center;flex:none">'+GEAR+'</a>'
      + '</div>';
  }
  function liveBlock(hero){
    if(!hero) return '';
    return '<div style="margin:16px 0 2px">'
      + '<div style="font-size:13px;font-weight:500;color:#52525B;margin-bottom:9px">Nächster Termin</div>' // lang-ok german-ok english-ok: real app label
      + '<a href="/de/profile/bookings" style="display:block;background:#fff;border:1px solid #E4E4E7;border-radius:24px;padding:18px;text-decoration:none;color:#0A0A0A;box-shadow:0 1px 2px rgba(10,10,10,.04)">'
      + '<div style="display:flex;align-items:flex-start;gap:14px">'
      + '<div style="flex:none;width:64px;border-radius:16px;background:#F4F4F5;padding:9px 0;text-align:center">'
      +   '<div style="font-size:12px;font-weight:700;color:#52525B">'+hero.dow+'</div>'
      +   '<div style="font-size:26px;font-weight:700;line-height:1.05;font-family:var(--font)">'+hero.day+'</div>'
      +   '<div style="font-size:12px;color:#52525B">'+hero.mon+'</div>'
      + '</div>'
      + '<div style="flex:1;min-width:0">'
      +   '<div style="font-size:18px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+hero.salon+'</div>'
      +   (hero.service?'<div style="font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+hero.service+'</div>':'')
      +   (hero.time?'<div style="font-size:13px;color:#52525B;margin-top:5px">'+hero.time+'</div>':'')
      + '</div>'
      + (hero.status?'<div style="flex:none;background:rgba(22,163,74,.1);color:#16A34A;font-size:12px;font-weight:600;border-radius:999px;padding:5px 11px">'+hero.status+'</div>':'')
      + '</div>'
      + '<div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid #E4E4E7;margin-top:14px;padding-top:12px">'
      +   '<div style="font-size:15px;font-weight:600">'+(hero.price?'<span style="font-size:12px;font-weight:400;color:#52525B;margin-right:6px">Gesamtpreis</span>'+hero.price:'')+'</div>' // lang-ok german-ok english-ok: real app label
      +   '<div style="display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600">Details '+CHEVI+'</div>' // lang-ok german-ok english-ok: real app label
      + '</div>'
      + '</a></div>';
  }
  function searchField(){
    // NET-NEW, non-functional: proposed search over the profile content (labeled in the manifest)
    return '<div style="display:flex;align-items:center;gap:10px;height:46px;border:1px solid #E4E4E7;border-radius:999px;padding:0 16px;margin:14px 0 4px">'+SEARCH+'<span style="font-size:15px;color:#A1A1AA">Suchen</span></div>'; // lang-ok german-ok english-ok: real app label
  }
  function tileHtml(name, img, meta, meta2, icon){
    var cover = img
      ? '<img src="'+img+'" alt="" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;display:block;background:#F4F4F5">'
      : '<div style="width:100%;aspect-ratio:4/3;border-radius:16px;background:#F4F4F5;display:grid;place-items:center">'+(icon||SCISSORS)+'</div>';
    return '<div>'+cover
      + '<div style="font-size:14px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+name+'</div>'
      + (meta?'<div style="font-size:12px;color:#52525B;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+meta+'</div>':'')
      + (meta2?'<div style="font-size:12px;color:#A1A1AA;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+meta2+'</div>':'')
      + '</div>';
  }
  function emptyBlock(icon, h, p, note){
    return '<div style="grid-column:1/-1;text-align:center;padding:38px 20px">'
      + '<div style="display:inline-grid;place-items:center;height:52px;width:52px;border-radius:999px;background:#F4F4F5">'+icon+'</div>'
      + '<div style="font-size:15px;font-weight:600;margin-top:12px">'+h+'</div>'
      + (p?'<div style="font-size:13px;color:#52525B;margin-top:5px;line-height:1.5">'+p+'</div>':'')
      + (note?'<div style="font-size:12px;color:#A1A1AA;margin-top:10px">'+note+'</div>':'')
      + '</div>';
  }
  function gridFor(key, tabId){
    var inner='';
    if(DATA.state!=='ready'){
      // loading skeleton: shape matches the final tile layout
      var sk='<div><div style="width:100%;aspect-ratio:4/3;border-radius:16px;background:#F4F4F5"></div><div style="height:12px;width:70%;border-radius:6px;background:#F4F4F5;margin-top:8px"></div></div>';
      inner=sk+sk+sk+sk;
    } else if(tabId==='appts'){
      if(!DATA.past.length){ inner=emptyBlock(SCISSORS,'Noch keine Termine','Deine vergangenen Termine erscheinen hier.',''); } // lang-ok german-ok english-ok: real app grammar
      else DATA.past.forEach(function(b){
        var s=b.salon||{}; var svc=b.service||{};
        inner+=tileHtml(s.name||'', s.cover_photo_url||null, svc.name_de||'', fmtDate(b.starts_at), SCISSORS); // lang-ok german-ok english-ok: real service name from the live DB
      });
    } else if(tabId==='saved'){
      if(!DATA.favs.length){ inner=emptyBlock(HEARTI,'Noch nichts gespeichert','Gespeicherte Salons erscheinen hier.',''); } // lang-ok german-ok english-ok: real app grammar
      else DATA.favs.forEach(function(f){ inner+=tileHtml(f.name, f.img, 'Gespeichert', '', null); }); // lang-ok german-ok english-ok: real app label
    } else {
      if(key==='v1'){
        var lh=(DATA.looks&&DATA.looks.h)||'Noch keine Looks'; var lp=(DATA.looks&&DATA.looks.p)||'Gespeicherte Inspo-Fotos erscheinen hier.'; // lang-ok german-ok english-ok: lifted from the real looks page
        inner=emptyBlock(SPARK, lh, lp, 'Looks is a stub today, the backend follows (real route: /profile/looks)');
      } else if(key==='v2'){
        inner=emptyBlock(STAR,'Deine Bewertungen','Nach jedem Termin kannst du hier bewerten.','net-new: no user-reviews list exists in the backend yet'); // lang-ok german-ok english-ok: proposed copy, labeled net-new
      } else {
        var vh=(DATA.vouchers&&DATA.vouchers.h)||'Keine Gutscheine'; var vp=(DATA.vouchers&&DATA.vouchers.p)||''; // lang-ok german-ok english-ok: lifted from the real vouchers page
        inner=emptyBlock(TICKET, vh, vp, 'real route: /profile/vouchers');
      }
    }
    return '<div data-pgrid style="display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin-top:14px;padding-bottom:28px">'+inner+'</div>';
  }
  // ---- injection ----
  function applyTo(doc, key){
    var root=doc.getElementById('sweep-pprof-root');
    // MEASURED live: the layout nests two mains (outer shell + the page's own main.min-h-screen); the outer
    // main's first div is a HIDDEN desktop breadcrumb (width 0), so anchor on the INNER page main explicitly
    if(root && root.offsetWidth===0){ root.parentNode&&root.parentNode.removeChild(root); root=null; }
    var col=null;
    if(!root){
      var main=doc.querySelector('main.min-h-screen'); if(!main) return 0;
      col=main.querySelector(':scope > div'); if(!col) return 0;
      if(!(col.textContent||'').length) return 0;
      if(col.getBoundingClientRect().width<200) return 0;
      main.style.background='#fff';
      var st=doc.getElementById('sweep-pprof-style');
      if(!st){ st=doc.createElement('style'); st.id='sweep-pprof-style'; st.textContent='#sweep-pprof-root *{transition:none !important}'; doc.head.appendChild(st); }
      [].forEach.call(col.children,function(ch){ ch.style.display='none'; });
      root=doc.createElement('div');
      root.id='sweep-pprof-root'; root.setAttribute('data-sweep-done','1');
      root.style.cssText='background:#fff;max-width:560px;margin:0 auto;padding:0 16px 24px;font-family:var(--font)';
      col.appendChild(root);
      root.addEventListener('click',function(ev){
        var b=ev.target.closest?ev.target.closest('[data-ptab]'):null;
        if(b){ ev.preventDefault(); tabPick[key]=b.getAttribute('data-ptab'); root.removeAttribute('data-render'); }
      });
    }
    var idn=readIdentity(doc); var hero=readHero(doc);
    var stamp=DATA.state+'|'+tabPick[key];
    if(root.getAttribute('data-render')===stamp) return 1;
    root.setAttribute('data-render',stamp);
    root.innerHTML = tabBar(key,tabPick[key],idn) + liveBlock(hero) + searchField() + gridFor(key,tabPick[key]);
    return 1;
  }
  var begun={};
  function beginPane(key){
    if(begun[key]) return; begun[key]=1;
    loadData();
    var f=document.getElementById('f'+key), tries=0;
    var MAX_POLLS=600; // psych-ok: a poll cap, never a displayed count
    var iv=setInterval(function(){
      tries++;
      try{ var doc=f.contentDocument; if(doc){ applyTo(doc,key); } }catch(e){}
      if(tries>MAX_POLLS){ clearInterval(iv); }
    },300);
  }
  function show(key){
    ['v0','v1','v2','v3'].forEach(function(k){
      document.getElementById('p'+k).classList.toggle('hidden', k!==key);
      document.getElementById('b'+k).classList.toggle('on', k===key);
    });
    if(key!=='v0') beginPane(key);
  }
</script>
</body>
