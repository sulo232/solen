<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Referral hero , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/profile/referral/page.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real referral page via /api/dev/login?to=/de/profile/referral
  (a gradient ink-wash hero + translucent stat cards, unlike the flat solid-white rest of profile). AFTER = the same
  hero on flat solid-white cards, matching the profile system. Only the hero treatment changes.
  Depicts: referral hero + stat cards -> app/[locale]/profile/referral/page.tsx
  Exists-check: `npm run exists "referral"` ran earlier , the page already renders.
  Backend-check: referral code is live; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--accent:#276EF1;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:24px 16px 40px}
  .h1{font-size:24px;font-weight:700;letter-spacing:-0.02em}
  .sub{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.5}
  .code{margin-top:16px;background:#fff;border:1px solid var(--hairline);border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 2px rgba(10,10,10,.04)}
  .cv{font-size:18px;font-weight:700;letter-spacing:.04em}
  .cp{font-size:13px;font-weight:600;color:var(--accent)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .stat{background:#fff;border:1px solid var(--hairline);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(10,10,10,.04)}
  .sv{font-size:22px;font-weight:700}.sl{font-size:12px;color:var(--ink3);margin-top:2px}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:22px;line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/api/dev/login?to=/de/profile/referral" title="live referral"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="h1">Invite friends, both get CHF 10</div>
        <div class="sub">Share your code. When a friend books, you each get CHF 10 off.</div>
        <div class="code"><span class="cv">SOLEN-4K2X</span><span class="cp">Copy</span></div>
        <div class="stats">
          <div class="stat"><div class="sv">3</div><div class="sl">Friends joined</div></div>
          <div class="stat"><div class="sv">CHF 30</div><div class="sl">Earned</div></div>
        </div>
        <div class="cap">Change applied: the hero and stat cards are flat solid-white (matching the rest of profile), instead of a gradient ink-wash hero with translucent cards.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
