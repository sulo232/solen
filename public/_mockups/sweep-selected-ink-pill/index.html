<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Settings language pill , selected fill , full page before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/profile/settings/SettingsForm.tsx
  FORMAT v2. BOTH panes are the real /de/profile/settings as LIVE iframes (needs the dev session ,
  open /api/dev/login?to=/de/profile/settings once if the panes show login). BEFORE = untouched: the selected
  language pill is a solid ink fill + white text. AFTER = injected: the selected pill becomes the LOCKED calm
  gray selected state (sunken fill + ink text + semibold), matching the Beauty chips one section up and every
  TabPill in the app.
  english-ok: match-labels mirror the live page's real language names.
  psych-ok: no hardcoded counts; the injection only restyles the live selected pill.
  Depicts: settings language selector -> app/[locale]/profile/settings/SettingsForm.tsx
  Diagnosis: selected language pill | measured bg rgb(10,10,10) ink fill + white text ("Deutsch") | violates the locked selected state (calm gray bg-s-bg-sunken + ink + semibold; ink fill is not one of the named exceptions) | target bg #F4F4F5 + #0A0A0A + 600
  Exists-check: `npm run exists "settings language"` ran this turn , the selector already renders.
  Backend-check: real live page + the real language options; no fabricated values.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .cap{position:fixed;top:52px;left:0;right:0;z-index:19;background:var(--sunken);color:var(--ink2);font-size:12px;font-weight:600;text-align:center;padding:6px 12px;line-height:1.35}
  .stage{position:fixed;top:84px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="cap">After: the selected language pill goes from a solid ink fill to the locked calm gray selected state (sunken + ink + semibold).</div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe id="beforeFrame" src="/de/profile/settings" title="real settings, before (ink-fill selected)"></iframe></div>
    <div id="paneAfter" class="pane hidden"><iframe id="afterFrame" src="/de/profile/settings" title="real settings, after (gray selected injected)"></iframe></div>
  </div>
<script>
  function applyChange(doc){
    var hit = 0;
    // a persistent !important stylesheet keyed on an attribute survives React re-renders
    if(!doc.getElementById('sweep-pill-style')){
      var st = doc.createElement('style');
      st.id = 'sweep-pill-style';
      st.textContent = '[data-sweep-done]{transition:none !important;background:#F4F4F5 !important;color:#0A0A0A !important;font-weight:600 !important;border:1px solid #E4E4E7 !important}';
      doc.head.appendChild(st);
    }
    [].forEach.call(doc.querySelectorAll('button'), function(b){
      if(!/^(Deutsch|English|Français|Italiano)$/.test((b.textContent||'').trim())) return;
      var cs = doc.defaultView.getComputedStyle(b);
      if(cs.backgroundColor === 'rgb(10, 10, 10)' && !b.getAttribute('data-sweep-done')){   // the ink-fill selected pill
        b.setAttribute('data-sweep-done','1');
        hit++;
      }
    });
    // bring the language section into view ONCE (re-applies must not fight the user's scrolling)
    if(hit && !doc.body.getAttribute('data-sweep-scrolled')){
      doc.body.setAttribute('data-sweep-scrolled','1');
      var done=doc.querySelector('[data-sweep-done]');
      if(done){ doc.documentElement.style.scrollBehavior='auto'; try{ done.scrollIntoView({block:'center'}); }catch(e){} }
    }
    return hit;
  }
  var afterStarted = false;
  function startAfter(){
    if(afterStarted) return; afterStarted = true;
    var f = document.getElementById('afterFrame'), tries = 0;
    var MAX_POLLS = 600; // psych-ok: a poll cap, never a displayed count. KEEPS re-applying:
    // the settings form re-renders after hydration and wipes injected inline styles, so the
    // injection re-asserts itself instead of stopping at first success.
    var iv = setInterval(function(){
      tries++;
      try{
        var doc = f.contentDocument;
        if(doc){
          applyChange(doc);
          // late re-scroll once the hydrating layout has settled (the first scroll can land off)
          if(tries === 20){
            var done = doc.querySelector('[data-sweep-done]');
            if(done){ doc.documentElement.style.scrollBehavior='auto'; try{ done.scrollIntoView({block:'center'}); }catch(e){} }
          }
        }
      }catch(e){}
      if(tries > MAX_POLLS){ clearInterval(iv); }
    }, 300);
  }
  function show(w){
    document.getElementById('paneBefore').classList.toggle('hidden', w!=='before');
    document.getElementById('paneAfter').classList.toggle('hidden', w!=='after');
    document.getElementById('bB').classList.toggle('on', w==='before');
    document.getElementById('bA').classList.toggle('on', w==='after');
    if(w==='after') startAfter();
  }
</script>
</body>
</html>
