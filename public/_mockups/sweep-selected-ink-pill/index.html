<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Selected pill , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/profile/settings/SettingsForm.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real settings page via
  /api/dev/login?to=/de/profile/settings (the selected language pill is an ink/black fill, contradicting the gray
  Beauty chips one section up on the same page). AFTER = the language pill on the locked gray-sunken selected state.
  Only the selected-pill fill changes.
  Depicts: settings language selector -> app/[locale]/profile/settings/SettingsForm.tsx
  Exists-check: `npm run exists "settings inspo pill"` ran earlier , the selector already renders.
  Backend-check: language switch is real; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:22px 16px 40px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-0.02em}
  .lbl{font-size:12.5px;font-weight:600;color:var(--ink2);margin:20px 0 8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .ch{font-size:13px;font-weight:500;padding:9px 15px;border-radius:999px;background:#fff;border:1px solid var(--hairline);color:var(--ink)}
  .ch.on{background:var(--sunken);border-color:var(--hairline);font-weight:600}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:24px;line-height:1.5;border-top:1px solid var(--hairline);padding-top:14px}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/api/dev/login?to=/de/profile/settings" title="live settings"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="h1">Settings</div>
        <div class="lbl">Beauty profile</div>
        <div class="row"><span class="ch on">Short</span><span class="ch">Medium</span><span class="ch">Long</span></div>
        <div class="lbl">Language</div>
        <div class="row"><span class="ch on">Deutsch</span><span class="ch">Français</span><span class="ch">Italiano</span><span class="ch">English</span></div>
        <div class="cap">Change applied: the selected language pill uses the locked gray-sunken selected state, matching the Beauty chips one section up on the same page, instead of a solid ink/black fill.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
