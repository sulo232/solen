<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Empty states , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: components-legacy/ui/EmptyState.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real /de/reviews (its hand-rolled empty state puts a
  sunken icon disc inside a sunken panel, so the disc disappears). AFTER = the locked registry EmptyState: a white
  disc that reads on the sunken panel, ink title, supporting line, ink action. Only the empty-state component changes.
  Depicts: reviews empty state -> app/[locale]/reviews/page.tsx (uses components-legacy/ui/EmptyState.tsx)
  Exists-check: `npm run exists "EmptyState"` ran earlier , the registry component already exists.
  Backend-check: reviews are live data; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{min-height:100%;background:var(--sunken);display:grid;place-items:center;padding:24px}
  .es{text-align:center;max-width:280px}
  .disc{height:56px;width:56px;border-radius:16px;background:#fff;border:1px solid var(--hairline);display:grid;place-items:center;margin:0 auto;box-shadow:0 1px 2px rgba(10,10,10,.05)}
  .disc svg{width:26px;height:26px;color:var(--ink)}
  .et{font-size:16px;font-weight:600;margin-top:14px}
  .em{font-size:13.5px;color:var(--ink2);margin-top:5px;line-height:1.45}
  .cta{display:inline-grid;place-items:center;height:42px;padding:0 20px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;margin-top:16px}
  .cap{font-size:11px;color:var(--ink3);margin-top:18px;line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de/reviews" title="live reviews"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="es">
          <div class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
          <div class="et">No reviews yet</div>
          <div class="em">Once guests leave a review, they'll show up here.</div>
          <div class="cta">Find a salon</div>
          <div class="cap">Change applied: the shared registry EmptyState, a white icon disc that reads on the sunken panel, instead of a hand-rolled sunken disc on a sunken panel where the disc vanishes.</div>
        </div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
