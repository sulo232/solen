<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Homepage category tile , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/_components/homepage/MobileCategoriesRow.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real /de home (the selected category tile is a bespoke
  white + ink-border + check). AFTER = the tiles with the locked gray-fill selected state, matching every other
  selected chip. Only the selected-tile treatment changes.
  Depicts: homepage category tiles -> app/[locale]/_components/homepage/MobileCategoriesRow.tsx
  Exists-check: `npm run exists "cookie consent search reviews"` ran this turn (batch) , the tiles already render.
  Backend-check: category filter is real; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:24px 16px 40px}
  .h1{font-size:24px;font-weight:700;letter-spacing:-0.02em}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .tile{aspect-ratio:1.15/1;border-radius:16px;background:#fff;border:1px solid var(--hairline);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:600}
  .tile svg{width:24px;height:24px;color:var(--ink2)}
  .tile.on{background:var(--sunken);border-color:var(--sunken)}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:22px;line-height:1.5;border-top:1px solid var(--hairline);padding-top:14px}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de" title="live home categories"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="h1">Browse by category</div>
        <div class="grid">
          <div class="tile on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="M20 20 8.5 8.5M9.5 9.5 3 3m6 6-4 4M14 14l7 7"/><circle cx="6" cy="6" r="3"/></svg>Barber</div>
          <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="M12 2a4 4 0 0 0-4 4v12a4 4 0 0 0 8 0V6a4 4 0 0 0-4-4z"/></svg>Coiffeur</div>
          <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="M9 11H5a2 2 0 0 0-2 2v7h18v-7a2 2 0 0 0-2-2h-4"/><path d="M9 11V4a3 3 0 0 1 6 0v7"/></svg>Nails</div>
          <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><circle cx="12" cy="12" r="9"/></svg>Spa</div>
          <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="M12 2v20M2 12h20"/></svg>Beauty</div>
          <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="M4 4h16v16H4z"/></svg>More</div>
        </div>
        <div class="cap">Change applied: the selected category tile uses the locked gray-fill selected state (matching every other selected chip), instead of a bespoke white tile with an ink border and a check.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
