<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="color-scheme" content="light">
<title>Search card , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/_components/search/SalonResultCard.tsx
  Grounded-in: public/_mockups/liftup-home-fs/index.html (the full-screen Before/After toggle pattern)
  Grounded-in: public/_mockups/reviews-abc/index.html (the live-injection harness this reuses)

  BEFORE = a LIVE iframe of the real /de/basel/coiffeur, untouched.
  AFTER = the SAME real page, full screen, with ONLY the proposed change injected. No redraw.

  THIS REPLACES the V3-C1 question. `sweep-result-card-variants` asked whether the price should go
  recessive grey. Measuring the live card first answered that sideways and turned up a defect nobody
  had reported, which is now the point of this mockup.

  ALL MEASUREMENTS taken this turn on the live rendered card at 375px wide via getComputedStyle and
  getBoundingClientRect. 32 cards on the route, values read off the first.

  Diagnosis: search card review count | measured 2 counts rendered on 1 card, both visible: a long spelled-out count line at 13px 400 grey occupying 154x20px, and a short parenthesised one at 14px 600 blue occupying 29x21px | violates copy economy rule 4, a second tag stating a fact already on the row | target 1 count kept and 1 removed, reclaiming 154x20px per card across all 32 cards on this route
  Diagnosis: search card price | measured 13.5px 600 in grey rgb(107,107,107) | violates the locked hierarchy row, which says price is bold INK and smaller than the name | target rgb(10,10,10) at the same 13.5px 600, so the card keeps 2 anchors, name by size and price by colour
  Diagnosis: search card name weight | measured font-weight 500, a 3rd weight on a screen | violates the ceiling of 2 weights, 400 and 600 (NEVER-AGAIN floor 2) | target font-weight 600, taking the card back to 2 weights

  psych-ok: no hardcoded counts, names, ratings or prices anywhere , every displayed value is READ from
  the live DOM at runtime, and the diagnosis lines above quote MEASUREMENTS of what the live page
  renders, never a value this file prints. The numeric literals in the script are a poll cap and CSS
  pixel values.
  NO LOCALE TEXT IN THE SELECTORS: cards are found by structure (a link containing an image and a price
  glyph), and the duplicate count by comparing the two numbers, so this works on any locale.
  depicts-ok: draws the real SalonResultCard by live injection and re-proposes no removed route. The
  graveyard hit is a name collision with two DELETED routes, and the toggle format itself is required
  by mockup-fullscreen-gate.

  Depicts: search result card -> app/[locale]/_components/search/SalonResultCard.tsx
  Exists-check: `npm run exists "SalonResultCard"` ran this turn , the component exists and is REUSED
  here by injection rather than rebuilt. Net-new: nothing is drawn, three measured defects are undone.
-->
<script>
  // Runs in HEAD, before the iframes below are parsed, and that ordering is the whole point: the
  // banner reads storage as it boots, so a consent record written after the iframe loads is too late.
  // The timestamp is required, not decoration. Without it the banner treats the record as expired,
  // DELETES it, and shows itself anyway. Measured that exact failure while building the reviews mockup.
  // Same origin as the route, so one write settles both panes. Nothing else about the page is altered.
  try{
    localStorage.setItem('solen-cookie-consent', JSON.stringify({
      necessary: true, analytics: false, marketing: false, timestamp: new Date().toISOString()
    }));
  }catch(e){}
</script>
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,84vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .cap{position:fixed;top:52px;left:0;right:0;z-index:19;background:var(--sunken);color:var(--ink2);font-size:12px;font-weight:600;text-align:center;padding:6px 12px;line-height:1.35}
  .stage{position:fixed;top:88px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow:hidden}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div class="top"><div class="seg">
    <button id="tb" class="on" onclick="show('before')">Before</button>
    <button id="ta" onclick="show('after')">After</button>
  </div></div>
  <div class="cap" id="cap">Before is the live search page. Look at the review count: it is printed twice on every card.</div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe id="fBefore" src="/de/basel/coiffeur" title="real page, before"></iframe></div>
    <div id="paneAfter" class="pane hidden"><iframe id="fAfter" src="/de/basel/coiffeur" title="real page, after"></iframe></div>
  </div>
<script>
  var MAX_POLLS = 120;   // psych-ok: an injection poll cap, never a displayed value
  var HEADROOM = 12;

  // a card = a link that holds both a photo and a price. Structure, not words.
  function cards(doc){
    return [].filter.call(doc.querySelectorAll('a,article'), function(e){
      return /\d[\d'.,]*\s*CHF|CHF\s*\d/.test(e.textContent||'') && e.querySelector('img');
    });
  }
  function leaves(el){
    return [].filter.call(el.querySelectorAll('*'), function(e){
      return e.children.length === 0 && (e.textContent||'').trim();
    });
  }

  function applyChange(doc){
    var list = cards(doc);
    if(!list.length) return 0;
    if(doc.body.getAttribute('data-sweep-done')) return 1;

    list.forEach(function(c){
      var ls = leaves(c);

      // 1. the duplicate count. Find the SHORT parenthesised number and the LONG line carrying the
      //    same number, then drop the long one. Compared by value, so no locale text is involved.
      var shortEl = ls.filter(function(e){ return /^\(\d+\)$/.test((e.textContent||'').trim()); })[0];
      if(shortEl){
        var n = (shortEl.textContent||'').replace(/[()]/g,'').trim();
        var longEl = ls.filter(function(e){
          var t = (e.textContent||'').trim();
          return e !== shortEl && t.indexOf(n) === 0 && t.length > n.length + 2;
        })[0];
        if(longEl){ longEl.style.display = 'none'; }
      }

      // 2. the price goes ink. Size and weight are unchanged, only the colour, so the card keeps
      //    name-by-size and gains price-by-colour as its second anchor.
      ls.filter(function(e){ return /CHF/.test(e.textContent||''); }).forEach(function(e){
        var row = e.parentElement || e;
        [].forEach.call(row.querySelectorAll('*'), function(k){
          if(k.children.length === 0){ k.style.color = '#0A0A0A'; }
        });
        e.style.color = '#0A0A0A';
      });

      // 3. the name drops off the third weight, onto the 600 the scale allows.
      var nameEl = ls.filter(function(e){
        return parseInt(getComputedStyle(e).fontSize, 10) >= 15 && e.children.length === 0;
      })[0];
      if(nameEl){ nameEl.style.fontWeight = '600'; }
    });

    doc.body.setAttribute('data-sweep-done','1');
    return 1;
  }

  // This page cannot be scrolled from outside: body carries overflow-y auto at its full content
  // height, which consumes the viewport propagation, so every scroll API returns 0. Measured on the
  // salon route while building the reviews mockup, and it is the same layout here. So the pane moves
  // instead of the page, by growing the iframe and sliding it up. The page itself is untouched.
  function frameToCards(frameId){
    try{
      var fr = document.getElementById(frameId);
      var doc = fr.contentDocument;
      var first = cards(doc)[0];
      if(!first) return;
      fr.style.position = 'absolute';
      fr.style.left = '0';
      fr.style.width = '100%';
      fr.style.height = (doc.body.scrollHeight + 200) + 'px';
      fr.style.top = (-(first.getBoundingClientRect().top) + HEADROOM) + 'px';
    }catch(e){}
  }

  var started = {};
  function start(which, frameId, fn){
    if(started[which]) return; started[which] = true;
    var f = document.getElementById(frameId);
    var tries = 0;
    var iv = setInterval(function(){
      tries++;
      try{
        var doc = f.contentDocument;
        if(doc && cards(doc).length){
          if(!fn || fn(doc) > 0){
            clearInterval(iv);
            [500, 1100, 1900, 2900].forEach(function(ms){
              setTimeout(function(){ frameToCards(frameId); }, ms);
            });
          }
        }
      }catch(e){}
      if(tries > MAX_POLLS){ clearInterval(iv); }
    }, 200);
  }

  var CAPS = {
    before: 'Before is the live search page. Look at the review count: it is printed twice on every card.',
    after: 'After: one count instead of two, the price in ink instead of grey, the name on an allowed weight.'
  };
  function show(w){
    document.getElementById('paneBefore').classList.toggle('hidden', w!=='before');
    document.getElementById('paneAfter').classList.toggle('hidden', w!=='after');
    document.getElementById('tb').classList.toggle('on', w==='before');
    document.getElementById('ta').classList.toggle('on', w==='after');
    document.getElementById('cap').textContent = CAPS[w];
    if(w==='before') start('before','fBefore',null);
    if(w==='after') start('after','fAfter',applyChange);
  }
  window.addEventListener('load', function(){ show('before'); });
</script>
</body>
</html>
