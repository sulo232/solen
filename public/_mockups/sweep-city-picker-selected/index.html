<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>City picker selected , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/_components/layout/DesktopCitySelector.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real /de home (the header city picker marks the current
  city by bold weight only, no fill, no check , in 3 pickers). AFTER = the city dropdown with the locked
  list-option treatment: gray sunken fill + semibold + a trailing check. Only the selected-option affordance changes.
  Depicts: city picker -> app/[locale]/_components/layout/DesktopCitySelector.tsx
  Exists-check: `npm run exists "cookie consent search reviews"` ran this turn (batch) , the picker already renders.
  Backend-check: city switch is real; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{min-height:100%;background:var(--sunken);padding:24px 16px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--hairline);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600}
  .chip svg{width:15px;height:15px;color:var(--ink3)}
  .menu{margin-top:10px;width:240px;background:#fff;border:1px solid var(--hairline);border-radius:16px;padding:6px;box-shadow:0 1px 2px rgba(10,10,10,.04),0 12px 30px -18px rgba(10,10,10,.16)}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;font-size:14px}
  .opt.on{background:var(--sunken);font-weight:600}
  .opt svg{width:16px;height:16px;color:var(--ink)}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:20px;line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de" title="live home header city picker"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="chip">Zürich <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="menu">
          <div class="opt on">Zürich <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="M20 6 9 17l-5-5"/></svg></div>
          <div class="opt">Genève</div>
          <div class="opt">Basel</div>
          <div class="opt">Bern</div>
          <div class="opt">Lausanne</div>
        </div>
        <div class="cap">Change applied: the current city gets the locked list-option treatment, gray sunken fill, semibold, and a trailing check, instead of just a heavier weight. Applies to all three city pickers.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
