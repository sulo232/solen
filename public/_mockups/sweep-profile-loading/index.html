<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Profile loading , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/profile/page.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real profile via /api/dev/login?to=/de/profile (the
  loaded page; today a single shared stale skeleton loads for 4 different profile pages, so each pops). AFTER = a
  skeleton shaped like THIS profile layout (avatar + name + activity rows), so it settles instead of popping.
  Depicts: profile loading skeleton -> app/[locale]/profile/page.tsx
  Exists-check: `npm run exists "profile loading"` ran earlier , the profile already renders.
  Backend-check: display of live profile; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:24px 16px 40px}
  .shim{background:linear-gradient(90deg,var(--sunken),#ececee,var(--sunken));background-size:200% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
  @keyframes sh{to{background-position:-200% 0}}
  .av{height:72px;width:72px;border-radius:999px}
  .nm{height:18px;width:150px;margin-top:14px}
  .sb{height:13px;width:100px;margin-top:8px}
  .card{height:64px;border-radius:16px;margin-top:20px}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:22px;line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/api/dev/login?to=/de/profile" title="live profile"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="shim av"></div>
        <div class="shim nm"></div>
        <div class="shim sb"></div>
        <div class="shim card"></div>
        <div class="shim card"></div>
        <div class="shim card"></div>
        <div class="cap">Change applied: a skeleton shaped like this profile layout (avatar + name + activity rows), so the screen settles into place, instead of one shared stale skeleton reused across four profile pages that makes each pop.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
