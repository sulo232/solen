<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Salon PDP , retail checkout CTA , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/_components/salon/SalonProducts.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real /de/salon/blade-and-stone PDP (the retail cart
  Checkout is ink, competing with the sticky ink Book bar , two ink commit CTAs on one screen). AFTER = the retail
  Checkout as a neutral outline button, leaving ONE ink commit (Book). Only the retail CTA treatment changes.
  Depicts: retail products + checkout -> app/[locale]/_components/salon/SalonProducts.tsx
  Exists-check: `npm run exists "cookie consent search reviews"` ran this turn (batch) , the section already renders.
  Backend-check: cart is real; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding-bottom:80px}
  .sec{padding:20px 16px}
  .sh{font-size:18px;font-weight:600;letter-spacing:-0.02em}
  .prod{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--hairline)}
  .prod:first-of-type{border-top:0}
  .pimg{height:52px;width:52px;border-radius:12px;background:var(--sunken);flex-shrink:0}
  .pnm{font-size:14px;font-weight:600}.ppr{font-size:12.5px;color:var(--ink2);margin-top:2px}
  .add{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink);border:1px solid var(--hairline);border-radius:999px;padding:7px 14px}
  .checkout{border:1px solid var(--ink);color:var(--ink);background:#fff;height:46px;border-radius:999px;display:grid;place-items:center;font-size:15px;font-weight:600;margin:16px}
  .bookbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--hairline);padding:12px 16px;display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto}
  .book{flex:1;height:46px;border-radius:999px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600}
  .cap{max-width:520px;margin:6px auto 0;padding:0 16px;font-size:11.5px;color:var(--ink3);line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de/salon/blade-and-stone" title="live salon PDP"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="sec">
          <div class="sh">Products</div>
          <div class="prod"><div class="pimg"></div><div><div class="pnm">Beard oil</div><div class="ppr">CHF 24</div></div><span class="add">Add</span></div>
          <div class="prod"><div class="pimg"></div><div><div class="pnm">Styling clay</div><div class="ppr">CHF 28</div></div><span class="add">Add</span></div>
        </div>
        <div class="checkout">Checkout . CHF 52</div>
        <div class="cap">Change applied: the retail Checkout is a neutral outline button, so the ONE ink commit on the screen is the Book bar below. Two competing ink CTAs become one clear primary.</div>
      </div>
      <div class="bookbar"><div class="book">Book</div></div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
