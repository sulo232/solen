<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Generated category icons</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#E9E9EC;font-family:-apple-system,system-ui,sans-serif;color:#0A0A0A;padding:24px 14px 60px}
  h1{font-size:18px;margin:0 0 4px}
  p{font-size:13px;color:#5b5b62;margin:0 0 20px;line-height:1.5}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;margin:0 auto}
  .card{background:#fff;border-radius:18px;padding:18px 12px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .card img{width:104px;height:104px;object-fit:contain}
  .card .lbl{margin-top:8px;font-size:14px;font-weight:600}
  .row-wrap{max-width:420px;margin:26px auto 0;background:#fff;border-radius:18px;padding:18px 8px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .row-wrap .t{font-size:12px;color:#6b6b72;text-align:center;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;padding:0 14px}
  .cat{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px}
  .cat img{width:44px;height:44px;object-fit:contain}
  .cat span{font-size:12px;color:#6B6B6B}
</style></head>
<body>
  <h1>Generated category icons</h1>
  <p>From your Uber strip as the style reference (Nano Banana Pro). Big view below; bottom shows them at real size in the category row.</p>

  <div class="grid">
    <div class="card"><img src="/_mockups/icons/coiffeur.png"><div class="lbl">Coiffeur</div></div>
    <div class="card"><img src="/_mockups/icons/barber.png"><div class="lbl">Barber</div></div>
    <div class="card"><img src="/_mockups/icons/nails.png"><div class="lbl">Nägel</div></div>
    <div class="card"><img src="/_mockups/icons/spa.png"><div class="lbl">Spa</div></div>
  </div>

  <div class="row-wrap">
    <div class="t">how they'd sit in the category row</div>
    <div class="row">
      <div class="cat"><img src="/_mockups/icons/coiffeur.png"><span>Coiffeur</span></div>
      <div class="cat"><img src="/_mockups/icons/barber.png"><span>Barber</span></div>
      <div class="cat"><img src="/_mockups/icons/nails.png"><span>Nägel</span></div>
      <div class="cat"><img src="/_mockups/icons/spa.png"><span>Spa</span></div>
    </div>
  </div>
</body></html>
