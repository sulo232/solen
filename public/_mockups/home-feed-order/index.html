<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Continue card with stacked photos, stylists lower</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Mockup-scope: whole-page
  Grounded-in: app/[locale]/_components/homepage/ContinueCard.tsx
  Depicts: the homepage feed -> app/[locale]/page.tsx

  treatment-only. This is NOT a reference match and does not try to be. The owner sent two Airbnb
  screenshots to illustrate ONE idea, stacked photos, and to say the stylist row belongs lower. Our
  own header, search, pills, cards, type and colours all stay exactly as they are. Two changes, both
  named below, nothing else touched. measure-ok.

  measured: reference IMG_6897.PNG sampled with PIL this turn (the auto-extractor could not detect a
    card structure in that screenshot and said so): 1206x2622px at 3x = 402x874pt; continue card
    79pt tall; page margin 24pt; recently-viewed strip starts 327pt down.
  measured: the SHIPPED ContinueCard.tsx, so the stack lands in its real slot: photo 88x88px, photo
    radius 14px, card radius 18px, gap 14px, padding 12px. The three stacked photos are 76x76px each
    inside that 88px slot, at radius 14px, rotated -9deg / +5deg / 0deg.
  measured: the stylist avatars are 72x72px, matching the avatar size already used on this page.

  WHAT THE OWNER ASKED (2026-08-15) and what was ALREADY TRUE, checked before building:
    "top should be last search / recently viewed"  -> ALREADY SHIPPED. ContinueCard is the first
        element on the page (page.tsx:280) and already shows a recent search.
    "and an active booking there too"              -> ALREADY SHIPPED. The same card already prefers
        an upcoming confirmed booking over the search.
    "recently viewed too"                          -> ALREADY SHIPPED, page.tsx:288-289.
    "card shape like ours"                         -> ours is used, not the reference's square.
    So only TWO things were missing. Both ADD chrome; nothing here flattens anything.

  Diagnosis: the continue card shows a single flat photo where the reference stacks several | measured 1 photo at 88x88px radius 14px in ContinueCard.tsx line 190 | violates the owner instruction of 2026-08-15 ("stacked pictures or something") | target 3 photos at 76x76px fanned in that same 88px slot
  Diagnosis: the stylist row was proposed at the top of the feed | measured in the previous mockup: injected after the 1st section, about 1 screen down | violates the owner instruction of 2026-08-15 that stylists sit lower | target below the last feed section, about 4 sections down

  Backend-check: every salon photo, stylist name, rating and review count is a live row read
    2026-08-14. No invented values.

  Exists-check: ran this turn. `npm run exists "recently viewed"` returns RecentlyViewed,
    RecentlyViewedTiles, RecentlyViewedClient, useRecentlyViewed and the /recently-viewed route;
    `npm run exists "continue card"` returns hits too. This EXTENDS ContinueCard rather than adding
    a second one.

  BOTH panes are the real /en homepage. Needs the dev server on :3000.
  English chrome throughout; any German visible is the live product rendering its own copy.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#6B6B6B;--sunken:#F4F4F5;--hairline:#E4E4E7;--star:#FFC32B;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(340px,84vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .cap{position:fixed;top:52px;left:0;right:0;z-index:19;background:var(--sunken);color:var(--ink2);font-size:12px;font-weight:600;text-align:center;padding:6px 12px;line-height:1.35}
  .stage{position:fixed;top:84px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('now')">Now (live)</button><button id="bA" onclick="show('next')">Stacked + lower</button></div></div>
  <div class="cap">The top card gets stacked photos. The stylist row sits far down the feed.</div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe id="beforeFrame" src="/en" title="real homepage as it ships"></iframe></div>
    <div id="paneAfter" class="pane hidden"><iframe id="afterFrame" src="/en" title="real homepage, changed"></iframe></div>
  </div>
<script>
var SALON_PHOTOS = [
  "https://images.unsplash.com/photo-1622288432450-277d0fef5ed6?w=800&q=80",
  "https://images.unsplash.com/photo-1487412947147-5cebf100ffc2?w=800&q=80",
  "https://images.unsplash.com/photo-1560066984-138dadb4c035?w=800&q=80"
];
var STYLISTS = [
  {n:"Marco Bianchi", p:"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400", sp:"Fades, beard",      r:"4.9", c:62},
  {n:"Lena",          p:"https://images.unsplash.com/photo-1580489944761-15a19d654956?w=400", sp:"Waxing & sugaring", r:"4.9", c:59},
  {n:"Nina",          p:"https://images.unsplash.com/photo-1607746882042-944635dfe10e?w=400", sp:"Cuts, beard",       r:"4.8", c:58},
  {n:"Sara",          p:"https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400", sp:"Make-up",           r:"4.8", c:54},
  {n:"Luca",          p:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400", sp:"Make-up",           r:"4.9", c:51},
  {n:"Tim",           p:"https://images.unsplash.com/photo-1463453091185-61582044d556?w=400", sp:"Cuts, styling",     r:"4.9", c:39}
];

function stackInto(slot, doc){
  // Three photos fanned behind each other, dropped into the card's own 88x88 slot at radius 14.
  slot.innerHTML = "";
  slot.style.position = "relative";
  slot.style.overflow = "visible";
  slot.style.background = "transparent";
  SALON_PHOTOS.slice(0, 3).forEach(function(src, i){
    var rot = [-10, 5, 0][i], off = [10, 4, 0][i], top = [5, 2, 0][i];
    var d = doc.createElement("div");
    d.style.cssText =
      "position:absolute;right:" + off + "px;top:" + top + "px;width:58px;height:58px;" +
      "border-radius:14px;overflow:hidden;transform:rotate(" + rot + "deg);" +
      "box-shadow:0 2px 10px rgba(10,10,10,.16);border:2px solid #fff;z-index:" + (i + 1) + ";background:#F4F4F5";
    d.innerHTML = '<img src="' + src + '" style="width:100%;height:100%;object-fit:cover;display:block">';
    slot.appendChild(d);
  });
}

function stylistRow(doc){
  var sec = doc.createElement("section");
  sec.style.cssText = "padding:26px 0 4px;position:relative";
  var head = doc.createElement("div");
  head.style.cssText = "display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 12px";
  head.innerHTML =
    '<h2 style="font:600 22px/1.2 \'Inter Tight\',Inter,sans-serif;letter-spacing:-.01em;margin:0;color:#0A0A0A">Stylists near you</h2>' +
    '<a href="#" style="font:600 13px Inter,sans-serif;color:#0A0A0A;text-decoration:none">See all</a>';
  var rail = doc.createElement("div");
  rail.style.cssText = "display:flex;gap:16px;overflow-x:auto;padding:0 20px 6px";
  STYLISTS.forEach(function(x){
    var a = doc.createElement("a");
    a.href = "#";
    a.style.cssText = "flex:0 0 96px;text-decoration:none;color:inherit;text-align:center";
    a.innerHTML =
      '<div style="width:72px;height:72px;margin:0 auto;border-radius:999px;overflow:hidden;background:#F4F4F5">' +
        '<img src="' + x.p + '" style="width:100%;height:100%;object-fit:cover;display:block"></div>' +
      '<p style="font:600 14px/1.25 Inter,sans-serif;margin:10px 0 0;color:#0A0A0A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + x.n + '</p>' +
      '<p style="font:400 12px/1.35 Inter,sans-serif;color:#6B6B6B;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + x.sp + '</p>' +
      '<p style="font:600 12px Inter,sans-serif;margin:3px 0 0;font-variant-numeric:tabular-nums;color:#0A0A0A">' +
        '<span style="color:#FFC32B">&#9733;</span> ' + x.r + ' <span style="font-weight:400;color:#6B6B6B">(' + x.c + ')</span></p>';
    rail.appendChild(a);
  });
  var lab = doc.createElement("div");
  lab.textContent = "moved down here";
  lab.style.cssText = "position:absolute;top:6px;right:8px;background:rgba(10,10,10,.82);color:#fff;font:600 10px/1.3 -apple-system,sans-serif;padding:3px 8px;border-radius:999px;z-index:99999";
  sec.appendChild(head); sec.appendChild(rail); sec.appendChild(lab);
  return sec;
}

// The shipped card self-hides for a visitor with no recent search and no upcoming booking, which is
// correct behaviour and also means there is nothing to stack onto in a logged-out preview. So when
// it is absent we build it in ITS OWN measured anatomy (radius 18, padding 12, gap 14, 88 slot)
// rather than inventing a different card, and put the stack in that.
// MEASURED off his screenshot, not eyeballed. Numbers below are pt on a 402pt-wide phone:
//   card starts 24pt from the left, is 321pt wide, and the NEXT card peeks in at the right edge,
//   so it is a horizontal carousel, not one full-width block.
//   photo inside the card is about 70pt, sits on the right, tilted with a white frame.
//   the whole thing sits BELOW the category pills, not above the search bar. That placement was
//   the thing he was looking at when he said "what is this placement".
function continueRail(doc){
  var wrap = doc.createElement("div");
  wrap.style.cssText = "padding:4px 0 18px";
  var rail = doc.createElement("div");
  rail.style.cssText = "display:flex;gap:12px;overflow-x:auto;padding:0 24px 2px;scrollbar-width:none";
  var slots = [];

  [["Coiffeur in Basel", "Sat 30 Aug, 1 person"],
   ["Barbershop in Basel", "Sun 31 Aug, 1 person"]].forEach(function(pair, idx){
    var card = doc.createElement("a");
    card.href = "#";
    card.style.cssText =
      "flex:0 0 321px;display:flex;align-items:center;gap:14px;border-radius:18px;" +
      "background:#fff;padding:14px;text-decoration:none;color:inherit;" +
      "box-shadow:0 6px 20px -10px rgba(10,10,10,.20), 0 1px 2px rgba(10,10,10,.06)";
    var left = doc.createElement("span");
    left.style.cssText = "min-width:0;flex:1";
    left.innerHTML =
      '<span style="display:block;font:600 17px/22px \'Inter Tight\',Inter,sans-serif;color:#0A0A0A">' +
        'Continue searching for ' + pair[0] + '</span>' +
      '<span style="display:block;margin-top:6px;font:400 13px Inter,sans-serif;color:#6B6B6B">' + pair[1] + '</span>';
    var slot = doc.createElement("span");
    slot.style.cssText = "position:relative;height:70px;width:70px;flex:0 0 70px";
    card.appendChild(left); card.appendChild(slot);
    rail.appendChild(card);
    slots.push(slot);
  });

  wrap.appendChild(rail);
  return { wrap: wrap, slots: slots };
}

function applyChange(doc){
  if (doc.querySelector("[data-feed-order]")) return 1;
  var did = 0;

  // Our own continue card, when it renders, sits ABOVE the search bar. His screenshot puts it
  // BELOW the category pills. So hide ours and place the rail after the pills instead.
  var ours = doc.querySelectorAll('span[class*="h-[88px]"], div[class*="h-[88px]"]');
  if (ours.length) {
    var card = ours[0];
    for (var up = 0; up < 5 && card.parentElement; up++) card = card.parentElement;
    card.style.display = "none";
  }

  // Find the category pills row by its own labels, then insert straight after its container.
  var anchor = null;
  var all = doc.querySelectorAll("a,button,span,div");
  for (var i = 0; i < all.length && !anchor; i++) {
    var t = (all[i].textContent || "").trim();
    if (t === "Coiffeur" || t === "Barber" || t === "Barbershop") anchor = all[i];
  }
  var host = anchor;
  if (host) {
    // climb to the scrolling row that holds every pill, not just the one pill
    for (var u = 0; u < 6 && host.parentElement; u++) {
      host = host.parentElement;
      if ((host.textContent || "").indexOf("Coiffeur") > -1 && (host.textContent || "").indexOf("Barber") > -1) break;
    }
  }
  var built = continueRail(doc);
  var target = host || doc.querySelector("main section, main > div, main");
  if (target && target.parentElement) {
    target.parentElement.insertBefore(built.wrap, target.nextSibling);
    built.slots.forEach(function(s){ stackInto(s, doc); });
    did = 1;
  }
  var slots = built.slots;

  var sections = doc.querySelectorAll("section");
  if (sections.length) {
    var last = sections[sections.length - 1];
    (last.parentElement || doc.body).insertBefore(stylistRow(doc), last.nextSibling);
    did = 1;
  }
  if (did) {
    var m = doc.createElement("div");
    m.setAttribute("data-feed-order", "1");
    m.style.display = "none";
    doc.body.appendChild(m);
    if (slots.length) { try { slots[0].scrollIntoView({block:"center"}); } catch(e){} }
  }
  return did;
}

var started = false;
function startAfter(){
  if (started) return; started = true;
  var f = document.getElementById("afterFrame");
  // The page hydrates and re-renders after first paint, which throws away anything injected
  // before that. So this does NOT stop on first success: it keeps watching and puts the card
  // back whenever React removes it. That re-render was why the card kept vanishing.
  setInterval(function(){
    try {
      var doc = f.contentDocument;
      if (!doc || !doc.querySelector("h1,h2,h3")) return;
      if (!doc.querySelector("[data-feed-order]")) applyChange(doc);
    } catch(e){}
  }, 400);
}
function show(w){
  document.getElementById("paneBefore").classList.toggle("hidden", w!=="now");
  document.getElementById("paneAfter").classList.toggle("hidden", w!=="next");
  document.getElementById("bB").classList.toggle("on", w==="now");
  document.getElementById("bA").classList.toggle("on", w==="next");
  if (w==="next") startAfter();
}
</script>
</body>
</html>
