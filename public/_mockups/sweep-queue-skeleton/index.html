<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Walk-in tracker loading , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/queue/[token]/page.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real walk-in entry (/de/walk-in-join, closest live analog;
  the live queue tracker loads behind a bare spinner then hard-swaps). AFTER = a Skeleton shaped like the tracker
  (position disc + status line + wait bar + barber row), so the screen the customer watches settles. Only loading changes.
  Depicts: walk-in tracker loading -> app/[locale]/queue/[token]/page.tsx
  Exists-check: `npm run exists "walk-in queue"` ran earlier , the tracker already renders.
  Backend-check: display of live queue; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:40px 16px;display:flex;flex-direction:column;align-items:center}
  .shim{background:linear-gradient(90deg,var(--sunken),#ececee,var(--sunken));background-size:200% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
  @keyframes sh{to{background-position:-200% 0}}
  .disc{height:84px;width:84px;border-radius:999px}
  .status{height:18px;width:60%;margin-top:24px}
  .wait{height:14px;width:44%;margin-top:14px}
  .barber{height:60px;width:100%;border-radius:16px;margin-top:28px}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:28px;line-height:1.5;text-align:left;align-self:stretch}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de/walk-in-join" title="live walk-in analog"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="shim disc"></div>
        <div class="shim status"></div>
        <div class="shim wait"></div>
        <div class="shim barber"></div>
        <div class="cap">Change applied: the live wait-tracker loads behind a Skeleton shaped like the tracker (position disc + status line + wait bar + barber row), so the screen the customer watches settles, instead of a bare spinner that hard-swaps.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
