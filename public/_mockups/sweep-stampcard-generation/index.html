<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Stamp card generation , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: components-legacy/loyalty/StampCard.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real rewards page via /api/dev/login?to=/de/rewards
  (the per-salon stamp card runs a generation behind RewardsView: a tracked all-caps label, an off-token shadow,
  an off-scale radius). AFTER = the same card on the current system: normal-case label, shadow-elevation, rounded-16.
  Depicts: per-salon stamp card -> components-legacy/loyalty/StampCard.tsx
  Exists-check: `npm run exists "stamp card loyalty"` ran earlier , the card already renders.
  Backend-check: stamps are live data; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:22px 16px 40px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-0.02em}
  .card{margin-top:14px;background:#fff;border:1px solid var(--hairline);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(10,10,10,.04),0 8px 24px -16px rgba(10,10,10,.12)}
  .lab{font-size:13px;font-weight:600}.sub{font-size:12px;color:var(--ink3);margin-top:3px}
  .stamps{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
  .st{height:24px;width:24px;border-radius:999px;border:1.5px solid var(--hairline)}
  .st.on{background:var(--ink);border-color:var(--ink)}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:22px;line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/api/dev/login?to=/de/rewards" title="live rewards"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="h1">Stamp cards</div>
        <div class="card">
          <div class="lab">Blade &amp; Stone</div>
          <div class="sub">3 of 10, 7 more to a free cut</div>
          <div class="stamps"><span class="st on"></span><span class="st on"></span><span class="st on"></span><span class="st"></span><span class="st"></span><span class="st"></span><span class="st"></span><span class="st"></span><span class="st"></span><span class="st"></span></div>
        </div>
        <div class="cap">Change applied: the per-salon stamp card moves onto the current system, normal-case label, shadow-elevation, rounded-16, matching RewardsView, instead of a tracked all-caps label with an off-token shadow and an off-scale radius.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
