<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Salon PDP , Team wrapper , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/_components/salon/SalonTeam.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real /de/salon/blade-and-stone PDP (the Team carousel
  sits in a rounded-3xl + heavy shadow-float wrapper, a third section grammar). AFTER = the Team section in the
  same flat/hairline rhythm as the rest of the PDP. Staff tiles unchanged; only the Team section wrapper changes.
  Depicts: salon Team section -> app/[locale]/_components/salon/SalonTeam.tsx
  Exists-check: `npm run exists "SalonTeam"` ran this turn , the PDP already renders the Team carousel.
  Backend-check: display of live staff data; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:0 0 40px}
  .sec{padding:20px 16px;border-top:1px solid var(--hairline)}
  .sec:first-child{border-top:0}
  .sh{font-size:18px;font-weight:600;letter-spacing:-0.02em}
  .team{display:flex;gap:16px;margin-top:14px;overflow-x:auto}
  .mem{width:96px;flex-shrink:0;text-align:center}
  .av{height:72px;width:72px;border-radius:999px;background:var(--sunken);margin:0 auto}
  .mn{font-size:13px;font-weight:600;margin-top:8px}
  .mr{font-size:11.5px;color:var(--ink3)}
  .cap{max-width:520px;margin:8px auto 0;padding:0 16px;font-size:11.5px;color:var(--ink3);line-height:1.5}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de/salon/blade-and-stone" title="live salon PDP"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="sec"><div class="sh">Services</div><div class="cap" style="margin:8px 0 0;padding:0">(flat section)</div></div>
        <div class="sec">
          <div class="sh">Team</div>
          <div class="team">
            <div class="mem"><div class="av"></div><div class="mn">Marco</div><div class="mr">Cuts</div></div>
            <div class="mem"><div class="av"></div><div class="mn">Luca</div><div class="mr">Fades</div></div>
            <div class="mem"><div class="av"></div><div class="mn">Sami</div><div class="mr">Beard</div></div>
          </div>
        </div>
        <div class="sec"><div class="sh">Reviews</div><div class="cap" style="margin:8px 0 0;padding:0">(flat section)</div></div>
        <div class="cap">Change applied: the Team section now sits flat with a hairline, matching Services and Reviews above and below it, instead of a big rounded-3xl card with a heavy float shadow. The staff tiles are unchanged.</div>
      </div>
    </div>
  </div>
<script>
  function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}
</script>
</body>
</html>
