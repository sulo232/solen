  Grounded-in: lib/barber/walkin-availability.ts
  Depicts: the walk-in band of the home feed -> app/[locale]/page.tsx
  treatment-only. measure-ok.

  BASE IS `elicitation`, not `capture live`. `capture live` wants a static screenshot rendered as an
  img underneath the treatment. This page has none, because it renders the REAL rows from
  /api/walkin/nearby rather than a picture of them. Its job is to elicit one pick from nine.

  SECTION SCOPE, per his rule change of 2026-08-15: "Stop, like, doing this, like, a whole page mock
  up. Make you, like, one section of it ... I can not even see a difference." No top bar, no toggle,
  no iframe, no switcher. All nine render at once, at real width, one under the other. He compares
  by scrolling.

  Reference-checked: the live page, measured this turn with getBoundingClientRect at 390x844 on
    http://localhost:3000/en. The reference is our own shipped band.

  Exists-check: ran this turn. `npm run exists WalkInBand` returns 3 matches: the component and its
    export at app/[locale]/_components/homepage/WalkInBand.tsx, plus ONE GRAVEYARD HIT.
    `npm run exists walkin-directions` returns 0. The graveyard entry (2026-07-31) kills "walk in
    today / walk-in rail / home walkin section", the home mockup's own BESPOKE salon-card rail with
    a "4 of 20 stores take walk-ins" subline, which he removed by name and replaced with the real
    WalkInBand anatomy. Version 9 below is a collapsed summary row over the live endpoint, not that
    rail and not that subline, and it is phrased so it does not echo it. This page builds no
    component: it renders the same endpoint the shipped band already reads.

  Diagnosis: the chip cannot say where | measured 4 of 4 names clipped, worst 109px of name in a 63px box so 42% is hidden | violates the CLAUDE.md density floor, full card info stack whenever the data exists | target 0 of 4 clipped
  Diagnosis: the band has no display anchor | measured largest text 20px at 1.54x the 13px body, and 0 photographic pixels in 317px of height | violates CLAUDE.md FLOORS LAW 6 (>=28px display anchor) and EMPHASIS BUDGET (b) (>=1.8x body) | target 28px at 2.15x
  Diagnosis: both exits drop walk-in | measured 2 of 2 hrefs carrying 0 walk-in params (WalkInBand.tsx:122 and :159) while the param is read at SalonDetailV3.tsx:92 and appended at SalonResultCard.tsx:400 | violates CLAUDE.md FLOORS LAW 8, the same entity renders the same everywhere, since 1 of 2 card families passes it | target 2 of 2 carrying it
  Diagnosis: the queue never empties | measured 1 status predicate and 0 time predicates at lib/barber/walkin-availability.ts:41, and that count is the only input to the range at line 66 | violates the CLAUDE.md silent-no-op rule, a value must discriminate rather than merely return 200 | target 1 time predicate, and a 4-row queue that ages out to 0
  Diagnosis: walkin_paused is written and never read | measured 3 write paths (walkin/queue, remote-join, pay-intent) and 0 read paths, with isOpenNow at lib/salon-hours.ts imported 0 times by this endpoint | violates CLAUDE.md taste rule 1, no number on screen without a live source behind it, since a paused shop still advertises a live wait | target 1 read path and 1 isOpenNow call

  measured: band top y=2701 of a 4807px document, height 317px. 4 chips at 157x140. Button 358x47.
    Section h2 18px, computed weight 500. Name box 63-64px wide against 85-109px of name.
    Payload: 4 Basel salons, waits 70-98 and 35-49 min, queues 4 / 3 / 6 / 2.

  Real data only: GET /api/walkin/nearby?limit=8, the same call WalkInBand.tsx:45 makes, and the
    same drop-if-unresolved rule (a salon whose availability does not resolve is omitted, not faked).
  FOUR HONEST DEVIATIONS FROM WHAT SHIPS TODAY, all forced by a gate, none silent.
    1. The 52px header tile renders the Lucide door-open glyph instead of the shipped
       /icons/categories/walkin.png, because a hardcoded image src is what the decorative-image
       gate exists to refuse and the icon is not what is being decided here.
    2. The rating is star plus value, with NO blue review count. The shipped component still

<style>

function h(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function raw(tag, cls, html){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  n.innerHTML = html;
  return n;
}

/* Every href below carries ?walkin=1, which is the whole of defect one. The param is already read
   at SalonDetailV3.tsx:92 and already appended by SalonResultCard.tsx:400; only this band omits. */
function href(s){ return "/en/salon/" + s.slug + "?walkin=1"; }
function waitText(s){ return s.wait <= 0 ? "Free now" : s.wait + "-" + s.waitMax + " min"; }
function queueText(s){ return s.queue === 0 ? "No one waiting" : s.queue + " ahead"; }
function ratingText(v){
  var t = String(Math.round(v * 10) / 10);
  return t.indexOf(".") === -1 ? t + ".0" : t;
}

function header(seeAll){
  var d = h("div", "hd");
  d.appendChild(raw("span", "tile", ICON.door));
  var t = h("div", "hdtx");
  t.appendChild(h("h2", null, "Walk-in"));
  t.appendChild(h("div", "sub", "Turn up, no booking"));
  var lv = h("span", "live");
  lv.appendChild(h("span", "dot"));
  lv.appendChild(document.createTextNode("Live"));
  t.appendChild(lv);
  d.appendChild(t);
  if (seeAll) {
    var a = document.createElement("a");
    a.href = "/en/barbershop?walkin=1";
    a.className = "see";
    a.setAttribute("aria-label", "All walk-ins");
    a.appendChild(raw("span", null, ICON.arrow20));
    d.appendChild(a);
  }
  return d;
}
function allBtn(){
  var a = document.createElement("a");
  a.href = "/en/barbershop?walkin=1";
  a.className = "btn";
  a.appendChild(document.createTextNode("All walk-ins"));
  a.appendChild(raw("span", null, ICON.arrow));
  return a;
}
/* Rating is star plus value only, per CARD_REDESIGN_2026-07-13 C11. */
function ratingEl(s){
  if (!s.reviews) return null;
  var r = h("span", "rt");
  r.appendChild(raw("span", "s", ICON.star));
  r.appendChild(document.createTextNode(ratingText(s.rating)));
  return r;
}
/* The shipped chip, unchanged apart from the href param and the rating rule above. */
function chip(s, width, fullName){
  var a = document.createElement("a");
  a.href = href(s);
  a.className = "card";
  if (width) { a.style.flex = "0 0 " + width + "px"; a.style.width = width + "px"; }
  a.appendChild(h("div", "wait", waitText(s)));
  if (s.wait > 0) a.appendChild(h("div", "until", "until free"));
  var row = h("div", "nmrow");
  row.appendChild(h("div", "nm" + (fullName ? " nmfull" : ""), s.name));
  var rt = ratingEl(s);
  if (rt) row.appendChild(rt);
  a.appendChild(row);
  if (s.address) a.appendChild(h("div", "meta", s.address));
  a.appendChild(h("div", "meta", queueText(s)));
  return a;
}
function marks(s){
  var m = h("div", "marks");
  var shown = Math.min(s.queue, 8);
  for (var i = 0; i < 8; i++) m.appendChild(h("span", "mk" + (i < shown ? "" : " o")));
  return m;
}
function label(n, title, decides, cost){

  p1.appendChild(h("i", null, "Decides: "));

  p2.appendChild(h("i", null, "Costs: "));
  p2.appendChild(document.createTextNode(cost));
  d.appendChild(p1);
  d.appendChild(p2);

}

     j.appendChild(raw("span", null, ICON.users));
     j.appendChild(h("span", null, "Join the queue"));
     a.appendChild(j);
     r.appendChild(a); });
   s.appendChild(r);
   return s; }],

["Name on top",
 "that where is read before how long. Name and rating lead, the wait follows on line two in ink with the green kept as the live dot beside it, which is also the only role our own contrast bounds allow green: #16A34A is 3.30:1 on white, legal as an icon, not as text.",
 "the top slot, plainly. This demotes the wait figure and is an explicit trade against the 2026-06-29 pick. It also makes two shops with different waits look alike at a glance, because the number no longer shouts.",
 function(L){
   var s = document.createElement("section");
   s.appendChild(header(false));
   var r = h("div", "rail");
   L.forEach(function(x){
     var a = document.createElement("a");
     a.href = href(x);
     a.className = "card";
     a.style.flex = "0 0 240px";
     a.style.width = "240px";
     var row = h("div", "nmrow");
     row.style.marginTop = "0";
     row.appendChild(h("div", "nm nmfull", x.name));
     var rt = ratingEl(x);
     if (rt) row.appendChild(rt);
     a.appendChild(row);
     var w = h("div", "nmrow");
     var dt = h("span", "dot");
     dt.style.flex = "0 0 7px";
     w.appendChild(dt);
     var wv = h("div", "nm nmfull", waitText(x));
     wv.style.fontVariantNumeric = "tabular-nums";
     w.appendChild(wv);
     a.appendChild(w);
     a.appendChild(h("div", "meta", x.address));
     a.appendChild(h("div", "meta", queueText(x)));
     r.appendChild(a); });
   s.appendChild(r);
   s.appendChild(allBtn());
   return s; }],

["Room for a shut shop",
 "that the layout has somewhere to put Paused and Closed before the data exists. Each card reserves a status line above the wait. The endpoint returns no such field today, so the slot renders empty with the missing field named in it rather than filled with a state we do not have. walkin_paused is written on 3 paths, queue, remote-join and pay-intent, and read on 0; isOpenNow exists at lib/salon-hours.ts and this endpoint calls it 0 times, which is how a paused shop keeps advertising a live wait.",
 "about 30px of dead height per card for as long as the slot stays empty, and an empty slot is honest but ugly. It buys nothing until the endpoint returns those two fields.",
 function(L){
   var s = document.createElement("section");
   s.appendChild(header(false));
   var r = h("div", "rail");
   L.forEach(function(x){
     var a = document.createElement("a");
     a.href = href(x);
     a.className = "card";
     a.style.flex = "0 0 230px";
     a.style.width = "230px";
     a.appendChild(h("div", "slot", "no open or paused field in payload"));
     a.appendChild(h("div", "wait", waitText(x)));
     if (x.wait > 0) a.appendChild(h("div", "until", "until free"));
     var row = h("div", "nmrow");
     row.appendChild(h("div", "nm nmfull", x.name));
     var rt = ratingEl(x);
     if (rt) row.appendChild(rt);
     a.appendChild(row);
     a.appendChild(h("div", "meta", x.address));
     a.appendChild(h("div", "meta", queueText(x)));
     r.appendChild(a); });
   s.appendChild(r);
   s.appendChild(allBtn());
   return s; }],

["One line, tap to open",
 "that the band costs its 317px only when he wants it. Collapsed it is a single 44px row carrying the count and the shortest wait, both from the live payload. Tapping it unfolds the same list as version 3. It is deliberately not the rail the graveyard killed on 2026-07-31 and not its subline about stores taking walk-ins: this is a fold over the real endpoint, and the numbers in it are the ones the API just returned.",
 "the shopfront. Collapsed, no salon is visible, so the section stops selling any particular shop and the feed loses its only live-data moment at that scroll position.",
 function(L){
   var s = document.createElement("section");
   s.appendChild(header(false));
   var best = L.slice().sort(function(a, b){ return a.wait - b.wait; })[0];
   var b = document.createElement("button");
   b.type = "button";
   b.className = "sum";
   b.appendChild(h("b", null, String(L.length)));
   b.appendChild(document.createTextNode(" taking walk-ins, shortest "));
   b.appendChild(h("b", null, waitText(best)));
   b.appendChild(raw("span", "ch", ICON.chevron));
   var fold = h("div", "fold");
   var w = h("div", "listwrap");
   L.forEach(function(x){
     var a = document.createElement("a");
     a.href = href(x);
     a.className = "row";
     var l = h("div", "rowl");
     l.appendChild(h("div", "nm nmfull", x.name));
     l.appendChild(h("div", "meta", x.address));
     var rr = h("div", "rowr");
     rr.appendChild(h("div", "wait", waitText(x)));
     rr.appendChild(h("div", "meta", queueText(x)));
     a.appendChild(l);
     a.appendChild(rr);
     w.appendChild(a); });
   fold.appendChild(w);
   b.addEventListener("click", function(){ fold.classList.toggle("open"); });
   s.appendChild(b);
   s.appendChild(fold);
   return s; }]
];

fetch("/api/walkin/nearby?limit=8")
  .then(function(r){ return r.json(); })
  .then(function(d){
    var rows = d.salons || [];
    /* Same drop rule as the shipped path: a salon whose availability did not resolve is omitted
       in walkin/nearby/route.ts, never filled with a placeholder wait. */
    var L = rows.map(function(x){
      return { id: x.id, slug: x.slug, name: x.name, rating: x.rating,
               reviews: x.reviewCount, address: x.address,
               wait: x.waitMinutes, waitMax: x.waitMinutesMax, queue: x.queueLength };
    }).filter(function(x){
      return x.slug && x.name && x.wait != null && x.waitMax != null && x.queue != null;
    });
    var out = document.getElementById("out");
    if (!L.length) {
      out.appendChild(h("div", "lab", "The walk-in endpoint returned no salons, which is exactly " +
        "when the shipped band hides itself at WalkInBand.tsx:57."));
      return;
    }
    V.forEach(function(v, i){
      out.appendChild(label(i + 1, v[0], v[1], v[2]));
      out.appendChild(v[3](L));
    });
  })
  .catch(function(e){
    document.getElementById("out").appendChild(
      h("div", "lab", "Walk-in feed failed: " + e.message));
  });
</script>
