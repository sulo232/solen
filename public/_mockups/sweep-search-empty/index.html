<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Search empty state , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/_components/search/ (SearchTemplate empty/no-results state)
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real /de/search (a no-results query shows the empty
  chip as a full circle). AFTER = the empty state using the shared registry rounded-square icon chip (matching
  EmptyState / ErrorState), not a bespoke full circle. Only the empty-chip shape changes.
  Depicts: search empty state -> app/[locale]/_components/search/SearchTemplate
  Exists-check: `npm run exists "cookie consent search reviews"` ran this turn (batch) , search already renders.
  Backend-check: real search query; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{min-height:100%;background:#fff;padding:16px}
  .sbar{height:48px;border:1px solid var(--hairline);border-radius:999px;display:flex;align-items:center;padding:0 16px;font-size:14px;color:var(--ink2);gap:8px}
  .sbar svg{width:16px;height:16px;color:var(--ink3)}
  .empty{margin-top:64px;text-align:center}
  .chip{height:64px;width:64px;border-radius:18px;background:var(--sunken);display:grid;place-items:center;margin:0 auto}
  .chip svg{width:30px;height:30px;color:var(--ink3)}
  .et{font-size:16px;font-weight:600;margin-top:16px}
  .em{font-size:13.5px;color:var(--ink2);margin-top:5px;line-height:1.5;max-width:280px;margin-left:auto;margin-right:auto}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:20px;text-align:center}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/de/search?q=zzznoresults" title="live search empty"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="sbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>zzznoresults</div>
        <div class="empty">
          <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
          <div class="et">No results</div>
          <div class="em">Try another salon name, service, or city.</div>
        </div>
        <div class="cap">Change applied: the empty-state icon chip is the shared rounded-square (matching the EmptyState / ErrorState primitives), not a bespoke full circle.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
