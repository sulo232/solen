<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walk-in Live Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .lucide{stroke-width:1.9;flex-shrink:0}
  :root{--ink:#0A0A0A;--ink-2:#6B6B6B;--ink-3:#9B9B9B;--border:#E7E7EA;--bg:#FFFFFF;--sunken:#F4F4F5;
    --blue:#276EF1;--blue-bg:#EAF1FE;--green:#16A34A;--star:#FFC32B;--r-pill:9999px;--ease:cubic-bezier(.16,1,.3,1);
    --shadow:0 8px 26px -16px rgba(10,10,10,.16);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:'Inter',sans-serif;background:#E9E9EC;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0 80px;}
  .frame{width:390px;background:var(--bg);position:relative;overflow:hidden;}
  .num{font-family:'Inter Tight',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .mono{font-family:'JetBrains Mono',monospace;font-weight:600;font-variant-numeric:tabular-nums;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}

  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:15px;font-weight:600;}
  .sig{display:flex;gap:5px;align-items:center;}
  .frost{width:40px;height:40px;border-radius:var(--r-pill);background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 2px 8px rgba(10,10,10,.12);cursor:pointer;}

  /* salon photo header (warm top) */
  .hero{position:relative;height:150px;overflow:hidden;}
  .hero img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32),transparent 46%,rgba(0,0,0,.34));}
  .hero-name{position:absolute;left:18px;bottom:13px;color:#fff;}
  .hero-name .n{font-family:'Inter Tight';font-weight:700;font-size:18px;letter-spacing:-.015em;}
  .hero-name .m{display:flex;align-items:center;gap:6px;font-size:12.5px;opacity:.92;margin-top:2px;}

  .body{padding:20px 20px 0;}
  /* headline = the ETA (time), the step label carries the stage — no duplication */
  .live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);}
  .pulse{width:8px;height:8px;border-radius:var(--r-pill);background:var(--green);position:relative;}
  .pulse::after{content:"";position:absolute;inset:0;border-radius:var(--r-pill);background:var(--green);animation:pl 2s var(--ease) infinite;}
  @keyframes pl{0%{transform:scale(1);opacity:.5;}70%{transform:scale(3.4);opacity:0;}100%{opacity:0;}}
  .headline{font-family:'Inter Tight';font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.05;margin-top:8px;}
  .subline{font-size:14px;color:var(--ink-2);margin-top:5px;}
  .subline b{color:var(--ink);font-weight:600;}

  /* step tracker — the ONE progress indicator */
  .steps{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding:0 6px;margin-top:24px;}
  .steps::before{content:"";position:absolute;top:21px;left:28px;right:28px;height:3px;background:var(--border);border-radius:var(--r-pill);}
  .steps .fill{position:absolute;top:21px;left:28px;height:3px;background:var(--blue);border-radius:var(--r-pill);width:0;animation:sgrow 1s var(--ease) both .35s;}
  @keyframes sgrow{to{width:calc((100% - 56px) * .66);}}
  .step{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;width:64px;}
  .step .c{width:42px;height:42px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;}
  .step.future .c{background:var(--sunken);color:var(--ink-3);}
  .step.current .c{box-shadow:0 0 0 5px var(--blue-bg);}
  .step .l{font-size:10.5px;font-weight:600;color:var(--ink-3);text-align:center;line-height:1.2;}
  .step.done .l,.step.current .l{color:var(--ink);}

  /* cards */
  .card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-top:16px;}
  .crow{display:flex;align-items:center;gap:13px;}
  .crow img{width:48px;height:48px;border-radius:var(--r-pill);object-fit:cover;flex-shrink:0;}
  .crow .nm{font-family:'Inter Tight';font-weight:700;font-size:15.5px;}
  .crow .mt{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3);margin-top:2px;}
  .cedit{margin-left:auto;width:36px;height:36px;border-radius:var(--r-pill);background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;flex-shrink:0;}
  .csub{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .csub img{width:44px;height:44px;border-radius:11px;object-fit:cover;}
  .csub .nm2{font-family:'Inter Tight';font-weight:600;font-size:14.5px;}
  .csub .mt2{font-size:12.5px;color:var(--ink-3);margin-top:2px;}
  .csub .pr{margin-left:auto;font-family:'Inter Tight';font-weight:700;font-size:15px;}
  /* hair chips inside the "Deine Haare" card */
  .hchips{display:flex;flex-wrap:wrap;gap:7px;}
  .hchip{height:30px;padding:0 12px;border-radius:var(--r-pill);background:var(--sunken);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;}

  .actions{display:flex;gap:10px;padding:18px 20px 24px;}
  .btn-blue{flex:1;background:var(--blue);color:#fff;border:none;border-radius:var(--r-pill);padding:14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;}
  .btn-out{flex:0 0 auto;width:54px;background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:var(--r-pill);padding:14px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>

<div class="frame">
  <div class="hero">
    <img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=820&q=80" referrerpolicy="no-referrer">
    <div class="hero-grad"></div>
    <div class="statusbar" style="position:relative;color:#fff"><span>9:41</span><span class="sig"><i data-lucide="signal" style="width:16px;height:16px"></i><i data-lucide="wifi" style="width:16px;height:16px"></i><i data-lucide="battery-full" style="width:20px;height:16px"></i></span></div>
    <div style="position:absolute;top:48px;left:14px;right:14px;display:flex;justify-content:space-between"><span class="frost"><i data-lucide="chevron-left" style="width:20px;height:20px"></i></span><span class="frost" style="width:auto;padding:0 16px;font-size:13.5px;font-weight:600">Hilfe</span></div>
    <div class="hero-name"><div class="n">Studio Eleven Barber</div><div class="m"><i data-lucide="map-pin" style="width:13px;height:13px"></i>Steinenvorstadt 28, Basel</div></div>
  </div>

  <div class="body">
    <span class="live"><span class="pulse"></span>Live</span>
    <div class="headline">Noch 10–15 Min</div>
    <div class="subline"><b>3</b> vor dir · Ticket <span class="mono" style="color:var(--ink)">W-047</span></div>

    <!-- the ONE progress indicator: icon step tracker -->
    <div class="steps">
      <div class="fill"></div>
      <div class="step done"><span class="c"><i data-lucide="check" style="width:19px;height:19px;stroke-width:2.6"></i></span><span class="l">Bezahlt</span></div>
      <div class="step done"><span class="c"><i data-lucide="users" style="width:18px;height:18px"></i></span><span class="l">In der Schlange</span></div>
      <div class="step current"><span class="c"><i data-lucide="clock" style="width:18px;height:18px"></i></span><span class="l">Fast dran</span></div>
      <div class="step future"><span class="c"><i data-lucide="armchair" style="width:18px;height:18px"></i></span><span class="l">Dran</span></div>
    </div>

    <!-- Dein Termin: barber + service + edit -->
    <div class="card">
      <div class="crow">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=140&q=80" referrerpolicy="no-referrer">
        <div><div class="nm">Marco B.</div><div class="mt"><i data-lucide="star" style="width:13px;height:13px;color:#FFC32B;fill:#FFC32B"></i><span class="num" style="font-size:12.5px;color:var(--ink)">4.8</span> Dein Barber</div></div>
        <span class="cedit"><i data-lucide="pencil" style="width:16px;height:16px"></i></span>
      </div>
      <div class="csub">
        <img src="https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=120&q=80" referrerpolicy="no-referrer">
        <div><div class="nm2">Herrenschnitt &amp; Bart</div><div class="mt2">45 Min</div></div>
        <span class="pr">CHF 45</span>
      </div>
    </div>

    <!-- Deine Haare: the saved hair-profile info (replaces "text barber") + edit -->
    <div class="card">
      <div class="crow" style="margin-bottom:13px">
        <span style="width:36px;height:36px;border-radius:var(--r-pill);background:var(--sunken);display:flex;align-items:center;justify-content:center"><span style="width:19px;height:19px;background:var(--ink);-webkit-mask:url(/hair-patterns/wavy.png) center/contain no-repeat;mask:url(/hair-patterns/wavy.png) center/contain no-repeat"></span></span>
        <div class="nm" style="font-size:15px">Deine Haare</div>
        <span class="cedit"><i data-lucide="pencil" style="width:16px;height:16px"></i></span>
      </div>
      <div class="hchips">
        <span class="hchip">Wellig</span><span class="hchip">Mittel</span><span class="hchip">Allergie: Ammoniak</span>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-blue"><i data-lucide="navigation" style="width:16px;height:16px"></i>Wegbeschreibung</button>
    <button class="btn-out"><i data-lucide="share" style="width:18px;height:18px"></i></button>
  </div>
</div>

<script>window.addEventListener('DOMContentLoaded',()=>lucide.createIcons());</script>
</body>
</html>
