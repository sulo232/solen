<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walk-in · Live Warteschlange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ─────────── TOKENS (verbatim from _KIT.html) ─────────── */
  :root{
    --ink:#0A0A0A;
    --ink-2:#6B6B6B;
    --ink-3:#9B9B9B;
    --border:#E4E4E7;
    --bg:#FFFFFF;
    --sunken:#F4F4F5;
    --blue:#276EF1;
    --green:#16A34A;
    --star:#FFC32B;
    --error:#DC2626;
    --heart:#FF3366;
    --r-card:24px;
    --r-sheet:20px;
    --r-pill:9999px;
    --r-tile:14px;
    --pad-card:20px;
    --shadow-card:0 1px 3px rgba(10,10,10,.05), 0 6px 16px -10px rgba(10,10,10,.10);
    --shadow-frost:0 1px 3px rgba(0,0,0,.10);
    --gap-section:30px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:'Inter',sans-serif;background:#E9E9EC;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0 80px;}

  .frame{width:390px;background:var(--bg);position:relative;overflow:hidden;}

  /* ─────────── iOS STATUS BAR (verbatim) ─────────── */
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;letter-spacing:-.01em;}
  .statusbar .ico{display:flex;gap:6px;align-items:center;}

  /* ─────────── TYPE SCALE (verbatim) ─────────── */
  .t-display{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.022em;line-height:1.05;}
  .t-title{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.1;}
  .t-section{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.015em;}
  .t-row{font-family:'Inter Tight',sans-serif;font-weight:600;font-size:15.5px;letter-spacing:-.01em;}
  .t-body{font-size:14px;font-weight:400;line-height:1.5;color:var(--ink-2);}
  .t-meta{font-size:13px;font-weight:400;color:var(--ink-3);}
  .t-eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}
  .mono{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}

  /* ─────────── CARD (verbatim) ─────────── */
  .card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:var(--pad-card);}
  .card-flat{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--pad-card);}

  /* ─────────── BUTTONS / LINKS (verbatim) ─────────── */
  .link{color:var(--blue);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;}
  .link:hover{text-decoration:underline;}

  /* ─────────── QUEUE POSITION BAR (kit .dist-track / .dist-fill) ─────────── */
  .dist-track{flex:1;height:6px;border-radius:var(--r-pill);background:var(--sunken);overflow:hidden;position:relative;}
  .dist-fill{height:100%;border-radius:var(--r-pill);background:var(--ink);}

  /* ─────────── ENTRANCE (verbatim) ─────────── */
  .rise{animation:rise .55s var(--ease) both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* ─────────── SCREEN-SPECIFIC (built from kit primitives) ─────────── */

  /* salon mini-header: small rounded photo + name + ticket + paid chip */
  .minihead{display:flex;align-items:center;gap:13px;padding:18px 20px 22px;}
  .mini-photo{width:48px;height:48px;border-radius:var(--r-tile);object-fit:cover;flex-shrink:0;}
  .mini-main{flex:1;min-width:0;}
  .mini-sub{display:flex;align-items:center;gap:7px;margin-top:3px;}
  .ticket{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--ink-2);font-variant-numeric:tabular-nums;}
  /* paid chip — green semantic (kit: --green = paid/success). pale tint + ink-green text + green dot */
  .paid-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:var(--r-pill);
    background:rgba(22,163,74,.10);color:var(--green);font-size:12px;font-weight:600;letter-spacing:-.005em;}
  .paid-dot{width:6px;height:6px;border-radius:var(--r-pill);background:var(--green);}

  /* THE FOCAL — huge mono number block */
  .focal{padding:26px 20px 30px;text-align:center;}
  .live-line{display:inline-flex;align-items:center;gap:7px;margin-bottom:18px;}
  .live-dot{width:9px;height:9px;border-radius:var(--r-pill);background:var(--green);position:relative;}
  .live-dot::after{content:"";position:absolute;inset:0;border-radius:var(--r-pill);background:var(--green);
    animation:pulse 1.8s var(--ease) infinite;}
  @keyframes pulse{0%{transform:scale(1);opacity:.55;}70%{transform:scale(3.2);opacity:0;}100%{opacity:0;}}
  .live-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--green);}

  .bignum{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:128px;line-height:.92;
    letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums;display:block;}
  .vordir{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.02em;color:var(--ink);
    margin-top:2px;}

  /* ETA pill — calm sunken, ink + mono number */
  .eta{display:inline-flex;align-items:center;gap:8px;margin-top:20px;height:42px;padding:0 20px;
    border-radius:var(--r-pill);background:var(--sunken);}
  .eta-label{font-size:13px;font-weight:500;color:var(--ink-2);}
  .eta-num{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:16px;color:var(--ink);
    letter-spacing:-.01em;font-variant-numeric:tabular-nums;}

  /* queue bar block */
  .qbar-wrap{padding:0 20px;}
  .qbar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .qbar-pos{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;color:var(--ink);
    letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  .qbar-of{color:var(--ink-3);font-weight:500;}
  .qbar-track{position:relative;height:8px;border-radius:var(--r-pill);background:var(--sunken);overflow:visible;}
  .qbar-fill{height:100%;border-radius:var(--r-pill);background:var(--ink);}
  /* the "you are here" marker sitting on the track */
  .qbar-you{position:absolute;top:50%;width:16px;height:16px;border-radius:var(--r-pill);background:var(--ink);
    border:3px solid #fff;box-shadow:0 1px 3px rgba(10,10,10,.18);transform:translate(-50%,-50%);}
  .qbar-ends{display:flex;justify-content:space-between;margin-top:9px;}
  .qbar-end{font-size:11.5px;font-weight:500;color:var(--ink-3);}

  /* updated line — calm grey */
  .updated{display:flex;align-items:center;justify-content:center;gap:6px;padding:24px 20px 4px;}
  .updated-txt{font-size:13px;font-weight:400;color:var(--ink-3);}
  .updated-live{color:var(--green);font-weight:600;}

  /* share link row */
  .sharerow{text-align:center;padding:14px 20px 32px;}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="frame">

  <!-- iOS status bar (verbatim chrome) -->
  <div class="statusbar"><span>9:41</span><span class="ico">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#0A0A0A"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="#0A0A0A"><path d="M8 2.2c2.1 0 4 .8 5.4 2.2l1.2-1.3A9.5 9.5 0 0 0 8 .3 9.5 9.5 0 0 0 1.4 3.1l1.2 1.3A7.6 7.6 0 0 1 8 2.2z"/><path d="M8 5.6c1.2 0 2.3.5 3.1 1.3l1.2-1.3A6 6 0 0 0 8 3.9a6 6 0 0 0-4.3 1.7l1.2 1.3A4.4 4.4 0 0 1 8 5.6z"/><circle cx="8" cy="9" r="1.6"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="#0A0A0A" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="#0A0A0A"/><rect x="23" y="4" width="1.5" height="4" rx="1" fill="#0A0A0A" fill-opacity=".4"/></svg>
  </span></div>

  <!-- salon mini-header -->
  <div class="minihead rise" style="animation-delay:.02s;">
    <img class="mini-photo" src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=160&q=80" alt="" referrerpolicy="no-referrer">
    <div class="mini-main">
      <div class="t-row">Studio Eleven · Barber</div>
      <div class="mini-sub">
        <span class="ticket">W-047</span>
        <span class="paid-chip"><span class="paid-dot"></span>Bezahlt</span>
      </div>
    </div>
  </div>

  <!-- THE FOCAL: huge number -->
  <div class="focal rise" style="animation-delay:.08s;">
    <div class="live-line">
      <span class="live-dot"></span>
      <span class="live-label">Live</span>
    </div>
    <span class="bignum mono">3</span>
    <div class="vordir">vor dir</div>
    <div class="eta">
      <span class="eta-label">Geschätzte Wartezeit</span>
      <span class="eta-num">~12 Min</span>
    </div>
  </div>

  <!-- queue position bar -->
  <div class="qbar-wrap rise" style="animation-delay:.14s;">
    <div class="qbar-head">
      <span class="t-meta">Deine Position</span>
      <span class="qbar-pos">4<span class="qbar-of"> / 7</span></span>
    </div>
    <div class="qbar-track">
      <div class="qbar-fill" style="width:43%;"></div>
      <div class="qbar-you" style="left:43%;"></div>
    </div>
    <div class="qbar-ends">
      <span class="qbar-end">An der Reihe</span>
      <span class="qbar-end">Ende</span>
    </div>
  </div>

  <!-- updated line -->
  <div class="updated rise" style="animation-delay:.2s;">
    <span class="updated-txt">Aktualisiert gerade eben · <span class="updated-live">live</span></span>
  </div>

  <!-- share link -->
  <div class="sharerow rise" style="animation-delay:.24s;">
    <a class="link">Status teilen</a>
  </div>

</div>

</body>
</html>
