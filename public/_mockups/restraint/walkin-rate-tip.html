<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk-in rate → tip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .lucide{stroke-width:1.9;flex-shrink:0}
  :root{--ink:#0A0A0A;--ink-2:#6B6B6B;--ink-3:#9B9B9B;--border:#E7E7EA;--bg:#FFFFFF;--sunken:#F4F4F5;
    --blue:#276EF1;--blue-bg:#EAF1FE;--green:#16A34A;--green-bg:#E8F5E9;--star:#FFC32B;--r-pill:9999px;--ease:cubic-bezier(.16,1,.3,1);
    --shadow:0 8px 26px -16px rgba(10,10,10,.16);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:'Inter',sans-serif;background:#E9E9EC;color:var(--ink);display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:30px;padding:30px 0 80px;}
  .col{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .flabel{font-size:12px;font-weight:600;color:var(--ink-2);}
  .frame{width:390px;min-height:720px;background:var(--bg);position:relative;overflow:hidden;border-radius:30px;box-shadow:0 30px 70px rgba(10,10,10,.14);display:flex;flex-direction:column;}
  .num{font-family:'Inter Tight',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .body{flex:1;padding:46px 22px 0;display:flex;flex-direction:column;align-items:center;}

  .mark{position:relative;width:64px;height:64px;border-radius:var(--r-pill);background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 20px rgba(22,163,74,.32);animation:pop .5s var(--ease) both;}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .h1{font-family:'Inter Tight';font-weight:700;font-size:25px;letter-spacing:-.02em;margin-top:15px;}
  .sub{font-size:14px;color:var(--ink-2);margin-top:6px;text-align:center;line-height:1.45;}

  /* barber chip */
  .who{display:flex;align-items:center;gap:10px;margin-top:22px;background:var(--sunken);border-radius:var(--r-pill);padding:7px 15px 7px 7px;}
  .who img{width:34px;height:34px;border-radius:var(--r-pill);object-fit:cover;}
  .who .n{font-family:'Inter Tight';font-weight:700;font-size:14.5px;}

  /* stars */
  .stars{display:flex;gap:10px;margin-top:26px;}
  .stars .s{cursor:pointer;transition:transform .12s var(--ease);color:var(--star);}
  .stars .s:active{transform:scale(.9);}
  .stars .s.off{color:#E2E2E6;}
  .senti{font-family:'Inter Tight';font-weight:700;font-size:17px;color:var(--green);margin-top:16px;animation:rise .4s var(--ease) both;}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hint{font-size:12.5px;color:var(--ink-3);margin-top:6px;}

  /* tip (frame 2) */
  .confirm{display:flex;align-items:center;gap:7px;margin-top:2px;background:var(--green-bg);color:var(--green);font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:var(--r-pill);}
  .card{width:100%;margin-top:22px;background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:18px;}
  .brow{display:flex;align-items:center;gap:12px;}
  .brow img{width:46px;height:46px;border-radius:var(--r-pill);object-fit:cover;flex-shrink:0;}
  .brow .t{font-family:'Inter Tight';font-weight:700;font-size:16px;letter-spacing:-.01em;}
  .brow .m{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3);margin-top:2px;}
  .tips{display:flex;gap:9px;margin-top:16px;}
  .tip{flex:1;height:60px;border-radius:15px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .tip .v{font-family:'Inter Tight';font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink);}
  .tip.custom .v{font-size:14px;}
  .tip.sel{border-color:var(--blue);background:var(--blue-bg);box-shadow:inset 0 0 0 1px var(--blue);}
  .tip.sel .v{color:var(--blue);}
  .to100{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;background:var(--green-bg);color:var(--green);font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:var(--r-pill);}

  /* footer */
  .foot{padding:14px 22px 24px;}
  .cta{width:100%;border:none;border-radius:var(--r-pill);padding:15px;font-family:'Inter Tight';font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .12s var(--ease);}
  .cta:active{transform:scale(.98);}
  .cta.ink{background:var(--ink);color:#fff;}
  .cta.blue{background:var(--blue);color:#fff;}
  .skip{display:block;width:100%;text-align:center;margin-top:13px;font-size:13.5px;font-weight:500;color:var(--ink-3);background:none;border:none;cursor:pointer;}
</style>
</head>
<body>

<!-- ===== FRAME 1: rate ===== -->
<div class="col">
  <div class="flabel">1 · Bewerten</div>
  <div class="frame">
    <div class="body">
      <div class="mark"><i data-lucide="check" style="width:30px;height:30px;stroke-width:3"></i></div>
      <div class="h1">Fertig!</div>
      <div class="sub">Wie war dein Schnitt?</div>

      <div class="who">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=120&q=80" referrerpolicy="no-referrer">
        <span class="n">Marco B.</span>
      </div>

      <div class="stars">
        <i data-lucide="star" class="s" style="width:40px;height:40px;fill:currentColor"></i>
        <i data-lucide="star" class="s" style="width:40px;height:40px;fill:currentColor"></i>
        <i data-lucide="star" class="s" style="width:40px;height:40px;fill:currentColor"></i>
        <i data-lucide="star" class="s" style="width:40px;height:40px;fill:currentColor"></i>
        <i data-lucide="star" class="s" style="width:40px;height:40px;fill:currentColor"></i>
      </div>
      <div class="senti">Ausgezeichnet!</div>
      <div class="hint">Tippe zum Bewerten</div>
    </div>
    <div class="foot">
      <button class="cta ink">Weiter</button>
      <button class="skip">Überspringen</button>
    </div>
  </div>
</div>

<!-- ===== FRAME 2: tip (after rating) ===== -->
<div class="col">
  <div class="flabel">2 · Trinkgeld</div>
  <div class="frame">
    <div class="body">
      <div class="confirm"><i data-lucide="star" style="width:14px;height:14px;fill:currentColor"></i> 5 Sterne für Marco gespeichert</div>
      <div class="h1" style="margin-top:18px">Trinkgeld für Marco?</div>
      <div class="sub">100% geht direkt an ihn. Ganz dir überlassen.</div>

      <div class="card">
        <div class="brow">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=140&q=80" referrerpolicy="no-referrer">
          <div style="flex:1">
            <div class="t">Marco B.</div>
            <div class="m"><i data-lucide="star" style="width:13px;height:13px;color:#FFC32B;fill:#FFC32B"></i><span class="num" style="font-size:12.5px;color:var(--ink)">4.8</span> Herrenschnitt &amp; Bart</div>
          </div>
        </div>
        <div class="tips">
          <div class="tip"><span class="v">CHF 5</span></div>
          <div class="tip sel"><span class="v">CHF 10</span></div>
          <div class="tip"><span class="v">CHF 15</span></div>
          <div class="tip custom"><span class="v">Eigener</span></div>
        </div>
        <div class="to100"><i data-lucide="heart-handshake" style="width:14px;height:14px"></i> 100% gehen an Marco</div>
      </div>
    </div>
    <div class="foot">
      <button class="cta blue"><i data-lucide="coins" style="width:18px;height:18px"></i> CHF 10 Trinkgeld senden</button>
      <button class="skip">Kein Trinkgeld, danke</button>
    </div>
  </div>
</div>

<script>window.addEventListener('DOMContentLoaded',()=>lucide.createIcons());</script>
</body>
</html>
