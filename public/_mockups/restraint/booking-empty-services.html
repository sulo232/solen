<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solen Buchung — keine Online-Buchung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .lucide{width:20px;height:20px;stroke-width:1.8;flex-shrink:0}
  /* ─────────── TOKENS (verbatim from _KIT.html) ─────────── */
  :root{
    --ink:#0A0A0A;
    --ink-2:#6B6B6B;
    --ink-3:#9B9B9B;
    --border:#E4E4E7;
    --bg:#FFFFFF;
    --sunken:#F4F4F5;
    --blue:#276EF1;
    --green:#16A34A;
    --star:#FFC32B;
    --error:#DC2626;
    --heart:#FF3366;
    --r-card:24px;
    --r-sheet:20px;
    --r-pill:9999px;
    --r-tile:14px;
    --pad-card:20px;
    --shadow-card:0 1px 3px rgba(10,10,10,.05), 0 6px 16px -10px rgba(10,10,10,.10);
    --shadow-frost:0 1px 3px rgba(0,0,0,.10);
    --gap-section:30px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:'Inter',sans-serif;background:#E9E9EC;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0 80px;}

  /* ═══════════ THE 390px FRAME ═══════════ */
  .frame{width:390px;background:var(--bg);position:relative;overflow:hidden;border-radius:0;min-height:844px;display:flex;flex-direction:column;}

  /* ─────────── iOS STATUS BAR ─────────── */
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;letter-spacing:-.01em;flex-shrink:0;}
  .statusbar .ico{display:flex;gap:6px;align-items:center;}

  /* ─────────── TYPE SCALE (verbatim) ─────────── */
  .t-display{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.022em;line-height:1.05;}
  .t-title{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.1;}
  .t-section{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.015em;}
  .t-row{font-family:'Inter Tight',sans-serif;font-weight:600;font-size:15.5px;letter-spacing:-.01em;}
  .t-body{font-size:14px;font-weight:400;line-height:1.5;color:var(--ink-2);}
  .t-meta{font-size:13px;font-weight:400;color:var(--ink-3);}
  /* NUMBERS: prices, durations, counts, dates, times, queue position → Inter Tight tabular (NOT mono). */
  .num{font-family:'Inter Tight',sans-serif;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  /* MONO: JetBrains Mono is for CODES ONLY (voucher code, ticket). Never on prices/times. */
  .mono{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}

  /* ─────────── BACK ROW (icon-only flat, kit .btn-icon) ─────────── */
  .topbar{display:flex;align-items:center;gap:12px;padding:6px 16px 0;flex-shrink:0;}
  .btn-icon{width:38px;height:38px;border-radius:var(--r-pill);background:var(--sunken);border:none;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;transition:transform .14s var(--ease);}
  .btn-icon:active{transform:scale(.92);}

  /* ─────────── STEP INDICATOR (Service, Datum, Zeit, Details) ─────────── */
  .steps{display:flex;align-items:center;padding:16px 20px 18px;flex-shrink:0;}
  .step{display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .step-num{width:21px;height:21px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;
    font-family:'Inter Tight',sans-serif;font-size:11px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .step-label{font-family:'Inter Tight',sans-serif;font-size:13px;letter-spacing:-.005em;}
  .step.active .step-num{background:var(--ink);color:#fff;}
  .step.active .step-label{color:var(--ink);font-weight:700;}
  .step.inactive .step-num{background:var(--sunken);color:var(--ink-3);font-weight:600;}
  .step.inactive .step-label{color:var(--ink-3);font-weight:500;}
  .step-sep{flex:1;height:1px;background:var(--border);margin:0 9px;min-width:8px;}

  /* ─────────── EMPTY-STATE BODY ─────────── */
  .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 28px 36px;}

  /* sunken calendar-off icon disc (flat: sunken, no shadow per CONTROL_ELEVATION) */
  .disc{width:84px;height:84px;border-radius:var(--r-pill);background:var(--sunken);display:flex;align-items:center;justify-content:center;margin-bottom:24px;color:var(--ink-2);}
  .disc svg{width:34px;height:34px;stroke:var(--ink-2);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}

  h1.headline{max-width:300px;margin-bottom:11px;}
  .body-text{max-width:280px;font-size:14px;line-height:1.5;color:var(--ink-2);margin-bottom:28px;}

  /* ─────────── SALON CONTEXT CARD (kit .card 24px + status row) ─────────── */
  .card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:14px;}
  .salon-card{width:100%;display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:28px;}
  .salon-thumb{width:56px;height:56px;border-radius:var(--r-tile);object-fit:cover;flex-shrink:0;background:var(--sunken);}
  .salon-meta{min-width:0;flex:1;}
  .salon-name{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.012em;color:var(--ink);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rating{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;}
  .rating svg{width:14px;height:14px;fill:var(--star);}
  .rating .num{font-weight:600;color:var(--ink);}
  .rating .count{color:var(--blue);font-weight:500;cursor:pointer;}
  .salon-loc{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ─────────── ACTIONS ─────────── */
  .actions{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;}
  /* PRIMARY = INK PILL (kit .btn-ink.full) */
  .btn-ink{background:var(--ink);color:#fff;border:none;border-radius:var(--r-pill);
    padding:16px 28px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    transition:transform .14s var(--ease);font-family:'Inter',sans-serif;}
  .btn-ink:active{transform:scale(.97);}
  .btn-ink svg{stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  /* blue text link (kit .link) — call */
  .link{color:var(--blue);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding:4px 2px;}
  .link svg{stroke:var(--blue);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;width:15px;height:15px;}
  .link:hover .u{text-decoration:underline;}

  /* ─────────── HOME INDICATOR ─────────── */
  .home-indicator{width:134px;height:5px;border-radius:var(--r-pill);background:var(--ink);opacity:.16;margin:0 auto 8px;flex-shrink:0;}

  /* ─────────── ENTRANCE (stagger) ─────────── */
  .rise{animation:rise .55s var(--ease) both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .d1{animation-delay:.05s;}
  .d2{animation-delay:.11s;}
  .d3{animation-delay:.17s;}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="frame">

  <!-- iOS status bar -->
  <div class="statusbar"><span>9:41</span><span class="ico">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#0A0A0A"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="#0A0A0A"><path d="M8 2.2c2.1 0 4 .8 5.4 2.2l1.2-1.3A9.5 9.5 0 0 0 8 .3 9.5 9.5 0 0 0 1.4 3.1l1.2 1.3A7.6 7.6 0 0 1 8 2.2z"/><path d="M8 5.6c1.2 0 2.3.5 3.1 1.3l1.2-1.3A6 6 0 0 0 8 3.9a6 6 0 0 0-4.3 1.7l1.2 1.3A4.4 4.4 0 0 1 8 5.6z"/><circle cx="8" cy="9" r="1.6"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="#0A0A0A" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="#0A0A0A"/><rect x="23" y="4" width="1.5" height="4" rx="1" fill="#0A0A0A" fill-opacity=".4"/></svg>
  </span></div>

  <!-- Back -->
  <div class="topbar">
    <button class="btn-icon" aria-label="Zurück"><i data-lucide="chevron-left" style="width:19px;height:19px"></i></button>
    <span class="t-row">Termin buchen</span>
  </div>

  <!-- Step indicator -->
  <nav class="steps" aria-label="Buchungsschritte">
    <div class="step active"><span class="step-num">1</span><span class="step-label">Service</span></div>
    <span class="step-sep"></span>
    <div class="step inactive"><span class="step-num">2</span><span class="step-label">Datum</span></div>
    <span class="step-sep"></span>
    <div class="step inactive"><span class="step-num">3</span><span class="step-label">Zeit</span></div>
    <span class="step-sep"></span>
    <div class="step inactive"><span class="step-num">4</span><span class="step-label">Details</span></div>
  </nav>

  <!-- Empty-state body -->
  <main class="body">
    <div class="disc rise">
      <i data-lucide="store" style="width:34px;height:34px"></i>
    </div>

    <h1 class="t-title headline rise d1">Online-Buchung nicht verfügbar</h1>

    <p class="body-text rise d1">Dieser Salon nimmt Termine telefonisch oder direkt vor Ort entgegen. Schau auf der Salon-Seite vorbei oder ruf kurz an.</p>

    <!-- Salon context card (kit .card 24px) -->
    <div class="card salon-card rise d2">
      <img class="salon-thumb" alt="Maison Lumière"
           src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=160&q=80" referrerpolicy="no-referrer">
      <div class="salon-meta">
        <div class="salon-name">Maison Lumière</div>
        <div class="rating">
          <i data-lucide="star" style="width:15px;height:15px;color:#FFC32B;fill:#FFC32B"></i>
          <span class="num">4.9</span><span class="count">(127)</span>
          <span class="salon-loc" style="margin-left:7px;">Basel, Kreis 4</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions rise d3">
      <button class="btn-ink">
        Zum Salon
        <i data-lucide="arrow-right" style="width:18px;height:18px"></i>
      </button>
      <a class="link" href="tel:+41612340000">
        <i data-lucide="phone" style="width:15px;height:15px"></i>
        <span class="u">Salon anrufen</span>
      </a>
    </div>
  </main>

  <div class="home-indicator"></div>

</div>
<script>window.addEventListener('DOMContentLoaded',()=>lucide.createIcons());</script>
</body>
</html>
