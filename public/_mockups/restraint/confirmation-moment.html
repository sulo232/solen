<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solen — Buchung bestätigt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ─────────── TOKENS (verbatim from _KIT.html) ─────────── */
  :root{
    --ink:#0A0A0A;
    --ink-2:#6B6B6B;
    --ink-3:#9B9B9B;
    --border:#E4E4E7;
    --bg:#FFFFFF;
    --sunken:#F4F4F5;
    --blue:#276EF1;
    --green:#16A34A;
    --star:#FFC32B;
    --error:#DC2626;
    --heart:#FF3366;
    --r-card:24px;
    --r-sheet:20px;
    --r-pill:9999px;
    --r-tile:14px;
    --pad-card:20px;
    --shadow-card:0 1px 3px rgba(10,10,10,.05), 0 6px 16px -10px rgba(10,10,10,.10);
    --shadow-frost:0 1px 3px rgba(0,0,0,.10);
    --gap-section:30px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:'Inter',sans-serif;background:#E9E9EC;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0 80px;}

  /* ═══════════ THE 390px FRAME ═══════════ */
  .frame{width:390px;background:var(--bg);position:relative;overflow:hidden;min-height:844px;}

  /* ─────────── iOS STATUS BAR ─────────── */
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;letter-spacing:-.01em;}
  .statusbar .ico{display:flex;gap:6px;align-items:center;}

  /* ─────────── TYPE SCALE ─────────── */
  .t-display{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:30px;letter-spacing:-.024em;line-height:1.05;}
  .t-section{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.015em;}
  .t-row{font-family:'Inter Tight',sans-serif;font-weight:600;font-size:15.5px;letter-spacing:-.01em;}
  .t-body{font-size:14px;font-weight:400;line-height:1.5;color:var(--ink-2);}
  .t-meta{font-size:13px;font-weight:400;color:var(--ink-3);}
  .t-eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}
  .mono{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}

  /* ─────────── CARD ─────────── */
  .card-flat{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-card);padding:6px 4px;}

  /* ─────────── DETAIL ROW (calendar / pin / avatar / scissors) ─────────── */
  .drow{display:flex;align-items:flex-start;gap:14px;padding:15px 16px;}
  .drow + .drow{border-top:1px solid var(--border);}
  .drow-ico{width:38px;height:38px;border-radius:var(--r-tile);background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
  .drow-ava{width:38px;height:38px;border-radius:var(--r-pill);object-fit:cover;flex-shrink:0;}
  .drow-main{flex:1;min-width:0;}
  .drow-sub{margin-top:3px;font-size:13px;color:var(--ink-3);}

  /* mono value cluster */
  .drow-when{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums;}

  /* map strip + Karte link inside the address row */
  .mapstrip{margin-top:11px;position:relative;height:62px;border-radius:var(--r-tile);overflow:hidden;border:1px solid var(--border);}
  .mapstrip img{width:100%;height:100%;object-fit:cover;display:block;}
  .map-pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);filter:drop-shadow(0 2px 3px rgba(10,10,10,.25));}
  .map-karte{position:absolute;right:8px;bottom:8px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.6);box-shadow:var(--shadow-frost);border-radius:var(--r-pill);
    padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:5px;text-decoration:none;cursor:pointer;
    transition:transform .14s var(--ease);}
  .map-karte:active{transform:scale(.96);}

  /* paid chip — green refined-pastel: pale bg + green ink + green icon */
  .chip-paid{display:inline-flex;align-items:center;gap:5px;background:#EAF7EF;border:1px solid #C7EBD5;
    border-radius:var(--r-pill);padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--green);white-space:nowrap;}

  /* ─────────── BUTTONS ─────────── */
  .btn-ink{background:var(--ink);color:#fff;border:none;border-radius:var(--r-pill);
    padding:16px 28px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .14s var(--ease);}
  .btn-ink:active{transform:scale(.97);}
  .btn-ink.full{width:100%;}
  .link{color:var(--blue);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;}
  .link:hover{text-decoration:underline;}
  .dot-sep{color:var(--ink-3);}

  /* ─────────── 2×2 ACTION TILE GRID (Marriott-style outline tiles) ─────────── */
  .tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-card);
    padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
    color:var(--ink);text-decoration:none;transition:transform .14s var(--ease),border-color .14s ease;}
  .tile:active{transform:scale(.97);}
  .tile:hover{border-color:#D4D4D8;}
  .tile-label{font-size:13px;font-weight:600;letter-spacing:-.01em;}

  /* ─────────── SUCCESS MARK (spring + ring pulse) ─────────── */
  .success-wrap{position:relative;width:84px;height:84px;margin:0 auto 24px;}
  .success-ring{position:absolute;inset:0;border-radius:var(--r-pill);background:var(--green);opacity:.18;animation:ring .9s var(--ease) .1s both;}
  @keyframes ring{from{transform:scale(1);opacity:.22;}to{transform:scale(1.7);opacity:0;}}
  .successmark{position:relative;width:84px;height:84px;border-radius:var(--r-pill);background:var(--green);display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px -8px rgba(22,163,74,.5);animation:pop .5s var(--ease) both;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.07);}100%{transform:scale(1);opacity:1;}}
  .successmark svg{stroke:#fff;animation:draw .55s var(--ease) .2s both;}
  @keyframes draw{from{stroke-dasharray:30;stroke-dashoffset:30;}to{stroke-dasharray:30;stroke-dashoffset:0;}}

  /* ─────────── ENTRANCE (stagger) ─────────── */
  .rise{animation:rise .55s var(--ease) both;}
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .d1{animation-delay:.16s;} .d2{animation-delay:.26s;} .d3{animation-delay:.38s;}
  .d4{animation-delay:.50s;} .d5{animation-delay:.60s;} .d6{animation-delay:.70s;}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="frame">
  <div class="statusbar"><span>9:41</span><span class="ico">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#0A0A0A"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="#0A0A0A"><path d="M8 2.2c2.1 0 4 .8 5.4 2.2l1.2-1.3A9.5 9.5 0 0 0 8 .3 9.5 9.5 0 0 0 1.4 3.1l1.2 1.3A7.6 7.6 0 0 1 8 2.2z"/><path d="M8 5.6c1.2 0 2.3.5 3.1 1.3l1.2-1.3A6 6 0 0 0 8 3.9a6 6 0 0 0-4.3 1.7l1.2 1.3A4.4 4.4 0 0 1 8 5.6z"/><circle cx="8" cy="9" r="1.6"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="#0A0A0A" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="#0A0A0A"/><rect x="23" y="4" width="1.5" height="4" rx="1" fill="#0A0A0A" fill-opacity=".4"/></svg>
  </span></div>

  <!-- ─────────── THE MOMENT ─────────── -->
  <div style="padding:48px 24px 0;text-align:center;">
    <div class="success-wrap">
      <span class="success-ring"></span>
      <div class="successmark">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
    </div>
    <h1 class="t-display rise d1">Du bist gebucht</h1>
    <p class="rise d2" style="margin-top:10px;"><span class="mono" style="font-size:15.5px;color:var(--ink-2);">Do, 12. Juni · 14:00</span></p>
  </div>

  <!-- ─────────── ONE CARD: when / where / who / what ─────────── -->
  <div style="padding:28px 20px 0;">
    <div class="card-flat rise d3">

      <!-- WHEN -->
      <div class="drow">
        <span class="drow-ico">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </span>
        <div class="drow-main">
          <div class="drow-when">Do, 12. Juni · 14:00</div>
          <div class="drow-sub">Dauer 45 Min · bis 14:45</div>
        </div>
      </div>

      <!-- WHERE -->
      <div class="drow">
        <span class="drow-ico">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </span>
        <div class="drow-main">
          <div class="t-row">Maison Lumière</div>
          <div class="drow-sub">Feldbergstrasse 24, 4057 Basel</div>
          <div class="mapstrip">
            <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=720&q=80" alt="" referrerpolicy="no-referrer">
            <span class="map-pin">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#0A0A0A" stroke="#fff" stroke-width="1.6"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0116 0z"/><circle cx="12" cy="10" r="2.6" fill="#fff" stroke="none"/></svg>
            </span>
            <a class="map-karte">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3zM9 7v13M15 4v13"/></svg>
              Karte
            </a>
          </div>
        </div>
      </div>

      <!-- WHO -->
      <div class="drow">
        <img class="drow-ava" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=160&q=80" alt="" referrerpolicy="no-referrer">
        <div class="drow-main">
          <div class="t-row">Sara Keller</div>
          <div class="drow-sub">Deine Stylistin</div>
        </div>
      </div>

      <!-- WHAT -->
      <div class="drow">
        <span class="drow-ico">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/></svg>
        </span>
        <div class="drow-main">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <div class="t-row">Damenschnitt &amp; Föhnen</div>
            <span class="mono" style="font-size:14px;color:var(--ink);">CHF 85.00</span>
          </div>
          <div style="margin-top:8px;"><span class="chip-paid">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            Bezahlt
          </span></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ─────────── PRIMARY: add to calendar (ink pill) ─────────── -->
  <div style="padding:20px 20px 0;">
    <button class="btn-ink full rise d4">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></svg>
      Kalender hinzufügen
    </button>
  </div>

  <!-- ─────────── 2×2 ACTION TILES (outline) ─────────── -->
  <div style="padding:10px 20px 0;">
    <div class="tilegrid rise d5">
      <a class="tile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="3"/><path d="M2 11h20M16 16h2"/></svg>
        <span class="tile-label">Wallet</span>
      </a>
      <a class="tile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        <span class="tile-label">Teilen</span>
      </a>
      <a class="tile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        <span class="tile-label">Speichern</span>
      </a>
      <a class="tile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
        <span class="tile-label">Route</span>
      </a>
    </div>
  </div>

  <!-- ─────────── UMBUCHEN · STORNIEREN (blue text links) ─────────── -->
  <div class="rise d6" style="padding:26px 20px 36px;text-align:center;">
    <a class="link">Umbuchen</a>
    <span class="dot-sep" style="margin:0 8px;">·</span>
    <a class="link">Stornieren</a>
  </div>

</div>

</body>
</html>
