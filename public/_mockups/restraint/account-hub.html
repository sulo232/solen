<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Konto · Solen (Restraint)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0A0A0A;
    --ink2: #6B6B6B;
    --ink3: #9B9B9B;
    --border: #E4E4E7;
    --bg: #FFFFFF;
    --sunken: #F4F4F5;
    --blue: #276EF1;
    --green: #16A34A;
    --star: #FFC32B;
    --error: #DC2626;
    --heart: #FF3366;
    --r-card: 16px;
    --shadow-rest: 0 1px 3px rgba(10,10,10,.05), 0 4px 12px -6px rgba(10,10,10,.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #E9E9EC;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px 64px;
    min-height: 100%;
  }

  /* ============ PHONE FRAME ============ */
  .frame {
    width: 390px;
    background: var(--bg);
    border-radius: 30px;
    box-shadow:
      0 40px 90px -40px rgba(10,10,10,.45),
      0 0 0 1px var(--border);
    overflow: hidden;
    position: relative;
  }

  /* status bar */
  .statusbar {
    height: 50px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 26px 6px;
    font-family: "Inter Tight", sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .statusbar .glyphs { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; }

  /* top app bar */
  .appbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 20px 4px;
  }
  .appbar .eyebrow {
    font-family: "Inter Tight", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink3);
  }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    color: var(--ink);
    cursor: pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn:hover { background: var(--sunken); }

  /* scroll body */
  .body {
    padding: 0 20px 28px;
  }

  /* ============ PROFILE HEADER ============ */
  .profile {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 0 26px;
  }
  .avatar {
    width: 68px; height: 68px;
    border-radius: 999px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--sunken);
    box-shadow: 0 0 0 1px var(--border);
  }
  .profile .who { min-width: 0; }
  .profile .name {
    font-family: "Inter Tight", sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--ink);
  }
  .profile .meta {
    font-size: 13.5px;
    color: var(--ink2);
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .profile .meta .verified {
    display: inline-flex;
    align-items: center;
    color: var(--green);
  }

  /* tiny edit link (legit small blue) */
  .edit-link {
    margin-left: auto;
    align-self: flex-start;
    margin-top: 4px;
    font-family: "Inter Tight", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--blue);
    text-decoration: none;
    flex-shrink: 0;
    transition: opacity .15s ease;
  }
  .edit-link:hover { text-decoration: underline; }
  .edit-link:active { opacity: .6; }

  /* ============ GROUP ============ */
  .group { margin-bottom: 26px; }
  .group-label {
    font-family: "Inter Tight", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink3);
    padding: 0 4px 10px;
  }

  /* card that holds rows */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-rest);
    overflow: hidden;
  }

  /* ============ ROW ============ */
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    width: 100%;
    background: var(--bg);
    border: none;
    text-align: left;
    cursor: pointer;
    position: relative;
    transition: background .15s ease, transform .12s ease;
    font-family: inherit;
  }
  .row + .row { border-top: 1px solid var(--border); }
  .row:hover { background: var(--sunken); }
  .row:active { transform: scale(.99); }

  .row-ic {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--sunken);
    display: grid;
    place-items: center;
    color: var(--ink);
    flex-shrink: 0;
  }
  .row-ic svg { display: block; }

  .row-main { flex: 1; min-width: 0; }
  .row-label {
    font-family: "Inter Tight", sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1.2;
  }
  .row-sub {
    font-size: 13px;
    color: var(--ink2);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-end {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  /* small blue count chip — legit small tappable metadata */
  .count-chip {
    min-width: 22px;
    height: 22px;
    padding: 0 7px;
    border-radius: 999px;
    background: var(--blue);
    color: #fff;
    font-family: "Inter Tight", sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    display: grid;
    place-items: center;
    line-height: 1;
  }

  /* a quiet inline count (no blue) for non-urgent metadata */
  .count-quiet {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink3);
  }

  /* ink chevron */
  .chev {
    color: var(--ink3);
    display: grid;
    place-items: center;
    transition: transform .18s ease, color .15s ease;
  }
  .row:hover .chev { color: var(--ink); transform: translateX(2px); }

  /* WALLET expanded sub-rows: indented, lighter top icon tile */
  .subrow {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px 13px 16px;
    width: 100%;
    background: var(--bg);
    border: none;
    border-top: 1px solid var(--border);
    text-align: left;
    cursor: pointer;
    transition: background .15s ease, transform .12s ease;
    font-family: inherit;
  }
  .subrow:hover { background: var(--sunken); }
  .subrow:active { transform: scale(.99); }
  .subrow-ic {
    width: 36px; height: 36px;
    margin-left: 28px;
    border-radius: 10px;
    background: var(--sunken);
    display: grid;
    place-items: center;
    color: var(--ink);
    flex-shrink: 0;
    position: relative;
  }
  /* connector rail to show nesting */
  .subrow-ic::before {
    content: "";
    position: absolute;
    left: -16px;
    top: -50%;
    bottom: 50%;
    width: 1px;
    background: var(--border);
  }
  .subrow:last-child .subrow-ic::before { bottom: 50%; }
  .subrow .row-label { font-size: 15px; }

  /* the WALLET parent header (the expandable group title row) */
  .wallet-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    width: 100%;
    background: var(--bg);
    border: none;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s ease;
  }
  .wallet-head:hover { background: var(--sunken); }
  .wallet-head .chev-down {
    color: var(--ink3);
    transition: transform .2s ease;
  }

  /* one big number — JetBrains mono treuestempel progress */
  .stamp-row .row-end { gap: 12px; }
  .stamp-count {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .stamp-count .slash { color: var(--ink3); font-weight: 500; }

  /* sign out */
  .signout {
    display: block;
    width: 100%;
    text-align: center;
    font-family: "Inter Tight", sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--error);
    background: none;
    border: none;
    padding: 14px;
    margin-top: 4px;
    cursor: pointer;
    border-radius: 12px;
    transition: background .15s ease;
  }
  .signout:hover { background: #FEF2F2; }

  /* version footnote */
  .foot-note {
    text-align: center;
    font-size: 12px;
    color: var(--ink3);
    margin-top: 8px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    letter-spacing: 0.02em;
  }

  /* ============ MOTION ============ */
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .anim {
    opacity: 0;
    animation: riseIn .5s cubic-bezier(.22,.61,.36,1) forwards;
  }
  .d1 { animation-delay: .04s; }
  .d2 { animation-delay: .10s; }
  .d3 { animation-delay: .17s; }
  .d4 { animation-delay: .24s; }
  .d5 { animation-delay: .31s; }
  .d6 { animation-delay: .38s; }

  @media (prefers-reduced-motion: reduce) {
    .anim { animation: none; opacity: 1; transform: none; }
    .row, .subrow, .chev, .icon-btn { transition: none; }
  }
</style>
</head>
<body>

<div class="frame">

  <!-- status bar -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="glyphs">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><rect x="0" y="6.5" width="3" height="4" rx="1" fill="#0A0A0A"/><rect x="4.5" y="4.5" width="3" height="6" rx="1" fill="#0A0A0A"/><rect x="9" y="2.5" width="3" height="8" rx="1" fill="#0A0A0A"/><rect x="13.5" y="0.5" width="3" height="10" rx="1" fill="#0A0A0A"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 2.2C10.3 2.2 12.4 3.1 14 4.6L15.2 3.3C13.3 1.5 10.8 0.4 8 0.4S2.7 1.5 0.8 3.3L2 4.6C3.6 3.1 5.7 2.2 8 2.2Z" fill="#0A0A0A"/><path d="M8 5.6C9.2 5.6 10.3 6.1 11.1 6.9L8 10.2 4.9 6.9C5.7 6.1 6.8 5.6 8 5.6Z" fill="#0A0A0A"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.8" width="21" height="10.4" rx="2.6" stroke="#0A0A0A" stroke-opacity="0.4"/><rect x="2" y="2.3" width="16" height="7.4" rx="1.4" fill="#0A0A0A"/><rect x="23" y="4" width="1.5" height="4" rx="0.75" fill="#0A0A0A" fill-opacity="0.4"/></svg>
    </span>
  </div>

  <!-- app bar -->
  <div class="appbar anim d1">
    <div class="eyebrow">Konto</div>
    <button class="icon-btn" aria-label="Einstellungen">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div class="body">

    <!-- ============ PROFILE HEADER ============ -->
    <div class="profile anim d1">
      <img class="avatar" alt="Lena Brunner"
           src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=200&h=200&fit=crop&crop=faces&q=80" />
      <div class="who">
        <div class="name">Lena Brunner</div>
        <div class="meta">
          <span class="verified" aria-label="verifiziert">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
          </span>
          Mitglied seit 2024
        </div>
      </div>
      <a href="#" class="edit-link">Bearbeiten</a>

    <!-- ============ BUCHUNGEN ============ -->
    <div class="group anim d2">
      <div class="card">
        <button class="row">
          <span class="row-ic">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
          </span>
          <span class="row-main">
            <span class="row-label">Meine Buchungen</span>
            <span class="row-sub">Nächster Termin: Do, 12. Juni · 14:00</span>
          </span>
          <span class="row-end">
            <span class="chev">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </span>
          </span>
        </button>
      </div>
    </div>

    <!-- ============ WALLET (expanded group) ============ -->
    <div class="group anim d3">
      <div class="group-label">Wallet</div>
      <div class="card">
        <!-- group header (expanded, chevron points down) -->
        <button class="wallet-head">
          <span class="row-ic">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-3a2 2 0 0 1 0-4h4"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
          </span>
          <span class="row-main">
            <span class="row-label">Wallet</span>
            <span class="row-sub">Geschenkkarten, Gutscheine &amp; Pakete</span>
          </span>
          <span class="chev-down">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </span>
        </button>

        <!-- sub: Geschenkkarten -->
        <button class="subrow">
          <span class="subrow-ic">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20M12 5v14"/><path d="M9 5a2.5 2.5 0 1 1 3-2.5A2.5 2.5 0 0 1 15 5"/></svg>
          </span>
          <span class="row-main">
            <span class="row-label">Geschenkkarten</span>
            <span class="row-sub">CHF 80.00 verfügbar</span>
          </span>
          <span class="row-end">
            <span class="count-quiet">2</span>
            <span class="chev">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </span>
          </span>
        </button>

        <!-- sub: Gutscheine -->

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2M13 17v2M13 11v2"/></svg>
          </span>
          <span class="row-main">
            <span class="row-label">Gutscheine</span>
            <span class="row-sub">1 aktiv · gültig bis 31.12.</span>
          </span>
          <span class="row-end">
            <span class="count-quiet">1</span>
            <span class="chev">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </span>
          </span>
        </button>

        <!-- sub: Pakete / Mitgliedschaften -->

          <span class="subrow-ic">

            <span class="row-label">Pakete &amp; Mitgliedschaften</span>

          <span class="row-end">
            <span class="chev">

            </span>

        </button>
      </div>
    </div>

    <!-- ============ AKTIVITÄT ============ -->
    <div class="group anim d4">
      <div class="group-label">Aktivität</div>
      <div class="card">
        <!-- Nachrichten (blue unread chip) -->

          <span class="row-ic">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
          </span>
          <span class="row-main">
            <span class="row-label">Nachrichten</span>

            <span class="chev">

        <!-- Gespeichert (heart, consolidated favorites) -->

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>

            <span class="row-label">Gespeichert</span>
            <span class="row-sub">8 Salons &amp; Behandlungen</span>
          </span>
          <span class="row-end">
            <span class="count-quiet">8</span>
            <span class="chev">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </span>
          </span>
        </button>

        <!-- Treuestempel (one big mono number) -->
        <button class="row stamp-row">
          <span class="row-ic">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></svg>
          </span>
          <span class="row-main">
            <span class="row-label">Treuestempel</span>
            <span class="row-sub">Noch 2 bis zur Gratis-Behandlung</span>
          </span>
          <span class="row-end">
