<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solen — Gutschein gekauft</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0A0A0A;
    --ink2:#6B6B6B;
    --ink3:#9B9B9B;
    --border:#E4E4E7;
    --white:#fff;
    --sunken:#F4F4F5;
    --blue:#276EF1;
    --green:#16A34A;
    --star:#FFC32B;
    --error:#DC2626;
    --heart:#FF3366;
    --radius-card:16px;
    --radius-pill:999px;
    --shadow-rest:0 1px 3px rgba(10,10,10,.05),0 4px 12px -6px rgba(10,10,10,.08);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:#E9E9EC;
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  body{min-height:100vh;display:flex;justify-content:center;padding:24px 0;}

  /* ---------- 390px phone frame ---------- */
  .frame{
    width:390px;
    min-height:760px;
    background:var(--white);
    border-radius:34px;
    overflow:hidden;
    position:relative;
    box-shadow:0 30px 80px -30px rgba(10,10,10,.45),0 0 0 1px rgba(10,10,10,.04);
    display:flex;
    flex-direction:column;
  }

  /* ---------- status bar ---------- */
  .statusbar{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;flex:none;}
  .statusbar .time{font-weight:600;font-size:14px;letter-spacing:.01em;}
  .statusbar .icons{display:flex;align-items:center;gap:6px;}
  .statusbar .icons svg{display:block;}

  /* ---------- top bar (close) ---------- */
  .topbar{height:52px;display:flex;align-items:center;justify-content:flex-end;padding:0 18px;flex:none;}
  .close-btn{
    width:38px;height:38px;border-radius:var(--radius-pill);
    background:var(--sunken);border:none;
    display:grid;place-items:center;cursor:pointer;
    transition:transform .12s ease,background .15s ease;
  }
  .close-btn:hover{background:#ECECEE;}
  .close-btn:active{transform:scale(.94);}
  .close-btn svg{stroke:var(--ink);}

  /* ---------- main scroll body ---------- */
  .body{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 24px 0;}

  /* ---------- entrance: rise-in stagger ---------- */
  @keyframes riseIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .rise{opacity:0;animation:riseIn .6s cubic-bezier(.22,1,.36,1) forwards;}
  .d1{animation-delay:.18s;} .d2{animation-delay:.30s;} .d3{animation-delay:.42s;}
  .d4{animation-delay:.54s;} .d5{animation-delay:.66s;}

  /* =================== SUCCESS MARK =================== */
  .mark-wrap{position:relative;width:84px;height:84px;display:grid;place-items:center;margin-top:30px;flex:none;}
  /* expanding ring pulse, fires once */
  .ring{position:absolute;width:84px;height:84px;border-radius:var(--radius-pill);border:2px solid var(--green);opacity:0;
        animation:ringPulse 1.1s ease-out .42s 1 forwards;}
  /* the green disc spring-pops in */
  .disc{
    position:relative;width:84px;height:84px;border-radius:var(--radius-pill);
    background:var(--green);display:grid;place-items:center;
    box-shadow:0 14px 30px -10px rgba(22,163,74,.55);
    transform:scale(0);
    animation:discPop .62s cubic-bezier(.2,1.3,.4,1) .30s forwards;
    transform-origin:center;
  }
  .disc svg{stroke:#fff;width:42px;height:42px;}
  .check-path{stroke-dasharray:30;stroke-dashoffset:30;
              animation:drawCheck .42s cubic-bezier(.65,0,.45,1) .60s forwards;}

  @keyframes discPop{
    0%{transform:scale(0);}
    55%{transform:scale(1.12);}
    74%{transform:scale(.96);}
    100%{transform:scale(1);}
  }
  @keyframes ringPulse{
    0%{transform:scale(.65);opacity:.5;}
    70%{opacity:.16;}
    100%{transform:scale(1.7);opacity:0;}
  }
  @keyframes drawCheck{to{stroke-dashoffset:0;}}

  /* =================== HEADLINE BLOCK =================== */
  .head{text-align:center;margin-top:22px;}
  .head h1{font-family:"Inter Tight",sans-serif;font-weight:700;font-size:30px;letter-spacing:-0.02em;line-height:1.08;}
  .head p{color:var(--ink2);font-size:15px;line-height:1.5;margin-top:8px;max-width:280px;margin-left:auto;margin-right:auto;}

  /* =================== VOUCHER CARD =================== */
  .voucher{
    width:100%;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-rest);
    margin-top:26px;
    overflow:hidden;
  }
  /* dark ink header strip — the gift "presentation" face */
  .voucher .vhead{
    background:var(--ink);
    padding:18px 20px 16px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .voucher .vhead .brand{display:flex;align-items:center;gap:8px;}
  .voucher .vhead .dot{width:8px;height:8px;border-radius:var(--radius-pill);background:var(--green);}
  .voucher .vhead .bname{font-family:"Inter Tight",sans-serif;font-weight:700;font-size:15px;letter-spacing:-0.01em;color:#fff;}
  .voucher .vhead .vtag{font-family:"Inter Tight",sans-serif;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);}

  .voucher .vbody{padding:22px 20px 22px;}

  /* the ONE big number — voucher code in JetBrains Mono */
  .code-label{font-family:"Inter Tight",sans-serif;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);text-align:center;}
  .code{
    font-family:"JetBrains Mono",monospace;font-weight:600;
    font-size:32px;letter-spacing:.10em;color:var(--ink);
    text-align:center;margin-top:9px;line-height:1;
  }

  /* amount + recipient meta row */
  .meta{display:flex;margin-top:22px;border-top:1px solid var(--border);}
  .meta .cell{flex:1;padding:16px 4px 2px;text-align:center;}
  .meta .cell + .cell{border-left:1px solid var(--border);}
  .meta .ml{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);}
  .meta .mv{font-family:"Inter Tight",sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.01em;color:var(--ink);margin-top:5px;}
  .meta .mv.amt small{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:0;margin-right:2px;vertical-align:1px;}

  /* =================== ACTIONS =================== */
  .actions{width:100%;margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .btn-primary{
    width:100%;height:54px;border-radius:var(--radius-pill);
    background:var(--ink);color:#fff;border:none;cursor:pointer;
    font-family:"Inter Tight",sans-serif;font-weight:700;font-size:16px;letter-spacing:-0.01em;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:var(--shadow-rest);
    transition:transform .12s ease,box-shadow .18s ease,filter .15s ease;
  }
  .btn-primary:hover{box-shadow:0 10px 24px -10px rgba(10,10,10,.5);filter:brightness(1.06);}
  .btn-primary:active{transform:scale(.97);}
  .btn-primary svg{stroke:#fff;}

  /* blue text link — small, sparse, the only blue */
  .copy-link{
    display:inline-flex;align-items:center;gap:7px;
    background:transparent;border:none;cursor:pointer;
    color:var(--blue);font-family:"Inter",sans-serif;font-weight:600;font-size:14px;
    padding:2px 4px;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease;
  }
  .copy-link:hover{border-bottom-color:var(--blue);}
  .copy-link svg{stroke:var(--blue);width:15px;height:15px;}
  /* two pre-rendered icons; toggle which shows via class */
  .copy-link .ic-check{display:none;}
  .copy-link.copied{color:var(--green);border-bottom-color:transparent;cursor:default;}
  .copy-link.copied svg{stroke:var(--green);}
  .copy-link.copied .ic-copy{display:none;}
  .copy-link.copied .ic-check{display:block;}

  /* =================== EMAIL NOTE =================== */
  .email-note{
    display:flex;align-items:center;gap:9px;
    margin-top:auto;margin-bottom:6px;
    padding:24px 0 26px;
    color:var(--ink2);font-size:13px;line-height:1.4;
  }
  .email-note svg{stroke:var(--ink3);width:16px;height:16px;flex:none;}
  .email-note strong{color:var(--ink);font-weight:600;}

  @media (prefers-reduced-motion: reduce){
    .rise{animation:none;opacity:1;transform:none;}
    .disc{animation:none;transform:scale(1);}
    .ring{animation:none;opacity:0;}
    .check-path{animation:none;stroke-dashoffset:0;}
    .btn-primary,.close-btn,.copy-link{transition:none;}
  }
</style>
</head>
<body>
  <div class="frame">

    <!-- status bar -->
    <div class="statusbar">
      <span class="time">9:41</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#0A0A0A"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#0A0A0A"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#0A0A0A"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#0A0A0A"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C10.6 2.5 12.5 3.3 13.9 4.6L15.1 3.3C13.4 1.6 11 0.6 8.5 0.6S3.6 1.6 1.9 3.3L3.1 4.6C4.5 3.3 6.4 2.5 8.5 2.5Z" fill="#0A0A0A"/><path d="M8.5 6.1C9.6 6.1 10.6 6.5 11.3 7.2L8.5 10 5.7 7.2C6.4 6.5 7.4 6.1 8.5 6.1Z" fill="#0A0A0A"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#0A0A0A" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#0A0A0A"/><rect x="24" y="4" width="1.5" height="4" rx="0.75" fill="#0A0A0A" opacity="0.4"/></svg>
      </span>
    </div>

    <!-- top bar with close -->
    <div class="topbar">
      <button class="close-btn" aria-label="Schliessen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="body">

      <!-- SUCCESS MARK -->
      <div class="mark-wrap">
        <div class="ring"></div>
        <div class="disc">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path class="check-path" d="M20 6 9 17l-5-5"/>
          </svg>
        </div>
      </div>

      <!-- HEADLINE -->
      <div class="head rise d1">
        <h1>Gutschein gekauft</h1>
        <p>Dein Beauty-Gutschein ist bereit. Er liegt in deiner Wallet.</p>
      </div>

      <!-- VOUCHER CARD -->
      <div class="voucher rise d2">
        <div class="vhead">
          <span class="brand">
            <span class="dot"></span>
            <span class="bname">Solen</span>
          </span>
          <span class="vtag">Gutschein</span>
        </div>

        <div class="vbody">
          <div class="code-label">Gutschein-Code</div>
          <div class="code">SOL-7K4F-92QX</div>

          <div class="meta">
            <div class="cell">
              <div class="ml">Wert</div>
              <div class="mv amt"><small>CHF</small>100</div>
            </div>
            <div class="cell">
              <div class="ml">Für</div>
              <div class="mv">An dich</div>
            </div>
          </div>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="actions rise d3">
        <button class="btn-primary">
          Zur Wallet
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button class="copy-link" id="copyBtn">
          <svg class="ic-copy" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <svg class="ic-check" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <span id="copyText">Code kopieren</span>
        </button>
      </div>

      <!-- EMAIL NOTE -->
      <div class="email-note rise d4">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
        <span>Wir haben dir den Gutschein per <strong>E-Mail</strong> geschickt.</span>
      </div>

    </div>
  </div>

  <script>
    const btn=document.getElementById('copyBtn');
    const txt=document.getElementById('copyText');
    const CODE='SOL-7K4F-92QX';
    btn.addEventListener('click',()=>{
      if(navigator.clipboard){navigator.clipboard.writeText(CODE).catch(()=>{});}
      btn.classList.add('copied');
      txt.textContent='Kopiert';
      setTimeout(()=>{
        btn.classList.remove('copied');
        txt.textContent='Code kopieren';
      },1800);
    });
  </script>
</body>
</html>
