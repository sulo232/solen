<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solen — Gutschein gekauft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ─────────── TOKENS (verbatim from _KIT.html) ─────────── */
  :root{
    --ink:#0A0A0A;        /* primary text, structure, primary CTA fill */
    --ink-2:#6B6B6B;      /* secondary text, meta */
    --ink-3:#9B9B9B;      /* tertiary text, eyebrow, counts */
    --border:#E4E4E7;     /* hairline + card border (cool grey) */
    --bg:#FFFFFF;
    --sunken:#F4F4F5;     /* cool grey fill: chips, "Alle ansehen", icon tiles, tracks */
    --blue:#276EF1;       /* SMALL clickable bits ONLY: review count, text links */
    --green:#16A34A;      /* available / open / success / paid */
    --star:#FFC32B;       /* rating star */
    --error:#DC2626;      /* error, closed status, destructive */
    --heart:#FF3366;      /* saved/favourite */
    /* real geometry */
    --r-card:24px;        /* rounded-3xl — the card radius */
    --r-sheet:20px;       /* content sheet rounded top */
    --r-pill:9999px;      /* every pill: chips, CTAs, "Alle ansehen", badges */
    --r-tile:14px;        /* small icon tiles / inner blocks */
    --pad-card:20px;
    --shadow-card:0 1px 3px rgba(10,10,10,.05), 0 6px 16px -10px rgba(10,10,10,.10);
    --shadow-frost:0 1px 3px rgba(0,0,0,.10);
    --gap-section:30px;   /* between PDP sections */
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:'Inter',sans-serif;background:#E9E9EC;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:28px 0 80px;}

  /* ═══════════ THE 390px FRAME ═══════════ */
  .frame{width:390px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:800px;}

  /* ─────────── iOS STATUS BAR (verbatim recipe) ─────────── */
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;letter-spacing:-.01em;flex:none;}
  .statusbar .ico{display:flex;gap:6px;align-items:center;}

  /* ─────────── TYPE SCALE (verbatim) ─────────── */
  .t-display{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.022em;line-height:1.05;}
  .t-body{font-size:14px;font-weight:400;line-height:1.5;color:var(--ink-2);}
  .t-meta{font-size:13px;font-weight:400;color:var(--ink-3);}
  .t-eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}
  .mono{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}

  /* ─────────── CARD (rounded-3xl 24px, verbatim) ─────────── */
  .card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:var(--pad-card);}

  /* ─────────── BUTTONS (verbatim) ─────────── */
  .btn-ink{background:var(--ink);color:#fff;border:none;border-radius:var(--r-pill);
    padding:14px 28px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .14s var(--ease);}
  .btn-ink:active{transform:scale(.97);}
  .btn-ink.full{width:100%;padding:16px 28px;}
  .btn-sunken{background:var(--sunken);color:var(--ink);border:none;border-radius:var(--r-pill);
    padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .14s var(--ease);}
  .btn-sunken:active{transform:scale(.97);}
  .btn-sunken.full{width:100%;padding:16px 28px;font-size:15px;}
  .link{color:var(--blue);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;background:none;border:none;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:6px;}
  .link:hover{text-decoration:underline;}

  /* ─────────── SUCCESS MARK (verbatim: green disc + white check, spring) ─────────── */
  .successmark{width:80px;height:80px;border-radius:var(--r-pill);background:var(--green);display:flex;align-items:center;justify-content:center;
    animation:pop .42s var(--ease) both;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.06);}100%{transform:scale(1);opacity:1;}}
  .successmark svg{stroke:#fff;}
  .check-path{stroke-dasharray:30;stroke-dashoffset:30;animation:drawCheck .4s cubic-bezier(.65,0,.45,1) .34s forwards;}
  @keyframes drawCheck{to{stroke-dashoffset:0;}}

  /* ─────────── ENTRANCE (stagger, verbatim base) ─────────── */
  .rise{animation:rise .55s var(--ease) both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .d1{animation-delay:.10s;} .d2{animation-delay:.22s;} .d3{animation-delay:.34s;} .d4{animation-delay:.46s;}

  /* ─────────── PAGE LAYOUT (full centred success page) ─────────── */
  .page{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 24px 0;text-align:center;}
  .head{margin-top:22px;}
  .head .t-display{font-size:30px;}
  .head .t-body{margin-top:8px;max-width:280px;}

  /* voucher card — ink-headed band + big mono code */
  .voucher{width:100%;margin-top:26px;padding:0;overflow:hidden;text-align:left;}
  .vhead{background:var(--ink);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
  .vhead .bname{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em;color:#fff;}
  .vhead .vtag{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.5);}
  .vbody{padding:24px 20px;text-align:center;}
  .code-label{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}
  /* the ONE big number on this screen */
  .code{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:31px;letter-spacing:.06em;color:var(--ink);margin-top:10px;line-height:1;}
  .vmeta{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);text-align:center;}
  .vmeta .row{display:inline-flex;align-items:center;gap:8px;}
  .vmeta .amt{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .vmeta .dot-sep{color:var(--ink-3);}
  .vmeta .who{font-size:14px;color:var(--ink-2);}
  .copyrow{margin-top:16px;text-align:center;}
  .link .ic-check{display:none;}
  .link.copied{color:var(--green);}
  .link.copied .ic-copy{display:none;}
  .link.copied .ic-check{display:inline;}

  /* actions */
  .actions{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:12px;}

  /* email note — grey line at the bottom */
  .email-note{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;padding:28px 0 30px;color:var(--ink-2);font-size:13px;line-height:1.4;}
  .email-note svg{stroke:var(--ink-3);width:16px;height:16px;flex:none;}
  .email-note strong{color:var(--ink);font-weight:600;}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}.check-path{stroke-dashoffset:0;}}
</style>
</head>
<body>

<div class="frame">

  <!-- iOS status bar (verbatim chrome) -->
  <div class="statusbar"><span>9:41</span><span class="ico">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#0A0A0A"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="#0A0A0A"><path d="M8 2.2c2.1 0 4 .8 5.4 2.2l1.2-1.3A9.5 9.5 0 0 0 8 .3 9.5 9.5 0 0 0 1.4 3.1l1.2 1.3A7.6 7.6 0 0 1 8 2.2z"/><path d="M8 5.6c1.2 0 2.3.5 3.1 1.3l1.2-1.3A6 6 0 0 0 8 3.9a6 6 0 0 0-4.3 1.7l1.2 1.3A4.4 4.4 0 0 1 8 5.6z"/><circle cx="8" cy="9" r="1.6"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="#0A0A0A" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="#0A0A0A"/><rect x="23" y="4" width="1.5" height="4" rx="1" fill="#0A0A0A" fill-opacity=".4"/></svg>
  </span></div>

  <div class="page">

    <!-- SUCCESS MARK (green disc + white check) -->
    <div class="successmark">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="check-path" d="M20 6L9 17l-5-5"/></svg>
    </div>

    <!-- HEADLINE -->
    <div class="head rise d1">
      <h1 class="t-display">Gutschein gekauft</h1>
      <p class="t-body">Dein Beauty-Gutschein ist bereit und liegt in deiner Wallet.</p>
    </div>

    <!-- VOUCHER CARD -->
    <div class="card voucher rise d2">
      <div class="vhead">
        <span class="bname">Solen</span>
        <span class="vtag">Gutschein</span>
      </div>
      <div class="vbody">
        <div class="code-label">Gutschein-Code</div>
        <div class="code">GIFT-7K2M-9XQ4</div>
        <div class="vmeta">
          <span class="row">
            <span class="amt">CHF 100</span>
            <span class="dot-sep">·</span>
            <span class="who">An dich</span>
          </span>
        </div>
        <div class="copyrow">
          <button class="link" id="copyBtn">
            <svg class="ic-copy" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <svg class="ic-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            <span id="copyText">Code kopieren</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions rise d3">
      <button class="btn-ink full">
        Zur Wallet
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button class="btn-sunken full">Zurück zum Profil</button>
    </div>

    <!-- EMAIL NOTE -->
    <div class="email-note rise d4">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
      <span>Wir haben dir den Gutschein per <strong>E-Mail</strong> geschickt.</span>
    </div>

  </div>
</div>

<script>
  const btn=document.getElementById('copyBtn');
  const txt=document.getElementById('copyText');
  const CODE='GIFT-7K2M-9XQ4';
  btn.addEventListener('click',()=>{
    if(navigator.clipboard){navigator.clipboard.writeText(CODE).catch(()=>{});}
    btn.classList.add('copied');
    txt.textContent='Kopiert';
    setTimeout(()=>{btn.classList.remove('copied');txt.textContent='Code kopieren';},1800);
  });
</script>
</body>
</html>
