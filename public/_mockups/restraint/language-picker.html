<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solen — Sprache wählen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .lucide{width:20px;height:20px;stroke-width:1.8;flex-shrink:0}
  /* ─────────── TOKENS (verbatim from _KIT.html) ─────────── */
  :root{
    --ink:#0A0A0A;
    --ink-2:#6B6B6B;
    --ink-3:#9B9B9B;
    --border:#E4E4E7;
    --bg:#FFFFFF;
    --sunken:#F4F4F5;
    --blue:#276EF1;
    --green:#16A34A;
    --star:#FFC32B;
    --error:#DC2626;
    --heart:#FF3366;
    --r-card:24px;
    --r-sheet:20px;
    --r-pill:9999px;
    --r-tile:14px;
    --pad-card:20px;
    --shadow-card:0 1px 3px rgba(10,10,10,.05), 0 6px 16px -10px rgba(10,10,10,.10);
    --shadow-frost:0 1px 3px rgba(0,0,0,.10);
    --gap-section:30px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:'Inter',sans-serif;background:#E9E9EC;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0 80px;}

  /* ═══════════ THE 390px FRAME ═══════════ */
  .frame{width:390px;height:760px;background:var(--bg);position:relative;overflow:hidden;}

  /* ─────────── iOS STATUS BAR ─────────── */
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:15px;font-weight:600;letter-spacing:-.01em;position:relative;z-index:2;}
  .statusbar .ico{display:flex;gap:6px;align-items:center;}

  /* ─────────── TYPE SCALE ─────────── */
  .t-display{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.022em;line-height:1.05;}
  .t-title{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.1;}
  .t-section{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.015em;}
  .t-row{font-family:'Inter Tight',sans-serif;font-weight:600;font-size:15.5px;letter-spacing:-.01em;}
  .t-body{font-size:14px;font-weight:400;line-height:1.5;color:var(--ink-2);}
  .t-meta{font-size:13px;font-weight:400;color:var(--ink-3);}
  .t-eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}
  /* NUMBERS: prices, durations, counts → Inter Tight tabular (NOT mono). */
  .num{font-family:'Inter Tight',sans-serif;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  /* MONO: JetBrains Mono is for CODES ONLY (voucher / ticket codes). Never on counts. */
  .mono{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}

  /* ─────────── ACCOUNT/SETTINGS LIST ROW (the page underneath, dimmed by scrim) ─────────── */
  .lrow{display:flex;align-items:center;gap:14px;padding:15px 16px;}
  .lrow-ico{width:38px;height:38px;border-radius:var(--r-tile);background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
  .lrow-main{flex:1;min-width:0;}
  .lrow-sub{font-size:13px;color:var(--ink-3);margin-top:1px;}
  .lrow-chev{color:var(--ink);}

  /* ─────────── BUTTONS ─────────── */
  .btn-ink{background:var(--ink);color:#fff;border:none;border-radius:var(--r-pill);
    padding:14px 28px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .14s var(--ease);}
  .btn-ink:active{transform:scale(.97);}
  .btn-ink.full{width:100%;padding:16px 28px;}

  /* ═══════════ BOTTOM SHEET (kit recipe) ═══════════ */
  .scrim{position:absolute;inset:0;background:rgba(10,10,10,.4);animation:fade .4s var(--ease) both;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .bsheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 20px 26px;
    box-shadow:0 -12px 40px -16px rgba(10,10,10,.22);animation:up .42s var(--ease) both;}
  .bsheet-grab{width:36px;height:4px;border-radius:var(--r-pill);background:var(--border);margin:6px auto 16px;}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}

  .bsheet-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .bsheet-head .mono{font-size:14px;color:var(--ink-3);}

  /* language rows — built from the kit list-row anatomy (.lrow + sunken icon tile + chev slot) */
  .lang{display:flex;align-items:center;gap:14px;padding:14px 4px;cursor:pointer;transition:transform .12s var(--ease);}
  .lang + .lang{border-top:1px solid var(--border);}
  .lang:active{transform:scale(.98);}
  .lang-flag{width:42px;height:42px;border-radius:var(--r-pill);background:var(--sunken);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  /* inline SVG flag chip — rounded-rect ~22x16, hairline ring */
  .lang-flag svg{width:22px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(10,10,10,.08);display:block;}
  .lang-main{flex:1;min-width:0;}
  .lang-native{font-size:13px;color:var(--ink-3);margin-top:1px;}
  /* selected = INK check, never blue, never a fill */
  .lang-check{color:var(--ink);display:none;flex-shrink:0;}
  .lang.is-selected .lang-check{display:block;}

  /* ─────────── ENTRANCE (stagger) ─────────── */
  .rise{animation:rise .55s var(--ease) both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  .kit-label{font-family:'Inter Tight';font-weight:700;font-size:12px;color:#6B6B6B;width:390px;padding:4px 2px;text-transform:uppercase;letter-spacing:.06em;}
</style>
</head>
<body>

<div class="kit-label">Sprache wählen bottom sheet</div>
<div class="frame">

  <!-- ───────── PAGE UNDERNEATH (account / settings, dimmed by the scrim) ───────── -->
  <div class="statusbar"><span>9:41</span><span class="ico">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#0A0A0A"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="#0A0A0A"><path d="M8 2.2c2.1 0 4 .8 5.4 2.2l1.2-1.3A9.5 9.5 0 0 0 8 .3 9.5 9.5 0 0 0 1.4 3.1l1.2 1.3A7.6 7.6 0 0 1 8 2.2z"/><path d="M8 5.6c1.2 0 2.3.5 3.1 1.3l1.2-1.3A6 6 0 0 0 8 3.9a6 6 0 0 0-4.3 1.7l1.2 1.3A4.4 4.4 0 0 1 8 5.6z"/><circle cx="8" cy="9" r="1.6"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="#0A0A0A" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="#0A0A0A"/><rect x="23" y="4" width="1.5" height="4" rx="1" fill="#0A0A0A" fill-opacity=".4"/></svg>
  </span></div>

  <div style="padding:6px 20px 0;">
    <h1 class="t-display">Konto</h1>
    <p class="t-body" style="margin-top:6px;">Einstellungen &amp; Präferenzen</p>
  </div>

  <div style="padding:16px 16px 0;">
    <div class="lrow"><span class="lrow-ico"><i data-lucide="user" style="width:19px;height:19px"></i></span><div class="lrow-main"><div class="t-row">Persönliche Daten</div><div class="lrow-sub">Name, E-Mail, Telefon</div></div><span class="lrow-chev"><i data-lucide="chevron-right" style="width:18px;height:18px"></i></span></div>
    <div class="lrow" style="border-top:1px solid var(--border);"><span class="lrow-ico"><i data-lucide="globe" style="width:19px;height:19px"></i></span><div class="lrow-main"><div class="t-row">Sprache</div><div class="lrow-sub">Deutsch (Schweiz)</div></div><span class="lrow-chev"><i data-lucide="chevron-right" style="width:18px;height:18px"></i></span></div>
    <div class="lrow" style="border-top:1px solid var(--border);"><span class="lrow-ico"><i data-lucide="bell" style="width:19px;height:19px"></i></span><div class="lrow-main"><div class="t-row">Benachrichtigungen</div><div class="lrow-sub">Push &amp; E-Mail</div></div><span class="lrow-chev"><i data-lucide="chevron-right" style="width:18px;height:18px"></i></span></div>
  </div>

  <!-- ───────── SCRIM + BOTTOM SHEET ───────── -->
  <div class="scrim"></div>
  <div class="bsheet">
    <div class="bsheet-grab"></div>
    <div class="bsheet-head">
      <h2 class="t-section">Sprache</h2>
    </div>

    <div style="margin-top:4px;">
      <div class="lang is-selected rise" style="animation-delay:.04s">
        <span class="lang-flag"><svg viewBox="0 0 5 3" preserveAspectRatio="xMidYMid slice"><rect width="5" height="1" y="0" fill="#000000"/><rect width="5" height="1" y="1" fill="#DD0000"/><rect width="5" height="1" y="2" fill="#FFCE00"/></svg></span>
        <div class="lang-main">
          <div class="t-row">Deutsch</div>
          <div class="lang-native">German</div>
        </div>
        <span class="lang-check"><i data-lucide="check" style="width:22px;height:22px"></i></span>
      </div>

      <div class="lang rise" style="animation-delay:.09s">
        <span class="lang-flag"><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice"><clipPath id="gb-r"><rect width="60" height="30" rx="3"/></clipPath><g clip-path="url(#gb-r)"><rect width="60" height="30" fill="#012169"/><path d="M0,0 60,30 M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30 M60,0 0,30" stroke="#C8102E" stroke-width="4"/><path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/></g></svg></span>
        <div class="lang-main">
          <div class="t-row">English</div>
          <div class="lang-native">English</div>
        </div>
        <span class="lang-check"><i data-lucide="check" style="width:22px;height:22px"></i></span>
      </div>

      <div class="lang rise" style="animation-delay:.14s">
        <span class="lang-flag"><svg viewBox="0 0 3 2" preserveAspectRatio="xMidYMid slice"><rect width="1" height="2" x="0" fill="#0055A4"/><rect width="1" height="2" x="1" fill="#FFFFFF"/><rect width="1" height="2" x="2" fill="#EF4135"/></svg></span>
        <div class="lang-main">
          <div class="t-row">Français</div>
          <div class="lang-native">French</div>
        </div>
        <span class="lang-check"><i data-lucide="check" style="width:22px;height:22px"></i></span>
      </div>

      <div class="lang rise" style="animation-delay:.19s">
        <span class="lang-flag"><svg viewBox="0 0 3 2" preserveAspectRatio="xMidYMid slice"><rect width="1" height="2" x="0" fill="#009246"/><rect width="1" height="2" x="1" fill="#FFFFFF"/><rect width="1" height="2" x="2" fill="#CE2B37"/></svg></span>
        <div class="lang-main">
          <div class="t-row">Italiano</div>
          <div class="lang-native">Italian</div>
        </div>
        <span class="lang-check"><i data-lucide="check" style="width:22px;height:22px"></i></span>
      </div>
    </div>

    <button class="btn-ink full" style="margin-top:22px;">Fertig</button>
  </div>

</div>

<script>window.addEventListener('DOMContentLoaded',()=>lucide.createIcons());</script>
</body>
</html>
