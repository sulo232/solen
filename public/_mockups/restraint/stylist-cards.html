<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solen — Team (PDP)</title>
<!-- Matches the REAL app component app/[locale]/_components/salon/SalonTeam.tsx:
     rounded-3xl white card + shadow-float, "Team" + ink "Alle ansehen", a horizontal
     carousel of 88px avatars each with a rating badge + name + first specialty.
     No featured card / no selection ring / no bookings-count — those were invented. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .lucide{width:20px;height:20px;stroke-width:1.8;flex-shrink:0}
  :root{--ink:#0A0A0A;--ink-2:#6B6B6B;--ink-3:#9B9B9B;--border:#E4E4E7;--bg:#FFFFFF;--sunken:#F4F4F5;
    --blue:#276EF1;--star:#FFC32B;--r-pill:9999px;--ease:cubic-bezier(.16,1,.3,1);
    --shadow-float:0 1px 3px rgba(10,10,10,.05), 0 10px 30px -12px rgba(10,10,10,.12);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:'Inter',sans-serif;background:#E9E9EC;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0 80px;}
  .frame{width:390px;background:var(--bg);position:relative;overflow:hidden;}
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:15px;font-weight:600;letter-spacing:-.01em;}
  .statusbar .ico{display:flex;gap:6px;align-items:center;}
  .num{font-family:'Inter Tight',sans-serif;font-weight:600;font-variant-numeric:tabular-nums;}

  /* the real SalonTeam card: rounded-3xl, white, shadow-float, p-5 */
  .team-card{margin:14px 16px;background:#fff;border-radius:24px;box-shadow:var(--shadow-float);padding:20px;
    animation:rise .55s var(--ease) both .05s;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .team-head{display:flex;align-items:baseline;justify-content:space-between;}
  .team-head h2{font-family:'Inter Tight',sans-serif;font-weight:600;font-size:20px;letter-spacing:-.02em;line-height:1.2;}
  /* "Alle ansehen" = INK (per the real component), not blue */
  .team-head a{font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;cursor:pointer;}
  .team-head a:hover{opacity:.8;}

  /* horizontal carousel of members */
  .team-row{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;margin-top:20px;padding-top:2px;padding-bottom:4px;}
  .team-row::-webkit-scrollbar{display:none;}
  .member{flex-shrink:0;width:104px;text-align:center;cursor:pointer;}
  .member .av-wrap{position:relative;width:88px;height:88px;margin:0 auto;transition:transform .2s var(--ease);}
  .member:hover .av-wrap{transform:scale(1.04);}
  .member .av-wrap img{width:88px;height:88px;border-radius:var(--r-pill);object-fit:cover;display:block;}
  /* rating badge folded into the avatar bottom edge (white pill, ★ + rating) */
  .rate-badge{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:3px;
    background:#fff;border:1px solid var(--border);border-radius:var(--r-pill);padding:2px 8px;box-shadow:0 1px 3px rgba(10,10,10,.1);}
  .rate-badge .num{font-size:12px;color:var(--ink);}
  .member .nm{font-family:'Inter Tight',sans-serif;font-weight:500;font-size:15px;color:var(--ink);margin-top:16px;line-height:1.2;}
  .member .role{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.25;}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="frame">
  <div class="statusbar"><span>9:41</span><span class="ico">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#0A0A0A"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="#0A0A0A"><path d="M8 2.2c2.1 0 4 .8 5.4 2.2l1.2-1.3A9.5 9.5 0 0 0 8 .3 9.5 9.5 0 0 0 1.4 3.1l1.2 1.3A7.6 7.6 0 0 1 8 2.2z"/><path d="M8 5.6c1.2 0 2.3.5 3.1 1.3l1.2-1.3A6 6 0 0 0 8 3.9a6 6 0 0 0-4.3 1.7l1.2 1.3A4.4 4.4 0 0 1 8 5.6z"/><circle cx="8" cy="9" r="1.6"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="#0A0A0A" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="#0A0A0A"/><rect x="23" y="4" width="1.5" height="4" rx="1" fill="#0A0A0A" fill-opacity=".4"/></svg>
  </span></div>

  <div class="team-card">
    <div class="team-head">
      <h2>Team</h2>
      <a>Alle ansehen</a>
    </div>
    <div class="team-row">
      <div class="member">
        <div class="av-wrap">
          <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=200&q=80" referrerpolicy="no-referrer" alt="">
          <span class="rate-badge"><i data-lucide="star" style="width:11px;height:11px;color:#FFC32B;fill:#FFC32B"></i><span class="num">4.9</span></span>
        </div>
        <div class="nm">Nadia F.</div>
        <div class="role">Balayage</div>
      </div>
      <div class="member">
        <div class="av-wrap">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80" referrerpolicy="no-referrer" alt="">
          <span class="rate-badge"><i data-lucide="star" style="width:11px;height:11px;color:#FFC32B;fill:#FFC32B"></i><span class="num">4.8</span></span>
        </div>
        <div class="nm">Léa M.</div>
        <div class="role">Coloration</div>
      </div>
      <div class="member">
        <div class="av-wrap">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" referrerpolicy="no-referrer" alt="">
          <span class="rate-badge"><i data-lucide="star" style="width:11px;height:11px;color:#FFC32B;fill:#FFC32B"></i><span class="num">5.0</span></span>
        </div>
        <div class="nm">Jonas W.</div>
        <div class="role">Herrenschnitt</div>
      </div>
      <div class="member">
        <div class="av-wrap">
          <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=200&q=80" referrerpolicy="no-referrer" alt="">
          <span class="rate-badge"><i data-lucide="star" style="width:11px;height:11px;color:#FFC32B;fill:#FFC32B"></i><span class="num">4.7</span></span>
        </div>
        <div class="nm">Sofia R.</div>
        <div class="role">Make-up</div>
      </div>
    </div>
  </div>
</div>

<script>window.addEventListener('DOMContentLoaded',()=>lucide.createIcons());</script>
</body>
</html>
