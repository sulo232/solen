<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Dashboard card signature , full screen before/after</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Grounded-in: app/[locale]/dashboard/revenue/page.tsx
  FULL-SCREEN before/after. BEFORE = LIVE <iframe> of the real revenue page via
  /api/dev/login?to=/de/dashboard/revenue (legacy cards hand-rolled at 12/16px with a warm-brown shadow). AFTER =
  the DashPanel signature: rounded-card-lg 20px + cool #E4E4E7 hairline + cool elevation. Only the card chrome changes.
  Depicts: dashboard revenue cards -> app/[locale]/dashboard/revenue/page.tsx
  Exists-check: `npm run exists "DashPanel dashboard card"` ran earlier , the primitive already exists.
  Backend-check: revenue is live data; no fabricated values. English chrome; live iframe shows real German.
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#52525B;--ink3:#A1A1AA;--sunken:#F4F4F5;--hairline:#E4E4E7;--accent:#276EF1;--font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;padding:0 12px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(320px,80vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{position:fixed;top:52px;left:0;right:0;bottom:0}
  .pane{position:absolute;inset:0;overflow-y:auto}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
  .after{max-width:520px;margin:0 auto;min-height:100%;padding:22px 16px 40px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-0.02em}
  .card{margin-top:14px;background:#fff;border:1px solid var(--hairline);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(10,10,10,.04),0 10px 28px -18px rgba(10,10,10,.12)}
  .kc{height:32px;width:32px;border-radius:10px;background:rgba(39,110,241,.12);color:var(--accent);display:grid;place-items:center;margin-bottom:10px}
  .kc svg{width:17px;height:17px}
  .kv{font-size:20px;font-weight:700;letter-spacing:-0.02em}.kl{font-size:12px;color:var(--ink3);margin-top:1px}
  .cap{font-size:11.5px;color:var(--ink3);margin-top:22px;line-height:1.5;border-top:1px solid var(--hairline);padding-top:14px}
</style>
</head>
<body>
  <div class="top"><div class="seg"><button id="bB" class="on" onclick="show('before')">Before (live)</button><button id="bA" onclick="show('after')">After</button></div></div>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe src="/api/dev/login?to=/de/dashboard/revenue" title="live revenue"></iframe></div>
    <div id="paneAfter" class="pane hidden">
      <div class="after">
        <div class="h1">Revenue</div>
        <div class="card"><div class="kc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg></div><div class="kv">CHF 4,210</div><div class="kl">This week</div></div>
        <div class="card"><div class="kc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lucide"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div><div class="kv">128</div><div class="kl">Bookings</div></div>
        <div class="cap">Change applied: every dashboard card uses the DashPanel signature, rounded 20 + cool #E4E4E7 hairline + cool elevation, instead of hand-rolled 12/16px cards with a warm-brown shadow left over from the old skin.</div>
      </div>
    </div>
  </div>
<script>function show(w){document.getElementById('paneBefore').classList.toggle('hidden',w!=='before');document.getElementById('paneAfter').classList.toggle('hidden',w!=='after');document.getElementById('bB').classList.toggle('on',w==='before');document.getElementById('bA').classList.toggle('on',w==='after');}</script>
</body>
</html>
