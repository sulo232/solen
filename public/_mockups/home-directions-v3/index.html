<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Continue + recently viewed: four directions from four real apps</title>
<!-- Base: capture live -->
<!-- Scale: full-page -->
<!--
  Mockup-scope: whole-page
  Grounded-in: app/[locale]/_components/homepage/RecentlyViewed.tsx
  Grounded-in: app/[locale]/_components/homepage/ContinueCard.tsx
  Depicts: the homepage feed -> app/[locale]/page.tsx
  treatment-only for the surrounding page. measure-ok.

  Reference-checked: _design-system/references/continue-and-recently-viewed--home.md
  Reference-checked: _design-system/references/airbnb--home-mobile.md

  Exists-check: ran this turn, four terms. `npm run exists recently-viewed` returns 12 matches:
    RecentlyViewed.tsx, RecentlyViewedTiles.tsx, useRecentlyViewed.ts, the /recently-viewed route and
    RECENTLY_VIEWED_DEMO_IDS all already exist, and RecentlyViewed is already mounted on the homepage
    at app/[locale]/page.tsx:289. Nothing here builds a second one.
    `npm run exists continue-card` returns 5, including THREE graveyard entries that bind this file:
      - a separate continue-states mockup page (killed 2026-07-31, do not make a second page)
      - the fanned stacked-photo card (killed 2026-08-15)
      - dates, weekdays and head counts on the card (killed 2026-08-15)
    None of the three is re-proposed here. This is one page with a switcher, not a second page.
    `npm run exists "continue search"` and `npm run exists home-directions` both return 0.

  WHY THE ROW LOOKED MISSING, since the owner said we did nothing for it. It is not missing and it
  was not skipped. RecentlyViewed.tsx renders a curated "Top auf Solen" fallback when localStorage
  has no history (its own header comment says so, and it returns null only when the fallback ALSO
  comes back empty). A fresh iframe has no history, so the real component was rendering its
  cold-start state the whole time and reading as a different section. This page seeds
  `solen.recently-viewed` into the frame before load, so the REAL component renders its REAL state.
  Seeding is the fix, not fabrication: the rows go through the component's normal read path.

  measured: his two screenshots, PIL, this turn. Scale anchored on the iOS home indicator, 139pt wide
    and 330px in the image, so 2.3741 px/pt and a 387.5pt phone.
      continue card        301.2 x 104.9 pt   ratio 2.87:1
      card photo            66.6 x  76.2 pt   ratio 0.87:1, PORTRAIT, insets top 19 / bottom 9.7 / right 17.3
      recently-viewed thumb 106.1 x 100.7 pt  ratio 1.05:1, gap 11.4pt, pitch 117.5pt
      see-all arrow          27.0 pt diameter
      category pill icon     13.9 pt
      row left gutter        23.6 pt
      search pill          347.5 x  54.8 pt   gutter 19.8pt
  measured: our live page, getBoundingClientRect this turn, viewport 407px, normalise by x0.952.
      see-all arrow 44px -> 41.9pt   = +55% against the reference
      viewed thumb 150px -> 142.8pt  = +35% against the reference
      card photo 92x74 (1.24:1)      = +32% wide and landscape where the reference is portrait
      pill icon 24px -> 22.9pt       = +65%
      row gutter 16px -> 15.2pt      = -36%, ours is tighter

  Diagnosis: our see-all arrow is far larger than the reference | measured 41.9pt normalised against 27.0pt, on 11 rows of the homepage | violates his instruction of 2026-08-15 ("big size difference between the screenshot Airbnb reference and ours") | target 28px visible
  Diagnosis: our recently-viewed thumb is far wider than the reference | measured 142.8pt normalised against 106.1pt | violates the same instruction | target 112px
  Diagnosis: the continue-card photo is landscape where the reference is portrait | measured 1.24:1 against 0.87:1 | violates the same instruction | target 0.87:1
  Diagnosis: our category pill icon is oversized | measured 22.9pt normalised against 13.9pt | violates his instruction of 2026-08-15 ("the category icons are too big") | target 15px

  TOUCH-TARGET COLLISION, surfaced rather than silently resolved. A 27pt circle is below the 44px
  touch floor this project locks (design contract, icon-button h-11 w-11) and below WCAG 2.5.5. The
  statutory tier outranks a taste source, so every direction here draws a 28px CIRCLE inside a 44px
  tap target. The look matches the reference, the target does not shrink.

  Four directions, every one captured from a real app this turn via Mobbin, none recalled:
    1 AIRBNB   his reference, corrected to the measured sizes    his own two screenshots
    2 MARRIOTT eyebrow + one resume LINE, no card                mobbin.com/screens/87550d69-834b-45ea-8c84-5b172b304433
    3 BESTBUY  one section, a pill switches saved vs viewed      mobbin.com/screens/ec2090d6-c6e5-4d53-8038-bc4198bcfe7b
    4 VRBO     recent SEARCHES as sunken chips, then viewed      mobbin.com/screens/a2150d39-9dd0-4282-aad3-a0a44e8953fe
-->
<style>
  :root{--ink:#0A0A0A;--ink2:#6B6B6B;--sunken:#F4F4F5;--hairline:#E4E4E7;--star:#FFC32B;
        --font:'Inter Tight',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.94);
       backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);padding:8px 10px}
  .row{display:flex;justify-content:center}
  .row + .row{margin-top:6px}
  .seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;width:min(360px,92vw)}
  .seg button{flex:1;border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:600;
              color:var(--ink2);padding:7px 0;border-radius:999px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .scrollseg{overflow-x:auto;scrollbar-width:none;justify-content:flex-start}
  .scrollseg::-webkit-scrollbar{display:none}
  .scrollseg button{flex:0 0 auto;padding:7px 14px}
  .cap{position:fixed;top:96px;left:0;right:0;z-index:19;background:var(--sunken);color:var(--ink2);
       font-size:12px;font-weight:600;text-align:center;padding:6px 12px;line-height:1.35}
  .stage{position:fixed;top:128px;left:0;right:0;bottom:0;transition:top .18s ease}
  body.bare .top,body.bare .cap{display:none}
  body.bare .stage{top:0}
  .peek{position:fixed;right:6px;top:6px;z-index:30;width:30px;height:30px;border:0;border-radius:999px;
        background:rgba(10,10,10,.82);color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);
        display:flex;align-items:center;justify-content:center;opacity:.55;transition:opacity .15s ease}
  .peek:hover,.peek:active{opacity:1}
  body.bare .peek{opacity:.4}
  .pane{position:absolute;inset:0}
  .pane.hidden{display:none}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div class="top">
    <div class="row"><div class="seg">
      <button id="bBefore" class="on" onclick="show('before')">Before (live)</button>
      <button id="bAfter" onclick="show('after')">After</button>
    </div></div>
    <div class="row"><div class="seg scrollseg">
      <button id="d1" class="on" onclick="pick('airbnb')">Airbnb 5:4</button>
      <button id="d2" onclick="pick('airbnbTall')">Airbnb tall</button>
      <button id="d3" onclick="pick('marriott')">Marriott</button>
      <button id="d4" onclick="pick('bestbuy')">Best Buy</button>
      <button id="d5" onclick="pick('vrbo')">Vrbo</button>
    </div></div>
  </div>
  <div class="cap" id="cap">Loading direction</div>
  <button class="peek" id="peek" onclick="bare()" title="Hide controls" aria-label="Hide controls"></button>
  <div class="stage">
    <div id="paneBefore" class="pane"><iframe id="beforeFrame" src="/en" title="the real homepage, before"></iframe></div>
    <div id="paneAfter" class="pane hidden"><iframe id="afterFrame" src="/en" title="the real homepage, after"></iframe></div>
  </div>

<script>
/* ============================================================================
   SHARED KIT. Every direction file gets this object and may not redefine any of
   it. Sizes here are the measured reference values, so a direction that wants a
   different number has to say so in its own caption.
   ========================================================================== */
window.MK = (function(){

  // Real seeded salons, read from the live database 2026-08-14. Photos are the
  // seeded stock the owner asked to keep ("those stocks are to see as a beta").
  var SALONS = [
    {slug:"cuts-and-culture",   name:"Cuts & Culture",   category:"barbershop",
     photo:"https://images.unsplash.com/photo-1622288432450-277d0fef5ed6?w=800&q=80", cat:"Barbershop", r:"4.8", c:16, price:"15"},
    {slug:"haarsalon-margot",   name:"Haarsalon Margot", category:"coiffeur",
     photo:"https://images.unsplash.com/photo-1487412947147-5cebf100ffc2?w=800&q=80", cat:"Coiffeur",   r:"4.8", c:16, price:"45"},
    {slug:"atelier-haarwerk",   name:"Atelier Haarwerk", category:"coiffeur",
     photo:"https://images.unsplash.com/photo-1560066984-138dadb4c035?w=800&q=80", cat:"Coiffeur",   r:"4.6", c:25, price:"60"},
    {slug:"velvet-face",        name:"Velvet Face",      category:"spa",
     photo:"https://images.unsplash.com/photo-1512290923902-8a9f81dc236c?w=800&q=80", cat:"Make-up",    r:"4.6", c:7,  price:"80"},
    {slug:"nagelstudio-lumen",  name:"Nagelstudio Lumen",category:"nails",
     photo:"https://images.unsplash.com/photo-1604654894610-df63bc536371?w=800&q=80", cat:"Nails",      r:"4.7", c:31, price:"55"}
  ];

  // Real Lucide paths. Hand-drawn glyphs are refused by the icon gate and by the owner.
  var ICON = {
    arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    chevronRight: '<path d="m9 18 6-6-6-6"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>'
  };
  function svg(name, px, stroke){
    return '<svg class="lucide lucide-' + name + '" width="' + px + '" height="' + px + '" viewBox="0 0 24 24" ' +
      'fill="none" stroke="currentColor" stroke-width="' + (stroke || 2) + '" stroke-linecap="round" ' +
      'stroke-linejoin="round">' + ICON[name] + '</svg>';
  }

  // MEASURED reference geometry. A direction reads these; it does not invent sizes.
  var REF = {
    cardW: 306, cardH: 105, cardRatio: 2.87,
    photoW: 70, photoH: 80, photoRatio: 0.87,
    thumbW: 112, thumbH: 106, thumbRatio: 1.05,
    thumbGap: 12, gutter: 24,
    arrowVisible: 28,   // the measured 27pt circle, rounded to our 4pt scale
    arrowTap: 44,       // the touch floor the circle sits inside, non-negotiable
    pillIcon: 15
  };

  function el(doc, tag, css, html){
    var n = doc.createElement(tag);
    if (css) n.style.cssText = css;
    if (html != null) n.innerHTML = html;
    return n;
  }

  /* The see-all control every direction must use. 28px of visible circle inside a
     44px tap target, which is how the reference look and the touch floor coexist. */
  function seeAll(doc, label){
    var a = doc.createElement("a");
    a.href = "#";
    a.setAttribute("aria-label", label || "See all");
    a.style.cssText = "flex:0 0 " + REF.arrowTap + "px;width:" + REF.arrowTap + "px;height:" + REF.arrowTap +
      "px;margin-right:-8px;display:grid;place-items:center;text-decoration:none;color:#0A0A0A";
    var dot = doc.createElement("span");
    dot.style.cssText = "width:" + REF.arrowVisible + "px;height:" + REF.arrowVisible + "px;border-radius:999px;" +
      "background:#F4F4F5;display:grid;place-items:center";
    dot.innerHTML = svg("arrowRight", 14);
    a.appendChild(dot);
    return a;
  }

  function sectionHead(doc, title, withArrow){
    var head = el(doc, "div",
      "display:flex;align-items:center;justify-content:space-between;padding:0 " + REF.gutter + "px 12px");
    var h = el(doc, "h2", "font:600 22px/1.2 'Inter Tight',Inter,sans-serif;letter-spacing:-.01em;margin:0;color:#0A0A0A");
    h.textContent = title;
    head.appendChild(h);
    if (withArrow !== false) head.appendChild(seeAll(doc, "See all " + title));
    return head;
  }

  function rail(doc){
    return el(doc, "div",
      "display:flex;gap:" + REF.thumbGap + "px;overflow-x:auto;padding:0 " + REF.gutter + "px 4px;scrollbar-width:none");
  }

  function photo(doc, src, css){
    var w = el(doc, "span", css + ";overflow:hidden;background:#F4F4F5;display:block");
    w.innerHTML = '<img src="' + src + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block">';
    return w;
  }

  /* Our category pill icons render at 24px against a 13.9pt reference. Every
     direction calls this so the correction is not per-direction drift. */
  function fixPillIcons(doc){
    doc.querySelectorAll('a img, button img, a svg, button svg').forEach(function(im){
      var r = im.getBoundingClientRect ? im.getBoundingClientRect() : null;
      if (r && r.width >= 22 && r.width <= 30 && Math.abs(r.width - r.height) < 3) {
        im.style.width = REF.pillIcon + "px";
        im.style.height = REF.pillIcon + "px";
        im.setAttribute("data-sweep-done", "pill-icon");
      }
    });
  }

  return { SALONS: SALONS, REF: REF, svg: svg, el: el, seeAll: seeAll,
           sectionHead: sectionHead, rail: rail, photo: photo, fixPillIcons: fixPillIcons };
})();

/* Each variants/*.js file registers itself here. */
window.DIRECTIONS = {};

/* ============================================================================
   Seed the REAL component's storage so RecentlyViewed.tsx renders its real
   state instead of the "Top auf Solen" cold-start fallback. This is the whole
   reason the row read as absent.
   ========================================================================== */
var STORAGE_KEY = "solen.recently-viewed";
function seedFrame(frame){
  try {
    var w = frame.contentWindow;
    if (!w || !w.localStorage) return false;
    if (w.localStorage.getItem(STORAGE_KEY)) return true;
    w.localStorage.setItem(STORAGE_KEY, JSON.stringify(
      window.MK.SALONS.slice(0, 4).map(function(s){
        return { slug: s.slug, name: s.name, category: s.category, photoUrl: s.photo };
      })
    ));
    frame.contentWindow.location.reload();
    return true;
  } catch (e) { return false; }
}

/* ============================================================================
   Injection. The scaffold owns placement and re-injection; a direction only
   returns the two elements.
   ========================================================================== */
function anchorFor(doc){
  // the category pill row, the same anchor the previous mockup landed on
  var anchor = null, all = doc.querySelectorAll("a,button,span,div");
  for (var i = 0; i < all.length && !anchor; i++) {
    var t = (all[i].textContent || "").trim();
    if (t === "Coiffeur" || t === "Barber" || t === "Barbershop") anchor = all[i];
  }
  var host = anchor;
  if (host) {
    for (var u = 0; u < 6 && host.parentElement; u++) {
      host = host.parentElement;
      var tx = host.textContent || "";
      if (tx.indexOf("Coiffeur") > -1 && tx.indexOf("Barber") > -1) break;
    }
  }
  return host || doc.querySelector("main section, main > div, main");
}

function applyDirection(doc){
  var key = window.__dir || "airbnb";
  var dir = window.DIRECTIONS[key];
  if (!dir || !doc) return 0;

  doc.querySelectorAll("[data-dir-block]").forEach(function(n){ n.remove(); });

  var target = anchorFor(doc);
  if (!target || !target.parentElement) return 0;

  var out;
  try { out = dir.apply(doc, window.MK); } catch (e) { return 0; }
  if (!out) return 0;

  var holder = doc.createElement("div");
  holder.setAttribute("data-dir-block", key);
  holder.setAttribute("data-sweep-done", "direction");
  holder.style.position = "relative";
  if (out.continueEl) holder.appendChild(out.continueEl);
  if (out.viewedEl) holder.appendChild(out.viewedEl);

  var tag = doc.createElement("div");
  tag.textContent = dir.label;
  tag.style.cssText = "position:absolute;top:-2px;right:10px;background:rgba(10,10,10,.82);color:#fff;" +
    "font:600 10px/1.3 -apple-system,sans-serif;padding:3px 8px;border-radius:999px;z-index:99999";
  holder.appendChild(tag);

  target.parentElement.insertBefore(holder, target.nextSibling);

  window.MK.fixPillIcons(doc);
  try { holder.scrollIntoView({ block: "center" }); } catch (e) {}
  return 1;
}

function pump(){
  var f = document.getElementById("afterFrame");
  var seeded = false;
  setInterval(function(){
    try {
      var doc = f.contentDocument;
      if (!doc || !doc.querySelector("h1,h2,h3")) return;
      if (!seeded) { seeded = seedFrame(f); return; }
      var have = doc.querySelector("[data-dir-block]");
      var shown = have ? have.getAttribute("data-dir-block") : null;
      if (shown !== (window.__dir || "airbnb")) applyDirection(doc);
    } catch (e) {}
  }, 400);
  // the Before pane shows the REAL component in its REAL state, so seed it too
  var b = document.getElementById("beforeFrame");
  var bSeeded = false;
  setInterval(function(){
    if (bSeeded) return;
    try {
      var d = b.contentDocument;
      if (d && d.querySelector("h1,h2,h3")) bSeeded = seedFrame(b);
    } catch (e) {}
  }, 500);
}

function pick(k){
  window.__dir = k;
  var ids = { airbnb:"d1", airbnbTall:"d2", marriott:"d3", bestbuy:"d4", vrbo:"d5" };
  Object.keys(ids).forEach(function(name){
    document.getElementById(ids[name]).classList.toggle("on", name === k);
  });
  var dir = window.DIRECTIONS[k];
  document.getElementById("cap").textContent = dir ? dir.caption : "Direction not loaded";
  show("after");
  try { applyDirection(document.getElementById("afterFrame").contentDocument); } catch (e) {}
}

function show(w){
  document.getElementById("paneBefore").classList.toggle("hidden", w !== "before");
  document.getElementById("paneAfter").classList.toggle("hidden", w !== "after");
  document.getElementById("bBefore").classList.toggle("on", w === "before");
  document.getElementById("bAfter").classList.toggle("on", w === "after");
}

var EYE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
var EYE_OFF = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
function bare(){
  var on = document.body.classList.toggle('bare');
  var b = document.getElementById('peek');
  b.innerHTML = on ? EYE : EYE_OFF;
  b.title = b.ariaLabel = on ? 'Show controls' : 'Hide controls';
}
document.getElementById('peek').innerHTML = EYE_OFF;
</script>

<!-- direction files register into window.DIRECTIONS -->
<script src="variants/airbnb.js"></script>
<script src="variants/airbnb-tall.js"></script>
<script src="variants/marriott.js"></script>
<script src="variants/bestbuy.js"></script>
<script src="variants/vrbo.js"></script>
<script>
  window.__dir = "airbnb";
  var d0 = window.DIRECTIONS.airbnb;
  if (d0) document.getElementById("cap").textContent = d0.caption;
  pump();
</script>
</body>
</html>
