<!--

  Grounded-in: app/[locale]/_components/homepage/ContinueCard.tsx
  Depicts: the homepage feed -> app/[locale]/page.tsx

  Exists-check: ran this turn, four terms. `npm run exists recently-viewed` returns 12 matches:
    RecentlyViewed.tsx, RecentlyViewedTiles.tsx, useRecentlyViewed.ts, the /recently-viewed route and
    RECENTLY_VIEWED_DEMO_IDS all already exist, and RecentlyViewed is already mounted on the homepage
    at app/[locale]/page.tsx:289. Nothing here builds a second one.
    `npm run exists continue-card` returns 5, including THREE graveyard entries that bind this file:

  WHY THE ROW LOOKED MISSING, since the owner said we did nothing for it. It is not missing and it
  was not skipped. RecentlyViewed.tsx renders a curated "Top auf Solen" fallback when localStorage
  has no history (its own header comment says so, and it returns null only when the fallback ALSO
  comes back empty). A fresh iframe has no history, so the real component was rendering its
  cold-start state the whole time and reading as a different section. This page seeds
  `solen.recently-viewed` into the frame before load, so the REAL component renders its REAL state.
  Seeding is the fix, not fabrication: the rows go through the component's normal read path.

  measured: his two screenshots, PIL, this turn. Scale anchored on the iOS home indicator, 139pt wide
    and 330px in the image, so 2.3741 px/pt and a 387.5pt phone.
      continue card        301.2 x 104.9 pt   ratio 2.87:1
      card photo            66.6 x  76.2 pt   ratio 0.87:1, PORTRAIT, insets top 19 / bottom 9.7 / right 17.3

      see-all arrow          27.0 pt diameter

      row left gutter        23.6 pt
      search pill          347.5 x  54.8 pt   gutter 19.8pt
  measured: our live page, getBoundingClientRect this turn, viewport 407px, normalise by x0.952.
      see-all arrow 44px -> 41.9pt   = +55% against the reference
      viewed thumb 150px -> 142.8pt  = +35% against the reference
      card photo 92x74 (1.24:1)      = +32% wide and landscape where the reference is portrait
      pill icon 24px -> 22.9pt       = +65%
      row gutter 16px -> 15.2pt      = -36%, ours is tighter

  Diagnosis: our see-all arrow is far larger than the reference | measured 41.9pt normalised against 27.0pt, on 11 rows of the homepage | violates his instruction of 2026-08-15 ("big size difference between the screenshot Airbnb reference and ours") | target 28px visible
  Diagnosis: our recently-viewed thumb is far wider than the reference | measured 142.8pt normalised against 106.1pt | violates the same instruction | target 112px
  Diagnosis: the continue-card photo is landscape where the reference is portrait | measured 1.24:1 against 0.87:1 | violates the same instruction | target 0.87:1
  Diagnosis: our category pill icon is oversized | measured 22.9pt normalised against 13.9pt | violates his instruction of 2026-08-15 ("the category icons are too big") | target 15px

  TOUCH-TARGET COLLISION, surfaced rather than silently resolved. A 27pt circle is below the 44px

  statutory tier outranks a taste source, so every direction here draws a 28px CIRCLE inside a 44px

  AIRBNB ONLY, owner 2026-08-15 ("jst Make it just Airbnb"). The Marriott, Best Buy and Vrbo
  directions built earlier the same day are NOT loaded. Their files stay in git at commit 1538981d5

  THE THREE DIRECTIONS ARE FOR THE RECENTLY-VIEWED ROW, which is what he actually asked for and
  what I got wrong for a whole turn by building them for the continue card instead. The continue
  card is now IDENTICAL in all three (MK.continueRail), so the only thing that changes when he taps
  A, B or C is the row.
    A small rail   Airbnb's own density, at our 5:4 instead of their 1.05 near-square
    B big rail     the big-card treatment Airbnb reserves for its suggestion row
    C wide list    photo left, one per row, no horizontal scroll, price included

  NOT SQUARE, measured: A is 112 x 90 (1.244), B is 240 x 192 (1.250), C is 96 x 77 (1.247). The
  square he rejected is the LIVE component, RecentlyViewedTiles.tsx:118, which renders aspect-square

  ENGLISH, and the German was a real bug not a mockup slip: RecentlyViewedTiles.tsx:108 and

  existed in all four locale files and had never been used.

<style>

<script>
/* ============================================================================
   SHARED KIT. Every direction file gets this object and may not redefine any of
   it. Sizes here are the measured reference values, so a direction that wants a
   different number has to say so in its own caption.
   ========================================================================== */
window.MK = (function(){

  // Real seeded salons, read from the live database 2026-08-14. Photos are the
  // seeded stock the owner asked to keep ("those stocks are to see as a beta").
  var SALONS = [
    {slug:"cuts-and-culture",   name:"Cuts & Culture",   category:"barbershop",
     photo:"https://images.unsplash.com/photo-1622288432450-277d0fef5ed6?w=800&q=80", cat:"Barbershop", r:"4.8", c:16, price:"15", city:"4056 Basel"},
    {slug:"haarsalon-margot",   name:"Haarsalon Margot", category:"coiffeur",
     photo:"https://images.unsplash.com/photo-1487412947147-5cebf100ffc2?w=800&q=80", cat:"Coiffeur",   r:"4.8", c:16, price:"45", city:"4051 Basel"},
    {slug:"atelier-haarwerk",   name:"Atelier Haarwerk", category:"coiffeur",
     photo:"https://images.unsplash.com/photo-1560066984-138dadb4c035?w=800&q=80", cat:"Coiffeur",   r:"4.6", c:25, price:"60", city:"4001 Basel"},
    {slug:"velvet-face",        name:"Velvet Face",      category:"spa",
     photo:"https://images.unsplash.com/photo-1512290923902-8a9f81dc236c?w=800&q=80", cat:"Make-up",    r:"4.6", c:7,  price:"80", city:"4058 Basel"},
    {slug:"nagelstudio-lumen",  name:"Nagelstudio Lumen",category:"nails",
     photo:"https://images.unsplash.com/photo-1604654894610-df63bc536371?w=800&q=80", cat:"Nails",      r:"4.7", c:31, price:"55", city:"4051 Basel"}
  ];

  // Real Lucide paths. Hand-drawn glyphs are refused by the icon gate and by the owner.
  var ICON = {
    arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    chevronRight: '<path d="m9 18 6-6-6-6"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
    star: '<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>'
  };
  /* Real Lucide class names are kebab-case (lucide-arrow-right), so the camelCase key has to be
     converted or every grep, gate and devtools search that looks for the real name misses ours. */
  function svg(name, px, stroke, fill){
    var cls = name.replace(/[A-Z]/g, function(c){ return "-" + c.toLowerCase(); });
    return '<svg class="lucide lucide-' + cls + '" width="' + px + '" height="' + px + '" viewBox="0 0 24 24" ' +
      'fill="' + (fill || 'none') + '" stroke="currentColor" stroke-width="' + (stroke || 2) + '" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + ICON[name] + '</svg>';
  }

  /* ONE rating line for the whole page. Added 2026-08-15 after the five directions were built:
     two of them drew a text glyph star, one dropped the star entirely because it believed the kit
     had none, and one showed no rating at all. Four implementations of one element is the exact
     drift FLOORS LAW 8 names, and the cause was the kit not owning it, so the kit owns it now.
     The star keeps #FFC32B and sits beside a darker value, which is what its 1.60:1 contrast needs. */
  function rating(doc, salon){
    var line = el(doc, "div",
      "font:400 12px/1.35 Inter,'Inter Tight',sans-serif;color:#6B6B6B;margin-top:2px;" +
      "font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px;white-space:nowrap");
    line.appendChild(el(doc, "span",
      "color:#FFC32B;display:flex;align-items:center", svg("star", 12, 1.5, "currentColor")));
    var v = doc.createElement("span");
    v.textContent = salon.r + " (" + salon.c + ")";
    line.appendChild(v);
    return line;
  }

  // MEASURED reference geometry. A direction reads these; it does not invent sizes.
  var REF = {
    cardW: 306, cardH: 118, cardRatio: 2.59,   /* 105pt measured, scaled 407/387.5, plus room for the two-line sentence */
    photoW: 70, photoH: 80, photoRatio: 0.87,
    thumbW: 112, thumbH: 106, thumbRatio: 1.05,
    thumbGap: 12, gutter: 0,    /* ZERO on purpose. The host container this block is injected into
                               already pads 16, which IS the page's line: measured left 16 on the
                               category pills and on the Top Coiffeur heading and its first card.
                               Airbnb's 23.6pt put the block at 40, and a 16 of my own put it at 32.
                               Both were right of everything else, which is the line he drew. */
    arrowVisible: 32,   // OUR page's see-all circle, measured 32 inside a 44 tap on the live Top Coiffeur row
    arrowTap: 44,       // the touch floor the circle sits inside, non-negotiable
    pillIcon: 15
  };

  function el(doc, tag, css, html){
    var n = doc.createElement(tag);
    if (css) n.style.cssText = css;
    if (html != null) n.innerHTML = html;
    return n;
  }

  /* The see-all control every direction must use. 28px of visible circle inside a
     44px tap target, which is how the reference look and the touch floor coexist. */
  function seeAll(doc, label){
    var a = doc.createElement("a");
    a.href = "#";
    a.setAttribute("aria-label", label || "See all");
    a.style.cssText = "flex:0 0 " + REF.arrowTap + "px;width:" + REF.arrowTap + "px;height:" + REF.arrowTap +
      "px;margin-right:-8px;display:grid;place-items:center;text-decoration:none;color:#0A0A0A";
    var dot = doc.createElement("span");
    dot.style.cssText = "width:" + REF.arrowVisible + "px;height:" + REF.arrowVisible + "px;border-radius:999px;" +
      "background:#F4F4F5;display:grid;place-items:center";
    dot.innerHTML = svg("arrowRight", 14);
    a.appendChild(dot);
    return a;
  }

  function sectionHead(doc, title, withArrow){
    var head = el(doc, "div",
      "display:flex;align-items:center;justify-content:space-between;padding:0 " + REF.gutter + "px 12px");
    var h = el(doc, "h2", "font:600 18px/1.25 'Inter Tight',Inter,sans-serif;letter-spacing:-.01em;margin:0;color:#0A0A0A");   /* measured: our live section h2 is 18px/600, not 22 */
    h.textContent = title;
    head.appendChild(h);
    if (withArrow !== false) head.appendChild(seeAll(doc, "See all " + title));
    return head;
  }

  function rail(doc){
    return el(doc, "div",
      "display:flex;gap:" + REF.thumbGap + "px;overflow-x:auto;padding:0 " + REF.gutter + "px 4px;scrollbar-width:none");
  }

  function photo(doc, src, css){
    var w = el(doc, "span", css + ";overflow:hidden;background:#F4F4F5;display:block");
    w.innerHTML = '<img src="' + src + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block">';
    return w;
  }

  /* THE PILLS, reverted 2026-08-15. Owner: "i literally wanted the text on these pills go smaller
     and everything, but what are you fucking doing? Revert bro."
     I had been rewriting the pill ICON from 28px down to 15px. He never asked for that. The icons
     are left exactly as the page ships them; only the label size changes, which is what he asked
     for. Measured live: the pill label is 14px, so it goes to 13. */
  function fixPillIcons(doc){
    doc.querySelectorAll('a[role="tab"]').forEach(function(a){
      if (a.getAttribute("data-sweep-done")) return;
      a.style.fontSize = "13px";
      a.setAttribute("data-sweep-done", "pill-text");
    });
  }

  /* THE CONTINUE CARD, one implementation, shared by every direction. It lives here and not in a
     variant file because the owner's question on 2026-08-15 is about the RECENTLY-VIEWED ROW, so
     the card has to be identical across the three directions or the comparison is not about the row.
     Airbnb measured: card 306 x 105, radius 18, photo on the right, second card peeking.
     The photo is OUR 1.25:1 landscape (87 x 70), not their measured 0.87:1 portrait, because he
     said "not square" and has twice asked to keep our own ratio. */
  /* What the last search was FOR. Owner 2026-08-15: "on this, like, skin fade, but you know, like,
     what you search for, you can't really identify what your last [search] ... look at the
     screenshot I fucking gave you."
     He is right and the screenshot says so plainly. Airbnb's card reads "Continue searching for
     hair stylists in Zurich", a SENTENCE over two lines naming what and where. Ours rendered the
     bare service name on one line, so nothing on the card said it was a resumed search at all.
     Measured on his screenshot: line 1 is 165.1pt wide, line 2 is 145.7pt, baseline to baseline is
     19.4pt, which puts the headline near 17pt, not the 15px we were drawing. */
  var SEARCHES = [
    { lead: "Continue searching for", what: "skin fades in Basel" },
    { lead: "Continue searching for", what: "balayage in Basel" }
  ];

  function continueRail(doc){
    /* NO GREY BAND. Owner 2026-08-15: "what is this gray, like, divided shit that's happening? I
       don't fucking like this." It was a port of Airbnb's grey page background, and on our white
       page it reads as a divider rather than as a surface. Removed.
       That leaves a white card on white, which FLOORS LAW 4 forbids on a shadow alone, so the card
       takes the hairline instead. Edge visibility is kept, the grey is gone.
       SHADOW, NO BORDER. Owner 2026-08-15: "why did you make it flat? Make a shadow. I fucking
       told you." He is right and he had said it before. The surface table allows exactly one of
       the two, so the hairline comes off as the shadow goes on. */
    var band = el(doc, "section", "padding:4px 0 16px");
    var r = rail(doc);
    r.style.paddingBottom = "10px";
    for (var i = 0; i < SEARCHES.length; i++) {
      var s = SALONS[i];
      var a = doc.createElement("a");
      a.href = "#";
      a.style.cssText = "flex:0 0 " + REF.cardW + "px;width:" + REF.cardW + "px;height:" + REF.cardH +
        "px;position:relative;display:block;background:#fff;border-radius:18px;text-decoration:none;" +
        "box-shadow:0 1px 2px rgba(10,10,10,.06),0 6px 16px rgba(10,10,10,.08)";
      var col = el(doc, "div",
        "position:absolute;left:18px;top:0;bottom:0;width:" + (REF.cardW - 18 - 17 - 87 - 14) +
        "px;display:flex;flex-direction:column;justify-content:center");
      /* The whole sentence is ONE block so it wraps to two lines the way the reference does.
         The service is the loud half; the lead-in stays quiet so it does not compete. */
      var h = el(doc, "div",
        "font:400 17px/22px 'Inter Tight',Inter,sans-serif;letter-spacing:-.01em;color:#6B6B6B");
      h.appendChild(doc.createTextNode(SEARCHES[i].lead + " "));
      var strong = el(doc, "span", "font-weight:600;color:#0A0A0A");
      strong.textContent = SEARCHES[i].what;
      h.appendChild(strong);
      col.appendChild(h);
      a.appendChild(col);
      a.appendChild(photo(doc, s.photo,
        "position:absolute;right:17px;top:17px;width:87px;height:70px;border-radius:14px"));
      r.appendChild(a);
    }
    band.appendChild(r);
    return band;
  }

  /* The heart badge, also shared: 26px of white circle inside a 44px target. It is a SIBLING of the
     card link, never a child, because a button inside an anchor gets hoisted out by the parser. */
  function heart(doc){
    var b = doc.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Save");
    b.style.cssText = "position:absolute;top:-1px;right:-1px;width:44px;height:44px;border:0;" +
      "padding:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:#0A0A0A";
    b.appendChild(el(doc, "span",
      "width:26px;height:26px;border-radius:999px;background:#fff;display:grid;place-items:center;" +
      "box-shadow:0 1px 3px rgba(10,10,10,.20)", svg("heart", 14)));
    return b;
  }

  return { SALONS: SALONS, REF: REF, svg: svg, el: el, seeAll: seeAll, rating: rating,
           sectionHead: sectionHead, rail: rail, photo: photo, fixPillIcons: fixPillIcons,
           continueRail: continueRail, heart: heart };
})();

/* Each variants/*.js file registers itself here. */
window.DIRECTIONS = {};

/* ============================================================================
   Seed the REAL component's storage so RecentlyViewed.tsx renders its real
   state instead of the "Top auf Solen" cold-start fallback. This is the whole
   reason the row read as absent.
   ========================================================================== */
var STORAGE_KEY = "solen.recently-viewed";

/* Harvest the entries from what the page ITSELF is already rendering, rather than handing it a
   list I wrote. Two reasons, one of them found the hard way:
   1. RecentlyViewedTiles renders its photo through next/image, which only accepts hosts in the
      Next config. Seeding an outside stock URL made every tile a bare grey box, which is both a
      broken-looking mockup and a false accusation against the component.
   2. Reading the slugs and photos off the live cards means the seeded history is the same data the
      rest of the page is showing, so the row cannot drift from the feed above it. */
function harvestEntries(doc){
  var out = [], seen = {};
  var links = doc.querySelectorAll('a[href*="/salon/"]');
  for (var i = 0; i < links.length && out.length < 4; i++) {
    var a = links[i];
    var href = a.getAttribute("href") || "";
    var slug = href.split("/salon/")[1];
    if (!slug) continue;
    slug = slug.split(/[?#/]/)[0];
    if (!slug || seen[slug]) continue;
    var img = a.querySelector("img");
    var src = img && (img.currentSrc || img.getAttribute("src"));
    if (!src) continue;
    /* The page renders through next/image, so what is in the DOM is already `/_next/image?url=...`.
       Storing THAT makes the component proxy an already-proxied URL on the next paint and every
       tile fails to load. Unwrap back to the original source and let next/image proxy it once. */
    var wrapped = src.indexOf("/_next/image") > -1 && src.indexOf("url=") > -1;
    if (wrapped) {
      try { src = decodeURIComponent(src.split("url=")[1].split("&")[0]); } catch (e) { continue; }
    }
    if (src.indexOf("/_next/image") > -1) continue;   // still wrapped, do not store it
    var name = (a.textContent || "").trim().split("\n")[0].slice(0, 40);
    if (!name) continue;
    seen[slug] = 1;
    out.push({ slug: slug, name: name, category: "coiffeur", photoUrl: src });
  }
  return out;
}

function seedFrame(frame){
  try {
    var w = frame.contentWindow;
    var doc = frame.contentDocument;
    if (!w || !w.localStorage || !doc) return false;
    if (w.localStorage.getItem(STORAGE_KEY)) return true;
    var entries = harvestEntries(doc);
    if (entries.length < 2) return false;   // page not painted yet, try again next tick
    w.localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    w.location.reload();
    return true;
  } catch (e) { return false; }
}

/* ============================================================================
   Injection. The scaffold owns placement and re-injection; a direction only
   returns the two elements.
   ========================================================================== */
function anchorFor(doc){
  // the category pill row, the same anchor the previous mockup landed on
  var anchor = null, all = doc.querySelectorAll("a,button,span,div");
  for (var i = 0; i < all.length && !anchor; i++) {
    var t = (all[i].textContent || "").trim();
    if (t === "Coiffeur" || t === "Barber" || t === "Barbershop") anchor = all[i];
  }
  var host = anchor;
  if (host) {
    for (var u = 0; u < 6 && host.parentElement; u++) {
      host = host.parentElement;
      var tx = host.textContent || "";
      if (tx.indexOf("Coiffeur") > -1 && tx.indexOf("Barber") > -1) break;
    }
  }
  return host || doc.querySelector("main section, main > div, main");
}

function applyDirection(doc){
  var key = window.__dir || "rowA";
  var dir = window.DIRECTIONS[key];
  if (!dir || !doc) return 0;

  doc.querySelectorAll("[data-dir-block]").forEach(function(n){ n.remove(); });

  /* Hide the LIVE recently-viewed sections while a direction is shown. Without this the page
     carries three of them: the proposed one plus both real ones, which is unreadable and also
     hides the point, since each direction REPLACES the live row rather than sitting above it.
     Both live rows are hidden because the homepage genuinely renders two of them once a visitor
     has history (RecentlyViewedTiles at page.tsx:288 and RecentlyViewed at :289), which is its own
     open question and not something a direction should silently inherit. */
  doc.querySelectorAll("h2").forEach(function(h){
    if (!/Recently viewed|Zuletzt angesehen/i.test(h.textContent || "")) return;
    var sec = h;
    for (var u = 0; u < 7 && sec.parentElement; u++) {
      sec = sec.parentElement;
      if (sec.tagName === "SECTION") break;
    }
    /* Skip a section that CONTAINS the injected block, not just one that sits inside it. Checking
       only `closest` looked right and hid the proposal along with the live rows, because the walk
       up from a heading lands on an outer page section that wraps the injection: the block is a
       DESCENDANT, so closest() never sees it. Everything measured 0 by 0. */
    if (sec && sec.tagName === "SECTION" &&
        !sec.closest("[data-dir-block]") && !sec.querySelector("[data-dir-block]")) {
      sec.style.display = "none";
      sec.setAttribute("data-dir-hidden", "1");
    }
  });

  var target = anchorFor(doc);
  if (!target || !target.parentElement) return 0;

  var out;
  try { out = dir.apply(doc, window.MK); } catch (e) { return 0; }
  if (!out) return 0;

  var holder = doc.createElement("div");
  holder.setAttribute("data-dir-block", key);
  holder.setAttribute("data-sweep-done", "direction");
  holder.style.position = "relative";
  if (out.continueEl) holder.appendChild(out.continueEl);
  if (out.viewedEl) holder.appendChild(out.viewedEl);

  var tag = doc.createElement("div");
  tag.textContent = dir.label;
  tag.style.cssText = "position:absolute;top:-2px;right:10px;background:rgba(10,10,10,.82);color:#fff;" +
    "font:600 10px/1.3 -apple-system,sans-serif;padding:3px 8px;border-radius:999px;z-index:99999";
  holder.appendChild(tag);

  target.parentElement.insertBefore(holder, target.nextSibling);

  window.MK.fixPillIcons(doc);
  try { holder.scrollIntoView({ block: "center" }); } catch (e) {}
  return 1;
}

function pump(){
  var f = document.getElementById("afterFrame");
  var seeded = false;
  setInterval(function(){
    try {
      var doc = f.contentDocument;
      if (!doc || !doc.querySelector("h1,h2,h3")) return;
      if (!seeded) { seeded = seedFrame(f); return; }
      var have = doc.querySelector("[data-dir-block]");
      var shown = have ? have.getAttribute("data-dir-block") : null;
      if (shown !== (window.__dir || "rowA")) applyDirection(doc);
    } catch (e) {}
  }, 400);
  // the Before pane shows the REAL component in its REAL state, so seed it too
  var b = document.getElementById("beforeFrame");
  var bSeeded = false;
  setInterval(function(){
    if (bSeeded) return;
    try {
      var d = b.contentDocument;
      if (d && d.querySelector("h1,h2,h3")) bSeeded = seedFrame(b);
    } catch (e) {}
  }, 500);
}

function pick(k){
  window.__dir = k;
  var ids = { rowA:"d1" };
  Object.keys(ids).forEach(function(name){
    document.getElementById(ids[name]).classList.toggle("on", name === k);
  });
  var dir = window.DIRECTIONS[k];
  document.getElementById("cap").textContent = dir ? dir.caption : "Direction not loaded";
  show("after");
  try { applyDirection(document.getElementById("afterFrame").contentDocument); } catch (e) {}
}

function show(w){
  document.getElementById("paneBefore").classList.toggle("hidden", w !== "before");
  document.getElementById("paneAfter").classList.toggle("hidden", w !== "after");
  document.getElementById("bBefore").classList.toggle("on", w === "before");
  document.getElementById("bAfter").classList.toggle("on", w === "after");
}

var EYE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
var EYE_OFF = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
function bare(){
  var on = document.body.classList.toggle('bare');
  var b = document.getElementById('peek');
  b.innerHTML = on ? EYE : EYE_OFF;
  b.title = b.ariaLabel = on ? 'Show controls' : 'Hide controls';
}
document.getElementById('peek').innerHTML = EYE_OFF;
</script>

<!-- direction files register into window.DIRECTIONS -->

<script>
  window.__dir = "rowA";
  var d0 = window.DIRECTIONS.rowA;
  if (d0) document.getElementById("cap").textContent = d0.caption;
  pump();
</script>
