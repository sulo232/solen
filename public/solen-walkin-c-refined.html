<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solen — walk-in card C, refined</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0A0A0A;--ink2:#6B6B6B;--ink3:#9a9a9a;--border:#E7E5E4;--sunken:#F5F5F4;--accent:#276EF1;--star:#FFC32B;--heart:#FF3366;
    --disp:'Inter Tight',sans-serif;--body:'Inter',sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e8e6;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:24px 16px 80px}
  h1{font-family:var(--disp);font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 2px 4px}
  .lead{font-size:13.5px;color:#444;line-height:1.55;margin:0 2px 22px;max-width:720px}
  .lead b{color:var(--ink)}
  .frames{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start}
  .col{width:392px;max-width:100%}
  .tag{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
  .tag .pill{font-size:11px;font-weight:800;color:#fff;background:var(--ink);min-width:22px;height:22px;padding:0 7px;border-radius:6px;display:grid;place-items:center;font-family:var(--disp)}
  .tag .nm{font-size:13.5px;font-weight:700;font-family:var(--disp)}
  .tag .ds{font-size:11.5px;color:#777}
  .phone{background:#fff;border-radius:30px;border:1px solid #d9d7d4;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.12);padding:20px 16px 24px;display:flex;flex-direction:column;gap:20px}
  .card .ph{position:relative;width:100%;aspect-ratio:3/2;border-radius:18px;overflow:hidden;background:var(--sunken);box-shadow:0 16px 36px rgba(0,0,0,.05)}
  .card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .heart{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--heart)}
  .live{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);border-radius:999px;padding:6px 11px 6px 9px;font-size:12.5px;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .pulse{position:relative;width:8px;height:8px;flex:0 0 auto}
  .pulse i{position:absolute;inset:0;border-radius:999px;background:var(--accent)}
  .pulse i.ring{animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite;opacity:.5}
  .pulse.grey i{background:var(--ink3)} .pulse.grey i.ring{display:none}
  @keyframes ping{75%,100%{transform:scale(2.5);opacity:0}}
  .body{margin-top:11px}
  .r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .nm{font-family:var(--disp);font-weight:500;font-size:18px;letter-spacing:-.015em;color:var(--ink)}
  .rt{display:flex;align-items:center;gap:3px;flex-shrink:0;font-size:13px;color:var(--ink2)}
  .meta{font-size:13px;color:var(--ink2);margin-top:3px}
  /* walk-in footer */
  .wf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px;padding-top:12px;border-top:1px solid var(--border)}
  .wf .ql{min-width:0}
  .wf .qn{font-size:13.5px;color:var(--ink);font-weight:600}
  .wf .qn b{color:var(--accent)}
  .wf .qsub{font-size:12px;color:var(--ink2);margin-top:2px}
  /* queue bar treatment */
  .qbar{display:flex;gap:3px;margin-bottom:7px}
  .qbar i{height:5px;flex:1;border-radius:3px;background:var(--border)}
  .qbar i.f{background:var(--ink)}
  .qbar i.live{background:var(--accent)}
  .join{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:600;white-space:nowrap}
  .join.notify{background:var(--sunken);color:var(--ink2)}
  .note{font-size:12px;color:#666;margin:14px 16px 0;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>Walk-in card C — refined</h1>
  <p class="lead">Variant C kept (live "Frei in" + queue position + a join button), refined onto our real 3:2 card, in German, no round dot-pips. Two treatments of the queue position — pick one. The blue pulse is the one allowed live status dot.</p>
  <div class="frames" id="frames"></div>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}
function svg(paths,o){o=o||{};const s=document.createElementNS(NS,"svg");s.setAttribute("width",o.size||15);s.setAttribute("height",o.size||15);s.setAttribute("viewBox","0 0 24 24");s.setAttribute("fill",o.fill||"none");s.setAttribute("stroke",o.stroke||"currentColor");s.setAttribute("stroke-width",o.sw||2);s.setAttribute("stroke-linecap","round");s.setAttribute("stroke-linejoin","round");(Array.isArray(paths)?paths:[paths]).forEach(d=>{const p=document.createElementNS(NS,"path");p.setAttribute("d",d);s.appendChild(p);});return s;}
function star(){const s=document.createElementNS(NS,"svg");s.setAttribute("width",12);s.setAttribute("height",12);s.setAttribute("viewBox","0 0 24 24");s.setAttribute("fill","#FFC32B");const p=document.createElementNS(NS,"path");p.setAttribute("d","M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");s.appendChild(p);return s;}
function pulse(grey){const w=el("span","pulse"+(grey?" grey":""));w.appendChild(el("i","ring"));w.appendChild(el("i"));return w;}
function heart(){const h=el("div","heart");const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("width","16");s.setAttribute("height","16");s.setAttribute("fill","none");s.setAttribute("stroke","currentColor");s.setAttribute("stroke-width","2");const p=document.createElementNS(NS,"path");p.setAttribute("d","M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z");s.appendChild(p);h.appendChild(s);return h;}

// salons: free = label on live pill; ahead = N in line; wait = sub; cap = bar capacity; full = backed up
const SALONS = [
  { name:"Blade & Stone", rating:4.4, reviews:11, addr:"Feldbergstrasse 82", price:43, live:"Jetzt frei", ahead:0, wait:"keine Wartezeit", cap:6, photo:"https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=800&q=80" },
  { name:"The Fade Factory", rating:4.3, reviews:11, addr:"Hammerstrasse 65", price:47, live:"Frei in 8–11 Min", ahead:3, wait:"~10 Min Wartezeit", cap:6, photo:"https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=800&q=80" },
  { name:"Old Town Barbers", rating:4.3, reviews:12, addr:"Münsterplatz 11", price:47, live:"~35 Min", ahead:7, wait:"~35 Min Wartezeit", cap:7, full:true, photo:"https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=800&q=80" },
];

function baseCard(s){
  const c=el("div","card");
  const ph=el("div","ph"); const im=el("img"); im.src=s.photo; im.alt=s.name; ph.appendChild(im);
  const lp=el("div","live"); lp.appendChild(pulse(s.full)); lp.appendChild(el("span",null,s.live)); ph.appendChild(lp);
  ph.appendChild(heart()); c.appendChild(ph);
  const body=el("div","body");
  const r1=el("div","r1"); r1.appendChild(el("div","nm",s.name)); const rt=el("div","rt"); rt.appendChild(star()); rt.appendChild(el("span",null,s.rating.toFixed(1)+" ("+s.reviews+")")); r1.appendChild(rt); body.appendChild(r1);
  body.appendChild(el("div","meta",s.addr+", Basel · ab CHF "+s.price));
  c.appendChild(body);
  return { c, body };
}
function joinBtn(s){ const a=el("div","join"+(s.full?" notify":"")); a.appendChild(el("span",null,s.full?"Benachrichtigen":"Anstellen")); if(!s.full)a.appendChild(svg(["M5 12h14","M12 5l7 7-7 7"],{size:15})); return a; }

// Treatment C-text: clean numbers, no viz
function cardText(s){
  const {c,body}=baseCard(s);
  const wf=el("div","wf"); const ql=el("div","ql");
  const qn=el("div","qn"); if(s.ahead===0){ qn.appendChild(el("span",null,"Niemand wartet")); } else { qn.appendChild(el("b",null,s.ahead)); qn.appendChild(el("span",null," in der Schlange")); } ql.appendChild(qn);
  ql.appendChild(el("div","qsub", s.wait)); wf.appendChild(ql); wf.appendChild(joinBtn(s)); body.appendChild(wf);
  return c;
}
// Treatment C-bar: slim segmented queue bar (refined from round dots)
function cardBar(s){
  const {c,body}=baseCard(s);
  const wf=el("div","wf"); const ql=el("div","ql");
  const bar=el("div","qbar"); for(let i=0;i<s.cap;i++){ const seg=el("i"); if(i<s.ahead-1) seg.className="f"; else if(i===s.ahead-1 && !s.full) seg.className="live"; else if(s.full) seg.className="f"; ql.appendChild; bar.appendChild(seg);} ql.appendChild(bar);
  const qn=el("div","qn"); if(s.ahead===0){qn.appendChild(el("span",null,"Niemand wartet"));}else{qn.appendChild(el("b",null,s.ahead));qn.appendChild(el("span",null," in der Schlange · "+s.wait));} ql.appendChild(qn);
  wf.appendChild(ql); wf.appendChild(joinBtn(s)); body.appendChild(wf);
  return c;
}

function colize(id,nm,ds,fn){
  const col=el("div","col"); const tag=el("div","tag"); tag.appendChild(el("span","pill",id)); tag.appendChild(el("span","nm",nm)); tag.appendChild(el("span","ds",ds)); col.appendChild(tag);
  const ph=el("div","phone"); SALONS.forEach(s=>ph.appendChild(fn(s))); col.appendChild(ph);
  document.getElementById("frames").appendChild(col);
}
colize("C1","Clean numbers","no viz, just the count + wait + Anstellen",cardText);
colize("C2","Queue bar","a slim segmented bar (refined dots) + count",cardBar);
</script>
</body>
</html>
