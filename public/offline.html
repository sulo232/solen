<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline – solen.ch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FAF6EF 0%, #F5EEE4 100%);
      color: #1A1209;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 360px;
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      font-size: 48px;
      margin-bottom: 24px;
      display: inline-block;
    }

    h1 {
      font-family: 'Syne', -apple-system, sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px;
      line-height: 1.2;
    }

    p {
      font-size: 16px;
      color: rgba(26, 18, 9, 0.6);
      line-height: 1.6;
      margin: 0 0 24px;
    }

    .retry-btn {
      display: inline-block;
      background: #E8624A;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 99px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: filter 200ms ease;
      font-family: 'DM Sans', -apple-system, sans-serif;
    }

    .retry-btn:hover {
      filter: brightness(1.06);
    }

    .retry-btn:active {
      transform: scale(0.98);
      transition: transform 100ms ease;
    }

    .status-text {
      font-size: 12px;
      color: rgba(26, 18, 9, 0.4);
      margin-top: 32px;
      font-family: 'DM Sans', -apple-system, sans-serif;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #151009 0%, #1E1710 100%);
        color: #F5EEE4;
      }

      p {
        color: rgba(245, 238, 228, 0.6);
      }

      .status-text {
        color: rgba(245, 238, 228, 0.4);
      }

      .retry-btn {
        background: #F07560;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Du bist offline</h1>
    <p>Bitte überprüfe deine Internetverbindung und versuche es erneut.</p>
    <button class="retry-btn" onclick="window.location.reload()">Erneut versuchen</button>
    <div class="status-text">solen.ch — Beauty & Wellness Booking</div>
  </div>
</body>
</html>
