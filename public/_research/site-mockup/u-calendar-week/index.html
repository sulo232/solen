<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar week view</title><style>@font-face{font-family:'Inter Tight';src:url(intertight.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Inter';src:url(inter.woff2) format('woff2');font-weight:100 900}
:root{--ink:#0A0A0A;--ink2:#6B6B6B;--line:#E4E4E7;--sunk:#F4F4F5;--shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.10) 0 8px 24px}
*{box-sizing:border-box;margin:0}
body{background:#fff;color:var(--ink);font:400 13px/1.35 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block;flex:none}
.grow{flex:1}
h1{font:600 22px/1.2 'Inter Tight',Inter,sans-serif;letter-spacing:-.01em}
.ib{width:44px;height:44px;border-radius:9999px;background:var(--sunk);display:grid;place-items:center;flex:none}
.ib.sm{width:36px;height:36px;position:relative}
.ib.sm::after{content:'';position:absolute;inset:-4px}
.pill{height:44px;border-radius:9999px;background:var(--sunk);display:inline-flex;align-items:center;gap:6px;padding:0 16px;font-size:15px;font-weight:500;white-space:nowrap}
.pill.ink{background:var(--ink);color:#fff;padding:0 20px 0 16px}
.stack{padding:0 12px 0 6px;gap:0}
.stack img{width:32px;height:32px;border-radius:9999px;border:2px solid var(--sunk);object-fit:cover;margin-right:-10px}
.stack img:nth-child(3){margin-right:8px}
.stack .cnt{margin-right:4px}

/* phone */
.phone{max-width:402px;margin:0 auto;padding:0 16px 96px}
.top{display:flex;align-items:center;gap:8px;height:68px}
.month{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 20px}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.rev{font:600 22px/1.2 'Inter Tight',Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rl{color:var(--ink2);margin-top:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.day{height:64px;border-radius:9999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day span{font-size:11px;font-weight:500;color:var(--ink2)}
.day b{font:600 15px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.day i{width:4px;height:4px;border-radius:9999px;background:var(--ink);margin-top:3px}
.day i.none{background:transparent}
.day.on{background:var(--ink);color:#fff}
.day.on span{color:rgba(255,255,255,.72)}
.day.on i{background:#fff}

.grid{border-radius:20px;box-shadow:var(--shadow);overflow:hidden;background:#fff}
.ghead{display:grid;grid-template-columns:var(--gut) repeat(3,1fr);height:52px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}
.sh{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.sh img{width:28px;height:28px;border-radius:9999px;object-fit:cover}
.gbody{position:relative;margin-top:12px}
.hours{position:absolute;left:0;top:0;width:var(--gut)}
.hr{position:absolute;left:0;width:var(--gut);text-align:center;font-size:11px;font-weight:500;color:var(--ink2);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.ln{position:absolute;left:var(--gut);right:0;height:1px;background:var(--line)}
.cols{position:absolute;left:var(--gut);right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr)}
.col{position:relative;border-left:1px solid var(--line)}
.ev{position:absolute;left:2px;right:2px;border-radius:12px;background:var(--tint);text-align:left;padding:6px 3px 6px 12px;line-height:1.25;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.ev::before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:3px;border-radius:9999px;background:var(--bar)}
.ev b{font-weight:600;font-size:13px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i,.ev em{font-style:normal;font-size:11px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev em{color:var(--ink)}
.ev-s{flex-direction:row;align-items:center;gap:6px;padding-top:0;padding-bottom:0}
.ev-s b{flex:0 1 auto}
.ev-m{justify-content:center;padding-top:3px;padding-bottom:3px}
.ev-m::before{top:5px;bottom:5px}
.free{position:absolute;left:6px;right:6px;border:1.5px dashed #D4D4D8;border-radius:12px;display:grid;place-items:center}
.free span{width:28px;height:28px;border-radius:9999px;background:var(--sunk);display:grid;place-items:center;color:var(--ink2)}
.fab{position:fixed;right:max(16px,calc(50vw - 185px));bottom:24px;width:56px;height:56px;border-radius:9999px;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow);z-index:5}

/* desktop */
.desk{display:none}
@media (min-width:900px){
  .phone{display:none}
  .desk{display:flex;min-height:100vh}
  .rail{width:64px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:0;padding:14px 0 16px;position:sticky;top:0;height:100vh}
  .logo{font:700 22px/1 'Inter Tight',sans-serif;height:44px;display:grid;place-items:center;margin-bottom:8px}
  .ri{width:44px;height:40px;border-radius:14px;display:grid;place-items:center;color:#52525B;margin:1px 0}
  .ri.on{background:var(--sunk);color:var(--ink)}
  .me{width:36px;height:36px;border-radius:9999px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;margin-top:8px}
  .main{flex:1;min-width:0}
  .dtop{height:64px;display:flex;align-items:center;gap:8px;padding:0 32px;border-bottom:1px solid var(--line)}
  .switch{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:9999px;background:var(--sunk);font-size:15px;font-weight:500}
  .dbody{padding:28px 32px 48px}
  .drow{display:flex;align-items:flex-end;margin-bottom:24px}
  .month.dm{justify-content:flex-start;margin:0 0 6px;gap:8px}
  .month.dm h1{margin-right:8px}
  .tools{display:flex;gap:8px}
  .week{max-width:640px}
  .day{height:56px}
}
.ev i{overflow:hidden;text-overflow:ellipsis}
