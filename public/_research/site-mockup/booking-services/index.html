/* ═══ INK FILL vs INK TEXT (owner 2026-08-15, and this is the design-system home of it) ═══

     Owner, verbatim: "I want the black used everywhere to be this. You know? ... not everywhere,
     like, text. Don't change it. Like, you know, like, for example, button... buttons and stuff,
     like all of it. It's already black ... what's already, like, fulfilled black, for example? I
     want that to be this color. I want you to actually put in design system."

     So the system now has TWO inks and they do different jobs:
       ink TEXT  #0A0A0A  unchanged, and it is the one with 5475 call sites. Text needs the
                          deepest black it can get for contrast, and he explicitly excluded it.
       ink FILL  #1C1C1F  `s-ink-soft`, the value he picked off the four-way mockup at
                          /dev/pill-ceramic on the same day. A large filled black surface reads as
                          a hole punched in the page; one step off pure makes it read as an object.

     WHY IT LIVES HERE, IN ONE RULE, instead of a sweep. Measured before choosing: `bg-s-ink` has
     416 opaque call sites and `text-s-ink` has 5475. Renaming 416 classes by hand is 416 chances
     to touch the wrong one, and the next new button would still be written `bg-s-ink` and would
     silently be the old black again. One rule here cannot drift, and it is greppable from either
     direction because the token and this block name each other.

     WHAT IS DELIBERATELY NOT COVERED, so the omissions are decisions and not oversights:
       - `text-s-ink`, `border-s-ink`, `fill-s-ink`, `stroke-s-ink`: he said do not touch text, and
         a 1px edge or a glyph is not a filled surface either.
       - the ALPHA variants, `bg-s-ink/40` and friends (208 sites). Those are photo scrims and
         gradient fades, where the point is darkness, not a surface. A scrim should stay true
         black; lifting it would just make photos look washed.
       - `bg-black` (81 sites), same reason: those are almost all gradient stops over imagery. */
.\!bg-s-ink {
    background-color: #1C1C1F !important;
  }
.bg-s-ink {
    background-color: #1C1C1F;
  }
/* ═══ TWO TEXT WEIGHTS ON CUSTOMER SURFACES (owner picked C, 2026-08-15) ═══

     He was shown three real salon pages side by side at /dev/type-weights, each with one rule
     swapped and each COUNTING its own result, and picked C.

       option                     weights (ceiling 2)   bold share (ceiling 30%)
       A, what shipped                    3                    36.8%
       B, anchors stay bold               2                    36.8%
       C, nothing bold  <- picked         2                     0%

     So the heavy tier drops one step: anything the product marks `font-semibold` or `font-bold`
     renders at 500. Body text is NOT touched, which is the whole difference between demoting a
     tier and flattening a page. The result is exactly two weights, 400 and 500.

     WHAT THIS COSTS, and he chose it knowing: the salon name stops being the heaviest thing on its
     screen. FLOORS LAW 6 wants one clearly biggest, heaviest element per customer screen, and
     after this the "biggest" half is carried entirely by SIZE (the name is 30px against a 14px
     body, a 2.1x step) with no weight step behind it. That is the trade C names on the mockup.

     WHY A RULE AND NOT A SWEEP. Measured first: `font-semibold` and `font-bold` appear 1,968 times
     across the app. Rewriting them by hand is 1,968 chances to catch the wrong one, and the next
     component anyone writes would still say `font-semibold` and would quietly be a third weight
     again. This is the same single-point reasoning as the ink-fill rule directly above.

     THE DASHBOARD IS EXCLUDED BY NAME. 239 of those 1,968 live in the operator dashboard, which is
     a density tool rather than a customer screen, and the emphasis budget already exempts that
     family by name. `DashboardLayout` carries `data-surface="dashboard"` for exactly this. It is
     the only exclusion, and it is an exclusion rather than an oversight.

     The dashboard sits INSIDE the same `<main>` as everything else, so it cannot be excluded by a
     `:not()` on the ancestor. The second rule restores it instead, and being later in the sheet at
     equal weight it wins on the dashboard and nowhere else.

     TO REVERT, or to narrow this to the salon page only: delete this block, or put the salon
     page's own selector in front of it. Nothing else in the codebase changed. */
main :is(.font-semibold, .font-bold) {
    font-weight: 500;
  }
[data-surface="dashboard"] :is(.font-semibold, .font-bold) {
    font-weight: 600;
  }
/* DS-6 (2026-06-11, video-audit, owner-approved): interactive blue darkens one
     ramp step on hover/pressed — s-accent #276EF1 -> s-accent-deep #1E54B7, 150ms.
     Single-point rule so every existing text-s-accent link/button gets the step
     without touching call sites. Scoped to real interactive elements only. */
:where(a, button, [role="button"], summary).text-s-accent {
    transition: color 150ms ease;
  }
:where(a, button, [role="button"], summary).text-s-accent:hover,
  :where(a, button, [role="button"], summary).text-s-accent:active {

/* §16.1 Option B (2026-06-11, owner pick): the page steps back behind an open
   sheet. Sheet.tsx toggles .sheet-scale-back on #main-content; portals live on
   <body>, so the sheet itself never scales. */

/* ── Phase 5.1: Standardized input styles ─────────────────────────── */
/* 2026-07-17 (owner, verbatim "for input decision both a and b2 was the problem i hated
   that sh"): input fill = A, filled gray (#F4F4F5, no hairline, radius 12, white on focus).
   This is now THE ONE TRUTH for fill/border/radius on every text-entry field.

   Selector widened from an explicit type=text/email/password/tel/number/search/url list to
   `input:not([the 10 non-text native types])`, because the explicit list missed BARE
   `<input>` (no `type` attribute at all, e.g. booking/lookup's #lookup-code) and date/time
   types (date/time/datetime-local/month/week), which rendered whatever the component's own
   Tailwind classes said instead of the depth-system gray fill (the two-look form this fixes).
   The :not() chain keeps the native browser chrome (checkbox/radio/range/file/color/submit/
   button/image/reset/hidden) exempt, those were never in scope and must stay untouched.

   CARVE-OUT: fields where a WRAPPER div (not the input) owns the visible chrome, search
   boxes with an icon + input nested in a bordered/filled row (SearchOverlay, CommandPalette,
   SalonSwitcher, dashboard search bars, the refund partial-amount field), deliberately ship
   `border-0`/`bg-transparent` etc. on the bare input itself so it blends invisibly into the
   wrapper. Widening this selector to bare inputs would now win on specificity and paint a
   second box inside the wrapper. Those inputs are protected with Tailwind `!important`
   prefixes on the specific instance (`!border-0 !bg-transparent`), the same pattern already
   used for the documented Inspo search carve-out (`input.discovery-searchbar`,
   _design-system/REMOVED.md around line 34), do not remove those `!` prefixes. */

/* Focus treatment is owned by the unlayered modality rules at the end of
   this file. Device type does not determine whether a keyboard is in use. */

/* ── Discovery search input: force a UNIFORM cool hairline (measured 2026-06-24).
     Tailwind parses `!border-s-border` two ways and ALSO emits
     `border-inline-start-color: hsl(var(--border))` (the legacy WARM token
     #DED9D3), which wins the LEFT edge over the cool `border-color` (#E4E4E7),
     so the bar showed cool top/right/bottom + a warm left. This forces all four
     to the cool s-border. Outside @layer + !important = beats the utility. ── */
input.discovery-searchbar {
  border-color: #E4E4E7 !important;              /* drift-ok: s-border literal; no CSS var exists (only the legacy warm --border) */
  border-inline-start-color: #E4E4E7 !important; /* drift-ok: s-border literal; overrides the warm logical-side leak */
}

/* ── P.1: Page-load stagger animation ──────────────────────────────── */
@keyframes fadeSlideUp {

  to   { opacity: 1; transform: translateY(0); }
}
/* Inspo search dropdown: a soft drop-in as it opens (owner 2026-06-23). */
@keyframes discover-drop {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.animate-in {

}

/* ── V2-D43 (Emil polish): heart-pop spring-feel save animation ──────────
   Used by HeartButton when toggling FROM unsaved TO saved. Range
   0.5 → 1.15 → 1.0 with strong ease-out gives the Apple spring feel
   without needing a JS spring library. transform-origin: center is
   critical — without it, the heart pops from the corner. */
@keyframes heart-pop {
  0%   { transform: scale(0.5); }
  50%  { transform: scale(1.15); }
  100% { transform: scale(1.0); }
}
.animate-heart-pop {
  transform-origin: center;
  animation: heart-pop 350ms var(--ease-out-strong, cubic-bezier(0.23, 1, 0.32, 1));
}

/* ── Success celebration (SuccessMark primitive + .celebrate-rise) ── motion pass 2026-06-09.
   Solid green disc springs in + ring pulse + white check draws; following content rises, staggered.
   See _design-system/MOTION.md. prefers-reduced-motion: base state IS the final/visible state. */
@keyframes confirm-ring { from { transform: scale(0.55); opacity: 0.32; } to { transform: scale(2); opacity: 0; } }
@keyframes confirm-pop  { from { transform: scale(0); } 60% { transform: scale(1.12); } to { transform: scale(1); } }
@keyframes confirm-draw { from { stroke-dashoffset: 32; } to { stroke-dashoffset: 0; } }
@keyframes confirm-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.success-ring { opacity: 0; animation: confirm-ring 0.75s ease-out forwards; }
.success-disc { animation: confirm-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.07s both; } /* = §4 `spring` (bouncy reveal) */
.success-check path { stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 32; animation: confirm-draw 0.4s ease-out 0.36s both; }
.celebrate-rise { animation: confirm-rise 0.42s cubic-bezier(0.16, 1, 0.3, 1) both; } /* = §4 `glide` (smooth reveal, no overshoot, correct for text) */
@media (prefers-reduced-motion: reduce) {
  .success-ring { display: none; }
  .success-disc, .success-check path, .celebrate-rise { animation: none; }
  .success-check path { stroke-dashoffset: 0; }
}

/* ── V3-D164 (2026-05-26): right-to-left text marquee ──────────────────
   Used by the small "TikTok" attribution strip on Entdecken cards
   (signals "this is a TikTok video" after the centered play orb was
   retired V3-D162). Pattern: container has `overflow: hidden`, inner
   flex holds TWO identical content blocks side-by-side, animation
   translates by -50% over one cycle so the second block lands exactly
   where the first started — seamless loop without a visible "pop".

   V3-D164e (2026-05-26): GPU-composited via translate3d + will-change.
   Without these the browser re-paints the text every frame on the CPU,
   which produced visible sub-pixel jitter (the "glitchy" look the user
   flagged). translate3d promotes the element to its own compositor
   layer; will-change tells the browser to keep that layer warm. */
@keyframes marquee {
  0%   { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(-50%, 0, 0); }
}
.animate-marquee {
  /* V3-D179 (2026-05-26): 22s → 12s per user "barely moves like slow asf".
     22s was too sedate for the small visible window — text felt static.
     12s is closer to Insta Reels' actual cadence (~10-15s/cycle) and
     reads as "alive ambient" instead of "frozen ambient". */
  animation: marquee 12s linear infinite;
  will-change: transform;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* ── V2-D43 (Emil polish): card stagger entrance on first paint ──────────
   Each card fades up with translateY(8px) → 0 + opacity 0 → 1. Stagger
   delay of 50ms between cards (Emil's recommended 30-80ms range) creates
   the cascading entrance feel without blocking interaction. Apply on
   .salon-card-stagger > * children. */
@keyframes card-stagger-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.salon-card-stagger > * {
  opacity: 0;
  transform: translateY(8px);
  animation: card-stagger-in 350ms var(--ease-out-strong, cubic-bezier(0.23, 1, 0.32, 1)) forwards;
}
.salon-card-stagger > *:nth-child(1) { animation-delay: 0ms; }
.salon-card-stagger > *:nth-child(2) { animation-delay: 50ms; }
.salon-card-stagger > *:nth-child(3) { animation-delay: 100ms; }
.salon-card-stagger > *:nth-child(4) { animation-delay: 150ms; }
.salon-card-stagger > *:nth-child(5) { animation-delay: 200ms; }
.salon-card-stagger > *:nth-child(6) { animation-delay: 250ms; }
.salon-card-stagger > *:nth-child(7) { animation-delay: 300ms; }
.salon-card-stagger > *:nth-child(8) { animation-delay: 350ms; }
/* motion-03: ceiling. Past 8 items the container ran out of enumerated delays and every
   later child inherited the undeclared default (0ms, same as :nth-child(1)), so a 12-item
   page (SearchTemplate PAGE_SIZE) entered cards 9-12 simultaneously with card 1, ahead of
   cards 2-8. Cap every item past the ceiling at the LAST defined delay instead. */
.salon-card-stagger > *:nth-child(n+9) { animation-delay: 350ms; }
@media (prefers-reduced-motion: reduce) {
  .salon-card-stagger > * { animation: none; opacity: 1; transform: none; }
}

/* ── V4 Scroll-Triggered Reveal ───────────────────────────────────── */
@keyframes v4RevealUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

  from { opacity: 0; transform: scale(0.97); }

/* Elements start hidden, animate when .is-visible is added via IntersectionObserver */

  transition: opacity 0.6s cubic-bezier(0.23, 1, 0.32, 1),
              transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}
.reveal-on-scroll.is-visible {

  transform: translateY(0);
}

.stagger-v4 > *:nth-child(2)  { animation-delay: 0.04s; }
.stagger-v4 > *:nth-child(3)  { animation-delay: 0.08s; }
.stagger-v4 > *:nth-child(4)  { animation-delay: 0.12s; }
.stagger-v4 > *:nth-child(5)  { animation-delay: 0.16s; }
.stagger-v4 > *:nth-child(6)  { animation-delay: 0.20s; }
.stagger-v4 > *:nth-child(7)  { animation-delay: 0.24s; }
.stagger-v4 > *:nth-child(8)  { animation-delay: 0.28s; }
.stagger-v4 > *:nth-child(9)  { animation-delay: 0.32s; }
.stagger-v4 > *:nth-child(10) { animation-delay: 0.36s; }
.stagger-v4 > *:nth-child(11) { animation-delay: 0.40s; }

.animate-count-v4 {
  animation: v4CountUp 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
}

/* ── V4 Subtle ambient gradient (replaces blobs) ─────────────────── */
.ambient-v4 {
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(4,51,56,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 80%, rgba(107,163,200,0.03) 0%, transparent 70%);
}
/* ── V5 Ambient gradient (warmer, unified) ────────────────────────── */
.ambient-v5 {

    radial-gradient(ellipse 70% 50% at 0% 0%, rgba(4,51,56,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%, rgba(243,168,100,0.03) 0%, transparent 60%);
}
/* ── V5 Hero Cinematic Gradient ────────────────────────────────── */
.hero-cinematic {

    radial-gradient(ellipse 60% 50% at 15% 70%, rgba(4, 51, 56, 0.05) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 25%, rgba(242, 193, 68, 0.04) 0%, transparent 60%),
    var(--bg);
}
/* ── Smooth scroll for anchor links ────────────────────────────────── */
html {
  scroll-behavior: smooth;
  transition: background-color 300ms ease, color 300ms ease;
}

/* ── Touch-device hover guard (Emil Kowalski) ────────────────────── */
@media not all and (hover: hover) {
  .store-card:hover,
  .spotlight-card:hover,
  .service-icon-card:hover,
  .quartier-photo-card:hover,
  .trending-card:hover {
    transform: none !important;
    box-shadow: inherit !important;
  }
}

/* ── @starting-style progressive enhancement (Emil Kowalski) ─────── */
@supports (selector(:starting-style)) {
  .css-enter-fade {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 250ms var(--ease-out-strong), transform 250ms var(--ease-out-strong);

    @starting-style {
      opacity: 0;
      transform: translateY(10px);
    }
  }

  .css-enter-scale {
    opacity: 1;
    transform: scale(1);
    transition: opacity 200ms var(--ease-out-strong), transform 200ms var(--ease-out-strong);

    @starting-style {
      opacity: 0;
      transform: scale(0.96);
    }
  }
}

/* ── Accessibility: prefers-reduced-motion (universal) ────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ── Scrollbar hide utility ───────────────────────────────────────── */
.scrollbar-hide {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.scrollbar-hide::-webkit-scrollbar {
  display: none;
}

/* ── Scrollbar none utility ───────────────────────────────────────── */
.scrollbar-none {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.scrollbar-none::-webkit-scrollbar {
  display: none;
}

/* ── Scroll-stable gutter utility (layout-geometry-08) ───────────────
   A scroll container whose content height is variable (a modal body, a
   bottom sheet, a sidebar list fed by live data the user can grow - reviews,
   staff lists, service lists) can cross its own scrolling threshold at
   runtime. When it does, the browser's scrollbar appears and takes
   ~15-17px of width from the content box, shifting everything inside
   sideways. `scrollbar-gutter: stable` reserves that width up front so the
   appearance/disappearance of the scrollbar never shifts content. Invisible
   on macOS' overlay scrollbars (which is plausibly most design review here),
   real on Windows/Linux Chrome and many embedded webviews - add this class
   alongside `overflow-y-auto` on any such container instead of relying on
   `overflow-y-auto` alone. See _design-system/LOCKFILE.md section 7. */
.scroll-stable-gutter {
  scrollbar-gutter: stable;
}

/* ── V5 Heart bounce animation ────────────────────────────────────── */
@keyframes heartBounce {
  0%   { transform: scale(1); }
  15%  { transform: scale(1.3); }
  30%  { transform: scale(0.9); }
  50%  { transform: scale(1.1); }
  70%  { transform: scale(0.95); }
  100% { transform: scale(1); }
}
.heart-bounce {
  animation: heartBounce 0.5s cubic-bezier(0.23, 1, 0.32, 1);
}

/* ── Walk-in live tracker: active-step blue ring + halo pulse (V3-D470c) ──
   Blue #276EF1 = walk-in primary. This is the "current step" marker on the queue
   tracker stepper, not a keyboard focus ring (no-focus-ring-skip.flag used for the
   box-shadow line below, a pre-existing marker, not a new one). Rebuilt 2026-07-25
   for two reasons: (1) WCAG 2.2.2, this ran `infinite` on a screen "built to be
   watched for minutes", beside an `animate-ping` on the same viewport
   (queue/[token]/page.tsx:398); (2) the box-shadow property it animated is the
   worst compositor case (every frame repaints instead of compositing). The static
   inset ring (the step marker itself) now sits on the base class, never animated,
   so it stays legible forever with zero cost. The halo moved to a `::after`
   pseudo-element animating transform + opacity only (compositor-friendly),
   bounded to 2 cycles (4.2s, under the 5s ceiling), held on its final frame
   (opacity 0: the halo fades out, the static ring remains). */
.walkin-ring-pulse {
  position: relative;
  box-shadow: inset 0 0 0 3px #276EF1;
}
.walkin-ring-pulse::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  border: 3px solid #276EF1;
  animation: walkinRingPulse 2.1s cubic-bezier(0.16, 1, 0.3, 1) 2 forwards;
}
@keyframes walkinRingPulse {
  0%   { transform: scale(1); opacity: 0.35; }
  100% { transform: scale(1.3); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .walkin-ring-pulse::after { animation: none; opacity: 0; }
}

/* ── V5 Page enter animation ──────────────────────────────────────── */
.page-enter {
  animation: v5PageIn 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
}
@keyframes v5PageIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Mobile tap active feedback ────────────────────────────────────── */
/* Scoped to touch devices only — no flash on desktop mouse clicks */
@media (pointer: coarse) {
  a:active,
  button:active,
  [role="button"]:active {
    opacity: 0.78;
    transform: scale(0.97);
    transition: opacity 80ms ease-out, transform 80ms ease-out;
  }
}

/* ── V5 Global Press Effect ────────────────────────────────────────── */
.solen-press-effect {
  transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1), opacity 0.1s ease;
  will-change: transform, opacity;
}
.solen-press-effect:active {
  transform: scale(0.97);
  opacity: 0.8;
}

/* ── Horizontal scroll right-edge fade ─────────────────────────────── */
/* Apply .scroll-fade-right to a relative wrapper around any overflow-x-auto container */
.scroll-fade-right {
  position: relative;
}
.scroll-fade-right::after {
  content: "";
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 48px;
  background: linear-gradient(to left, #FFFFFF 0%, transparent 100%);
  pointer-events: none;
  z-index: 1;
}

/* ── Skeleton shimmer utility ──────────────────────────────────────── */
.skeleton-shimmer {
  background: linear-gradient(90deg, #F0F0F0 25%, #E0E0E0 50%, #F0F0F0 75%);
  background-size: 200% 100%;
  /* mockup-ok: WCAG 2.2.2 conformance fix. 2 cycles (3s, under the 5s ceiling), held on the
     final frame (forwards). The gradient is symmetric (#F0F0F0 at both the first and third
     stop), so the 0%/100% keyframe endpoints both land on the flat #F0F0F0 fill, never a
     mid-sweep highlight. */
  animation: skeletonShimmer 1.5s ease-in-out 2 forwards;
  border-radius: 8px;
}

/* ── Testimonial infinite scroll ───────────────────────────────────── */
@keyframes testimonialScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.testimonial-scroll {
  animation: testimonialScroll 40s linear infinite;
}
.testimonial-scroll:hover {
  animation-play-state: paused;
}

/* Legacy global focus-visible block removed 2026-05-02 — superseded by Q47 spec
   in the @layer base block above (2px coral solid outline, 2px offset). */

/* ============== PAGE-WIDE ATMOSPHERE WASHES (V3 — LIVE_TRUTH §5g extended) ==============
   Two layered body-level washes that span the entire scrolling page so V3 sections
   (hero / recently-viewed / last-minute / nearby / categories / etc.) feel like
   ONE atmosphere instead of stark white seams between sections.

   Layer 1 — body::before:
     position: fixed → stays in place during scroll
     5 radial gradients (cyan / teal / navy whispers)
     22s drift animation, very subtle

   Layer 2 — body::after:
     position: absolute → parallax-feel echo, scrolls with document
     13 stacked radial gradients distributed top-to-bottom (so every section
     has SOMETHING tinting the bg, not just the viewport-fixed hotspots)
     28s drift animation, drifts opposite direction

   Hero gets an additional softened §5g wash on top of these (Hero.tsx).
   prefers-reduced-motion: animations disabled, glows stay still.

   Palette discipline (per V2-D15-3): ONLY brand-coordinate hues — pale teal
   #C2F0F1, brand subtle #E1F4F4, pale ice blue #CAE8FF, navy #005898 / #031E48.
   NO cream / cherry / bone / forest (those are CATEGORY-page colors). */

/* HTML carries the base white substrate so the page never falls back to
   browser default bg when scrolled past the wash bleed area. Body itself
   stays transparent so body::before / body::after wash layers (z -1 / -2)
   paint on top of the white substrate, BELOW any section content. */
html {
  /* V2-D68 (2026-05-18): substrate swapped from pure white #FFFFFF to subtle
     off-white #F8F7F2. Atmosphere wash (body::before + body::after + JSX
     AtmosphereBlobs) RETIRED in the same commit per user "atmosphere wash
     creates visual mush, lets do subtle off white". Substrate is now a quiet
     ~97% lightness with faint warmth; brand colors live as accents (CTAs,
     badges, category tags), not as a page-wide gradient.
     V2-D60-fresha history: was #FFFFFF white, with atmospheric color coming
     from body::before/::after wash layers (also retired V2-D68).
     V2-D70 (2026-05-18): #F8F7F2 → #F9F8F6 warm pearl per Aurex/Fresha spec.
     V2-D71 (2026-05-18): #F9F8F6 → #F8F7F5 slightly darker warm grey per
     user "If background too close to white on mobile, darken just a tiny bit"
     — gives white cards crisper contrast for the Aurex floating effect.
     V3-D72 (2026-05-18): #F8F7F5 warm grey → #F4F4F6 cool grey per user
     "Try #F4F4F6 or #F7F7F8" — slight cool shift makes pure-white cards pop
     more decisively (warmer substrates blended into white at certain angles).
     V3-D86 (2026-05-19): #F4F4F6 → #FFFFFF pure white per user "atmosphere
     wash removed → pure white (Airbnb pattern)." Trade-off: white cards on
     white page → depth flat, wrap/halo effects fight to be visible.
     V3-D93 (2026-05-21): #FFFFFF → #FAF8F2 subtle warm. Variant B picked from
     public/solen-substrate-variants.html. Cards (#FFFFFF) now visibly float
     on a barely-warmer substrate. Yellow-cream cast (vs V3-D72's cool grey)
     so salon photos harmonize. 1.5% warmer + 1.5% darker than pure white —
     below the threshold of "looks beige", above the threshold of "white
     cards float." V2-D60 cards-stay-white fix preserved.
     V3-D94 (2026-05-21): REVERTED V3-D93 — #FAF8F2 → #FFFFFF per user
     "revert back to comp white". Atmosphere/blob exploration continues on
     pure white substrate; the warm cream experiment did not survive contact
     with the cool-poster blob mockup. */
  background-color: #FFFFFF;
}

body {
  background: transparent;
  position: relative;
  /* Prevent horizontal scroll from -10% / -15% wash insets bleeding past viewport */
  overflow-x: hidden;
}

/* V2-D68 (2026-05-18): body::before + body::after atmosphere wash layers
   RETIRED. They were the page-wide gradient that created the "visual mush"
   user feedback — 5-layer cloud zones at 0.40-0.85 opacity (::before) + 12
   micro-gradients down the page (::after). Substrate is now subtle off-white
   #F8F7F2 with NO atmosphere overlay. Brand colors live as accents on CTAs
   + badges + category tags only, not as a page-wide background.
   To re-introduce as per-section accent (e.g. behind hero h1 only), build a
   localized component instead of pseudo-elements on body.
   V2-D60-fresha history preserved in git blame + archived LIVE_TRUTH §5g.
body::before {
  content: '';
  position: fixed;
  inset: -15%;
  background:
    radial-gradient(ellipse 75% 55% at 82% 12%, rgba(255, 232, 216, 0.85) 0%, transparent 65%),
    radial-gradient(ellipse 60% 55% at 15% 22%, rgba(212, 221, 200, 0.75) 0%, transparent 70%),
    radial-gradient(ellipse 55% 45% at 92% 48%, rgba(168, 224, 191, 0.55) 0%, transparent 65%),
    radial-gradient(ellipse 60% 50% at 8% 72%, rgba(240, 169, 140, 0.40) 0%, transparent 65%),
    radial-gradient(ellipse 65% 50% at 70% 92%, rgba(255, 232, 216, 0.55) 0%, transparent 60%);
  z-index: -2;
  pointer-events: none;
  animation: atm-drift-1 22s ease-in-out infinite;
  will-change: transform;
}
body::after {
  content: '';
  position: absolute;
  inset: -10%;
  background:
    radial-gradient(ellipse 55% 7% at 80% 14%, rgba(212, 221, 200, 0.20) 0%, transparent 70%),
    radial-gradient(ellipse 45% 6% at 15% 19%, rgba(255, 232, 216, 0.18) 0%, transparent 75%),
    radial-gradient(ellipse 50% 7% at 60% 26%, rgba(255, 232, 216, 0.22) 0%, transparent 70%),
    radial-gradient(ellipse 40% 6% at 25% 32%, rgba(240, 169, 140, 0.14) 0%, transparent 75%),
    radial-gradient(ellipse 50% 8% at 75% 40%, rgba(212, 221, 200, 0.22) 0%, transparent 70%),
    radial-gradient(ellipse 45% 7% at 20% 46%, rgba(168, 224, 191, 0.14) 0%, transparent 75%),
    radial-gradient(ellipse 55% 7% at 60% 54%, rgba(240, 169, 140, 0.18) 0%, transparent 70%),
    radial-gradient(ellipse 40% 6% at 12% 60%, rgba(255, 232, 216, 0.16) 0%, transparent 75%),
    radial-gradient(ellipse 50% 7% at 85% 66%, rgba(212, 221, 200, 0.22) 0%, transparent 70%),
    radial-gradient(ellipse 45% 6% at 30% 72%, rgba(255, 232, 216, 0.16) 0%, transparent 75%),
    radial-gradient(ellipse 55% 7% at 60% 80%, rgba(255, 232, 216, 0.18) 0%, transparent 70%),
    radial-gradient(ellipse 50% 7% at 25% 88%, rgba(168, 224, 191, 0.12) 0%, transparent 65%);
  z-index: -1;
  pointer-events: none;
  animation: atm-drift-2 28s ease-in-out infinite;
  will-change: transform;
}
*/

@keyframes atm-drift-1 {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  25%      { transform: translate3d(-7%, 4%, 0) scale(1.08); }
  50%      { transform: translate3d(3%, -5%, 0) scale(1.10); }
  75%      { transform: translate3d(5%, 3%, 0) scale(1.05); }
}

@keyframes atm-drift-2 {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  25%      { transform: translate3d(8%, -3%, 0) scale(1.07); }
  50%      { transform: translate3d(-5%, 6%, 0) scale(1.12); }
  75%      { transform: translate3d(-7%, -4%, 0) scale(1.06); }
}

@media (prefers-reduced-motion: reduce) {
  body::before, body::after { animation: none !important; }
}


/* ── Motion sheet 22 (owner-approved 2026-06-12): the NEW micro-moment vocabulary ──
   All curves = §4 tokens (spring = bouncy reveal, glide = smooth). Each utility is
   one moment; respect prefers-reduced-motion via the global media query below. */

/* 1 · count bump — re-mount the badge with key={count} to fire on change */
@keyframes count-bump { 0% { transform: scale(1); } 35% { transform: scale(1.45); } 100% { transform: scale(1); } }
.animate-count-bump { animation: count-bump 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

/* 3 · price roll — re-mount the value with key={price}; reads as an odometer tick */
@keyframes value-roll { 0% { transform: translateY(60%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
.animate-value-roll { display: inline-block; animation: value-roll 0.35s cubic-bezier(0.16, 1, 0.3, 1); }

/* 5 · slot cascade — set on the chips container, re-mount with key={selectedDay} */
/* fill-mode BACKWARDS (not forwards): forwards pinned opacity:1 forever, which
   beat the .opacity-40 class on DISABLED slots (greyed already-booked times,
   2026-06-12). backwards covers the stagger delay, then releases the cascade. */
.slot-cascade > * { animation: slot-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
.slot-cascade > *:nth-child(1) { animation-delay: 0.03s; } .slot-cascade > *:nth-child(2) { animation-delay: 0.08s; }
.slot-cascade > *:nth-child(3) { animation-delay: 0.13s; } .slot-cascade > *:nth-child(4) { animation-delay: 0.18s; }
.slot-cascade > *:nth-child(5) { animation-delay: 0.23s; } .slot-cascade > *:nth-child(6) { animation-delay: 0.28s; }
.slot-cascade > *:nth-child(7) { animation-delay: 0.33s; } .slot-cascade > *:nth-child(8) { animation-delay: 0.38s; }
.slot-cascade > *:nth-child(n+9) { animation-delay: 0.43s; }
@keyframes slot-in { from { opacity: 0; transform: translateY(10px) scale(0.92); } }

/* 6 · number flip — re-mount with key={position}; departure-board beat */
@keyframes num-flip { 0% { transform: rotateX(90deg); opacity: 0.4; } 100% { transform: rotateX(0); opacity: 1; } }
.animate-num-flip { display: inline-block; transform-origin: center 60%; animation: num-flip 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); perspective: 300px; }

/* 7 · stamp slam — the newest earned stamp drops in + ring shockwave (::after on a relative parent) */
@keyframes stamp-slam { 0% { transform: scale(2.2) rotate(-14deg); opacity: 0; } 55% { transform: scale(0.92) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
.animate-stamp-slam { animation: stamp-slam 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes slam-ring { 0% { opacity: 0.5; transform: scale(0.8); } 100% { opacity: 0; transform: scale(1.6); } }
.stamp-slam-ring::after { content: ""; position: absolute; inset: -6px; border-radius: 9999px; border: 2px solid currentColor; animation: slam-ring 0.6s 0.25s ease-out both; }

/* 8 · team wave — container class set when in view; avatars bounce hello once */
.team-wave > * { animation: team-wave 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.team-wave > *:nth-child(1) { animation-delay: 0.05s; } .team-wave > *:nth-child(2) { animation-delay: 0.17s; }
.team-wave > *:nth-child(3) { animation-delay: 0.29s; } .team-wave > *:nth-child(4) { animation-delay: 0.41s; }
.team-wave > *:nth-child(5) { animation-delay: 0.53s; } .team-wave > *:nth-child(n+6) { animation-delay: 0.65s; }
@keyframes team-wave { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } }

/* 9 · breathing empty-state icon */
@keyframes breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-7px) scale(1.05); } }
.animate-breathe { animation: breathe 3.4s ease-in-out infinite; }

/* 2 · heart burst — 6 particles; HeartButton renders .heart-burst spans on activate */
.heart-burst { position: absolute; width: 6px; height: 6px; border-radius: 9999px; background: #FF3366; pointer-events: none; opacity: 0; }
.heart-burst:nth-of-type(1) { animation: hb-a 0.55s ease-out both; } .heart-burst:nth-of-type(2) { animation: hb-b 0.55s ease-out both; }
.heart-burst:nth-of-type(3) { animation: hb-c 0.55s ease-out both; } .heart-burst:nth-of-type(4) { animation: hb-d 0.55s ease-out both; }
.heart-burst:nth-of-type(5) { animation: hb-e 0.55s ease-out both; } .heart-burst:nth-of-type(6) { animation: hb-f 0.55s ease-out both; }
@keyframes hb-a { 10% { opacity: 1; } 100% { transform: translate(-20px, -16px) scale(0.4); opacity: 0; } }
@keyframes hb-b { 10% { opacity: 1; } 100% { transform: translate(20px, -16px) scale(0.4); opacity: 0; } }
@keyframes hb-c { 10% { opacity: 1; } 100% { transform: translate(-24px, 4px) scale(0.4); opacity: 0; } }
@keyframes hb-d { 10% { opacity: 1; } 100% { transform: translate(24px, 4px) scale(0.4); opacity: 0; } }
@keyframes hb-e { 10% { opacity: 1; } 100% { transform: translate(-10px, -25px) scale(0.4); opacity: 0; } }
@keyframes hb-f { 10% { opacity: 1; } 100% { transform: translate(10px, -25px) scale(0.4); opacity: 0; } }

/* 10 · toast tilt-settle — overrides the toaster enter */
@keyframes toast-tilt { 0% { transform: translateY(60px) rotate(2deg); opacity: 0; } 60% { transform: translateY(-3px) rotate(-0.5deg); opacity: 1; } 100% { transform: none; opacity: 1; } }

   the two places that breaks for Solen specifically, without disabling the
   feature (never a blanket forced-color-adjust: none on the page):

      normalizes backgrounds (the "selected = calm grey sunken fill" law,

      via a real ARIA attribute a visible system-color border too, so the
      distinction survives the remap.

:left-auto md:right-6 md:items-end md:max-w-[420px]"></ol><title>Book your appointment | Solen</title><meta name="description" content="Secure your appointment with just a few clicks."><link rel="canonical" href="https://solen.ch/en/salon/atelier-haarwerk"><link rel="alternate" hreflang="de" href="https://solen.ch/de/salon/atelier-haarwerk"><link rel="alternate" hreflang="en" href="https://solen.ch/en/salon/atelier-haarwerk"><link rel="alternate" hreflang="fr" href="https://solen.ch/fr/salon/atelier-haarwerk"><link rel="alternate" hreflang="it" href="https://solen.ch/it/salon/atelier-haarwerk"><link rel="alternate" hreflang="x-default" href="https://solen.ch/de/salon/atelier-haarwerk"><meta property="og:title" content="Atelier Haarwerk | Solen"><meta property="og:description" content="Book now at Atelier Haarwerk in Freie Strasse 12, Basel. ★ 4.6 (25 reviews). Book online, instant confirmation."><meta property="og:url" content="https://solen.ch/en/salon/atelier-haarwerk"><meta property="og:site_name" content="solen.ch"><meta property="og:locale" content="en_GB"><meta property="og:image" content="https://images.unsplash.com/photo-1560066984-138dadb4c035?w=800&amp;q=80"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Atelier Haarwerk"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Atelier Haarwerk | Solen"><meta name="twitter:description" content="Book now at Atelier Haarwerk in Freie Strasse 12, Basel. ★ 4.6 (25 reviews). Book online, instant confirmation."><meta name="twitter:image" content="https://images.unsplash.com/photo-1560066984-138dadb4c035?w=800&amp;q=80"><script>// Mockup-only interactions for the frozen site pages: press feedback, single-select chips, slots and
// day tiles, segmented controls, switches, add-service with a live total, back buttons.
// Simulated: nothing is booked or saved.
(() => {
  const INK = '#0A0A0A', GREY = '#F4F4F5', WHITE = '#fff';
  const css = document.createElement('style');
  css.textContent = 'button,a,[role=button],[role=switch]{cursor:pointer;-webkit-tap-highlight-color:transparent}' +
    'button:active,a:active,[role=button]:active,[role=switch]:active{transform:scale(.97);transition:transform 80ms ease}';
  document.head.appendChild(css);
  const txt = (e) => (e.innerText || '').replace(/\s+/g, ' ').trim();
  const bgOf = (e) => getComputedStyle(e).backgroundColor;
  const isInk = (c) => /^rgb\((\d+), (\d+), (\d+)\)$/.test(c) && c.match(/\d+/g).slice(0, 3).every((n) => +n < 45);
  const paint = (e, on) => {
    e.style.setProperty('background-color', on ? INK : GREY, 'important');
    e.style.setProperty('color', on ? WHITE : INK, 'important');
    for (const k of e.querySelectorAll('*')) if ([...k.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim())) k.style.setProperty('color', on ? WHITE : INK, 'important');
    e.setAttribute('aria-pressed', on ? 'true' : 'false');
  };
  const SLOT = /^\d{1,2}:\d{2}$/;
  const DAY = /^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\.? ?\d{1,2}( [A-Za-z]{3})?$/;
  let total = 0, items = 0, mins = 0;
  // a disabled button swallows clicks, so Continue is re-enabled and only looks disabled until a service is added
  const cont = [...document.querySelectorAll('button')].find((b) => /^continue/i.test(txt(b)) && b.disabled);
  if (cont) { cont.disabled = false; cont.removeAttribute('disabled'); cont.style.setProperty('opacity', '.5', 'important'); cont.style.setProperty('cursor', 'not-allowed', 'important'); }

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('button, [role=button], [role=switch], a');
    if (!el) return;
    const label = (el.getAttribute('aria-label') || '').toLowerCase();
    const t = txt(el);
    // back
    if (/^(back|zurück)$/.test(label) || /go back/.test(label)) { ev.preventDefault(); history.back(); return; }
    // switch
    if (el.getAttribute('role') === 'switch') {
      ev.preventDefault();
      const on = el.getAttribute('aria-checked') !== 'true';
      el.setAttribute('aria-checked', on ? 'true' : 'false');
      el.style.setProperty('background-color', on ? INK : '#D4D4D8', 'important');
      const knob = el.firstElementChild; if (knob) { knob.style.transition = 'transform 150ms ease'; knob.style.transform = on ? '' : 'translateX(-20px)'; }
      return;
    }
    // add a service (booking step 1): toggle with a check, update the bottom total, enable Continue
    if (label === 'add' || label === 'added' || /hinzufügen/.test(label)) {
      ev.preventDefault();
      let row = el.parentElement; while (row && !/\d+\s*CHF/.test(row.innerText)) row = row.parentElement;
      const price = +((row && row.innerText.match(/(\d+)\s*CHF/) || [])[1] || 0);
      const dur = +((row && row.innerText.match(/(\d+)\s*min/) || [])[1] || 0);
      const on = el.getAttribute('aria-pressed') !== 'true';
      const circle = el.querySelector('span.rounded-full') || el; el.setAttribute('aria-pressed', on ? 'true' : 'false'); el.setAttribute('aria-label', on ? 'Added' : 'Add');
      circle.style.transition = 'background-color 150ms ease, border-color 150ms ease, color 150ms ease';
      circle.style.setProperty('background-color', on ? INK : 'transparent', 'important'); circle.style.setProperty('border-color', on ? INK : '', 'important'); circle.style.setProperty('color', on ? WHITE : '', 'important');
      const [plus, check] = circle.children; // the real component cross-fades plus to check with a blur
      for (const [k, show] of [[plus, !on], [check, on]]) if (k) { k.style.transition = 'opacity 180ms ease, filter 180ms ease, transform 180ms ease'; k.style.opacity = show ? '1' : '0'; k.style.filter = show ? 'blur(0px)' : 'blur(6px)'; k.style.transform = show ? 'none' : 'scale(0.6)'; }
      total += on ? price : -price; items += on ? 1 : -1; mins += on ? dur : -dur;
      const cart = document.querySelector('[data-cart-anchor]');
      if (cart) {
        const [pt, pm] = cart.querySelectorAll('p'); const ts = pt && pt.querySelector('span'); if (ts) ts.textContent = total;
        if (pm) { const svg = pm.querySelector('svg'); pm.textContent = ''; if (svg) pm.appendChild(svg); pm.append(`${items} ${items === 1 ? 'item' : 'items'} `); const ms = document.createElement('span'); ms.textContent = mins; pm.append(ms, ' min'); }
      }
      if (cont) { cont.style.setProperty('opacity', items ? '1' : '.5', 'important'); cont.style.setProperty('cursor', items ? 'pointer' : 'not-allowed', 'important'); }
      return;
    }
    // continue on booking step 1 goes to the date and time step
    if (/^continue/i.test(t) && /booking-services/.test(location.pathname)) { ev.preventDefault(); if (items) location.href = '../booking-time/index.html'; return; }
    // time slots and day tiles: single select across the page
    if (SLOT.test(t) || DAY.test(t)) {
      ev.preventDefault();
      const re = SLOT.test(t) ? SLOT : DAY;
      for (const b of document.querySelectorAll('button')) if (re.test(txt(b)) && !b.disabled) paint(b, b === el);
      return;
    }
    // chips and segmented controls: single select among sibling buttons
    const sibs = el.parentElement ? [...el.parentElement.children].filter((c) => c.tagName === el.tagName && txt(c)) : [];
    if (el.tagName === 'BUTTON' && sibs.length >= 2 && !el.closest('nav')) {
      const r = el.getBoundingClientRect();
      if (r.height <= 60 && sibs.some((c) => isInk(bgOf(c)) || c.getAttribute('aria-pressed') === 'true' || c.getAttribute('aria-selected') === 'true')) {
        ev.preventDefault();
        for (const c of sibs) paint(c, c === el);
        return;
      }
    }
    // dead links stay put instead of jumping to the top
    if (el.tagName === 'A' && el.getAttribute('href') === '#') ev.preventDefault();
  }, true);
})();
