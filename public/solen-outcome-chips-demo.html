<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outcome-driven amount chips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A; --ink2:#6B6B6B; --ink40:rgba(10,10,10,.4); --border:#E7E5E4; --sunken:#F5F5F4;
    --accent:#276EF1; --accent-pale:#EAEFFE;
    --success:#16A34A; --success-bg:#E8F5E9; --error:#DC2626; --error-bg:#FEE2E2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#fff;padding:32px;display:flex;flex-direction:column;align-items:center}
  .fh{font-family:'Inter Tight',sans-serif}
  h1{font-family:'Inter Tight';font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
  .sub{font-size:13px;color:var(--ink40);margin-bottom:24px}
  .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .chip{width:220px;border:1px solid;border-radius:12px;padding:12px 14px}
  .chip .k{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
  .chip .v{font-family:'Inter Tight';font-weight:600;font-size:20px;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
  .chip .s{font-size:11px;font-weight:600;margin-top:8px}
  .pending{background:var(--accent-pale);border-color:rgba(39,110,241,.2)}
  .pending .v{color:var(--accent)}
  .declined{background:var(--error-bg);border-color:rgba(220,38,38,.2)}
  .declined .v{color:var(--error)}
  .refunded{background:var(--success-bg);border-color:rgba(22,163,74,.2)}
  .refunded .v{color:var(--success)}
</style>
</head>
<body>
  <h1>Outcome-driven amount chip</h1>
  <p class="sub">Same chip — the colour follows the case outcome, automatically (caseChipClasses).</p>
  <div class="row">
    <div class="chip pending">
      <div class="k">Erstattung angefordert</div>
      <div class="v num">CHF 45.00</div>
      <div class="s" style="color:var(--accent)">● Offen / In Prüfung</div>
    </div>
    <div class="chip declined">
      <div class="k">Erstattung angefordert</div>
      <div class="v num">CHF 45.00</div>
      <div class="s" style="color:var(--error)">● Abgelehnt</div>
    </div>
    <div class="chip refunded">
      <div class="k">Erstattet</div>
      <div class="v num">CHF 45.00</div>
      <div class="s" style="color:var(--success)">● Erstattet</div>
    </div>
  </div>
</body>
</html>
