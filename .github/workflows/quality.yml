name: quality

# Ring 5 (test + CI floor, _plans/BACKEND_IMPROVEMENT.md). Three independent gates on
# every push + PR: typecheck (hard zero since 2026-07-11), lint (ratchet, 481
# pre-existing errors), unit tests. The `e2e` job runs the live-DB booking lifecycle
# script (scripts/e2e-booking.ts) and the `visual` job runs the 2 Playwright specs
# against a real build; both SKIP GREEN when their secrets aren't configured on the
# repo (see each job's comment for the gh secret set one-liners).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: tsc --noEmit (hard zero, the 4 pre-existing errors were fixed 2026-07-11)
        run: |
          set +e
          npx tsc --noEmit > tsc-output.txt 2>&1
          set -e
          COUNT=$(grep -c "error TS" tsc-output.txt || true)
          BASELINE=0
          echo "tsc error count: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::tsc error count went UP: $COUNT > $BASELINE baseline"
            cat tsc-output.txt
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # testing-release-10: a ratchet that only ever holds a line and never lowers it
      # is a permanent debt marker, not a quality gate. Trigger to lower BASELINE:
      # whenever a change touches a file that already has pre-existing lint errors,
      # fix those errors as part of that change (fix-while-you're-there) and drop
      # BASELINE by the count fixed. Compare to the `typecheck` job above, which
      # DID get driven to a hard 0 in practice; this job's baseline has not moved
      # since it was created and needs the same treatment.
      # accessibility-09 (2026-07-27): eslint.config.mjs now turns on
      # eslint-plugin-jsx-a11y's full `recommended` ruleset (next/core-web-vitals only
      # wired 6 of its ~40 rules before this). That surfaced 56 real pre-existing
      # violations (23 click-events-have-key-events, 18 no-static-element-interactions,
      # 6 no-autofocus, 3 no-noninteractive-element-interactions, 3
      # label-has-associated-control, 1 each heading-has-content/anchor-is-valid/
      # anchor-has-content) on top of the 483 the ratchet already measured (2 above
      # the 481 this comment used to say, unrelated drift). BASELINE moves to 539
      # (483 + 56) the same way this ratchet is meant to move on any new check: it
      # only fails a build that makes the count go UP from here.
      # copy-i18n-05 (2026-07-27): eslint.config.mjs added a no-restricted-syntax
      # rule blocking a literal BCP-47 tag ("de-CH" etc) passed directly to
      # toLocale*String/Intl.*Format outside lib/format.ts (the 112-site hardcode
      # bug _rules/LESSONS_LEARNED.md already recorded once). Measured freshly at
      # 541 pre-existing errors (2 above the 539 this comment used to say, unrelated
      # drift, not this change) before the rule; the rule itself surfaced 23 real
      # pre-existing violations (dev/search-morph, dev/pdp/_overhaul, the payout
      # invoice HTML, lib/email.ts, cron SMS reminders, availability/time-slots,
      # express-rebook, dashboard/today, profile/live-state, notify-no-show-fee,
      # lib/salon-hours.ts). BASELINE moves to 564 (541 + 23), same ratchet shape:
      # it only fails a build that makes the count go UP from here.
      - name: npm run lint (ratchet vs baseline, currently 564 pre-existing errors, 23 of them copy-i18n-05 from the new de-CH-literal rule)
        run: |
          set +e
          npm run lint > lint-output.txt 2>&1
          set -e
          COUNT=$(grep -c "Error:" lint-output.txt || true)
          BASELINE=564
          echo "lint error count: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::lint error count went UP: $COUNT > $BASELINE baseline"
            cat lint-output.txt
            exit 1
          fi

  # fe-01: the repo-wide `lint` ratchet above only guarantees the TOTAL error
  # count never goes up. It does not guarantee NEW code is clean, because a PR
  # can add 5 fresh `any`s in file A while an unrelated PR removes 5 in file B,
  # and both pass individually -- that laundering is exactly why BASELINE above
  # sat frozen for months. This job runs ESLint ONLY against files changed since
  # the merge-base with main (scripts/lint-diff-scoped.mjs) and fails on ANY
  # occurrence of @typescript-eslint/no-explicit-any, @typescript-eslint/no-unused-vars,
  # or @next/next/no-html-link-for-pages in those changed lines -- zero baseline,
  # no exception. Paydown schedule for the repo-wide 539: _rules/LINT_DEBT.md.
  lint-diff-scoped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: lint-diff-scoped (hard zero on changed lines, no baseline)
        run: node scripts/lint-diff-scoped.mjs

  # secrets-webhooks-02: a dependency-vulnerability scan is only as good as the
  # last time someone remembered to run it by hand. `npm audit --omit=dev`'s
  # critical+high count nearly tripled (2 -> 6) in the 10 days between the
  # research pass on 2026-07-16 and this gate's own re-run on 2026-07-27, with
  # zero automated signal anywhere in that window. Ratchet, same shape as the
  # lint job above: ships with the CURRENT critical+high count as BASELINE (a
  # live CVE already in the lockfile is a real, separate cleanup task, not
  # something this gate silently fixes) and only fails a build that makes a NEW
  # one land. Lower BASELINE whenever a dependency bump fixes one.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: "npm audit --omit=dev (ratchet vs baseline, currently 6 critical+high: 1 critical protobufjs via posthog-js's OpenTelemetry exporter, 5 high including next itself pinned below its fix floor)"
        run: |
          set +e
          npm audit --omit=dev --json > audit-output.json 2>audit-output.err
          set -e
          COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('audit-output.json','utf8')).metadata.vulnerabilities; console.log(d.critical + d.high)")
          CRITICAL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('audit-output.json','utf8')).metadata.vulnerabilities.critical)")
          HIGH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('audit-output.json','utf8')).metadata.vulnerabilities.high)")
          BASELINE=6
          echo "npm audit critical+high count: $COUNT (critical=$CRITICAL high=$HIGH, baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::npm audit critical+high count went UP: $COUNT > $BASELINE baseline"
            npm audit --omit=dev || true
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: vitest run (money-path unit tests, tests/**/*.test.ts)
        run: npx vitest run

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: "check-i18n-sentinel (copy-i18n-01: no TODO/sentinel keys, identical-to-en ratchet)"
        run: node scripts/check-i18n-sentinel.mjs
      - name: "check-i18n-parity (copy-i18n-07: de.json key set must match en/fr/it.json exactly, hard zero)"
        run: node scripts/check-i18n-parity.mjs

  # color-tokens-01 (2026-07-27): a token LOCKFILE.md calls RETIRED is worse than
  # useless if the drift-checker's RETIRED_TOKENS set doesn't name it too -- it
  # gives false confidence that enforcement exists. This job parses LOCKFILE.md's
  # RETIRED section and check.py's RETIRED_TOKENS and fails, naming the exact
  # token, on any token the doc retires that the checker doesn't enforce. Python
  # (not Node) because it lives in the solen-drift-check skill alongside check.py.
  retired-token-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "check-retired-sync (LOCKFILE.md RETIRED bullets vs check.py RETIRED_TOKENS, hard zero)"
        run: python3 .claude/skills/solen-drift-check/scripts/check-retired-sync.py

  # secrets-webhooks-10: a repo-wide grep-pattern check that a NEW !==/=== compare
  # against a secret/token/signature/hmac-shaped variable never lands again. The
  # project already had the right rule written down as a comment in one file
  # (lib/bookings/guest-access.ts) and it did not travel: 22 cron routes plus 3
  # other routes were still doing a plain !== on a shared secret until this same
  # finding fixed them (lib/cron-auth.ts's constantTimeStringEqual). Baseline 0.
  timing-safe-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: check-timing-safe-secrets (hard zero)
        run: node scripts/check-timing-safe-secrets.mjs

  # api-contracts-01/02/05: a ratchet over scripts/api-contracts-census.mjs's three
  # counts (legacy error shapes, legacy paginated-list success shapes, 201 responses
  # missing Location). No mass migration of the existing legacy shapes, per
  # _backend-system/LAW.md section 7; this only fails when a count goes UP, meaning a
  # new or touched route introduced a NEW instance of a shape LAW.md already retired.
  contracts-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: api-contracts-census (ratchet vs baseline)
        run: |
          set +e
          OUTPUT=$(node scripts/api-contracts-census.mjs)
          set -e
          echo "$OUTPUT"
          ERR=$(echo "$OUTPUT" | grep -oE 'RATCHET_LEGACY_ERROR_SHAPES=[0-9]+' | cut -d= -f2)
          SUC=$(echo "$OUTPUT" | grep -oE 'RATCHET_LEGACY_SUCCESS_SHAPES=[0-9]+' | cut -d= -f2)
          LOC=$(echo "$OUTPUT" | grep -oE 'RATCHET_MISSING_LOCATION_201=[0-9]+' | cut -d= -f2)
          BASELINE_ERR=1716
          BASELINE_SUC=5
          BASELINE_LOC=44
          FAIL=0
          if [ "$ERR" -gt "$BASELINE_ERR" ]; then echo "::error::legacy error-shape count went UP: $ERR > $BASELINE_ERR baseline"; FAIL=1; fi
          if [ "$SUC" -gt "$BASELINE_SUC" ]; then echo "::error::legacy success-envelope count went UP: $SUC > $BASELINE_SUC baseline"; FAIL=1; fi
          if [ "$LOC" -gt "$BASELINE_LOC" ]; then echo "::error::201-without-Location count went UP: $LOC > $BASELINE_LOC baseline"; FAIL=1; fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi

  # performance-01: a ratchet over scripts/select-star-census.mjs's count of
  # select("*")/select('*') under app/api, Solen's single most repeated
  # over-fetch bug shape (SWEEP_BACKLOG independently found + fixed the same
  # pattern on 5+ routes). Same ratchet shape as the tsc/lint jobs above: only
  # fails when a NEW or edited route pushes the count above the baseline. A
  # route that genuinely needs every column goes in
  # scripts/select-star-allowlist.json with a one-line reason, not a silent
  # exemption.
  select-star-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: select-star-census (ratchet vs baseline, currently 107)
        run: |
          OUTPUT=$(node scripts/select-star-census.mjs)
          echo "$OUTPUT"
          COUNT=$(echo "$OUTPUT" | grep -oE 'RATCHET_SELECT_STAR=[0-9]+' | cut -d= -f2)
          BASELINE=107
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::select(\"*\") count went UP: $COUNT > $BASELINE baseline. Name explicit columns, or add a one-line reason to scripts/select-star-allowlist.json if this route genuinely needs every column."
            exit 1
          fi

  # fe-04: a structural code-DUPLICATION census (jscpd over app/+components/+
  # components-legacy/), a distinct failure mode from the solen-drift-check
  # token-drift gate (that one catches hardcoded hex/spacing/duration; this
  # one catches repeated LOGIC/JSX). COMPONENT_REGISTRY.md documents at least
  # 5 confirmed historical duplicate-component incidents (PriceFrom,
  # SeeAllButton, Avatar, RatingStars, FilterBar), each found only by a human
  # doing a manual sweep, sometimes long after the duplicate shipped. Same
  # ratchet shape as the lint/select-star/contracts jobs above: fails only
  # when the clone count goes UP from baseline.
  duplication-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: duplication-census (ratchet vs baseline, currently 67 clones)
        run: |
          OUTPUT=$(node scripts/duplication-census.mjs)
          echo "$OUTPUT"
          COUNT=$(echo "$OUTPUT" | grep -oE 'RATCHET_DUPLICATION_CLONES=[0-9]+' | cut -d= -f2)
          BASELINE=67
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::duplicated-code clone count went UP: $COUNT > $BASELINE baseline. A new block matches 30+ existing lines elsewhere in the tree -- extract it into a shared component/util instead of re-pasting it (see _design-system/COMPONENT_REGISTRY.md for the collapsed-duplicate history this gate exists to prevent recurring)."
            exit 1
          fi

  # testing-release-03: scripts/api-smoke.ts is the mobile-contract tripwire (live-DB
  # zod-shape checks against ~10 GET endpoints, built specifically to catch PostgREST
  # silently swallowing a `.select()` on a renamed/missing column). It only needs the
  # 3 Supabase secrets already configured on this repo, unlike the `e2e`/`visual` jobs
  # below, so it activates immediately with no owner action.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secrets-check
        id: secrets-check
        run: |
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase secrets not set on this repo, skipping the smoke job (stays green). See .github/workflows/quality.yml's e2e job comment for the gh secret set one-liners."
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets-check.outputs.has-secrets == 'true'
        with:
          node-version: "22"
          cache: "npm"
      - name: npm ci
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm ci
      - name: npm run smoke (live-DB zod-shape checks, mobile-contract tripwire)
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm run smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # E2E booking lifecycle (scripts/e2e-booking.ts, Ring 2 recommendations batch): drives
  # the REAL route handlers (bookings create, booking-pay-intent, cancel) against the live
  # DB's sanctioned test salon (testsalon-7a2dd244) with a real Stripe TEST-mode
  # PaymentIntent, self-cleaning (deletes its own booking/slot rows, cancels its own PI,
  # restores the salon's accepts_online_payment flag). Needs live-DB + Stripe TEST secrets
  # this repo does not have configured today, so secrets-check is a STEP, not a job-level
  # `if:`, so the job always reports SUCCESS: absent secrets means every later step is
  # individually skipped instead of the workflow failing or showing a grey "skipped" check.
  #
  # To activate once the owner is ready (test-mode Stripe key + the SAME Supabase project
  # this script targets, service-role key required for admin seed/cleanup):
  #   gh secret set NEXT_PUBLIC_SUPABASE_URL --body "<https://xxxxx.supabase.co>"
  #   gh secret set NEXT_PUBLIC_SUPABASE_ANON_KEY --body "<anon key>"
  #   gh secret set SUPABASE_SERVICE_ROLE_KEY --body "<service role key>"
  #   gh secret set STRIPE_SECRET_KEY --body "<sk_test_... , NEVER an sk_live_ key>"
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secrets-check
        id: secrets-check
        # testing-release-01: a secrets-gated job that only ever WARNS can stay dark
        # forever with a permanent green check. GRACE_PERIOD_END gives the owner a
        # real deadline (set 2 weeks out from the day this was hardened); past it,
        # the missing secret turns the job red instead of silently passing.
        run: |
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] && [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            GRACE_PERIOD_END="2026-08-09"
            TODAY=$(date -u +%Y-%m-%d)
            if [[ "$TODAY" > "$GRACE_PERIOD_END" ]]; then
              echo "::error::STRIPE_SECRET_KEY (and/or the Supabase secrets) still not set on this repo, past the $GRACE_PERIOD_END grace period. This job has been silently reporting SUCCESS while skipping the real e2e-booking test. Run the gh secret set commands in this job's header comment, or explicitly accept the gap by moving GRACE_PERIOD_END forward with a reason."
              exit 1
            fi
            echo "::warning::Live-DB/Stripe secrets not set on this repo, skipping the e2e job (stays green until $GRACE_PERIOD_END). See the job comment in .github/workflows/quality.yml for the gh secret set one-liners."
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets-check.outputs.has-secrets == 'true'
        with:
          node-version: "22"
          cache: "npm"
      - name: npm ci
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm ci
      - name: npm run e2e (live-DB booking lifecycle, self-cleaning)
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm run e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

  # Playwright visual specs (e2e/visual/, owner batch R3): real `next build` + `next start`
  # on port 3001, chromium only. Needs the live project's public Supabase URL/anon key AND
  # the service role key (getServerEnv() runs at module scope in several routes, so
  # `next build` throws without it). Skips green while secrets are absent; activate with
  # the same gh secret set one-liners as the e2e job above.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: secrets-check
        id: secrets-check
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] && [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase secrets not set on this repo, skipping the visual job (stays green)."
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets-check.outputs.has-secrets == 'true'
        with:
          node-version: "22"
          cache: "npm"
      - name: npm ci
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm ci
      - name: install chromium
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npx playwright install --with-deps chromium
      - name: next build
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: next start (background) + wait for it
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: |
          npx next start -p 3001 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://localhost:3001"; then echo "server up"; exit 0; fi
            sleep 2
          done
          echo "::error::next start never became reachable"; exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: playwright visual specs
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3001

  # performance-02: the LCP <= 2.5s budget LOCKFILE.md already locked (but only as a
  # manual per-wave verifier-agent step) turned into a numeric, always-on CI check,
  # plus CLS and an INP lab-proxy (Total Blocking Time) that had no Solen-specific
  # number at all before this. lighthouserc.js holds the thresholds + the 3 named
  # routes (home, a city/category page, the sanctioned test-salon PDP). Same
  # build/serve + secrets-gated skip-green shape as the `visual`/`motion` jobs above.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: secrets-check
        id: secrets-check
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] && [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase secrets not set on this repo, skipping the lighthouse job (stays green)."
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets-check.outputs.has-secrets == 'true'
        with:
          node-version: "22"
          cache: "npm"
      - name: npm ci
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm ci
      - name: next build
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: next start (background) + wait for it
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: |
          npx next start -p 3001 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://localhost:3001"; then echo "server up"; exit 0; fi
            sleep 2
          done
          echo "::error::next start never became reachable"; exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Lighthouse CI (lighthouserc.js)
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npx lhci autorun

  # WCAG 2.2.2 runtime motion gate (motion-04, scripts/check-motion.mjs --gate). The check
  # itself is proven (MOTION_LAW.md D2: caught 8 animate-spin + 25 animate-pulse loops a
  # by-hand audit missed sixfold) but was sitting as a manual `npm run gate:motion` nobody
  # was forced to run, so a new auto-starting >5s loop got zero automatic scrutiny. Same
  # build/serve shape as the `visual` job above (real `next build` + `next start`, needs the
  # Supabase secrets for the DB-backed routes in DEFAULT_ROUTES); skips green while secrets
  # are absent, same gh secret set one-liners as the e2e job.
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: secrets-check
        id: secrets-check
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] && [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase secrets not set on this repo, skipping the motion job (stays green)."
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets-check.outputs.has-secrets == 'true'
        with:
          node-version: "22"
          cache: "npm"
      - name: npm ci
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm ci
      - name: install chromium
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npx playwright install --with-deps chromium
      - name: next build
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: next start (background) + wait for it
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: |
          npx next start -p 3001 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://localhost:3001"; then echo "server up"; exit 0; fi
            sleep 2
          done
          echo "::error::next start never became reachable"; exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: gate:motion (WCAG 2.2.2 runtime probe)
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm run gate:motion
        env:
          BASE_URL: http://localhost:3001

  # FLOORS LAW runtime gate (scripts/check-geometry.mjs --floors-only --gate). Wired
  # 2026-07-28 for exactly the reason the motion job above was: a proven check sitting as a
  # manual `npm run gate:floors` nobody was forced to run, so a new floor violation got zero
  # automatic scrutiny. Measured before wiring: the current default routes produce 5 FAILs
  # (/de imagery, the PDP weight share at 32.14%, and three on /de/booking/lookup), and every
  # one is already a reasoned entry in the script's own FLOORS_ALLOWLIST ratchet, so
  # `gate:floors` EXITS 0 TODAY. That was verified by running it, not assumed. This job
  # therefore goes green on day one and only ever fails on a NEW, un-allowlisted violation,
  # which is the property that stops a gate being muted in week two. The allowlist only
  # shrinks: delete an entry when its surface is fixed, never add one to route around a new
  # failure. Same build/serve shape as motion, on port 3002 so the two can run concurrently.
  floors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: secrets-check
        id: secrets-check
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] && [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase secrets not set on this repo, skipping the floors job (stays green)."
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets-check.outputs.has-secrets == 'true'
        with:
          node-version: "22"
          cache: "npm"
      - name: npm ci
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm ci
      - name: install chromium
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npx playwright install --with-deps chromium
      - name: next build
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: next start (background) + wait for it
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: |
          npx next start -p 3002 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://localhost:3002"; then echo "server up"; exit 0; fi
            sleep 2
          done
          echo "::error::next start never became reachable"; exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: gate:floors (FLOORS LAW runtime probe)
        if: steps.secrets-check.outputs.has-secrets == 'true'
        run: npm run gate:floors
        env:
          BASE_URL: http://localhost:3002  # 3002, not 3001: this job serves on 3002 (see `next start -p 3002` above). It said 3001 from the commit that wired it (3f3d09a2a, 2026-07-28), so the checker reached nothing and reported GATE: PASSED for 30 days.
