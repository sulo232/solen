# Apply Supabase migrations automatically so code + schema ship together.
#
# NOT ENABLED YET — intentionally workflow_dispatch-only (manual).
# The remote migration history is currently DIVERGED from supabase/migrations/
# (42 remote versions absent locally; different naming schemes), so an automatic
# `supabase db push` would fail with "already exists" conflicts. This file is
# Phase B groundwork from _tasks/MIGRATION_REBASELINE_PLAN.md and must stay
# manual until the one-time Phase A rebaseline is done.
#
# To enable after Phase A rebaseline:
#   1. Verify `supabase migration list --linked` shows local == remote.
#   2. Add repo secrets SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD
#      (GitHub -> Settings -> Secrets and variables -> Actions).
#   3. Uncomment the push: trigger below (and optionally drop workflow_dispatch).
#
# Security note: this workflow consumes no untrusted event input (issue/PR/commit
# text) in run: steps — only repo secrets via env — so there is no injection surface.
name: Apply DB migrations

on:
  workflow_dispatch: {}
  # Enable after Phase A rebaseline (see header comment):
  # push:
  #   branches: [main]
  #   paths: ['supabase/migrations/**']

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref tocfnsmxmdxkrcmjzzdw
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Push pending migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
