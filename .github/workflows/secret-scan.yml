name: secret-scan

# secrets-webhooks-06: Solen's own documented founding incident is exposed
# credentials in git (_rules/SECURITY_RULES.md). `.gitignore` correctly blocks
# committing a `.env*` file (the preventive control), but that only holds
# until someone bypasses it (`git add -f`, a secret pasted into a comment, a
# hardcoded "just for testing" value). This is the detective control that
# catches what the preventive one missed, on every push and pull request.
#
# Uses the gitleaks CLI binary directly (not the gitleaks/gitleaks-action
# marketplace action, which requires a paid license for anything but a
# public repo) so this runs free regardless of repo visibility.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history needed so the diff range below resolves

      - name: install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks detect (new commits only, not full history)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/$PR_BASE_REF..HEAD"
          else
            # push to main: scan only the commits this push actually added.
            if [ -z "$PUSH_BEFORE_SHA" ] || [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$PUSH_BEFORE_SHA..HEAD"
            fi
          fi
          echo "Scanning range: $RANGE"
          gitleaks detect --source . --log-opts="$RANGE" --redact --verbose --exit-code 1
