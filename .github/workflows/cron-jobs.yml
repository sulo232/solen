  daily-11-utc:
    if: github.event.schedule == '0 11 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'rebooking-nudge')
    name: Daily 11:00 UTC · rebooking-nudge
    runs-on: ubuntu-latest
