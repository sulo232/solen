name: Solen cron jobs

# Replaces the 19 vercel.json cron jobs after migrating off Vercel.
# Each job is gated by its cron schedule via `if:` and pings the listed
# /api endpoints with the CRON_SECRET bearer header. UTC schedules.

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '*/30 * * * *'
    - cron: '0 * * * *'
    - cron: '0 */6 * * *'
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
    - cron: '45 3 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 4 1 * *'
    - cron: '0 5 * * 1'
    - cron: '15 5 * * *'
    - cron: '1 0 * * *'
    - cron: '0 0 1 * *'
  # A manual run must pick exactly ONE job. Every job below is gated on
  # github.event.schedule, which is empty on a manual run, so without this picker the
  # Run-workflow button silently did nothing. One-at-a-time on purpose: a blanket manual
  # run would also fire release-deposits / release-payments / pre-charge.
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run now (schedules still run on their own)'
        required: true
        default: generate-slots
        type: choice
        options:
          - auto-complete-sweep
          - late-cancel-reminders-noshow
          - review-prompt-and-pre-charge
          - release-deposits-and-payments
          - discovery-ai-backfill
          - generate-slots
          - nightly-maintenance
          - db-backup
          - barber-smart-reminders
          - salon-onboarding-and-birthdays
          - welcome-series-and-nail-infill
          - rebooking-nudge
          - loyalty-recompute
          - discovery-deadcheck
          - daily-digest
          - recurring-bookings
          - salon-freeze-escalation

jobs:

  every-15-min:
    if: github.event.schedule == '*/15 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'auto-complete-sweep')
    name: Every 15 min · auto-complete, pending-timeout, abandon-sweep, walkin-no-show
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
      # on the runner after checkout. Without this the job fails in ~6s.
      - uses: actions/checkout@v4
      # Uptime monitor (R1, 2026-07-11): piggybacked on this job so it costs zero
      # extra Actions minutes (a separate scheduled job bills a rounded-up minute
      # per run). Fails the run red on a down/erroring live site; GitHub then
      # emails the owner. Retries once to ride out a single blip.
      - name: Live site health check
        run: |
          for i in 1 2; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "https://solen.ch/api/health" || echo 000)
            if [ "$status" = "200" ]; then echo "health OK"; exit 0; fi
            echo "health attempt $i returned $status"; sleep 10
          done
          echo "::error::solen.ch/api/health unhealthy (last status $status)"; exit 1
      - uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/auto-complete,/api/cron/pending-timeout,/api/cron/abandon-sweep,/api/cron/walkin-no-show
          secret: ${{ secrets.CRON_SECRET }}

  every-30-min:
    if: github.event.schedule == '*/30 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'late-cancel-reminders-noshow')
    name: Every 30 min · sms-reminders, no-show
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
      # on the runner after checkout. Without this the job fails in ~6s.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/sms-reminders,/api/cron/no-show
          secret: ${{ secrets.CRON_SECRET }}

  hourly:
    if: github.event.schedule == '0 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'review-prompt-and-pre-charge')
    name: Hourly · review-prompt, pre-charge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
      # on the runner after checkout. Without this the job fails in ~6s.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ping-cron
        with:
          # /api/cron/reminders removed 2026-06-03 — deprecated no-op; SMS reminders now run solely
          # via the every-30-min /api/cron/sms-reminders (which honors the per-salon toggles).
          paths: /api/cron/review-prompt,/api/cron/pre-charge
          secret: ${{ secrets.CRON_SECRET }}

  every-6-hours:
    if: github.event.schedule == '0 */6 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'release-deposits-and-payments')
    name: Every 6h · release-deposits, release-payments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
      # on the runner after checkout. Without this the job fails in ~6s.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/release-deposits,/api/cron/release-payments
          secret: ${{ secrets.CRON_SECRET }}

  every-30-min-ai-backfill:
    if: github.event.schedule == '*/30 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'discovery-ai-backfill')
    name: Every 30 min · discovery-ai-backfill (auto-spec un-described looks)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
      # on the runner after checkout. Without this the job fails in ~6s.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/discovery-ai-backfill
          secret: ${{ secrets.CRON_SECRET }}

  daily-02-utc:
    if: github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'generate-slots')
    name: Daily 02:00 UTC · generate-slots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
      # on the runner after checkout. Without this the job fails in ~6s.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/generate-slots
          secret: ${{ secrets.CRON_SECRET }}

  daily-03-utc:
    if: github.event.schedule == '0 3 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'nightly-maintenance')
    name: Daily 03:00 UTC · solen-score recalc (POST), process-deletions (GET), reconcile (GET), affinity-recompute (GET), salon-engagement-recompute (GET), dispute-timeout (GET)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
      # on the runner after checkout. Without this the job fails in ~6s.
      - uses: actions/checkout@v4
      - name: solen-score recalculate (POST)
        uses: ./.github/actions/ping-cron
        with:
          paths: /api/admin/solen-score/recalculate
          secret: ${{ secrets.CRON_SECRET }}
          method: POST
      - name: process-deletions (GET)
        uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/process-deletions
          secret: ${{ secrets.CRON_SECRET }}
      - name: reconcile Stripe↔DB (GET)
        uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/reconcile
          secret: ${{ secrets.CRON_SECRET }}
      - name: style-affinity recompute (GET)
        uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/style-affinity-recompute
          secret: ${{ secrets.CRON_SECRET }}
      - name: affinity-recompute (GET)
        uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/affinity-recompute
          secret: ${{ secrets.CRON_SECRET }}
      - name: salon-engagement-recompute (GET)
        uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/salon-engagement-recompute
          secret: ${{ secrets.CRON_SECRET }}
      - name: dispute-timeout (GET)
        uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/dispute-timeout
          secret: ${{ secrets.CRON_SECRET }}

  daily-03-45-utc:
    if: github.event.schedule == '45 3 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'db-backup')
    name: Daily 03:45 UTC · db-backup (nightly data safety net)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
      # on the runner after checkout. Without this the job fails in ~6s.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/db-backup
          secret: ${{ secrets.CRON_SECRET }}

  daily-08-utc:
    if: github.event.schedule == '0 8 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'barber-smart-reminders')
    name: Daily 08:00 UTC · barber-smart-reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
      # on the runner after checkout. Without this the job fails in ~6s.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/barber-smart-reminders
          secret: ${{ secrets.CRON_SECRET }}

  daily-09-utc:
    if: github.event.schedule == '0 9 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'salon-onboarding-and-birthdays')
    name: Daily 09:00 UTC · salon-onboarding, birthday-messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
      # on the runner after checkout. Without this the job fails in ~6s.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ping-cron
        with:
          paths: /api/cron/salon-onboarding,/api/cron/birthday-messages
          secret: ${{ secrets.CRON_SECRET }}

  daily-10-utc:
    if: github.event.schedule == '0 10 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'welcome-series-and-nail-infill')
    name: Daily 10:00 UTC · welcome-series, nail-infill-reminders
    runs-on: ubuntu-latest
