  daily-05-15-utc:
    if: github.event.schedule == '15 5 * * *'
    name: Daily 05:15 UTC · daily-digest (founder ops email)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
