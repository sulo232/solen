          secret: ${{ secrets.CRON_SECRET }}

  weekly-mon-05-utc:
    if: github.event.schedule == '0 5 * * 1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'discovery-deadcheck')
    name: Weekly (Mon) 05:00 UTC · discovery-deadcheck (hide deleted/private TikToks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The ping step below uses a LOCAL composite action, which only exists
