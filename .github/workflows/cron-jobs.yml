  monthly-1st-04-utc:
    if: github.event.schedule == '0 4 1 * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'loyalty-recompute')
    name: Monthly (1st) 04:00 UTC · loyalty-recompute (Solen Status ranks)
    runs-on: ubuntu-latest
