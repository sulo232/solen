name: credential-expiry-check

# secrets-webhooks-03: monthly check of _backend-system/CREDENTIAL_EXPIRY.md.
# Today the only tracked row is the Apple Sign-in client-secret JWT (expires
# 2026-12-30), which used to live only in a chat memory file and a doc
# sentence, both requiring a human to remember to look. This workflow is the
# automated trigger that fires on its own instead.

on:
  schedule:
    - cron: "0 8 1 * *" # 08:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: check-credential-expiry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/check-credential-expiry.mjs --github-issue
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            echo "::error::A tracked credential is within 7 days of expiry or already expired. See _backend-system/CREDENTIAL_EXPIRY.md and the opened issue."
            exit 1
          fi
