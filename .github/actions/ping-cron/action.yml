name: Ping Solen cron endpoints
description: POSTs to one or more /api paths with the CRON_SECRET bearer header.

inputs:
  paths:
    description: Comma-separated /api paths to ping
    required: true
  secret:
    description: CRON_SECRET (passed in to avoid exposing the secrets context)
    required: true
  base-url:
    description: Base URL for the Solen site
    required: false
    default: https://solen.ch
  method:
    description: HTTP method to use (GET or POST)
    required: false
    default: GET

runs:
  using: composite
  steps:
    - name: Ping endpoints
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        CRON_SECRET: ${{ inputs.secret }}
        BASE_URL: ${{ inputs.base-url }}
        METHOD: ${{ inputs.method }}
      run: |
        if [ -z "$CRON_SECRET" ]; then
          echo "::error::CRON_SECRET input is empty (is the GitHub Actions secret set?)"
          exit 1
        fi
        HAS_JQ=0
        if command -v jq >/dev/null 2>&1; then HAS_JQ=1; fi
        IFS=',' read -ra arr <<< "$PATHS"
        fail=0
        for p in "${arr[@]}"; do
          url="${BASE_URL}${p}"
          echo "→ ${METHOD} $url"
          status=$(curl -sS -o /tmp/body -w "%{http_code}" -X "${METHOD}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 280 \
            "$url" || echo "000")
          echo "   HTTP $status"
          # Hard assert: 2xx AND the JSON body carries "ok":true (the withCronRun
          # contract, lib/cron-run.ts). A dead cron used to only emit a ::warning::
          # and exit 0 here, invisible on the Actions dashboard.
          ok_field=0
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            if [ "$HAS_JQ" = "1" ]; then
              jq -e '.ok == true' /tmp/body >/dev/null 2>&1 && ok_field=1
            else
              grep -qE '"ok"[[:space:]]*:[[:space:]]*true' /tmp/body 2>/dev/null && ok_field=1
            fi
          fi
          if [ "$ok_field" = "1" ]; then
            echo "   ok:true"
          else
            echo "::error::$url returned HTTP $status without \"ok\":true"
            head -c 500 /tmp/body || true
            echo
            fail=$((fail+1))
          fi
        done
        echo "Completed with $fail failure(s) of ${#arr[@]} endpoint(s)."
        if [ "$fail" -gt 0 ]; then
          exit 1
        fi
